<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Grammar in Use 5th ed. · Designer Book</title>
<style>
:root{--o:#f26b1d;--ink:#26303a;--bg:#f3f1ee;--card:#fffdfb;--line:#e0dad2;--g:#1f8a4c;--r:#c0392b;--b:#4a6fb5;--m:#c2438e}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--o);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px}
header b{font-size:18px;flex:1}header button{border:0;border-radius:8px;background:rgba(255,255,255,.22);color:#fff;font:700 14px inherit;padding:8px 14px;cursor:pointer;text-transform:uppercase}
.tag{background:#26303a;color:#fff;border-radius:6px;font-size:12px;padding:3px 8px;text-transform:uppercase;letter-spacing:.04em}
main{max-width:1240px;margin:0 auto;padding:20px 18px 60px}h1{font-size:28px;margin:6px 0 4px}p.sub{color:#6b7580;margin:0 0 18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.tabs button,.btn{border:0;border-radius:10px;padding:10px 18px;font:700 14px inherit;cursor:pointer;background:#e8e3dc;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
input.search{width:100%;max-width:420px;padding:11px 14px;border:2px solid var(--line);border-radius:10px;font:inherit;background:#fff;margin-bottom:12px}
.grp{margin:22px 0 8px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:#6b7580;font-weight:700}
.ug{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.uc{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.uc:hover{border-color:var(--o);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.uc b{flex:none;width:46px;height:46px;border-radius:10px;background:#fff;border:3px solid var(--b);color:var(--b);display:flex;align-items:center;justify-content:center;font-size:20px}
.uc span{font-size:14px;line-height:1.3}.uc small{display:block;color:#6b7580;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.chip{border:0;border-radius:6px;background:var(--m);color:#fff;font:700 13px inherit;padding:6px 10px;cursor:pointer}.chip.done{background:var(--g)}
.uh{display:flex;align-items:center;gap:14px;margin-bottom:6px}.uh .n{width:56px;height:56px;border:4px solid var(--b);border-radius:12px;background:#fff;color:var(--b);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}
.uh h1{margin:0;font-size:24px}
.study img{display:block;max-width:900px;width:100%;margin:0 auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 20px}
.ex.hl{box-shadow:0 0 0 3px var(--o)}
.ex .two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px}
.ex .pg img{display:block;width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6b7580;font-weight:700;margin-bottom:8px}
.rows{display:grid;gap:8px}.row{display:flex;align-items:center;gap:8px}
.row i{flex:none;width:30px;height:30px;border-radius:50%;background:#ece8e2;display:flex;align-items:center;justify-content:center;font:700 13px system-ui;font-style:normal}
.row input{flex:1;min-width:60px;max-width:380px;padding:7px 10px;border:2px solid #cfc8bd;border-radius:8px;font:16px inherit;background:#fff}
.row input.ok{border-color:var(--g);background:#e8f6ee}.row input.bad{border-color:var(--r);background:#fdecea}
.row em{font-style:normal;font-weight:700;width:18px}.row input.ok+em{color:var(--g)}.row input.bad+em{color:var(--r)}
.row.open input{border-style:dashed}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.btn.p{background:var(--b);color:#fff}.btn.s{background:var(--g);color:#fff}.btn.k{background:#fff;border:2px solid var(--g);color:var(--g)}
.score{font-weight:700;margin-right:6px}.score span{display:inline-block;min-width:70px;border-bottom:2px solid #cfc8bd;text-align:center}
.key{margin-top:12px;background:#fff7e8;border:1px solid #efd9a8;border-radius:10px;padding:10px 14px;font-size:14px}.key div{padding:2px 0}.key b{color:var(--o)}
.note{color:#6b7580;font-size:14px}
.nav{display:flex;justify-content:space-between;margin-top:10px}.nav a{color:var(--o);font-weight:700;cursor:pointer}
.addp img{display:block;max-width:900px;width:100%;margin:0 auto 14px;border:1px solid var(--line);border-radius:6px;background:#fff}
@media(max-width:860px){.ex .two{grid-template-columns:1fr}header{padding:10px 12px}main{padding:14px 12px 50px}}

.btn.n{background:#6a4fb5;color:#fff}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0}
.sgi{display:flex;align-items:center;gap:8px}.sgi b{flex:none;min-width:38px;font-size:13px;color:#6b7580}
.sgi input{width:100%;max-width:130px;padding:7px 10px;border:2px solid #cfc8bd;border-radius:8px;font:16px inherit;background:#fff;text-transform:uppercase}
.sgi input.ok{border-color:var(--g);background:#e8f6ee}.sgi input.bad{border-color:var(--r);background:#fdecea}
.sec{margin:18px 0 6px;font-weight:700;color:var(--b)}
.pgs img{display:block;max-width:900px;width:100%;margin:0 auto 14px;border:1px solid var(--line);border-radius:6px;background:#fff}
</style></head><body>

function sgview(){var h='<p class="note">Read each sentence in the study-guide pages below, choose the correct letter(s) and type them in the boxes (for example <b>B</b> or <b>A, D</b>). The Study guide tells you which unit to review.</p>';
 h+='<div class="bar" style="margin:8px 0 14px"><span class="score">Score: <span class="sc"></span></span><button class="btn p ck">Check Answers</button><button class="btn n nx2">See Next Answer</button><button class="btn rs">Try Again</button></div>';
 var g=null;D.sg.forEach(function(s){if(s.g!=g){if(g!==null)h+='</div>';h+='<div class="sec">'+esc(s.g)+'</div><div class="sgrid">';g=s.g}h+='<div class="sgi"><b>'+s.lbl+'</b><input data-i="'+s.lbl+'" maxlength="12" autocomplete="off" spellcheck="false"><em></em></div>'});
 h+='</div><h2>Study guide pages</h2><div class="pgs">'+D.pg.sg.map(function(s){return '<img loading="lazy" src="'+S(s)+'" alt="">'}).join('')+'</div>';return h}
function wiresg(){var sec=app,ins=[].slice.call(app.querySelectorAll('.sgi input'));
 function L(s){return String(s).toUpperCase().replace(/[^A-E]/g,'').split('').sort().join('')}
 function ok(x){var v=L(x.value);return v.length>0&&v==L(AN.s[x.dataset.i])}
 function mark(){var c=0;ins.forEach(function(x){var g=ok(x);x.className=g?'ok':'bad';x.nextSibling.textContent=g?' ✓':' ✗';if(g)c++});app.querySelector('.sc').textContent=c+' / '+ins.length;SC.SG=[c,ins.length];save()}
 app.querySelector('.ck').onclick=mark;
 app.querySelector('.rs').onclick=function(){ins.forEach(function(x){x.value='';x.className='';x.nextSibling.textContent=''});app.querySelector('.sc').textContent=''};
 app.querySelector('.nx2').onclick=function(){for(var j=0;j<ins.length;j++){var x=ins[j];if(!ok(x)){x.value=AN.s[x.dataset.i];x.className='ok';x.nextSibling.textContent=' ✓';var c=ins.filter(function(y){return y.className=='ok'}).length;app.querySelector('.sc').textContent=c+' / '+ins.length;x.scrollIntoView({block:'nearest',inline:'nearest'});return}}}}
home();
</script></body></html>
