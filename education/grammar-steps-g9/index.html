<title>Grammar Steps · Global English 9</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: classroom-software shell — teal top band, section tiles, one topic per screen with tabs (Rule · 3 exercises · Game · Q&A) and a fixed action row */
:root{
  --bg:#eef3f2; --panel:#ffffff; --ink:#1f2d33; --muted:#5f6f75; --line:#d3dedc;
  --band:#0f6e6a; --band-ink:#fff; --accent:#0f6e6a; --hot:#e0742a; --sec:#3d6fb6;
  --ok:#1e8a4b; --ok-bg:#e1f3e8; --bad:#c23b32; --bad-bg:#fbe5e3; --sel:#ffd98a;
  --chip:#e6eeec; --chip-ink:#1f2d33; --star:#e8a317;
  --display:"Lexend",system-ui,sans-serif; --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a1c; --panel:#1b2528; --ink:#e8efef; --muted:#9db0b2; --line:#2f3d40; --band:#0c5a57; --accent:#4fc2b9; --hot:#f09a5a; --sec:#83a9e6;
  --ok:#5fd18f; --ok-bg:#163226; --bad:#ff8c82; --bad-bg:#3a1e1c; --sel:#7d6420; --chip:#26333a; --chip-ink:#e8efef; --star:#f2c14e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a1c; --panel:#1b2528; --ink:#e8efef; --muted:#9db0b2; --line:#2f3d40; --band:#0c5a57; --accent:#4fc2b9; --hot:#f09a5a; --sec:#83a9e6;
  --ok:#5fd18f; --ok-bg:#163226; --bad:#ff8c82; --bad-bg:#3a1e1c; --sel:#7d6420; --chip:#26333a; --chip-ink:#e8efef; --star:#f2c14e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
.band{background:var(--band);color:var(--band-ink)}
.band .in,.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band .in{display:flex;align-items:center;gap:12px;padding-block:12px;min-height:56px}
.band h1{font-family:var(--display);font-size:1.05rem;font-weight:600;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.btn-back,.btn-home{font:600 .9rem var(--display);background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:8px 12px;cursor:pointer;flex:none}
.wrap{padding-block:24px 48px}
h2{font-family:var(--display);font-weight:600;font-size:1.6rem;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 22px;max-width:65ch}
button{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* home */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.prog{font:500 .95rem var(--display);color:var(--muted)}
.prog b{color:var(--star);font-size:1.1rem}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:10px;align-content:start}
.sec header{display:flex;align-items:center;gap:12px}
.snum{flex:none;width:44px;height:44px;border:4px solid var(--sec);display:grid;place-items:center;font:600 1.2rem var(--display);color:var(--sec)}
.sec h3{margin:0;font:600 1.1rem var(--display);color:var(--sec);flex:1;min-width:0}
.tlist{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.tbtn{width:100%;display:flex;gap:10px;align-items:center;justify-content:space-between;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;color:var(--ink);font-size:1rem;cursor:pointer}
.tbtn:hover{background:var(--chip)}
.tbtn .stars{flex:none;color:var(--star);font-size:.85rem;letter-spacing:1px}
.tbtn .stars .off{color:var(--line)}
.stest{justify-self:start;background:var(--hot);color:#fff;border:0;border-radius:6px;padding:7px 14px;font:600 .9rem var(--display);cursor:pointer}

/* topic */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.tab{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;font:500 .92rem var(--display);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.tab .dot{color:var(--star)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px}
.instr{font-weight:700;margin:0 0 18px}
.rules{display:grid;gap:14px}
.rule{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:12px 14px;border-left:5px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:0 8px 8px 0}
.rule b{font-family:var(--display);font-weight:600}
.rule i{color:var(--muted);font-style:normal}
.rule i::before{content:"e.g. ";font-weight:700;color:var(--accent)}
.qlist{display:grid;gap:14px;counter-reset:q}
.q{display:flex;gap:12px;align-items:flex-start}
.q::before{counter-increment:q;content:counter(q);flex:none;width:30px;height:30px;border-radius:50%;background:var(--chip);color:var(--muted);display:grid;place-items:center;font:600 .85rem var(--display);margin-top:2px}
.q .t{flex:1;min-width:0;line-height:2.1}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:130px;min-height:40px;vertical-align:middle;border:2px dashed var(--line);border-radius:8px;padding:2px 4px;cursor:pointer}
.slot.target{border-color:var(--hot);background:color-mix(in srgb,var(--hot) 10%,transparent)}
.chip{display:inline-block;background:var(--chip);color:var(--chip-ink);border:1px solid var(--line);border-radius:7px;padding:6px 14px;font:500 1rem var(--display);cursor:grab;user-select:none;touch-action:manipulation;box-shadow:0 1px 0 var(--line)}
.chip.sel{background:var(--sel);border-color:var(--hot)}
.bank{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-radius:8px;background:color-mix(in srgb,var(--chip) 60%,transparent);min-height:62px;margin-top:20px}
select,input[type=text]{font:inherit;font-size:1rem;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:7px;padding:5px 8px;max-width:100%}
input[type=text]{width:100%;margin-top:6px}
.mcq{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.opt{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:1rem}
.opt.on{border-color:var(--sec);background:color-mix(in srgb,var(--sec) 14%,transparent)}
.sortgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}
.col h4{font:600 1rem var(--display);margin:0 0 8px;text-align:center;color:var(--muted)}
.col .slot{display:flex;width:100%;margin-bottom:8px;min-width:0;min-height:48px}
.col .slot .chip,.sortgrid~.bank .chip{white-space:normal}
.line{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:8px;border-bottom:2px solid var(--line);margin-top:6px}
.ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-bg)!important;animation:shake .35s}
.model{color:var(--ok);font-size:.92rem;font-weight:700;margin-top:4px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px}
.score{font:600 1.2rem var(--display);min-width:150px}
.score output{display:inline-block;min-width:60px;border-bottom:2px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.score output.pop{animation:pop .4s}
.act{border:0;border-radius:7px;padding:11px 18px;font:600 .95rem var(--display);cursor:pointer;color:#fff;background:var(--sec)}
.act.alt{background:var(--chip);color:var(--chip-ink)}
.act.see{background:var(--ok)}
.nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:16px}
.nav button{background:none;border:0;color:var(--accent);font:600 1rem var(--display);cursor:pointer;padding:6px 0}
.nav button:disabled{opacity:.3;cursor:default}
.hint{color:var(--muted);font-size:.9rem;margin-top:10px}

/* games */
.gpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.gcard{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:16px;text-align:left;cursor:pointer;color:var(--ink);display:grid;gap:4px}
.gcard:hover{border-color:var(--hot)}
.gcard b{font:600 1.05rem var(--display)}
.gcard span{color:var(--muted);font-size:.92rem}
.ghead{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:14px;font:600 1rem var(--display)}
.timer{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin-bottom:18px}
.timer i{display:block;height:100%;background:var(--hot);transition:width .25s linear}
.big{font:500 1.35rem var(--display);text-align:center;padding:22px 10px;min-height:96px;display:grid;place-items:center}
.gbtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.gbtns button{min-width:140px;border:0;border-radius:10px;padding:14px 18px;font:600 1.05rem var(--display);cursor:pointer;color:#fff}
.yes{background:var(--ok)} .no{background:var(--bad)} .pick{background:var(--sec)}
.fb{text-align:center;min-height:30px;margin-top:12px;font-weight:700}
.fb.y{color:var(--ok)} .fb.n{color:var(--bad)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mc{min-height:76px;border-radius:10px;border:2px solid var(--line);background:var(--sec);color:transparent;font:600 1rem var(--display);cursor:pointer;padding:8px}
.mc.up{background:var(--panel);color:var(--ink)}
.mc.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ink);cursor:default}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding:16px}
.result .n{font:700 2.4rem var(--display);color:var(--hot)}
/* modes */
.mode{font:600 .85rem var(--display);background:transparent;color:#fff;border:2px solid rgba(255,255,255,.45);border-radius:999px;padding:6px 12px;cursor:pointer;flex:none}
.mode[aria-pressed="true"]{background:#fff;color:var(--band);border-color:#fff}
.tnotes{margin-top:18px;background:var(--panel);border:2px dashed var(--hot);border-radius:10px;padding:16px 20px}
.tnotes summary{font:600 1.05rem var(--display);color:var(--hot);cursor:pointer}
.tnotes h4{font:600 .95rem var(--display);margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tnotes ul,.tnotes ol{margin:0;padding-left:22px;display:grid;gap:4px}
.tnotes .fix{color:var(--ok);font-weight:700}
.tnotes .wrong{color:var(--bad);text-decoration:line-through}
.tbadge{display:inline-block;font:600 .75rem var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--hot);color:#fff;border-radius:4px;padding:2px 8px;margin-left:8px;vertical-align:middle}
body.board{font-size:24px}
body.board .wrap{max-width:1400px}
body.board h2{font-size:2.2rem}
body.board .chip{font-size:1.35rem;padding:10px 20px}
body.board .slot{min-height:58px;min-width:180px}
body.board select,body.board input[type=text]{font-size:1.3rem;padding:8px 12px}
body.board .opt{font-size:1.3rem;padding:10px 20px}
body.board .act{font-size:1.15rem;padding:15px 24px}
body.board .tab{font-size:1.1rem;padding:10px 18px}
body.board .q::before{width:40px;height:40px;font-size:1.1rem}
body.board .big{font-size:2rem;min-height:140px}
body.board .gbtns button{font-size:1.4rem;padding:20px 26px;min-width:200px}
body.board .mc{min-height:110px;font-size:1.3rem}
body.board .hint,body.board .lead{display:none}
body.board .rule b{font-size:1.25rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.slot{min-width:100px}.q .t{line-height:1.9}.band .in{gap:8px;flex-wrap:wrap}}
</style>

<div class="band"><div class="in">
  <button class="btn-back" id="back" hidden>‹ Back</button>

passive:{t:"The passive (is done / was done)",

f frequency","r":[["always, usually, often, sometimes, rarely, never: how often something happens.","I often recycle paper."],["They go before the main verb but after be.","She is always careful. / She always recycles."],["In questions: Do you ever …?","Do you ever walk to school?"]],"d":["I [often recycle*|recycle often|am often recycle] plastic.","She is [never*|ever|always never] late.","We [rarely use*|use rarely|are rarely use] a car.","[Do you ever*|Ever do you|Are you ever] walk to school?","He [hardly ever*|hardly never|never ever] wastes water.","They [usually switch off*|switch usually off|are usually switch off] the lights."],"gp":{"q":["I {always} turn off the tap.","They {rarely} use plastic bags.","She is {usually} on time.","Do you {ever} cycle?","We {sometimes} walk to school."],"x":["rare"]},"o":["I often recycle paper.","She is always careful with water.","We hardly ever use plastic."],"tf":[["I never waste water.",1],["I recycle always paper.",0,"I always recycle paper."],["She is often late.",1],["He is hardly never here.",0,"He is hardly ever here."],["Do you ever recycle?",1],["We use rarely cars.",0,"We rarely use cars."]],"qa":[["How often do you recycle? (I / always / recycle / paper)",["I always recycle paper."]],["Do you use plastic bags? (No / I / hardly ever / use)",["No, I hardly ever use them."]],["Are you late? (never / late)",["I am never late."]]]},"mwv9":{"t":"Multi-word verbs about the environment","r":[["cut down on = reduce; run out of = have no more; look after = take care of.","We should cut down on plastic."],["use up, throw away, switch off, give up are common.","Don't throw it away."],["With a pronoun, separate the verb: throw it away.","Switch it off."]],"d":["We must [cut down on*|cut up on|cut on down] energy.","The oil is [running out*|running away|running up].","Please [switch off*|switch up|switch on out] the lights.","We should [look after*|look at|look for] our planet.","Don't [throw it away*|throw away it|throw awa ,0,"We avoid wasting water."],["It is a small green cotton bag.",1],["She suggested to recycle.",0,"She suggested recycling."],["I don't mind walking.",1],["We saw plastic huge bottles.",0,"We saw huge plastic bottles."]],"qa":[["What do you avoid? (I / avoid / waste / water)",["I avoid wasting water."]],["What did you see? (three / huge / plastic bags)",["I saw three huge plastic bags."]],["What did she suggest? (she / suggest / recycle / more)",["She suggested recycling more."]]]},"relrev9":{"t":"Relative clauses (revision)","r":[["who / that for people; which / that for things; whose for possession.","Marie Curie is the scientist who won two Nobel prizes."],["Non-defining clauses add extra information, use commas and not that.","Curie, who was Polish, worked in France."],["We can drop the pronoun when it is the object of a defining clause.","The book (that) I read was great."]],"d":["She is the woman [who*|which|whose] won the prize.","Everest, [which*|that|what] is in Asia, is very high.","He is a man [whose*|who|which] dream came true.","The medal [that I won*|that I won it|what I won] is gold.","Tom, [who*|that|whom he] is my friend, plays chess.","That is the school [where*|which|who] she studied."],"gp":{"q":["The athlete {who} won is my cousin.","The Nile, {which} is long, is in Africa.","She is a person {whose} ambition is great.","That's the book {that} changed my life.","Bishkek, {where} I live, is beautiful."],"x":["what"]},"o":["She is the woman who won the prize.","Everest, which is in Asia, is very high.","That is the school where she studied."],"tf":[["He is the man who helped me.",1],["Curie, that was Polish, won prizes.",0,"Curie, who was Polish, won prizes."],["The medal that I won is gold.",1],["She is the woman whose she won the prize.",0,"She is the woman who won the prize."],["Tom, who is my friend, plays chess.",1],["The book that I read it was great.",0,"The book that I read was great."]],"qa":[["Who is she? (the woman / who / win / the pri terested in.","She is proud of her medal."],["Others: keen on, responsible for, familiar with, capable of.","He is keen on chess."],["A noun or -ing follows the preposition.","I'm interested in becoming a pilot."]],"d":["She is proud [of*|for|about] her success.","He is good [at*|in|on] solving problems.","I'm interested [in*|on|of] becoming a doctor.","They are afraid [of*|from|for] failing.","He is responsible [for*|of|to] the team.","She is keen [on*|in|at] sailing."],"gp":{"q":["I'm very proud {of} you.","She is excellent {at} maths.","He is capable {of} winning.","We are not familiar {with} this sport.","I'm worried {about} the exam."],"x":["by"]},"o":["She is proud of her success.","He is good at solving problems.","I'm interested in becoming a pilot."],"tf":[["They are afraid of failing.",1],["He is good in chess.",0,"He is good at chess."],["She is keen on swimming.",1],["I'm interested on art.",0,"I'm interested in art."],["He is responsible for the team.",1],["She is proud for her son.",0,"She is proud of her son."]],"qa":[["What are you proud of? (I / proud of / my medal)",["I am proud of my medal."]],["What is he good at? (he / good at / solve problems)",["He is good at solving problems."]],["What are you worried about? (I / worried about / the exam)",["I am worried about the exam."]]]}};</script>
<script>
const SECTIONS=[["Views and voices", ["ingforms9", "presentpassive9"]], ["Well-being", ["abstract9", "compare9", "modalspast", "strongadj"]], ["Tourism", ["compoundnoun9", "phrasal9", "pastcontpass", "compoundadj9"]], ["Science", ["conj9", "ppsimple9", "prefcont9", "depprepverb"]], ["Technology", ["relclause9", "future9", "toodnough9", "havesth9"]], ["Rules and laws", ["passiveinf", "reported9", "thirdcond9", "wasgoing"]], ["Competition", ["pperf9", "comp9", "connect9"]], ["The environment", ["freq9", "mwv9", "verbing9"]], ["Achievements and ambitions", ["relrev9", "participle9", "depadj9"]]];
const ORDER=SECTIONS.flatMap(s=>s[1]);
const TABS=[["rule","Rule"],["ex1","Exercise 1"],["ex2","Exercise 2"],["ex3","Exercise 3"],["ex4","Exercise 4"],["game","Game"],["qa","Q&A"]];
const app=document.getElementById("app"),back=document.getElementById("back"),homeBtn=document.getElementById("homeBtn"),crumb=document.getElementById("crumb");
let stack=[],cur=null,sel=null,gameTimer=null;
const h=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/\bi am\b/g,"i'm").replace(/\bit is\b/g,"it's").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* progress (per viewer, optional) */
let PROG={};try{PROG=JSON.parse(localStorage.getItem("gs-prog-g9")||"{}")}catch(e){PROG={}}
function save(id,tab,c,t){const k=id+":"+tab,p=Math.round(100*c/t);if(!(PROG[k]>=p)){PROG[k]=p;try{localStorage.setItem("gs-prog-g9",JSON.stringify(PROG))}catch(e){}}}
function starsFor(id){let s=0;["ex1","ex2","ex3","qa"].forEach(t=>{if((PROG[id+":"+t]||0)>=80)s++});return Math.min(3,Math.round(s*3/4))}
function starEl(n){const s=h("span","stars");s.setAttribute("aria-label",n+" of 3 stars");for(let i=0;i<3;i++){const x=h("span",i<n?null:"off","★");s.append(x)}return s}

/* board & teacher modes (remembered per viewer) */
let MODE={board:false,teacher:false};try{Object.assign(MODE,JSON.parse(localStorage.getItem("gs-mode")||"{}"))}catch(e){}
const boardBtn=document.getElementById("boardBtn"),teacherBtn=document.getElementById("teacherBtn");
let rerender=null;
function applyModes(){document.body.classList.toggle("board",!!MODE.board);document.body.classList.toggle("teacher",!!MODE.teacher);
  boardBtn.setAttribute("aria-pressed",!!MODE.board);teacherBtn.setAttribute("aria-pressed",!!MODE.teacher);
  try{localStorage.setItem("gs-mode",JSON.stringify(MODE))}catch(e){}}
boardBtn.onclick=()=>{MODE.board=!MODE.board;applyModes()};
teacherBtn.onclick=()=>{MODE.teacher=!MODE.teacher;applyModes();if(rerender)rerender()};
applyModes();
document.addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  const nav=document.querySelector(".nav");if(!nav)return;
  if(e.key=="ArrowRight"){const b=nav.querySelector("button:last-child");if(b&&!b.disabled)b.click()}
  if(e.key=="ArrowLeft"){const b=nav.querySelector("button:first-child");if(b&&!b.disabled&&b.textContent.includes("Previous"))b.click()}});

function teacherNotes(T0){
  const d=h("details","tnotes");d.open=true;d.append(h("summary",null,"Teacher notes & answer key"));
  const sec=(title,items,ordered)=>{d.append(h("h4",null,title));const l=h(ordered?"ol":"ul");items.forEach(x=>{const li=h("li");typeof x=="string"?li.textContent=x:li.append(...x);l.append(li)});d.append(l)};
  sec("Warm-up: ask the class",T0.qa.map(q=>q[0].replace(/\s*\(.*\)\s*$/,"")));
  sec("Board summary",T0.r.map(r=>r[0]+"  →  "+r[1]));
  const wrongs=T0.tf.filter(x=>!x[1]);
  if(wrongs.length)sec("Common mistakes",wrongs.map(([s,,f])=>[h("span","wrong",s),"  →  ",h("span","fix",f)]));
  sec("Exercise 1 key",T0.d.map(s=>{const m=s.match(/^(.*)\[(.+)\](.*)$/);return (m[1]+m[2].split("|").find(o=>o.endsWith("*")).replace("*","")+m[3]).trim()}),true);
  sec("Exercise 2 key",T0.gp.q.map(s=>s.replace(/\{(.+)\}/,"$1")+"").concat(["(extra word: "+(T0.gp.x||[]).join(", ")+")"]),true);
  sec("Exercise 3 key",T0.o,true);
  sec("Q&A model answers",T0.qa.map(q=>q[1][0]),true);
  sec("Speaking follow-up",["Pairs: ask and answer the Q&A questions with your own information.","Each student writes two true and one false sentence using today's rule. The partner guesses the false one."]);
  return d}

function stopGame(){if(gameTimer){clearInterval(gameTimer);gameTimer=null}}
back.onclick=()=>{stopGame();stack.pop();const f=stack.pop();f?go(f):home()};
homeBtn.onclick=()=>{stopGame();home()};
function go(fn){stack.push(fn);back.hidden=stack.length<2;homeBtn.hidden=stack.length<2;fn()}

function home(){stack=[];go(()=>{
  rerender=null;crumb.textContent="Grammar Steps · Global English 9";app.innerHTML="";
  const top=h("div","top"),l=h("div");
  l.append(h("h2",null,"Grammar practice"),h("p","lead","31 topics in 9 sections. Topics taken from the Global English 9 Learner’s Book and Workbook. Each topic has a short rule, three exercises, a game and questions to answer. Works with a mouse, a touchscreen or a smart board."));
  const total=ORDER.reduce((a,id)=>a+starsFor(id),0),pr=h("div","prog");pr.append("Your stars: ",h("b",null,"★ "+total)," / "+ORDER.length*3);
  top.append(l,pr);app.append(top);
  const g=h("div","secs");
  SECTIONS.forEach(([name,ids],si)=>{
    const s=h("section","sec"),hd=h("header");hd.append(h("div","snum",si+1),h("h3",null,name));s.append(hd);
    const ul=h("ul","tlist");
    ids.forEach(id=>{const li=h("li"),b=h("button","tbtn");b.append(h("span",null,T[id].t),starEl(starsFor(id)));b.onclick=()=>go(()=>topic(id,"rule"));li.append(b);ul.append(li)});
    const tb=h("button","stest","Section test");tb.onclick=()=>go(()=>secTest(si));
    s.append(ul,tb);g.append(s)});
  app.append(g)})}

function sectionOf(id){return SECTIONS.findIndex(s=>s[1].includes(id))}

function topic(id,tab){
  stopGame();const T0=T[id],idx=ORDER.indexOf(id),si=sectionOf(id);sel=null;
  crumb.textContent=SECTIONS[si][0]+" · "+T0.t;app.innerHTML="";
  app.append(h("h2",null,T0.t));
  const tabs=h("div","tabs");tabs.setAttribute("role","tablist");
  TABS.forEach(([k,lab])=>{const b=h("button","tab",lab);b.setAttribute("role","tab");b.setAttribute("aria-selected",k==tab);
    if((PROG[id+":"+k]||0)>=80){const d=h("span","dot"," ★");b.append(d)}
    b.onclick=()=>{stack.pop();go(()=>topic(id,k))};tabs.append(b)});
  app.append(tabs);
  const card=h("div","card");app.append(card);
  if(tab=="rule")ruleView(T0,card);
  else if(tab=="game")gameMenu(id,T0,card);
  else{
    const spec={
      ex1:{type:"drop",instr:"Choose the correct answer.",qs:T0.d},
      ex2:{type:"gap",instr:"Complete the sentences with the words below. There is one extra word.",qs:T0.gp.q,extra:T0.gp.x},
      ex3:{type:"order",instr:"Tap the words to put them in the correct order.",qs:T0.o},
      ex4:{type:"sort",instr:"Are the sentences correct or wrong? Put them into the correct group.",cats:["correct ✓","wrong ✗"],items:Object.fromEntries(T0.tf.map(x=>[x[0],x[1]?0:1])),fix:Object.fromEntries(T0.tf.filter(x=>!x[1]).map(x=>[x[0],x[2]]))},
      qa:{type:"qa",instr:"Answer the questions. Write full sentences. Use the words in brackets.",qs:T0.qa}}[tab];
    exerciseInto(card,spec,(c,t)=>save(id,tab,c,t));
    if(["ex2","ex3","ex4"].includes(tab))app.append(h("p","hint",tab!="ex3"?"Tip: tap a word, then tap a box. Or drag it with the mouse.":"Tip: tap a word to move it to the line. Tap it again to take it back."));
  }
  if(MODE.teacher)app.append(teacherNotes(T0));
  const nav=h("div","nav"),p=h("button",null,"‹ Previous topic"),n=h("button",null,"Next topic ›");
  p.disabled=idx==0;n.disabled=idx==ORDER.length-1;
  p.onclick=()=>{stack.pop();go(()=>topic(ORDER[idx-1],"rule"))};n.onclick=()=>{stack.pop();go(()=>topic(ORDER[idx+1],"rule"))};
  nav.append(p,n);app.append(nav);
  rerender=()=>{stack.pop();go(()=>topic(id,tab))};
  window.scrollTo(0,0)}

function ruleView(T0,card){
  card.append(h("p","instr","Read the rule and the examples. Then do the exercises."));
  const r=h("div","rules");T0.r.forEach(([a,b])=>{const d=h("div","rule");d.append(h("b",null,a),h("i",null,b));r.append(d)});card.append(r);
  const a=h("div","actions"),b=h("button","act","Start Exercise 1 ›");b.onclick=()=>{stack.pop();const id=Object.keys(T).find(k=>T[k]===T0);go(()=>topic(id,"ex1"))};a.append(b);card.append(a)}

function exerciseInto(card,ex,onScore,shown){
  card.append(h("p","instr",ex.instr));const body=h("div");card.append(body);
  cur=BUILD[ex.type](ex,body);
  const acts=h("div","actions"),sc=h("div","score"),out=h("output",null,"");sc.append("Score: ",out);
  const bC=h("button","act","Check Answers"),bT=h("button","act alt","Try Again"),bS=h("button","act see","Show Answers");
  bC.onclick=()=>{const[c,t]=cur.check();out.textContent=c+"/"+t;out.classList.remove("pop");void out.offsetWidth;out.classList.add("pop");onScore&&onScore(c,t)};
  bT.onclick=()=>{card.innerHTML="";exerciseInto(card,ex,onScore)};
  bS.onclick=()=>{card.innerHTML="";exerciseInto(card,ex,onScore,!shown)};
  if(shown){cur.show();bS.textContent="Hide Answers"}
  acts.append(sc,bC,bT,bS);card.append(acts)}

/* section test: 10 random items from the section's choose-exercises */
function secTest(si){
  rerender=null;const [name,ids]=SECTIONS[si];crumb.textContent=name+" · Section test";app.innerHTML="";
  app.append(h("h2",null,"Section test: "+name),h("p","lead","Ten questions mixed from all topics in this section."));
  const pool=shuffle(ids.flatMap(id=>T[id].d)).slice(0,10);
  const qs=pool.map(s=>{const m=s.match(/^(.*)\[(.+)\](.*)$/),opts=m[2].split("|"),a=opts.findIndex(o=>o.endsWith("*")),o=opts.map(x=>x.replace("*",""));
    const ord=shuffle(o.map((x,i)=>i));return{t:m[1]+"___"+m[3],o:ord.map(i=>o[i]),a:ord.indexOf(a)}});
  const card=h("div","card");app.append(card);
  exerciseInto(card,{type:"mcq",instr:"Choose the correct answer.",qs},null);
  const nav=h("div","nav"),again=h("button",null,"New test ↻");again.onclick=()=>{stack.pop();go(()=>secTest(si))};nav.append(h("span"),again);app.append(nav);window.scrollTo(0,0)}

/* tap-or-drag chips */
function chip(text){const c=h("span","chip",text);c.draggable=true;c.dataset.v=text;
  c.onclick=e=>{e.stopPropagation();if(c.closest(".slot")&&!sel){c.closest(".slot")._home.append(c);return}
    if(sel===c){clearSel();return}select(c)};
  c.ondragstart=()=>select(c);return c}
function select(c){document.querySelectorAll(".chip.sel").forEach(x=>x.classList.remove("sel"));sel=c;c.classList.add("sel");
  document.querySelectorAll(".slot").forEach(s=>s.classList.add("target"))}
function clearSel(){if(sel)sel.classList.remove("sel");sel=null;document.querySelectorAll(".slot.target").forEach(s=>s.classList.remove("target"))}
function slot(bank){const s=h("span","slot");s._home=bank;
  const place=()=>{if(!sel)return;const old=s.querySelector(".chip");if(old&&old!==sel)bank.append(old);s.append(sel);s.classList.remove("ok","bad");clearSel()};
  s.onclick=place;s.ondragover=e=>e.preventDefault();s.ondrop=e=>{e.preventDefault();place()};return s}
function bankEl(){const b=h("div","bank");b.onclick=()=>{if(sel){b.append(sel);clearSel()}};b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();if(sel){b.append(sel);clearSel()}};return b}
const mark=(el,ok)=>{el.classList.remove("ok","bad");void el.offsetWidth;el.classList.add(ok?"ok":"bad");return ok?1:0};

const BUILD={
 sort(ex,body){const bank=bankEl(),grid=h("div","sortgrid"),slots=[],words=Object.keys(ex.items),fixes=h("div","qlist");fixes.hidden=true;
  ex.cats.forEach((c,ci)=>{const col=h("div","col");col.append(h("h4",null,c));
    words.filter(w=>ex.items[w]==ci).forEach(()=>{const s=slot(bank);s.dataset.cat=ci;slots.push(s);col.append(s)});grid.append(col)});
  shuffle(words).forEach(w=>bank.append(chip(w)));body.append(grid,bank,fixes);
  const showFix=()=>{fixes.innerHTML="";Object.entries(ex.fix||{}).forEach(([w,f])=>{const r=h("div","model");r.textContent="✗ "+w+"  →  ✓ "+f;fixes.append(r)});fixes.hidden=false};
  return{check(){let c=0;slots.forEach(s=>{const ch=s.querySelector(".chip");c+=mark(s,!!ch&&ex.items[ch.dataset.v]==s.dataset.cat)});showFix();return[c,words.length]},
   show(){ex.cats.forEach((_,ci)=>{const ss=slots.filter(s=>s.dataset.cat==ci);words.filter(w=>ex.items[w]==ci).forEach((w,j)=>{
     const ch=[...body.querySelectorAll(".chip")].find(x=>x.dataset.v==w);ss[j].append(ch);mark(ss[j],true)})});clearSel();showFix()}}},
 gap(ex,body){const bank=bankEl(),list=h("div","qlist"),slots=[],words=[];
  ex.qs.forEach(q=>{const m=q.match(/^(.*)\{(.+)\}(.*)$/),row=h("div","q"),t=h("div","t"),s=slot(bank);
    s.dataset.a=m[2];words.push(m[2]);slots.push(s);t.append(m[1],s,m[3]);row.append(t);list.append(row)});
  shuffle(words.concat(ex.extra||[])).forEach(w=>bank.append(chip(w)));body.append(list,bank);
  return{check(){let c=0;slots.forEach(s=>{const ch=s.querySelector(".chip");c+=mark(s,!!ch&&ch.dataset.v==s.dataset.a)});return[c,slots.length]},
   show(){slots.forEach(s=>{const old=s.querySelector(".chip");if(old)bank.append(old)});
     slots.forEach(s=>{const ch=[...bank.querySelectorAll(".chip")].find(x=>x.dataset.v==s.dataset.a);if(ch)s.append(ch);mark(s,true)});clearSel()}}},
 drop(ex,body){const list=h("div","qlist"),sels=[];
  ex.qs.forEach((q,i)=>{const m=q.match(/^(.*)\[(.+)\](.*)$/),row=h("div","q"),t=h("div","t"),s=h("select");s.id="dd"+i;
    s.append(new Option("",""));shuffle(m[2].split("|")).forEach(o=>{const v=o.replace("*","");s.append(new Option(v,v));if(o.endsWith("*"))s.dataset.a=v});
    s.onchange=()=>s.classList.remove("ok","bad");sels.push(s);t.append(m[1],s,m[3]);row.append(t);list.append(row)});
  body.append(list);
  return{check(){let c=0;sels.forEach(s=>c+=mark(s,s.value==s.dataset.a));return[c,sels.length]},
   show(){sels.forEach(s=>{s.value=s.dataset.a;mark(s,true)})}}},
 order(ex,body){const list=h("div","qlist"),rows=[];
  ex.qs.forEach(q=>{const words=q.replace(/[?.!]$/,"").split(" "),row=h("div","q"),t=h("div","t"),line=h("div","line"),bank=h("div","bank");
    bank.style.marginTop="8px";
    let sh=shuffle(words);for(let k=0;k<5&&sh.join(" ")==words.join(" ");k++)sh=shuffle(words);
    sh.forEach(w=>{const c=h("span","chip",w);c.onclick=()=>{(c.parentNode===bank?line:bank).append(c);line.classList.remove("ok","bad")};bank.append(c)});
    rows.push({line,bank,q});t.append(line,bank);row.append(t);list.append(row)});
  body.append(list);
  return{check(){let c=0;rows.forEach(r=>{const s=[...r.line.children].map(x=>x.textContent).join(" ");c+=mark(r.line,norm(s)==norm(r.q))});return[c,rows.length]},
   show(){rows.forEach(r=>{const all=[...r.line.children,...r.bank.children];r.q.replace(/[?.!]$/,"").split(" ").forEach(w=>{const i=all.findIndex(x=>x.textContent==w);if(i>-1)r.line.append(all.splice(i,1)[0])});mark(r.line,true)})}}},
 mcq(ex,body){const list=h("div","qlist"),qs=[];
  ex.qs.forEach(q=>{const row=h("div","q"),t=h("div","t"),opts=h("div","mcq"),st={pick:-1,btns:[]};
    q.o.forEach((o,oi)=>{const b=h("button","opt",o);b.onclick=()=>{st.pick=oi;st.btns.forEach(x=>x.classList.remove("on","ok","bad"));b.classList.add("on")};st.btns.push(b);opts.append(b)});
    qs.push([st,q.a,opts]);t.append(h("div",null,q.t),opts);row.append(t);list.append(row)});
  body.append(list);
  return{check(){let c=0;qs.forEach(([st,a,opts])=>{if(st.pick<0){mark(opts,false);return}opts.classList.remove("ok","bad");c+=mark(st.btns[st.pick],st.pick==a)});return[c,qs.length]},
   show(){qs.forEach(([st,a,opts])=>{opts.classList.remove("ok","bad");st.btns.forEach(b=>b.classList.remove("on","ok","bad"));st.pick=a;st.btns[a].classList.add("on");mark(st.btns[a],true)})}}},
 qa(ex,body){const list=h("div","qlist"),ins=[];
  ex.qs.forEach(([q,a],i)=>{const row=h("div","q"),t=h("div","t"),inp=h("input"),m=h("div","model");m.hidden=true;
    inp.type="text";inp.id="qa"+i;inp.autocomplete="off";inp.spellcheck=false;inp.placeholder="Write your answer…";
    inp.oninput=()=>{inp.classList.remove("ok","bad");m.hidden=true};ins.push([inp,a,m]);t.append(h("div",null,q),inp,m);row.append(t);list.append(row)});
  body.append(list);
  return{check(){let c=0;ins.forEach(([i,a,m])=>{const ok=a.some(x=>norm(x)==norm(i.value));c+=mark(i,ok);if(!ok){m.textContent="Model answer: "+a[0];m.hidden=false}});return[c,ins.length]},
   show(){ins.forEach(([i,a,m])=>{i.value=a[0];mark(i,true);m.hidden=true})}}}
};

/* ---------- games ---------- */
function gameMenu(id,T0,card){
  card.append(h("p","instr","Choose a game."));
  const g=h("div","gpick");
  const add=(t,d,fn)=>{const b=h("button","gcard");b.append(h("b",null,t),h("span",null,d));b.onclick=()=>{card.innerHTML="";fn(card,id,T0)};g.append(b)};
  add("⏱ Speed race","Choose the right word as fast as you can. 45 seconds.",speedGame);
  add("✓ ✗ Right or wrong?","Is the sentence correct? Decide quickly and see the fix.",tfGame);
  if(T0.m)add("🃏 Memory match","Turn over two cards and find the pairs.",matchGame);
  card.append(g)}
function backToMenu(card,id,T0){const b=h("button","act alt","Other games");b.onclick=()=>{stopGame();card.innerHTML="";gameMenu(id,T0,card)};return b}
function bestKey(id,g){return "gs-best:"+id+":"+g}
function getBest(k){try{return +localStorage.getItem(k)||0}catch(e){return 0}}
function setBest(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function resultView(card,id,T0,title,n,sub,again){
  card.innerHTML="";const r=h("div","result");r.append(h("b",null,title),h("div","n",n),h("div",null,sub));
  const a=h("div","actions"),p=h("button","act","Play again");p.onclick=()=>{card.innerHTML="";again(card,id,T0)};a.append(p,backToMenu(card,id,T0));r.append(a);card.append(r)}

function speedGame(card,id,T0){
  stopGame();const items=T0.d.map(s=>{const m=s.match(/^(.*)\[(.+)\](.*)$/),o=m[2].split("|");return{t:m[1]+"___"+m[3],o:o.map(x=>x.replace("*","")),a:o.find(x=>x.endsWith("*")).replace("*","")}});
  // pull a few extra items from the same section for variety
  const extra=SECTIONS[sectionOf(id)][1].filter(x=>x!=id).flatMap(x=>T[x].d).map(s=>{const m=s.match(/^(.*)\[(.+)\](.*)$/),o=m[2].split("|");return{t:m[1]+"___"+m[3],o:o.map(x=>x.replace("*","")),a:o.find(x=>x.endsWith("*")).replace("*","")}});
  let deck=shuffle(items).concat(shuffle(extra)),i=0,score=0,streak=0,left=45;
  const head=h("div","ghead"),sc=h("span",null,"Score: 0"),st=h("span",null,""),tm=h("span",null,"45 s");head.append(sc,st,tm);
  const bar=h("div","timer"),fill=h("i");fill.style.width="100%";bar.append(fill);
  const big=h("div","big"),btns=h("div","gbtns"),fb=h("div","fb");card.append(head,bar,big,btns,fb);
  function next(){if(i>=deck.length){deck=deck.concat(shuffle(deck));}const q=deck[i++];big.textContent=q.t;btns.innerHTML="";
    shuffle(q.o).forEach(o=>{const b=h("button","pick",o);b.onclick=()=>{if(o==q.a){score+=1+(streak>=3?1:0);streak++;fb.className="fb y";fb.textContent=streak>=3?"Correct! Streak bonus +1":"Correct!"}else{streak=0;fb.className="fb n";fb.textContent="✗ "+q.t.replace("___",q.a)}
      sc.textContent="Score: "+score;st.textContent=streak>=2?"🔥 "+streak:"";next()};btns.append(b)})}
  next();
  gameTimer=setInterval(()=>{left--;tm.textContent=left+" s";fill.style.width=(left/45*100)+"%";
    if(left<=0){stopGame();const k=bestKey(id,"speed"),best=Math.max(getBest(k),score);setBest(k,best);resultView(card,id,T0,"Time's up!",score,"Best score: "+best,speedGame)}},1000)}

function tfGame(card,id,T0){
  stopGame();const deck=shuffle(T0.tf);let i=0,score=0,left=40;
  const head=h("div","ghead"),sc=h("span",null,"Score: 0 / "+deck.length),tm=h("span",null,"40 s");head.append(sc,tm);
  const bar=h("div","timer"),fill=h("i");fill.style.width="100%";bar.append(fill);
  const big=h("div","big"),btns=h("div","gbtns"),fb=h("div","fb");
  const y=h("button","yes","✓ Correct"),n=h("button","no","✗ Wrong");btns.append(y,n);card.append(head,bar,big,btns,fb);
  function end(){stopGame();const k=bestKey(id,"tf"),best=Math.max(getBest(k),score);setBest(k,best);resultView(card,id,T0,"Finished!",score+" / "+deck.length,"Best score: "+best,tfGame)}
  function show(){if(i>=deck.length){end();return}big.textContent=deck[i][0]}
  function answer(v){if(i>=deck.length)return;const [s,ok,fix]=deck[i];
    if((v?1:0)===ok){score++;fb.className="fb y";fb.textContent=ok?"Yes, it's correct!":"Right, it's wrong. Correct: "+fix}
    else{fb.className="fb n";fb.textContent=ok?"No — this sentence is correct.":"It's wrong. Correct: "+fix}
    sc.textContent="Score: "+score+" / "+deck.length;i++;show()}
  y.onclick=()=>answer(true);n.onclick=()=>answer(false);show();
  gameTimer=setInterval(()=>{left--;tm.textContent=left+" s";fill.style.width=(left/40*100)+"%";if(left<=0)end()},1000)}

function matchGame(card,id,T0){
  stopGame();const pairs=T0.m.slice(0,8);let cards=[];pairs.forEach((p,pi)=>{cards.push({v:p[0],p:pi});cards.push({v:p[1],p:pi})});cards=shuffle(cards);
  let open=[],found=0,moves=0,lock=false;
  const head=h("div","ghead"),mv=h("span",null,"Moves: 0"),fd=h("span",null,"Pairs: 0 / "+pairs.length);head.append(mv,fd);
  const grid=h("div","mgrid");card.append(head,grid);
  cards.forEach(c=>{const b=h("button","mc",c.v);b.setAttribute("aria-label","Hidden card");c.el=b;
    b.onclick=()=>{if(lock||b.classList.contains("up")||b.classList.contains("done"))return;b.classList.add("up");b.setAttribute("aria-label",c.v);open.push(c);
      if(open.length==2){moves++;mv.textContent="Moves: "+moves;const[a,d]=open;
        if(a.p==d.p&&a!==d){a.el.classList.replace("up","done");d.el.classList.replace("up","done");open=[];found++;fd.textContent="Pairs: "+found+" / "+pairs.length;
          if(found==pairs.length){const k=bestKey(id,"match"),prev=getBest(k),best=prev?Math.min(prev,moves):moves;setBest(k,best);setTimeout(()=>resultView(card,id,T0,"All pairs found!",moves+" moves","Best: "+best+" moves",matchGame),600)}}
        else{lock=true;setTimeout(()=>{a.el.classList.remove("up");d.el.classList.remove("up");a.el.setAttribute("aria-label","Hidden card");d.el.setAttribute("aria-label","Hidden card");open=[];lock=false},900)}}};
    grid.append(b)});
  const a=h("div","actions");a.append(backToMenu(card,id,T0));card.append(a)}

const missing=ORDER.filter(id=>!T[id]);if(missing.length)console.error("Missing topics",missing);
home();
</script>
