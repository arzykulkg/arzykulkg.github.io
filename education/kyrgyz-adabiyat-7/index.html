ын эстелиги, жашыл парктар мага абдан жакты. Шаар чоң, кооз, ар кандай улуттар тынч жашайт. Мен борборубузду сыймыктанам."}, {"t": "act", "i": "group", "h": "Биздин долбоор. <small style=\"color:#7a6a60;font-weight:400\">(122-бет)</small>", "html": "1. Ак-Буура суусуна же силер жашаган жерде аккан өзөнгө, тоого экскурсия уюштургула. Дарыянын, тоонун сырткы көрүнүшүнө, жайгашкан географиялык абалына көңүл бургула.<br>2. Силер барган жаратылыш аймагынын санитардык абалын талдагыла. Эгерде ал жердин экологиялык абалы силерди канааттандырбаса, окуучулардан ыктыярдуулардын топ түзүп тазалап чыккыла.<br>3. Барган жериңерди жергиликтүү бийлик тарабынан натыйжалуу пайдаланылышына жана корголушуна кандай деңгээлде көңүл бурулганын тактагыла.<br>4. Тарыхый-архитектуралык жайлар, музейлер болсо, алардын баалуулугун сурап билгиле.<br>5. Биология мугалими менен бирдикте суунун курамын изилдеп чыккыла.<br>6. Жыйнаган материалдардын негизинде презентация даярдагыла.<br>7. «Табият кереметтери» аттуу сүрөт жана колго жасалган экспонаттардын көргөзмөсүн уюштургула."}, {"t": "game", "i": "game", "h": "Оюндар", "gs": ["tug", "chuko", "quiz"], "theme": 3}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}], "gloss": []}, {"n": 4, "color": "#2f6b3a", "em": "🌍", "en": "Чет эл адабияты", "ky": "Крылов, Жуковский, Гриммдер, Сент-Экзюпери", "intro": "Орус жана Европа адабиятынын үлгүлөрү: тамсил, баллада, жомок жана притча.", "pool": [{"q": "И. А. Крылов кайсы жанрдын улуу чебери?", "o": ["Тамсил", "Роман", "Драма", "Баллада"], "c": "c"}, {"q": "Крылов канча тамсил жазган?", "o": ["236", "100", "50", "500"], "c": "c"}, {"q": "Крыловдун замандаштары аны кандай аташкан?", "o": ["«Зыяндуу кумарлардын душманы»", "«От жүрөк»", "«Кара сөздүн алпы»", "«Балладист»"], "c": "c"}, {"q": "«Карышкыр менен козу» тамсилин ким которгон?", "o": ["Райкан Шүкүрбеков", "Ашым Жакыпбеков", "Т. Сыдыкбеков", "К. Жунусов"], "c": "c"}, {"q": "«Алдуу алсызды дайым күнөөкөр кылат» — кайсы тамсилден?", "o": ["«Карышкыр менен козу»", "«Кызыл Топучан»", "«Токой падышасы»", "«Кичинекей ханзада»"], "c": "c"}, {"q": "В. А. Жуковский кайсы багыттын негиздөөчүсү?", "o": ["Романтизм", "Реализм", "Классицизм", "Сентиментализм"], "c": "c"}, {"q": "«Токой падышасы» балладасынын түп нускасынын автору?", "o": ["И. В. Гёте", "Шиллер", "Скотт", "Пушкин"], "c": "c"}, {"q": "«Токой падышасы» балладасында нариста эмне болот?", "o": ["Атасынын колунда өлүп калат", "Аман калат", "Токойдо адашат", "Падыша болот"], "c": "c"}, {"q": "Бир тууган Гриммдердин аттары?", "o": ["Якоб жана Вильгельм", "Шарль жана Пьер", "Иван жана Василий", "Антуан жана Леон"], "c": "c"}, {"q": "«Балдар жана үй-бүлө жомоктору» качан чыккан?", "o": ["1812", "1697", "1943", "1806"], "c": "c"}, {"q": "«Кызыл Топучан» жомогун биринчи ким иштеп чыккан?", "o": ["Шарль Перро", "Гриммдер", "Андерсен", "Крылов"], "c": "c"}, {"q": "Гриммдердин вариантында Кызыл Топучанды ким куткарат?", "o": ["Аңчы (мергенчи)", "Атасы", "Чоң энеси", "Эч ким"], "c": "c"}, {"q": "«Кичинекей ханзада» чыгармасынын автору?", "o": ["Антуан де Сент-Экзюпери", "Шарль Перро", "В. Жуковский", "Гриммдер"], "c": "c"}, {"q": "Сент-Экзюпери кандай кесиптин ээси болгон?", "o": ["Учкуч", "Дарыгер", "Мугалим", "Аңчы"], "c": "c"}, {"q": "Кичинекей ханзада кайсы планетадан келген?", "o": ["Астероид B-612", "Марс", "Венера", "Юпитер"], "c": "c"}, {"q": "Түлкүнүн сыры: «… гана көрөгөч».", "o": ["Жүрөк", "Көз", "Акыл", "Кулак"], "c": "c"}, {"q": "Кичинекей ханзаданын планетасына коркунуч туудурган өсүмдүк?", "o": ["Баобаб", "Роза", "Терек", "Арча"], "c": "c"}, {"q": "«Кичинекей ханзада» ким арналган?", "o": ["Леон Вертке", "Перрого", "Гётеге", "Апасына"], "c": "c"}, {"q": "«Тамсил» деген эмне?", "o": ["Акыл-насаат айтылган ыр же проза", "Узун роман", "Трагедия", "Гимн"], "c": "g"}, {"q": "«Аллегория» грек тилинен кандай которулат?", "o": ["Кыйытып айтуу, каймана айтуу", "Бийлөө", "Сүйлөшүү", "Өтүп кетүү"], "c": "g"}, {"q": "«Баллада» (фр.) эмнени билдирет?", "o": ["Бийлөө", "Ырдоо", "Айтуу", "Жазуу"], "c": "g"}, {"q": "«Диалог» деген эмне?", "o": ["Эки же андан ашык адамдын сүйлөшүүсү", "Бир адамдын сөзү", "Ыр", "Макал"], "c": "g"}, {"q": "«Монолог» деген эмне?", "o": ["Бир каармандын жекече сөзү", "Эки адамдын сүйлөшүүсү", "Хор", "Жомок"], "c": "g"}, {"q": "«Притча» деген эмне?", "o": ["Дидактикалык-аллегориялык жанр", "Сатиралык роман", "Гимн", "Айтыш"], "c": "g"}, {"q": "«Метафора» (гр.) эмнени билдирет?", "o": ["Өтүп кетүү", "Каймана айтуу", "Бийлөө", "Сүйлөшүү"], "c": "g"}, {"q": "«Жадады кулак» деген эмне?", "o": ["Жаагыңды жап, тынч бол", "Угуп тур", "Кулагың чоң", "Ыр ырда"], "c": "v"}, {"q": "«Кокустатасыңар» деген эмне?", "o": ["Кокустан зыян кыласыңар", "Жардам бересиңер", "Мактайсыңар", "Кетесиңер"], "c": "v"}, {"q": "«Татынакай» деген эмне?", "o": ["Сүйкүмдүү, жагымдуу", "Жаман", "Чоң", "Кары"], "c": "v"}, {"q": "«Байыр болуу» деген эмне?", "o": ["Жакын, дос болуу, үйрөнүү", "Качуу", "Урушуу", "Унутуу"], "c": "v"}, {"q": "«Илгичти басуу» деген эмне?", "o": ["Эшиктин тутканы басуу", "Мылтык атуу", "Китеп окуу", "Ырдоо"], "c": "v"}], "speak": ["Карышкыр менен козунун ортосундагы диалогду айтып бер.", "Кызыл Топучан кандай кыз? Айт.", "Кичинекей ханзаданын досу ким болгон?", "«Жүрөк гана көрөгөч» дегенди кандай түшүнөсүң?", "Сенин сүйүктүү жомогуң кайсы?"], "lessons": [{"id": "t4l1", "title": "Иван Андреевич Крылов. «Карышкыр менен козу»", "ky": "Улуу тамсилчи (1769–1844)", "gram": "<b>Тамсил</b> — ыр же проза түрүндөгү адабий чыгарма. Тамсилдин башында же аягында акыл-насаат айтылат. Каармандары көбүнчө жаныбарлар; алар аркылуу адамдардын кемчиликтери шылдыңданат. <b>Аллегория</b> (гр. — <i>кыйытып айтуу, каймана айтуу</i>): жомоктордо куулук — түлкүнүн, ырайымсыздык жана адилетсиздик — карышкырдын образы аркылуу берилет. Кыргыз жазма адабиятында тамсил Тоголок Молдонун чыгармачылыгы менен байланыштуу.", "lex": "элдик китепкана, сиңирген, чагылдырып берүү, агартуу доору, алсыздыктар, адегенде, элдик сүймөнчүлүк, Жайкы бак, окурмандар, сандап чыгат, оркойтпой, какмар-шакмар, бейбаштыгың, төрөм, бекерден бекер, жалганчы, так ушул, жек-жаат, ошолордун айыбы, жадады кулак", "tasks": [{"t": "vocab", "i": "think", "h": "Сөздүк. Басканда угулат (🔊). <small style=\"color:#7a6a60;font-weight:400\">(127-бет)</small>", "w": [["тамсил", "акыл-насааттуу кыска чыгарма", "басня", "🦊"], ["сиңирген", "өзүнө алган", "впитал", "🧽"], ["агартуу доору", "XVIII кылымдагы билим доору", "эпоха Просвещения", "💡"], ["сандап чыгат", "көп, санап бүтпөйт", "не счесть", "🔢"], ["оркойтпой", "көрүнөө, ачык эмес", "не выставляя напоказ", "🙈"], ["какмар-шакмар", "кир, булганыч", "грязный", "🤢"], ["бейбаштык", "тартипсиздик, тентектик", "дерзость", "😤"], ["төрөм", "мырзам, урматтуум", "господин мой", "🎩"], ["бекерден бекер", "эч себепсиз", "ни за что", "🤷"], ["жалганчы", "калпычы", "лжец", "🤥"], ["жек-жаат", "туугандар", "родня", "👪"], ["кокустатуу", "кокустан зыян кылуу", "навредить", "⚠️"], ["айып", "күнөө, жаза", "вина", "⚖️"], ["жадады кулак", "«жаагыңды жап!»", "замолчи!", "🤐"], ["каяша кылуу", "тил кайтаруу", "перечить", "🗯️"], ["жара тартып жейин", "айрып жейин", "разорву и съем", "🐺"]]}, {"t": "read", "i": "read", "h": "Тамсилчи жөнүндө окугула. <small style=\"color:#7a6a60;font-weight:400\">(124-бет)</small>", "title": "Иван Андреевич Крылов (1769–1844)", "text": ["И. В. Крылов орус адабиятынын тарыхында улуу тамсилчи катары калган. Ал Петербургдун элдик китепканасында 30 жыл эмгектенип, 200дөн ашык тамсилдерди жазган.", "Иван Андреевич Крылов 2 (13) февралда 1769-жылы Москвада, армиянын офицеринин үй-бүлөсүндө туулган. Атасы кайтыш болгондон кийин, ал апасы менен Петербургга көчүп келишкен. Бала кезинен көп окуган жана карапайым элдин ичинде чоңойгон. Жөнөкөй орус адамдарынын мүнөзүн, жандуу тилин кебин өзүнө сиңирген.", "Москвада театрга кызыгып, пьесаларды жазган жана атайын журнал чыгара баштаган. Ал сатиралык чыгармаларды жаратып, адамдардын кемчилигин күзгүдөй чагылдырып берүүгө умтулган. Агартуу доорунун ошол учурдагы идеясы боюнча, адамдардын алсыздыктарын көрсөтүү менен гана аларды оңдоого болот деп ишенген.", "1806-жылы Петербургга кайтып келген И. В. Крылов тамсил жанрына кызыга баштаган. Адегенде ал француз тамсилчиси Лафонтенди которуп, андан кийин өз тамсилдерин жаратууга киришет. Карапайым элдин идеясын чагылдырган мазмундуу жана акылман тамсилдери ага жалпы элдик сүймөнчүлүктү алып келген.", "И. В. Крылов 1844-жылы 9-ноябрда дүйнөдөн кайткан, бир жылдан кийин Санкт-Петербургдун Жайкы багында азыркыга чейин сакталып келе жаткан атактуу эстелиги тургузулган."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Крылов качан, кайда туулган?", "o": ["1769-ж., Москвада", "1783-ж., Тула губерниясында", "1785-ж., Германияда", "1900-ж., Лиондо"], "a": 0}, {"q": "Крылов элдик китепканада канча жыл иштеген?", "o": ["30 жыл", "10 жыл", "50 жыл", "5 жыл"], "a": 0}, {"q": "Адегенде кайсы тамсилчини которгон?", "o": ["Лафонтенди", "Эзопту", "Гётени", "Перрону"], "a": 0}, {"q": "Крыловдун эстелиги кайда турат?", "o": ["Санкт-Петербургдун Жайкы багында", "Москвада", "Парижде", "Бишкекте"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "Тамсилди окугула. <small style=\"color:#7a6a60;font-weight:400\">(126-бет)</small>", "title": "Карышкыр менен козу (Райкан Шүкүрбековдун котормосу боюнча)", "text": ["Алдуу алсызды дайым күнөөкөр кылат: Буга мисал тарыхта сандап чыгат, Биз тарых жазган жерибиз жок, Ал эми тамсилде мындай айтылат.", "Ысыкта суу ичүүгө козу булакка келди, Козуну ач карышкыр андан көрдү. Балээни кайдан деп болобу, Козуну жара тартып жейин деди: Бирок оркойтпой законду болсун деп, Карышкырдын козуга айтып турган жери: «Ой, адепсиз, жүзү кара, какмар-шакмар оозуң менен Менин ичкен суумду Эмне үчүн Булгадың сен? Бейбаштыгың үчүн «балам» Сенин башыңды жулуп алам».", "«Уруксат этсеңиз, улук карышкыр төрөм, Мен сизден жүз кадамча ылдыйтан ичтим төмөн. Сиз бекерден бекер каарданасыз, Ылдый аккан суунун жогор жагын кантип булгамак элем»", "«Жалганчы экемин го анда мен! Акмакты кара! Мындайды көрдү бекен дүйнөнүн ай-ааламы, Эсиңдеби козум, былтыркы жайындагы, Мени так ушул жерде тилдегенсиң: Унутканым жок, досум, аны!» «Ой, кудай ай! Мен быйыл төрөлгөм» — Деди козу. «Анда эмесе сенин тууганың чыгар»", "«Менин тууганым жок», — «Жек-жаат, урук-жууратыңар, Кыскасын айтканда силердин тукумуңар! Силердин өзүңөр, итиңер, койчуларыңар, Мени жек көрөсүңөр баарыңар: Колуңардан келсе эле кокустатасыңар мени, Ошолордун айыбы үчүн азыр көрөмүн сени»", "«Менде эмне жазык?» «Жап жаагыңды, угуудан жадады кулак, Иттин баласы, уялбай мага каяша кылат! Сенин күнөөң ушул: менин кардым ачып турат» Дейт да козуну тиштеп, токойду көздөй урат."], "by": "И. А. Крылов", "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Тамсил кайсы акыл-насаат менен башталат?", "o": ["Алдуу алсызды дайым күнөөкөр кылат", "Жүрөк гана көрөгөч", "Ат — адамдын канаты", "Билим — элге, суу — жерге"], "a": 0}, {"q": "Карышкыр козуну алгач эмне деп күнөөлөдү?", "o": ["Менин суумду булгадың деп", "Мени тилдедиң деп", "Тууганың мени жек көрөт деп", "Ачка экенимди айтпадың деп"], "a": 0}, {"q": "Козу кандай жооп берди?", "o": ["Мен ылдыйдан ичтим, жогор жакты булгай албайм", "Кечирип коюңуз", "Мен ичкен жокмун", "Качып кетти"], "a": 0}, {"q": "Карышкырдын чыныгы себеби эмне болду?", "o": ["«Менин кардым ачып турат»", "Козу аны тилдеген", "Козу суу булгаган", "Ити аны тиштеген"], "a": 0}]}]}, {"t": "sort", "i": "think", "h": "Сөздөрдү козуга же карышкырга таандыгына жараша бөлгүлө. <small style=\"color:#7a6a60;font-weight:400\">(128-бет)</small>", "cols": ["Козунун сөзү (мүнөзү)", "Карышкырдын сөзү (мүнөзү)"], "items": [["«Уруксат этсеңиз, улук карышкыр төрөм»", 0], ["«Мен сизден жүз кадамча ылдыйтан ичтим»", 0], ["«Ой, кудай ай! Мен быйыл төрөлгөм»", 0], ["«Менде эмне жазык?»", 0], ["«Ой, адепсиз, жүзү кара»", 1], ["«Сенин башыңды жулуп алам»", 1], ["«Жалганчы экемин го анда мен!»", 1], ["«Сенин күнөөң ушул: менин кардым ачып турат»", 1]]}, {"t": "match", "i": "think", "h": "Антонимдерди жупташтыргыла. <small style=\"color:#7a6a60;font-weight:400\">(129-бет)</small>", "pairs": [["алсыз", "күчтүү"], ["ак көңүл", "кара ниет"], ["достор", "душмандар"], ["орой", "сылык"], ["акырын", "катуу"], ["чындык", "калп"], ["жашоо", "өлүм"]]}, {"t": "read", "i": "read", "h": "Тамсилдин идеялык мазмунун окугула. <small style=\"color:#7a6a60;font-weight:400\">(129-бет)</small>", "title": "«Карышкыр менен козу» тамсилинин идеялык мазмуну", "text": ["Бул тамсил стилдик жактан эки башка каармандын диалогу аркылуу курулган чыгарма. Негизги айтыла турган насаат тамсилдин башында эле берилген: Алдуу алсызды дайым күнөөкөр кылат. Муну менен И. А. Крылов тамсилдеги айтылуучу негизги идеяга окурмандарды багыттайт.", "Демек алдуулар, жырткычтар алсыз момундарды ар дайым күнөөгө жыгат деген ой тастыкталып жатабы? Чынында туулганына жарым жыл болгон козу карды ачып турган азуусу курч, тырмагы узун, күчтүү карышкырга каршылык көрсөтө алган жок. Бирок карышкыр да өзүнөн күчтүү жырткычка жолугуп, алдуу жолборс же аюунун алдында козудай жалдырап калышы да толук мүмкүн экендигин эсине албайт.", "Ал өзүнүн күчүнөн, бийлигинен пайдаланып, башкаларды басынткан жана эзген наадан адамдын образын ачат. Карышкыр өзүнүн жазаланбай турганын жакшы түшүнөт, ошондуктан анын сөздөрү орой жана каардуу, жасаган иши адилетсиз, ырайымсыз.", "Ал эми коргоосуз жана айыпсыз козу карапайым элдин, өз укугун коргой албаган жөнөкөй адамдардын образын берет. Козу карышкырга өзүнөн жогору тургандай сый-урмат менен кайрылып, аны жумшартууга аракет жасайт. Бирок тамсилде айтылгандай алдуу-күчтүү, алсызды айыпташ үчүн бир себепти баары бир табат. Чыгармада оройлук, өз абалынан пайдаланган жалпы «күчтүүлөрдүн» — дворяниндердин элге, помещиктердин өз крепостной дыйкандарына жасаган мыйзамсыз, адилетсиз мамилеси шылдыңга алынган."]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(128-бет)</small>", "qs": ["1. Тамсилдин «Алдуу алсызды дайым күнөөкөр кылат» деп башталганы эмнеден кабар берет?", "2. Суу ичкенге келген козуну көрүп карышкыр эмнени ойлоду?", "3. Козу бир жыл мурда карышкырды сөгүүсү мүмкүн беле?", "4. Карышкырдын козуга асылгандыгынын чыныгы себеби эмнеде экен?", "5. Козунун карышкырдан кутулуп чыгууга мүмкүндүгү бар беле?", "6. «Алсыздар күчтүүлөрдүн алдында ар дайым күнөөлүү» деген сөздөр тамсилдин маанисине туура келеби?", "7. Адам коомунда алсыздарды күчтүүлөрдүн кысымынан кантип коргоого болот деп ойлойсуң?"], "rows": 3, "ex": "1. Тамсилдин негизги идеясын алдын ала айтып, окурманды багыттайт.<br>2. Козуну жара тартып жейин деди, бирок «законду болсун» деп себеп издеди.<br>3. Жок, ал быйыл төрөлгөн.<br>4. Карышкырдын карды ачып турган.<br>5. Жок, алсыз, коргоосуз болчу.<br>6. Ооба, тамсилдеги карышкыр ар дайым бир себеп табат.<br>7. Мыйзам, адилеттүү сот, биримдик жана бири-бирин коргоо аркылуу."}, {"t": "act", "i": "group", "h": "Сценка койгула. <small style=\"color:#7a6a60;font-weight:400\">(129-бет)</small>", "html": "Тамсил боюнча козу менен карышкырдын диалогун жаттап, ролдошуп сценка койгула."}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t4l2", "title": "Василий Андреевич Жуковский. «Токой падышасы»", "ky": "Романтик акын (1783–1852). Баллада", "gram": "<b>Баллада</b> (фр. — <i>бийлөө</i>) — Европанын орто кылым адабиятындагы лирикалык жанр. XIII кылымда трубадурлар поэзиясында пайда болуп, XIV кылымда түптөлгөн. Баллада — көбүнчө музыкалуу, романтикалуу сюжеттүү лирикалык окуя. <i>«Токой падышасы»</i> — фантастикалуу образдар, курч сюжет жана трагедиялуу финал менен коштолгон романтикалуу ыр.", "lex": "таанымал, ачууга түрткү, падышалык сарай, жемиштүү, зор урмат, чеберчилик, өз кучагы, түзгөн, көкүрөгүнө, өз дүйнөсүнө, чаап бара жатат, үшүгөн, жылынуу, жөөлүү, азгыруу, жөнөкөй нерселер, сооротуу, туткун, арбап алды, ойноп учушат, тумчугуп калдым, чабандес, чарчап калуу", "tasks": [{"t": "vocab", "i": "think", "h": "Сөздүк. Басканда угулат (🔊). <small style=\"color:#7a6a60;font-weight:400\">(134-бет)</small>", "w": [["чаап бара жатат", "катуу жүрүп баратат", "скачет", "🐎"], ["үшүгөн", "сууктан калтыраган", "озябший", "🥶"], ["жылынуу", "жылуу болуу", "согреваться", "🔥"], ["жөөлүү", "алжыгандай сүйлөө", "бредить", "😵"], ["азгыруу", "алдап чакыруу", "соблазнять", "🌀"], ["жөнөкөй нерселер", "кадимки көрүнүштөр", "обычные вещи", "🍃"], ["сооротуу", "тынчытуу", "утешать", "🤗"], ["туткун", "колго түшкөн", "пленник", "⛓️"], ["арбап алды", "сыйкырлап алды", "заворожил", "✨"], ["ойноп учушат", "бийлеп, учуп ойношот", "играют, кружатся", "🧚"], ["тумчугуу", "дем ала албай калуу", "задыхаться", "😮‍💨"], ["чабандес", "атчан адам", "всадник", "🏇"], ["чарчап калуу", "өлүп калуу", "скончаться", "🕯️"], ["таажы", "падышанын баш кийими", "корона", "👑"], ["Дубров", "эмен токою", "дубрава", "🌳"], ["таанымал", "белгилүү", "известный", "🌟"]]}, {"t": "read", "i": "read", "h": "Акын жөнүндө окугула. <small style=\"color:#7a6a60;font-weight:400\">(130-бет)</small>", "title": "Василий Андреевич Жуковский (1783–1852)", "text": ["Орус элинин улуу акыны, котормочусу Василий Андреевич Жуковский орус адабиятындагы романтизм багытынын негиздөөчүсү болуп саналат.", "Ал 1783-жылы Тула губерниясындагы Мишенск айылында помещиктин үй-бүлөсүндө туулган. Алгачкы ырлары Москва шаарындагы университеттин пансионунда окуп жүргөндө жазылган. Сентиментализм жана романтизм багытындагы «Людмила», «Светлана», «Кассандра» сыяктуу чыгармалары менен окурмандарга таанымал болгон. Акындын «Европа жарчысы» журналында редактор болуп иштеши, котормочулук талантын ачууга түрткү берген.", "1812-жылдагы Ата Мекендик согуш учурундагы тарыхый окуялар, алардын таасири В. Н. Жуковскийдин «Император Александрга», «Орус жоокерлеринин кошуунундагы ырчы» аттуу чыгармаларында көркөм ачылган. Ал эми 1815-жылдан баштап падышалык сарайда кызматын баштап, 25 жыл жогорку орус коомундагы таасирдүү адамдардын арасында болгон. Эң жемиштүү деп эсептелген бул жылдары «Эоловдун арфасы», «Уйкудагы он эки сулуу» аттуу балладалары, ырлары жана котормолору жаралган. В. Н. Жуковский 12-апрелде 1852-жылы Баден-Баден шаарында кайтыш болгон. Улуу акындын сөөгү Россияга алынып келинген жана зор урмат менен Санкт-Петербургда коюлган.", "XIX кылымда Василий Жуковский «балладист» деп аталып, ал немис романтизм доорунун чыгармаларын орус тилине чеберчилик менен которгон. Анын которулган балладаларынын арасында — Гётенин, Шиллердин, Скотттун балладалары бар.", "«Токой падышасы» балладасын акын 1818-жылы И. В. Гётенин чыгармасын немец тилинен которуп, өзгөртүп жазган. Мистикалык чыгарманын негизин кичинекей оорукчан бала жана аны өз кучагына чакырган токой падышасы түзгөн. Наристе бала ага көрүнгөн токой падышасынан атасынын көкүрөгүнө жашынып калгысы келет. Бирок кубаттуу жана каардуу дух баланын жанын өз дүйнөсүнө алып кетет."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Жуковский качан, кайда туулган?", "o": ["1783-ж., Тула губерниясы, Мишенск айылы", "1769-ж., Москва", "1785-ж., Ганау", "1900-ж., Лион"], "a": 0}, {"q": "Жуковский кайсы багыттын негиздөөчүсү?", "o": ["Романтизм", "Реализм", "Классицизм", "Футуризм"], "a": 0}, {"q": "Жуковский кандай аталган?", "o": ["«Балладист»", "«Тамсилчи»", "«Жомокчу»", "«Учкуч»"], "a": 0}, {"q": "«Токой падышасы» балладасын ким жазган (түп нуска)?", "o": ["И. В. Гёте", "Шиллер", "В. Скотт", "Крылов"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "Балладаны окугула. <small style=\"color:#7a6a60;font-weight:400\">(133-бет)</small>", "title": "Токой падышасы", "text": ["Муздак туман астында ким чуркайт, ким чуркайт? Чабандес кечигип жатат, аны менен бирге жаш уулу. Атасына калчылдап, наристе жабышып калды; Карыя аны кучактап, жылуулайт.", "— Балам, эмнеге мага уялчаак болуп жабыштың? — «Кымбаттуум, токой падышасы көзүмө урунду: Ал кара таажы кийип, калың сакал койду» деди. — — Жок, туман суу үстүндө аппак болуп турат.", "«Балам, айланаңды карачы; балам, мага; Менин жагымда көп кызыктуу нерселер бар: Көгүш-жашыл гүлдөрү, апакай берметтер; Менин сарайларым алтындан куюлуп бүттү» деди. «Кымбаттуум, токой падышасы мага: Ал алтын, бермет жана кубанычты убада кылат». — — Ой, балам, сен туура эмес уккансың: Андан кийин шамал ойгонуп, шейшептерди силкип жиберди».", "«Мага, балам; менин Дубровдо Менин сулуу кыздарымды тааныйсың: Бир айдан кийин алар ойноп учушат, Ойноп, учуп, сени уктатат». «Кымбаттуум, токой падышасы кыздарын чакырды: Карасам, алар кара бутактардан баштарын ийкеп жатышат». «Жок, түндүн тереңинде бардыгы тынч: Ак чачтуу талдар дагы четте турушат» деди.", "«Балам, сенин сулуулугуң мени арбап алды: Туткун болобу же каалайбы, бирок сен меники болосуң». — «Кымбаттуум, токой падышасы бизди кууп жетүүнү каалайт; Мына, мен тумчугуп калдым, дем алуу мага кыйын болуп жатат». Уялчаак атчан секирбейт, учат; Бала энсеп жатат, бала кыйкырып жатат; Атчан айдайт, чабандес чуркайт … Анын колунда чарчап калган наристе болгон."], "by": "В. А. Жуковский (И. В. Гётеден которгон)", "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Караңгы токойдогу жолоочулар кимдер?", "o": ["Чабандес ата жана анын жаш уулу", "Токой падышасы жана кыздары", "Аңчылар", "Эки бала"], "a": 0}, {"q": "Токой падышасы балага эмнелерди убада кылат?", "o": ["Алтын, бермет жана кубанычты", "Ат жана мылтыкты", "Китеп жана калемди", "Жылуу үй жана тамакты"], "a": 0}, {"q": "Ата баланы эмне менен сооротот?", "o": ["Жөнөкөй нерселер менен: туман, шамал, талдар", "Ыр менен", "Тамак менен", "Жомок менен"], "a": 0}, {"q": "Балладанын финалы кандай?", "o": ["Трагедиялуу — бала атасынын колунда өлүп калат", "Бактылуу — бала айыгат", "Бала падыша болот", "Ата падышаны жеңет"], "a": 0}]}]}, {"t": "sort", "i": "think", "h": "Реалдуу дүйнө жана элестүү дүйнө: сөз айкаштарын бөлгүлө. <small style=\"color:#7a6a60;font-weight:400\">(134-бет)</small>", "cols": ["Оорукчан наристе, караңгы токой, атасы — реалдуу дүйнө", "Токой падышасы, алтын сарай, ойноок кыздар — элестүү дүйнө"], "items": [["Оорукчан, алсыз. Караңгы токой", 0], ["Бала коркуп, үшүйт. Атасы атчан", 0], ["Атасынын кучагына жабышат", 0], ["Кара бутактар, тумандуу кеч", 0], ["Кара таажы кийип, калың сакал", 1], ["Анда көп кызыктуу нерселер бар", 1], ["Сарайлары алтындан", 1], ["Кыздары учуп, сени уктатат", 1]]}, {"t": "read", "i": "read", "h": "Балладанын идеялык мазмунун окугула. <small style=\"color:#7a6a60;font-weight:400\">(135-бет)</small>", "title": "«Токой падышасы» балладасынын идеялык мазмуну", "text": ["«Токой падышасы» — токойдун өзгөчө жашоочулары жана коргоочулары. Алар токойду аралаганда дарактар менен тең болуп, чөптөрдүн ичинде кирсе чөптөй жапыз болушат дешкен. Кээде алар адам кейпинде кечиккен жолоочуларга көрүнүшөт — деп жазышкан элдик мифологияны изилдөөчүлөр. Гётенин балладасында англиянын токойлорун мекендеген эрл же эльфтер тууралуу айтылган. Ал эми В. А. Жуковскийдин котормосунда орус токойлорунун сырдуу жашоочуларын башкарган Токой падышасы деп сүрөттөлгөн.", "Ооруган бала жөөлүйт, көзүнө укмуштуу Токой падышасы артынан кубалап келе жаткандай көрүнөт. Токой падышасы баланы байлык, кооз буюмдар менен азгырып, өзүнө чакырат. Мунун баарын бала атасына айтат, бирок атасы аларды жөнөкөй нерселер (шамалдын согушу, бак-дарактардын кыймылдары) менен түшүндүрөт.", "Трагедиянын жакындыгы Токой падышасынын ишенчээк, алсыз жана оорукчан балага гана көрүнүшү менен бекемделет. Балага көрүнгөн сырдуу дүйнөгө атасынын ишенбегени, чоң адамдын реалдуулук менен бекем байланышы баланын өлүмүн жакындатат. Наристенин жаны үчүн, жашоосу үчүн күрөштө Токой падышасы жана караңгылык менен өлүм жеңишке жетишет. Акын бул балладада адам үмүтү, жашоого болгон эрки ар кандай кыйын шарттарда да өчпөйт, акырына чейин күрөшөт деген негизги идеяны реалдуулук менен фантазиянын жуурулушу аркылуу чагылдырган."]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(134-бет)</small>", "qs": ["1. Караңгы токойдогу жолоочулар кимдер? Чабандес атын кайда шашып чапкылайт?", "2. Баланын көзүнө эмнелер көрүнүп жатат? Аларды атасы эмне үчүн көрө албайт?", "3. Токой падышасы өз дүйнөсүн кандай сүрөттөйт, эмнелерди убада кылды?", "4. Бала токой падышасынын сөздөрүнө ишенеби, эмне үчүн ал улам атасынын көкүрөгүнө жабышат?", "5. Эгерде баланын атасы ага ишенгенде окуя кандай өнүгөт эле?", "6. Наристе тумчугуп, кыйкырып жатканы эмнеден кабар берет? Токой падышасынын жеңиши эмнени билдирет?"], "rows": 3, "ex": "1. Ата жана анын оорукчан уулу; баланы тезирээк үйгө жеткирүүгө шашат.<br>2. Токой падышасы, анын кыздары; ата реалдуулукка гана ишенет.<br>3. Көгүш-жашыл гүлдөр, берметтер, алтын сарайлар, сулуу кыздар; алтын, бермет, кубаныч.<br>4. Ишенет жана коркот, ошондуктан атасынан коргоо издейт.<br>5. Балким, ата баланы тезирээк куткармак же сооротмок.<br>6. Баланын өлүмүнөн; караңгылык менен өлүмдүн жеңишин."}, {"t": "box", "i": "think", "h": "Кызыктуу фактылар", "c": "y", "html": "• В. Н. Жуковский никесиз туулган бала болгондуктан, жасалма грамота менен дворяндар окуган пансиондордо билим алып, мамлекеттик жогорку кызматтарга жеткен.<br>• Акын 11 жашында байыркы грек жана француз адабиятынын негизинде трагедия жана мелодрама жазган экен.<br>• Пансиондо орто бааларга окуганы менен В. Н. Жуковский окууну күмүш медаль менен аяктаган. Ал немец, француз жана байыркы грек тилдеринде эркин сүйлөгөн.<br>• 1826-жылы «Бир тууган Гриммдердин жомоктору» орус тилине которулган. Котормонун автору Василий Жуковский болгон."}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t4l3", "title": "Бир тууган Гриммдер. «Кызыл Топучан»", "ky": "Немис жомокчулары. Жомок", "gram": "<b>Диалог</b> (гр. — <i>сүйлөшүү, аңгемелешүү</i>) — эки же андан ашык адамдардын өз ара оозеки сүйлөшүүсү. <i>«Кызыл Топучан» жомогундагы Кызыл Топучан менен Карышкырдын диалогу алардын образын таасын ачып берет.</i> <b>Монолог</b> (гр. — <i>бир сөз</i>) — көркөм чыгармада каармандардын жекече окурманга карата айтылган сөзү.", "lex": "татынакай, жанын берүүгө даяр, оидогудай кылам, жандай басты, сайрап жатканын, коозураагын, илгичти басты, үн катпастан, көтөрө алгыс, катуу коңурук, картаң арам, куткарса болот, тилик жасап, уруксаты жок, сак болуп, чоң таш дагара, кармана албай", "tasks": [{"t": "vocab", "i": "think", "h": "Сөздүк. Басканда угулат (🔊). <small style=\"color:#7a6a60;font-weight:400\">(142-бет)</small>", "w": [["татынакай", "сүйкүмдүү, жагымдуу", "милый", "🥰"], ["жанын берүүгө даяр", "абдан жакшы көргөн", "готов отдать жизнь", "❤️"], ["ойдогудай кылам", "жакшы аткарам", "сделаю как надо", "👌"], ["жандай басты", "жанында басып жүрдү", "шёл рядом", "🚶"], ["сайрап жатканын", "ырдап жатканын (куштар)", "как поют", "🐦"], ["коозураагын", "сулуураагын", "покрасивее", "🌸"], ["илгичти басты", "эшиктин тутканы басты", "нажал на ручку", "🚪"], ["үн катпастан", "эч нерсе дебестен", "молча", "🤐"], ["көтөрө алгыс", "абдан көп", "не унести", "🧺"], ["катуу коңурук", "катуу коңурук тартуу", "громкий храп", "😴"], ["картаң арам", "кары митаам", "старый злодей", "😠"], ["тилик жасап", "кесип", "разрезав", "✂️"], ["сак болуп", "абайлап", "осторожно", "⚠️"], ["дагара", "чоң идиш, чара", "корыто", "🪣"], ["кармана албай", "токтой албай", "не удержавшись", "⬇️"], ["топу", "баш кийим", "шапочка", "🧢"]]}, {"t": "read", "i": "read", "h": "Гриммдер жөнүндө окугула. <small style=\"color:#7a6a60;font-weight:400\">(137-бет)</small>", "title": "Бир тууган Гриммдер (Якоб 1785–1863, Вильгельм 1786–1859)", "text": ["Якоб менен Вильгельм Гриммдер — атактуу немис жомокчулары, герман филологиясынын негиздөөчүлөр. Алардын жомокторундагы Күлчү кыз, Уйкудагы сулуу, Рапунцель сыяктуу персонаждары дүйнөгө белгилүү.", "Якоб Гримм 1785-жылдын 4-январында туулган, бир жылдан кийин, 1786-жылдын 24-февралында Вильгельм Гримм жарык дүйнөгө келген. Гриммдердин үй-бүлөсүндө Якоб менен Вильгельмден башка дагы алты уул бала, бир кыз бала болгон.", "Алардын атасы адвокат болуп иштеген. Ал балдары жаш кезинде каза болуп калат. Улуусу Якоб 11 гана жашта болгон, ал балдардын улуусу катары үй-бүлөнү багууга мажбур болот. Окуунун маанилүү экендигин түшүнгөн энеси балдарын Кассель шаарына эжесиникине жөнөтөт. Ал жерде Якоб менен Вильгельм жогорку баскычтагы лицейде окуусун улантышат. Лицейде балдар 7-8 жыл окушчу, бирок бир туугандар эмгекчил, тырышчаак болушкандыктан, лицейди төрт жылда эле бүтүрүшөт.", "Бир туугандар юридикалык факультетти бүтүрүшкөнүнө карабастан, дайыма адабиятка, немис поэзиясына кызыгышчу. Чыгармачылыгын бир туугандар байыркы герман адабиятын изилдөөдөн башташкан. Алар миңдеген жылдардан бери муундан-муунга айтылып келе жаткан элдик жомокторду, уламыштарды жыйнап, иштеп чыгышат. 1812-жылы бир туугандар биринчи «Балдар жана үй-бүлөлүк жомоктор» аттуу жыйнагын басып чыгарышат. Жыйнакка 100 чыгарма кирген. Андан кийин, 1815-жылы жыйнактын 2-китеби жарык көргөн.", "1819-жылы Гриммдер «Немис грамматикасынын» томун басып чыгарышат. Бир туугандардын эң негизги эмгеги — «Немис сөздүгү». Анын үстүнөн бир туугандар 1838-жылы иштей башташкан. Бул абдан оор жана узак иш эле. Аны кийинки муундагы филологдор 120 жылдан кийин, 1960-жылы гана аякташкан."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Гриммдердин атасы ким болгон?", "o": ["Адвокат", "Мугалим", "Дыйкан", "Офицер"], "a": 0}, {"q": "Гриммдер лицейди канча жылда бүтүрүшкөн?", "o": ["Төрт жылда", "Сегиз жылда", "Эки жылда", "Он жылда"], "a": 0}, {"q": "Биринчи жыйнагына канча чыгарма кирген?", "o": ["100", "200", "50", "1000"], "a": 0}, {"q": "«Немис сөздүгү» качан аяктаган?", "o": ["1960-жылы", "1838-жылы", "1812-жылы", "1900-жылы"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "Жомокту окугула. <small style=\"color:#7a6a60;font-weight:400\">(139-бет)</small>", "title": "Кызыл Топучан (жомок)", "text": ["Бир татынакай, кичинекей кыз жашаптыр. Ал бардык адамдарга жакчу, өзгөчө чоң энеси ал үчүн жанын берүүгө даяр эле. Бир жолу чоң энеси кызга тукабадан кызыл топу тигип белек кылат. Топу кызга ушунчалык жарашып калат, кыз андан башка топуну кийгиси келбейт. Ошондуктан аны бардыгы Кызыл Топучан деп коюшчу. Бир күнү апасы кызына мындай деди: — Кызыл Топучан, чоң энең ооруп, алсыз, айыгып кетсин, бул таттуу токочту жана бир бөтөлкө шарапты чоң энеге алып барып бер. Үйдөн күн ысып кете электе эрте чык, жолдон башка жакка бурулбай түз жүр. Жыгылып кетип бөтөлкөнү сындырып алба. Антсең, чоң энеге эч нерсе жетпей калат.", "— Мен баарын ойдогудай кылам, — деп жооп берди апасы менен коштошуп жатып Кызыл Топучан. Чоң энеси токойдун ичинде жашачу, кыштактан ал жакка жарым саатта жетсе болот. Кызыл Топучан токойго кирер замат карышкыр астынан чыгат. Кызыл Топучан анын кандай жырткыч экенин билчү эмес, ошондуктан корккон да жок. — Саламатсыңбы, Кызыл Топучан? — деди карышкыр. — Ыракмат сага, карышкыр, айтканың келсин. — Кызыл Топучан, сен мынча эрте кайда бара жатасың? — Чоң энеме. — Кызыл Топучан, чоң энең кайда жашайт? — Тигине, токойдо, дагы чейрек саат басыш керек, анын үйү үч чоң эмен багынын астында, ал эми төмөнүрөөк бассаң жаңгак бактары бар. Сен билсең керек? — деди Кызыл Топучан. — «Татынакай кыз экен, — карышкыр өзүнчө ойлонуп калды, — картаң кемпирден көрө мен үчүн абдан таттуу болор, бирок экөөнү тең кармаш керек, ал үчүн куулук керек».", "Карышкыр Кызыл Топучанды жандай басты да: — Кызыл Топучан, сен эмнеге айланаңды карабайсың? Карачы, тегерегиңдин баары гүл. Сен куштар кандай сонун сайрап жатканын да уккан жоксуңбу? Сен мектепке бара жаткандай шашасың да, токойдо убакытты аябай көңүлдүү өткөрсө болот, — дейт. Кызыл Топучан айланасын караса, күндүн нурлары дарактардын арасынан бийлеп жаткандай, тегерегинде укмуш кооз гүлдөр өскөн экен. Ал: «Чоң энеме жаңы гүлдөрдөн гүлдесте жасап барып берсем жакшы болот эле», — деп Кызыл Топучан ойлоно калды, — ал да кубанат. Азыр эрте да, өз убагында эле жетем». Ошентип, ал жолдон токойдун ичине бурулду да, гүл тере баштады.", "Ошол учурда карышкыр дароо чоң эненин үйүн карай бет алды, жете келип эшикти какты. — Бул ким? — Бул менмин, Кызыл Топучанмын. Эшикти аччы, мен шарап менен таттуу токоч алып келдим. — Илгичти бас, — деп кыйкырды чоң энеси, — мен абдан алсыз болуп турам, тура албайм. Карышкыр илгичти басты, эшик дароо ачылды. Үн катпастан карышкыр чоң эненин төшөгүнүн жанына келди да, чоң энени жутуп жиберди. Анан чоң эненин көйнөгүн, башына топусун кийип, төшөгүнө жатып алды да, көшөгөнү жаап койду.", "Кызыл Топучан болсо гүлдөрдү тере берди, көтөрө алгыс кылып абдан көп чогултту, ошондо гана чоң энесин эстеп, ага жөнөдү. Эшик ачык экендигин көрүп абдан таң калды. Бөлмөгө киргенде, баары ага кызык көрүндү. Ошондо ал төшөктүн жанына келип, көшөгөнү ачты, караса, чоң энеси жатат, топусу менен бетин жаап алган, ал аябай кызык көрүнөт. — Ой, чоң эне, эмне үчүн кулактарың ушунча чоң? — Сени жакшы угуш үчүн! — Ой, чоң эне, көздөрүң кандай чоң! — Сени жакшы көрүш үчүн! — Ой, чоң эне, эмне үчүн колдоруң ушунча чоң? — Сени оңой кармаш үчүн! — Ой, чоң эне, сенин оозуң ушунча коркунучтуу чоң экен! — Бул сени оңой жутуп алуу үчүн! Ушуну айтар менен карышкыр ыргып турду да, бечара Кызыл Топучанды жутуп койду.", "Тойгон карышкыр кайрадан төшөккө жатып уктап калды, анан абдан катуу коңурук тарта баштады. Ошол маалда үйдүн жанынан мергенчи кетип бара жаткан. Ал: «Кемпир абдан катуу коңурук тартып жатат го, балким ага жардам керектир, карап коюш керек», — деп үйгө кирди. Төшөктү караса, карышкыр жатат. — Ох! Картаң арам, бул жерде белең! — деп кыйкырды аңчы. — Сени көптөн бери издеп жүрөм. Аңчы мылтыгын мээлеп атайын дейт, анан, балким карышкыр чоң энени жеп койбосун, аны куткарса болот да деп ойлонот. Ал атпай, кайчыны алып уктап жаткан карышкырдын ичин кесип жарат. Бир нече тилик жасагандан кийин кызыл топуну көрдү, дагы кессе кыз чыгып кыйкырып жиберди: — Мен ушундай корктум, карышкырдын курсагында капкараңгы экен! Андан кийин типтирүү картаң чоң эне эптеп дем алып чыга келди. Кызыл Топучан чоң-чоң таштарды алып келди, аларды карышкырдын курсагына толтура салышты. Карышкыр ойгонуп, качайын десе, таштардын оордугунан жерге жыгылды да, ошол бойдон тура алган жок.", "Үчөө абдан ыраазы болушту. Аңчы карышкырдын терисин сыйрып, үйүнө алып кетти. Чоң эне Кызыл Топучан алып келген таттуу токочту жеп, шарапты ичип сакайып, алдуу-күчтүү боло баштады. Ал эми Кызыл Топучан болсо: «Мындан ары мен эч качан апамдын уруксаты жок чоң жолдон токойго жалгыз бурулбайм», — деп ойлоду."], "by": "Бир тууган Гриммдер", "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Кызыл Топучанды эмне үчүн баары жакшы көрүшкөн?", "o": ["Ал татынакай, бардык адамдарга жакчу", "Бай болгон", "Кыйын болгон", "Ырдаганы үчүн"], "a": 0}, {"q": "Апасы Кызыл Топучанды эмне тууралуу эскертти?", "o": ["Жолдон башка жакка бурулба, түз жүр", "Карышкырга салам айт", "Гүл тер", "Кечинде бар"], "a": 0}, {"q": "Карышкыр кызды кантип алдады?", "o": ["Гүлдөрдү, куштарды көрсөтүп, жолдон бурдурду", "Коркутту", "Тамак берди", "Ырдап берди"], "a": 0}, {"q": "Чоң эне менен кызды ким куткарды?", "o": ["Аңчы (мергенчи)", "Апасы", "Атасы", "Кошуна"], "a": 0}, {"q": "Жомоктун аягында Кызыл Топучан кандай сабак алды?", "o": ["Апамдын уруксаты жок жолдон бурулбайм", "Карышкырлардан коркпойм", "Гүл тербейм", "Токойго барбайм"], "a": 0}]}]}, {"t": "order", "i": "think", "h": "Окуялардын иретин эстеп, ар бир сүйлөмдүн сөздөрүн туура тартипке койгула.", "items": [["Апасы токоч менен шарапты берет", "1-окуя"], ["Кыз токойдо карышкырга жолугат", "2-окуя"], ["Кыз гүл тере баштайт", "3-окуя"], ["Карышкыр чоң энени жутат", "4-окуя"], ["Карышкыр кызды да жутат", "5-окуя"], ["Аңчы экөөнү куткарат", "6-окуя"]]}, {"t": "sort", "i": "think", "h": "Ким эмне кылды? Иш-аракеттерди бөлгүлө. <small style=\"color:#7a6a60;font-weight:400\">(143-бет)</small>", "cols": ["Кызыл Топучан эмне кылды?", "Карышкыр эмне кылды?"], "items": [["Карышкыр менен сүйлөштү", 0], ["Жолдон бурулуп кетти", 0], ["Куштардын сайраганын укту", 0], ["Чоң энесине кооз гүлдесте терди", 0], ["Кызыл Топучанга жолукту", 1], ["Кызды алдап жолдон чыгарды", 1], ["Чоң энени алдап үйүнө кирди", 1], ["Керебетте коңурук тартып уктады", 1]]}, {"t": "mcm", "i": "think", "h": "Жомоктун идеясын так берген эки сүйлөмдү белгилегиле. <small style=\"color:#7a6a60;font-weight:400\">(144-бет)</small>", "qs": [{"q": "Жомоктун идеясы (2 жооп):", "o": ["Ак көңүл жана ишенчээк балдар жырткычтарга жем болушат", "Турмушта бейтааныш нерселерге эмес, апаңа ишениш керек", "Кандай болсо да мээримдүү адамдар ар дайым жеңип чыгышат", "Жолуңда кандай тоскоолдуктар болсо да, өз максатыңдан чегинбе"], "a": [0, 1]}]}, {"t": "read", "i": "read", "h": "Жомоктун варианттарын окугула. <small style=\"color:#7a6a60;font-weight:400\">(145-бет)</small>", "title": "«Кызыл Топучан» жомогунун варианттары, алардын идеялык мазмуну", "text": ["Бир тууган Гриммдердин «Балдар жана үй-бүлө жомоктору» жыйнагы 1812-жылы жарык көргөн. Жомоктордун бул жыйнагына немец жеринен чогултулуп, бир туугандар тарабынан адабий тилде кайра иштелип чыккан чыгармалар топтолгон.", "«Кызыл Топучан» элдик жомогундагы карышкырга жолуккан кыз тууралуу сюжет алгачкы ирет Шарль Перро, кийин бир тууган Гриммдер тарабынан иштелип чыккан. Бул сюжет Францияда, Италияда орто кылымдардан бери кеңири тараган. Кыз чоң энесине алып барган себеттин ичиндеги тамак-аш гана жергиликтүү шарттарга жараша ар түрдүү өзгөрүп турган. Элдик жомокту 1-иштеп чыккан француздук жазуучу Шарль Перро сюжеттеги айрым персонаждарды, ырайымсыздык сценаларын алып таштаган. Башкы каарманга ошол учурда айыл жериндеги кыздар кийген кызыл баш кийими кийгизилген. Жомоктун негизги насааты бой жеткен кыздарга арналып ыр түрүндө аягында жазылган. Бул жомок 1697-жылы Парижде «Каз эненин жомоктору» деген жыйнакта жарык көргөн.", "Жомокту 100 жылдан кийин бир тууган Гриммдер өз вариантында жазып чыгышкан. Алар жомоктун аягын жакшылыктын жеңиши менен бүтүрүшкөн. Кыздын чоң энесинин үйүнүн алдынан өтүп бара жаткан мергенчилер карышкырды өлтүрүп, анын ичинен Кызыл Топучан менен чоң энесин аман-эсен алып чыгышат. Бул варианттын негизги идеясы эми бийкечтерге гана эмес, жалпы тилазар балдарга сабак болчу окуя катары эскертилген."], "qs": [{"t": "tf", "i": "think", "h": "Туура же ката экенин белгилегиле.", "qs": [{"s": "Сюжетти алгачкы ирет Шарль Перро иштеп чыккан.", "a": true}, {"s": "Перронун жомогу 1697-жылы Парижде «Каз эненин жомоктору» жыйнагында чыккан.", "a": true}, {"s": "Перронун вариантында аңчы кызды куткарат.", "a": false, "fix": "Аңчы куткарган аягы — Гриммдердин варианты."}, {"s": "Гриммдер жомокту жакшылыктын жеңиши менен бүтүрүшкөн.", "a": true}]}]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(143-бет)</small>", "qs": ["1. Кызыл Топучанды эмне үчүн баары жакшы көрүшкөн?", "2. Ал токойдогу чоң энесине эмне үчүн жөнөдү?", "3. Апасы Кызыл Топучанды эмне тууралуу эскертти?", "4. Кызыл Топучан сүйлөшпөсө карышкыр үйгө кире алат беле?", "5. Кыз чоң энесинин үйүнө кирип эмнелерди көрдү, сезди?", "6. Карышкыр менен Кызыл Топучандын диалогу эмнени көрсөтөт?", "7. Мергенчи карышкырды эмне үчүн атып салган жок?", "8. Кызыл Топучанды ак көңүл, боорукер жана тайманбас кыз деп эсептейсиңби?"], "rows": 3, "ex": "1. Ал татынакай, кичинекей, бардык адамдарга жакчу.<br>2. Чоң энеси ооруп калган, ага токоч, шарап алып баруу үчүн.<br>3. Жолдон бурулбай түз жүр, бөтөлкөнү сындырба деп.<br>4. Жок, кыз жолду айтып бергендиктен карышкыр чоң эненин үйүн тапты.<br>5. Эшик ачык, баары кызык; чоң энесинин кулагы, көзү, колу, оозу чоң.<br>6. Кыздын ишенчээктигин, карышкырдын куулугун.<br>7. Чоң энени куткарса болот деп ойлоду.<br>8. Ооба, ак көңүл, мээримдүү; бирок апасынын тилин албаганы үчүн жоопкерчилиги аз."}, {"t": "write", "i": "write", "h": "Жомоктун аягына өз вариантыңарды жазгыла. <small style=\"color:#7a6a60;font-weight:400\">(144-бет)</small>", "rows": 5, "min": 30, "ph": "Менин вариантымда…", "sample": "Менин вариантымда Кызыл Топучан жолдон бурулбай, түз эле чоң энесине барат. Карышкыр анын артынан келгенде, кыз эшикти бекитип, коңшуларды чакырат. Карышкыр корккондон токойго качып кетет."}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t4l4", "title": "Антуан де Сент-Экзюпери. «Кичинекей ханзада»", "ky": "Француз жазуучусу, учкуч (1900–1944). Притча", "gram": "<b>Притча</b> — адабияттагы дидактикалык-аллегориялык жанр. А. <i>Каймана маанидеги</i> акыл-насаат айтуу үчүн жазылган чакан аңгемелер. Б. XIX кылымда инсандык маселелер жана коомдук жүрүш-туруш боюнча насаат айтылган чыгармалар. <b>Метафора</b> (гр. — <i>өтүп кетүү</i>) — бир нерсени, көрүнүштү башка бир нерсеге окшош же жакын нерсе менен атоо. «Кичинекей ханзадада» кооз роза, акылман түлкү жана баобаб ушундай маанидеги образдар.", "lex": "сынак, тапшыруу, күбөлүк, авиа кырсык, чөл, жеке менчик, эскерүү, деңгээл, арнаган, сыйлык, билерик, адам аралай элек, чер токой, жырткыч, олжо, андап ал, айкын, эчтекеге арзыбай, жадатып жиберет, олуттуу, коюн-колтук, ой-пикир, бөтөкөй, опурталдуу, кыянаттуу, үрөндөр, өнүп чыгуу, кыбыр жумуш, айрып таануу, тамыр, жулбай койгон, илбериңки алик алуу, байыр болуу, байландыруу, түмөн, түшүнүк, айырма, осолдой түштү, беймаани, муңкануу, кулак түрүп туруу, көрөгөч, дил", "tasks": [{"t": "vocab", "i": "think", "h": "Сөздүк. Басканда угулат (🔊). <small style=\"color:#7a6a60;font-weight:400\">(155-бет)</small>", "w": [["авиа кырсык", "учактын кулашы", "авиакатастрофа", "✈️"], ["чөл", "кургак, кумдуу жер", "пустыня", "🏜️"], ["билерик", "колго тагылуучу шакек", "браслет", "⌚"], ["чер токой", "калың, жапайы токой", "дремучий лес", "🌲"], ["олжо", "кармалган жем", "добыча", "🐁"], ["эчтекеге арзыбай", "маанисиз", "ничего не стоящий", "🤷"], ["олуттуу", "маанилүү, салмактуу", "серьёзный", "🧐"], ["бөтөкөй", "бөтөн, башка", "чужой", "❓"], ["опурталдуу", "коркунучтуу", "опасный", "⚠️"], ["кыянаттуу", "зыяндуу", "вредный", "☠️"], ["кыбыр жумуш", "майда, тажатма иш", "кропотливая работа", "🧹"], ["тамыр", "өсүмдүктүн жер астындагы бөлүгү", "корень", "🌱"], ["илбериңки алик алуу", "сылык саламга жооп берүү", "вежливо ответить на приветствие", "🙇"], ["байыр болуу", "жакын, дос болуу", "приручить", "🦊"], ["байландыруу", "бири-бирине байлануу", "привязать", "🔗"], ["түмөн", "абдан көп", "тьма, бесчисленно", "♾️"], ["осолдой түштү", "уялып, ыңгайсыз болду", "смутились", "😳"], ["беймаани", "маанисиз", "бессмысленный", "🌫️"], ["муңкануу", "кайгыруу", "грустить", "😔"], ["көрөгөч", "алдын ала көрө билген", "зоркий", "👁️"], ["дил", "жан, жүрөк", "душа", "💖"], ["баобаб", "чоң дарак", "баобаб", "🌳"]]}, {"t": "read", "i": "read", "h": "Жазуучу жөнүндө окугула. <small style=\"color:#7a6a60;font-weight:400\">(146-бет)</small>", "title": "Антуан де Сент-Экзюпери (1900–1944)", "text": ["Антуан де Сент-Экзюпери француздук жазуучу, акын, журналист жана кесипкөй учкуч болгон.", "Сент-Экзюпери 1900-жылдын 29-июнунда Лион шаарында туулган. Антуан төрткө чыкканда анын атасы каза болот. Алгачкы билимди Антуан ыйык Варфоломейдин христиандар мектебинде билим алат, 1908–1914-жылдары Сент-Круа иезуеттердин колледжинде билим алган. Абага 1912-жылы 12 жашында көтөрүлгөн. 1919-жылы келечектеги жазуучу Улуттук көркөм сүрөт жогорку мектебине жазылат. 1921-жылы Сент-Экзюпери армиянын катарына чакырылат. Ал атып жок кылуучу авиацияга жазылган. Сынакты ийгиликтүү тапшыргандан кийин, ал аскер учкучунун күбөлүгүн алат. 1922-жылы кенже лейтенант наамын алган.", "30-жылдардын ортосунда Сент-Экзюпери менчик учактуу болот. Ал учакта ал дүйнөлүк рекорд койгусу келген. Бирок 1935-жылы Сайгондон Парижге учуп бара жатканда Сент-Экзюпери авиа кырсыкка учурайт. Кырсык Аравия чөлүндө болгон. Ал Сент-Экзюперинин эсинде түбөлүккө сакталып калат. Бул эскерүүлөр жана Экинчи дүйнөлүк согушта болгон окуялар «Кичинекей ханзада» жомогун жазууга түрткү болду.", "Согушка чейин Сент-Экзюперинин Францияда учкуч катары аты чыккан. Тунгуч чыгармасы 1926-жылы жарыяланган. Адабий чыгармалары көзү өтүп кеткенден кийин жазуучунун беделин Францияда улуттук баатыр деңгээлине чейин көтөргөн. Ал «Кичинекей ханзаада» новелласы, «Шамал, кум жана жылдыздар» жана «Түнкү учуу» лирикалык чыгармалары менен көпчүлүктүн эсинде калган.", "1944-жылдын 31-июлунда чалгын жүргүзүп учуу учурунда анын учагы Жер ортолук деңиздин үстүнөн учуп бара жатып жарылат. Анын аты жазылган билерик 1998-жылы табылган."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Сент-Экзюпери качан, кайда туулган?", "o": ["1900-ж., Лион шаарында", "1785-ж., Ганауда", "1769-ж., Москвада", "1912-ж., Парижде"], "a": 0}, {"q": "Абага биринчи жолу канча жашында көтөрүлгөн?", "o": ["12 жашында", "20 жашында", "6 жашында", "30 жашында"], "a": 0}, {"q": "Кырсык кайда болгон?", "o": ["Аравия чөлүндө", "Альп тоолорунда", "Атлантика океанында", "Сибирде"], "a": 0}, {"q": "Жазуучу кантип каза болгон?", "o": ["Учагы Жер ортолук деңиздин үстүндө жарылган", "Ооруп", "Карылыктан", "Согуш талаасында"], "a": 0}, {"q": "Анын аты жазылган билерик качан табылган?", "o": ["1998-жылы", "1944-жылы", "2003-жылы", "1950-жылы"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "«Кичинекей ханзада» чыгармасынан үзүндүнү окугула (I бөлүм). <small style=\"color:#7a6a60;font-weight:400\">(148-бет)</small>", "title": "Кичинекей ханзада (I)", "text": ["Алты жашымда адам аралай элек чер токойлор жөнүндө сөз кылган «Болмуш окуялар» аттуу китептен бир сапар (жолу) укмуш сүрөт көрдүм. Сүрөттөө удав деген килейген жалан бир жырткыч айбанды оп тартып жатыптыр.", "Китепте мындай деп жазылыптыр: «Удав өз олжосун чайнабай бүкүлү жутат. Анан тырп эте албай калат да, ошо бойдон алты ай бою уктап, жутканын аш кылмайынча ойгонбой жата берет».", "Шумдук-шумдук окуяларга бай жунглинин турмушу тууралуу көп-көп ой жүгүртүп, акыры түр калем менен биринчи мертебе сүрөт тарттым. Бул менин №1 сүрөтүм эле. Тарткан сүрөтүмдү чоң кишилерге көрсөтүп: — Коркуп атасыңарбы? — деп сурадым. — Шляпадан да коркчу беле? — дешти алар. А сүрөт дегеле шляпа эмес болчу. Ал пилди жутуп алган удав эле. Ошондо мен чоң кишилер андап алсын деп удавдын ичиндеги пилди айкын көрсөтүп тарттым. Билесиңер, чоңдорго бардык нерсени түшүндүрүп бербейин болбойт.", "Чоң кишилер мага жыланды ичинен тартканыңды да кой, тышынан тартканыңды да кой, андан көрө географияга, тарыхка, арифметикага, таза жазууга көбүрөөк көңүл бур деп кеңеш беришти. Жакшы сүрөтчү болот элем, андан алты жашымда ушинтип айныбадымбы. №1 жана №2 сүрөттөрүм эчтекеге арзыбай калган соң өзүмө өзүм дурус ишенбей калдым. Чоң кишилер өздөрү эчтемени андап түшүнө алышпайт, ал эми аларга көрүнгөндүн баарын улам-улам эзип түшүндүрүп отуруу балдарды аябай жадатып жиберет.", "Ошентип, мен башка кесипти тандашка аргасыз болуп, учкучтукту үйрөнүп чыктым. Уча берип жер шарын бүт кыдырып койдум окшойт. Ырасын айтсам, географияны окуганым жакшы эле болгон экен. Мен Аризонадан Кытайды бир караганда эле айрып тааныйм. Түндөсү жолдон адашып кетсең мунун аябай кереги тиет.", "Өмүрүмдө ар кыл олуттуу адамдарды арбын жолуктурдум. Көп убагымды чоң кишилердин арасында өткөрдүм. Алар менен коюн-колтук да жүрүп көрдүм. Ошондой деле алар жөнүндөгү ой-пикирим оңолуп кеткен жок. Башкалардан нары акылдуу, нары парасаттуу көрүнгөн бир чоң кишиге туш келгенде ага баягы №1 сүрөтүмдү көрсөтөр элем. А сүрөттү айрып-тыткан эмесмин, дайыма жаныма ала жүрчүмүн. Бирок алардын баары: «Шляпа турбайбы» — дей салышчу. Ошондон кийин алар менен удавдар, жунглилер, жылдыздар жөнүндө сүйлөшчү эмесмин. Алар менен бриж жана гольф оюну, саясат менен галстуктар жөнүндө сүйлөшчү элем. Ошонума чоң кишилер да ыраазы болушуп, турмушту туура түшүнгөн адам менен тааныштык деп компоюп калышар эле."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Автор биринчи сүрөтүндө эмнени тарткан?", "o": ["Пилди жутуп алган удавды", "Шляпаны", "Жылдызды", "Учакты"], "a": 0}, {"q": "Чоң кишилер сүрөттү эмне деп ойлошту?", "o": ["Шляпа", "Жылан", "Тоо", "Пил"], "a": 0}, {"q": "Автор кайсы кесипти тандады?", "o": ["Учкучтукту", "Сүрөтчүлүктү", "Географды", "Мугалимди"], "a": 0}, {"q": "Чоң кишилер менен автор эмне жөнүндө гана сүйлөшчү болду?", "o": ["Бриж, гольф, саясат, галстуктар", "Удавдар, жунглилер", "Жылдыздар", "Жомоктор"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "Уландысын окугула (IV–V бөлүм). <small style=\"color:#7a6a60;font-weight:400\">(151-бет)</small>", "title": "Кичинекей ханзада (IV–V)", "text": ["Дагы бир жаңылыкты мен ушинтип ачтым: көрсө, анын планетасы үйдөй эле бар экен! Бу мени анча деле таң калтырган жок. Жер, Юпитер, Марс, Венера сыяктуу чоң планеталардан башка жүздөгөн планеталар бар экен, алардын эң кичинелери телескоптун көзүнө да араң-зорго урунарын мен жакшы билчүмүн. Ошондой бир кичинекей планета ачып калса, астроном ага ат эмес, жөн гана номер коёт. Мисалы, «Астероид №3251» — деп.", "Мен Кичинекей ханзада «Астероид В-612» деген бөтөкөй планетадан учуп келди деп болжойм. Анткенимин жүйөөсү бар. Ал астероидди 1909-жылы бир түрк астроном телескоптон бир эле жолу көрүп калган эле. Астроном өзү ачкан жаңылык тууралуу Эл аралык астрономиялык конгрессте баян этет. Бирок ага эч ким ишенбейт, анткени астроном түркчө кийинип алган болот. Чоң кишилер дегениң ушундай го, чиркин!", "… Кичинекей ханзаданын планетасында аябай опурталдуу, өтө кыянаттуу үрөндөр… баобабдардын үрөндөрү бар эле. Планетанын топурагы бүтүндөй ошол үрөндөр булгап таштаган эле. Эгер баобабды чыгар замат айрып таанып албасаң, кийин бүт планетаны ээлеп алат терең-терең сойлотот. Планета кичине болот, баобабдар көп болсо, алар аны барча-барча жарып ийет.", "— Бир катуу эреже бар, — деди мага Кичинекей ханзада кийинчерээк. — Эртең менен туруп, жуунуп, өзүңдү тартипке келтирер замат планетаңды да тартипке келтир. Баобаб менен роза өнүп чыкканда коёндой окшош болот. Алар бир аздан соң айырмалана баштайт, ошондо күн сайын баобабдарды, сөзсүз, отоп турушуң керек. Бу аябай кыбыр жумуш, жадатып иет, бирок анча деле оор эмес.", "— Бу эрежени силердин балдар да жакшы түшүнүп алсын, сен мындай бир сүрөт тартып көр, — деди ал бир күнү мага. — Эгер алар бир кезде саякатка чыгып калышса, мунун пайдасы тиет. Башка иш күтүп турса да зыяны жок. Бирок баобабдарды эркинче коё берсең, балээге калганың ошол. Мен жалкоо бирөө жашаган планетаны билчү элем. Ал үч көчөттү убагында жулбай койгон экен…"], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Кичинекей ханзада кайсы планетадан келген?", "o": ["Астероид В-612", "Астероид №3251", "Марс", "Юпитер"], "a": 0}, {"q": "Астероидди ким, качан көргөн?", "o": ["Түрк астроном, 1909-жылы", "Француз учкуч, 1935-жылы", "Немис окумуштуу, 1812-жылы", "Эч ким"], "a": 0}, {"q": "Астрономго эмне үчүн эч ким ишенген жок?", "o": ["Түркчө кийинип алгандыктан", "Жалганчы болгондуктан", "Жаш болгондуктан", "Телескобу жок болгондуктан"], "a": 0}, {"q": "Ханзаданын «катуу эрежеси» кандай?", "o": ["Күн сайын планетаңды тартипке келтирип, баобабдарды отоп тур", "Эч качан уктаба", "Розаны жулуп сал", "Планетадан кетпе"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "Уландысын окугула: Түлкү (XXI бөлүм). <small style=\"color:#7a6a60;font-weight:400\">(153-бет)</small>", "title": "Кичинекей ханзада (XXI)", "text": ["Так ошондо Түлкү пайда болду. — Салоомалейкум, — деди ал. Кичинекей ханзада илбериңки алик алып, эки жагын каранды эле. Эч ким көрүнгөн жок. — Мындамын, — деди дабыш, — Алманын түбүндөмүн… — Сен кимсиң? — деди Кичинекей ханзада. — Укмуш сулуу экенсиң го! — Түлкүмүн, — деди Түлкү. — Мени менен ойносоң, — деп суранды Кичинекей ханзада. — Мен капаланып турам… — Ойной албайм, — деди Түлкү. — Мен али байыр боло элекмин.", "— «Байыр» деген эмне? — деп сурады. — Адамдардын мылтыгы бар, алар аң уулашат. Мунусу өтө жаман! Бирок алар тоок да багышат. Мунусу абдан жакшы! Сен тоок издеп жүрөсүң го? — Жок, — деди Кичинекей ханзада. — Дос издеп жүрөм. Айтсаң, «байыр» деген эмне, ыя? — Бу эчак унутулуп калган түшүнүк, — деди Түлкү. — Ал «Жүрөккө жүрөктү байландыруу» дегенге барабар. — Байландыруу дедиңби? — Ооба, — деди Түлкү, — Азырынча сен мага түмөн-түмөн балдардан эч айырмаң жок кичинекей бир баласың. Мага кереги жок. Менин да сага керегим жок. Мен да сага түмөн-түмөн түлкүлөргө окшогон бир түлкү элемин. Эгер сен мени байыр кылып алсаң, экөөбүз бири-бирибизге керек болуп калабыз. Сен мен үчүн бу дүйнөдө жалгыз болосуң. Мен да сен үчүн дүйнөдө жападан жалгыз болом…", "… Эгерде сен мени байыр кылып алсаң, менин өмүрүм күн тийгендей жаркырап түшөр эле. Дүңгүрөгөн дүбүрттөрдүн арасынан сенин басканыңды дароо айрып таанып алмакмын. … — Эмнени байыр кылсаң, ошону гана чындап биле аласың, — деди Түлкү. — Бирдеме билгенге эми адамдардын чолосу тийбей калды. Алар буюмдарды магазинден даяр бойдон сатып алат. Бирок, дос саткан магазин жок да, ошон үчүн эми адамдардын досу болбойт. Досум болсун десең, мени байыр кылып ал!", "Ошентип Кичинекей ханзада Түлкүнү байыр кылып алды. Аңгыча коштошор маалы да кыйгачтап келди. — Мен сени сагынып ыйлайм, — деп улутунду Түлкү. — Айып өзүңдө, — деди Кичинекей ханзада. — Мен сени сыздатып кетейин деген эмес элем, сен өзүң байыр кылып ал деп туруп алдыңбы…", "… Ал тып басылды. Бир маалда мындай деди: — Бар, розаларды карап кел. Сен эми өзүңдүн розаң дүйнөдө жалгыз, бирөө гана экенин билесиң. Анан коштошкону мага келгенде, бир сыр айтам. Сага берген белегим ошол болот. … Айтаарын айтты да, Кичинекей ханзада кайра Түлкүгө келди. — Жакшы кал… — деди ал. — Жакшы бар, — деди Түлкү, — Мына менин сырым, ал жөнөкөй эле сыр: жүрөк гана көрөгөч. Эң түпкү касиетти көз менен көрө албайсың. Унутуп калбайын деп Кичинекей ханзада кайталап айтты: — Эң түпкү касиетти көз менен көрө албайсың. — Розаң сага кымбат, анткени сен ага бүт дилиңди бергенсиң. Унутуп калбайын деп Кичинекей ханзада кайталап айтты: — Мен розам үчүн жоопкермин…"], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Кичинекей ханзада Жерде эмне издеди?", "o": ["Дос", "Тоок", "Роза", "Учак"], "a": 0}, {"q": "Түлкүнүн оюу боюнча «байыр болуу» эмне?", "o": ["Жүрөккө жүрөктү байландыруу", "Аң уулоо", "Тоок багуу", "Ойноо"], "a": 0}, {"q": "Түлкүнүн сыры:", "o": ["Жүрөк гана көрөгөч", "Эң түпкү касиетти көз менен көрөсүң", "Дос магазинден сатылат", "Роза баарынан кооз"], "a": 0}, {"q": "Эмне үчүн ханзадага анын розасы кымбат?", "o": ["Ага бүт дилин бергендиктен", "Ал эң кооз болгондуктан", "Ал алтын болгондуктан", "Ал жалгыз гүл болгондуктан"], "a": 0}]}]}, {"t": "gap", "i": "write", "h": "Түлкүнүн сөздөрүн толуктагыла.", "items": ["Жүрөк гана [көрөгөч].", "Эң түпкү касиетти [көз] менен көрө албайсың.", "Мен [розам] үчүн жоопкермин.", "Эмнени [байыр] кылсаң, ошону гана чындап биле аласың."]}, {"t": "sort", "i": "think", "h": "Кичинекей ханзаданын планетасы менен биздин планетабызды салыштыргыла. <small style=\"color:#7a6a60;font-weight:400\">(153-бет)</small>", "cols": ["Кичинекей ханзаданын планетасы", "Биздин планетабыз (Жер)"], "items": [["Үйдөй эле кичинекей", 0], ["Баобабдардын үрөндөрү бар", 0], ["Бир гана роза өсөт", 0], ["Чоң, көп өлкөлөр бар", 1], ["Түмөн-түмөн розалар бар", 1], ["Адамдар магазинден даяр буюм сатып алат", 1]]}, {"t": "read", "i": "read", "h": "Чыгарманын идеялык мазмунун окугула. <small style=\"color:#7a6a60;font-weight:400\">(156-бет)</small>", "title": "«Кичинекей ханзада» чыгармасынын идеялык мазмуну", "text": ["Антуан де Сент-Экзюперинин «Кичинекей ханзада» жомогу биринчи жолу Америка Кошмо Штаттарында 1943-жылы жарык көргөн. Жомокту жазууга Аравия чөлүндө болгон кырсык жана Экинчи дүйнөлүк согушта болгон окуялар түрткү болгон. Чыгарманы жазуучу өзүнүн досу Леон Вертке арнаган. Леон Верт еврей журналисти жана адабий сынчы болгон. Ал согуш учурунда фашисттер тарабынан куугунтукталган.", "«Кичинекей ханзаданын» жанры — жомок — притча. Чыгарманын өзгөчөлүгү анын сюжетинин жөнөкөйлүгү жана фантастикалуулугу. Бирок ошол эле учурда ал таалим-тарбия, насаат берүүчү касиетке ээ болгон чыгарма. Ал окурмандардын мыкты адеп-аклактык сапаттарын калыптандырып, алардын гумандуу көз караштарын, адептүү жүрүш-турушун тарбиялайт. Дүйнө жүзүнө коркунуч туудурган жамандыктын образы баобаб сыяктуу өсүмдүктүн тез жайылган тамырлары, бутактары аркылуу ачылган. Ошондуктан жылдыздардан учуп келген жаш баланын көзү менен караганда Жер планетасында жашаган Адамдын эң негизги милдети — кайдыгерликти жана жалкоолукту таштап, өз планетасы үчүн жоопкерчиликтүү болушу.", "Бул чыгармасында жазуучу бүткүл адамзатты миңдеген жылдар бою ойлонтуп келе жаткан глобалдуу темаларды көтөрөт. Алардын эң башкысы бул жашоонун маанисин издөө темасы. Жашоо маңызы таза жашап, сени менен жанаша жашаган жандууларга камкордук көрүп, сулуукту сактоодо деп айтылат. Эң башкысы, бардык жандуу жана жансыз жаратылышка гана эмес, жаныңдагы адамдарга сүйүү жана достук мамиледе болуу деген ой берилген. Сүйүү — сулуулукту, өзгөчөлүктү көрө билүү, бул сезимди кылдат асыроо деген ойду берет. Ошондуктан жазуучунун философиялык жомок — притча жанрында жазылган бул чыгармасы балдардын гана эмес, жалпы дүйнө окурмандарынын сүйүктүү китеби болуп эсептелет."]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(155-бет)</small>", "qs": ["1. Бир планетадан экинчисине саякаттап Кичинекей ханзада эмне издеди?", "2. Түлкү Кичинекей ханзададан эмнени суранды?", "3. Түлкүнүн оюу боюнча, адамдар бири-бирине качан жакын болуп калышат?", "4. Түлкү менен болгон жолугушуудан Кичинекей ханзада кандай сабак алды? «Жүрөк гана көрөгөч» дегенди кандай түшүнөсүң?", "5. Эмне үчүн Кичинекей ханзада үчүн анын розасы абдан кымбат?", "6. Баобаб — бул чыгармада эмненин символу?", "7. Силер Кичинекей ханзададай дос күтүүнү келеби?"], "rows": 3, "ex": "1. Дос издеди.<br>2. Аны байыр кылып алууну, дос болууну.<br>3. Бири-бирин «байыр кылып», жүрөккө жүрөктү байландырганда.<br>4. Чыныгы баалуулукту жүрөк менен гана сезесиң; сырткы көрүнүш эмес, ички сапат маанилүү.<br>5. Анткени ал розага бүт дилин берген, ага кам көргөн.<br>6. Жамандыктын, кайдыгерликтин, тез жайылган коркунучтун символу.<br>7. (Өз оюңар.)"}, {"t": "write", "i": "write", "h": "Биздин проект: «Сыйкырдуу жомокторду жазабыз». Өз сыйкырдуу жомогуңарды жазгыла. <small style=\"color:#7a6a60;font-weight:400\">(158-бет)</small>", "rows": 7, "min": 60, "ph": "Илгери-илгери…", "sample": "Илгери-илгери бир кичинекей айылда Айбек деген бала жашаптыр. Бир күнү ал тоодо сүйлөй турган бүркүттү жолуктурат. Бүркүт ага: «Сен жакшылык кылсаң, сага сыйкырдуу канат берем», — дейт. Айбек кары апага, жетим козуга жардам берип, акыры канат алат жана бүт айылына бакыт алып келет. Жакшылык ар дайым жамандыкты жеңет."}, {"t": "box", "i": "think", "h": "Кызыктуу фактылар", "c": "y", "html": "• Учкуч катары Сент-Экзюпери он беш жолу авиа кырсыктарга дуушар болгон.<br>• Жазуучу оюн карталары менен түрдүү фокустарды жасоонун көптөгөн ыкмаларын билчү.<br>• Экзюпери авиация тармагындагы бир нече ойлоп табуулардын автору.<br>• Эң белгилүү «Адамдар планетасы» романынын сюжетин Экзюпери өз турмушунда болгон фактыдан алган.<br>• Жазуучунун аты менен ал туулган Лион шаарындагы аэропорт аталган.<br>• 2003-жылы Кичинекей ханзааданын аты астероиддин айына берилген.<br>• Атактуу жазуучунун аты Патагониядагы тоо чокусуна берилген."}, {"t": "game", "i": "game", "h": "Оюндар", "gs": ["tug", "chuko", "quiz"], "theme": 4}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}], "gloss": []}]};

function lookup(w){

    if(DICT[x+"-"])return DICT[x+"-"];
    for(var i=0;i<SUF.length;i++){var sf=SUF[i];if(x.length>sf.length+1&&x.slice(-sf.length)===sf){var y=x.slice(0,-sf.length);if(!seen[y])q.push(y)}}
    if(x.length>3){var z=x.replace(/(.)\1$/,"$1");if(z!==x&&!seen[z])q.push(z)}}

  for(var L=lc.length-1;L>=4;L--){var p=lc.slice(0,L);if(DICT[p])return DICT[p];if(DICT[p+"-"])return DICT[p+"-"]}
  return null}

  h+='<div class="gwrap"><b>Оюндардын рекорду</b><p style="margin:6px 0">Чүкө: '+(S.best.chuko||0)+' упай · Аркан тартыш: '+(S.best.tug||0)+' жеңиш</p></div><div class="btns"><button class="btn g" id="bigb">'+(S.big?"Кичине тамга":"Чоң тамга (смарт-такта)")+'</button><button class="btn r" id="rst">Баарын тазалоо</button></div>';
  app.innerHTML=h;
  $("#bigb").onclick=function(){S.big=S.big?0:1;save();document.documentElement.classList.toggle("big",!!S.big);pageMe()};
  $("#rst").onclick=function(){if(confirm("Бардык жыйынтык өчүрүлсүнбү?")){S.done={};S.notes={};S.light={};S.best={};S.quiz={};save();pageMe()}};
}

/* ---------- games ---------- */
var GAMES={
  tug:{n:"Аркан тартыш",em:"🪢",s:"Команда менен"},
  chuko:{n:"Чүкө оюну",em:"🦴",s:"Сөз, грамматика, маданият"},
  quiz:{n:"Тема тести",em:"✅",s:"10 суроо"}
};
function poolFor(sel){
  var ts=sel==="all"?B.themes:[themeBy(sel)];var p=[];ts.forEach(function(t){(t.pool||[]).forEach(function(q){p.push(q)})});return p}
function speakFor(sel){var ts=sel==="all"?B.themes:[themeBy(sel)];var p=[];ts.forEach(function(t){(t.speak||[]).forEach(function(q){p.push(q)})});return p}
function mkQ(q){var o=shuf(q.o.map(function(x,i){return{x:x,c:i===0}}));return{q:q.q,o:o,c:q.c}}
function askBox(q,tc,onAns){
  var b=el('<div class="qbox" style="--tc:'+tc+'"><h3>'+wrap(q.q)+'</h3><div class="opts">'+q.o.map(function(o,i){return '<button class="o" data-i="'+i+'">'+esc(o.x)+'</button>'}).join("")+'</div></div>');
  b.addEventListener("click",function(e){var o=e.target.closest(".o");if(!o||b.dataset.l)return;b.dataset.l=1;var good=q.o[+o.dataset.i].c;o.classList.add(good?"ok":"no");if(!good)$$(".o",b).forEach(function(x,i){if(q.o[i].c)x.classList.add("ok")});setTimeout(function(){onAns(good)},900)});
  return b;
}
function setupScreen(title,sel,opts,start){
  app.innerHTML='<div class="crumb"><a href="#/">Башкы</a> › <span>'+title+'</span></div><div class="gwrap setup"><h2>'+title+'</h2><label>Тема</label><div class="seg" id="sg-t"></div>'+opts.map(function(o){return '<label>'+o.l+'</label><div class="seg" id="sg-'+o.k+'"></div>'}).join("")+'<div class="btns"><button class="btn r" id="go">Баштоо</button></div></div>';
  var cfg={t:String(sel)};opts.forEach(function(o){cfg[o.k]=o.d});
  function seg(id,items,key){var d=$("#"+id);d.innerHTML=items.map(function(it){return '<button data-v="'+it[0]+'" class="'+(String(cfg[key])===String(it[0])?"on":"")+'">'+it[1]+'</button>'}).join("");d.onclick=function(e){var b=e.target.closest("button");if(!b)return;cfg[key]=b.dataset.v;seg(id,items,key)}}
  seg("sg-t",[["all","Бардыгы"]].concat(B.themes.map(function(t){return [t.n,t.n+". "+t.en]})),"t");
  opts.forEach(function(o){seg("sg-"+o.k,o.items,o.k)});
  $("#go").onclick=function(){start(cfg)};
}
function gameTug(sel){
  setNav("games");
  setupScreen("Аркан тартыш",sel,[{l:"Оюнчулар",k:"m",d:"2",items:[["2","Команда vs команда"],["1","Мен vs компьютер"]]},{l:"Жеңүү үчүн тартуу",k:"n",d:"5",items:[["3","3"],["5","5"],["7","7"]]}],function(cfg){
    var pool=shuf(poolFor(cfg.t)),pi=0,pos=0,turn=0,N=+cfg.n,solo=cfg.m==="1";
    var names=["Көк команда","Кызыл команда"],cols=["#14507a","#d62839"];
    if(solo)names=["Мен","Компьютер"];
    function team(x,c){var s="";for(var i=0;i<3;i++)s+='<g transform="translate('+(x+i*(c==="L"?-26:26))+',112)"><circle cx="0" cy="-34" r="10" fill="'+(c==="L"?cols[0]:cols[1])+'"/><path d="M0-24 L'+(c==="L"?-14:14)+' 8 M0-24 L0 6 M0-6 L'+(c==="L"?10:-10)+'-14 M0 6 L-8 30 M0 6 L9 30" stroke="'+(c==="L"?cols[0]:cols[1])+'" stroke-width="7" stroke-linecap="round" fill="none"/></g>';return s}
    function draw(){
      app.innerHTML='<div class="crumb"><a href="#/">Башкы</a> › <a href="#/game/tug/'+cfg.t+'">Аркан тартыш</a></div><div class="arena"><svg viewBox="0 0 360 190"><g class="rope" style="transform:translateX('+(pos*(120/N))+'px)"><line x1="-40" y1="108" x2="400" y2="108" stroke="#8b5a2b" stroke-width="6"/><path d="M176 98h8v20h-8z" fill="#ffd100"/>'+team(80,"L")+team(280,"R")+'</g><line x1="180" y1="70" x2="180" y2="140" stroke="#222" stroke-dasharray="4 4"/><rect x="150" y="150" width="60" height="6" fill="#6b4a2a" opacity=".4"/></svg></div><div class="score"><span class="a">'+names[0]+': '+Math.max(0,-pos)+'</span><span class="b">'+names[1]+': '+Math.max(0,pos)+'</span></div><div id="q"></div>';
    }
    function ask(){
      draw();
      if(Math.abs(pos)>=N){var w=pos<0?0:1;S.best.tug=(S.best.tug||0)+(w===0||!solo?1:0);save();$("#q").innerHTML='<div class="win"><h2>🏆 '+names[w]+' жеңди!</h2><p>Аркан тартыш аяктады.</p><div class="btns" style="justify-content:center"><button class="btn r" onclick="location.reload()">Кайра ойноо</button><a class="btn g" href="#/" style="text-decoration:none">Башкы бет</a></div></div>';return}
      if(pi>=pool.length){pool=shuf(pool);pi=0}
      var q=mkQ(pool[pi++]),tc=cols[turn];
      var box=$("#q");box.innerHTML='<span class="turn" style="background:'+tc+'">'+names[turn]+' — суроо</span>';
      if(solo&&turn===1){var good=Math.random()<.55;var b=askBox(q,tc,function(){});b.dataset.l=1;$$(".o",b).forEach(function(x,i){if(q.o[i].c)x.classList.add(good?"ok":"")});box.appendChild(b);setTimeout(function(){after(good)},1300);return}
      box.appendChild(askBox(q,tc,after));
    }
    function after(good){if(good)pos+=turn===0?-1:1;turn=1-turn;ask()}
    ask();
  });
}
var BONE='<svg class="bone" viewBox="0 0 120 120"><g id="bg"><path d="M30 34c-10-2-14-14-6-20s18 0 18 8c6 0 12 0 18 0 0-8 12-14 18-8s4 18-6 20c4 14 4 34 0 52 10 2 14 14 6 20s-18 0-18-8c-6 0-12 0-18 0 0 8-12 14-18 8s-4-18 6-20c-4-18-4-38 0-52Z" fill="#f4e4c1" stroke="#8b5a2b" stroke-width="3"/><path d="M44 40q16 6 32 0M44 80q16-6 32 0" stroke="#c9a56a" stroke-width="3" fill="none"/></g></svg>';
function gameChuko(sel){
  setNav("games");
  setupScreen("Чүкө оюну",sel,[{l:"Оюнчулар",k:"m",d:"1",items:[["1","1 оюнчу"],["2","2 оюнчу"]]},{l:"Ыргытуу саны",k:"n",d:"8",items:[["6","6"],["8","8"],["12","12"]]}],function(cfg){
    var pool=poolFor(cfg.t),spk=speakFor(cfg.t),N=+cfg.n,P=+cfg.m,k=0,sc=[0,0],used=[];
    var F=[{n:"Алчы",d:"Сөз (1 упай)",c:"v",p:1},{n:"Бүк",d:"Грамматика (2 упай)",c:"g",p:2},{n:"Чик",d:"Маданият (3 упай)",c:"c",p:3},{n:"Тай",d:"Сүйлө! (2 упай)",c:"s",p:2}];
    function view(face,extra){
      app.innerHTML='<div class="crumb"><a href="#/">Башкы</a> › <a href="#/game/chuko/'+cfg.t+'">Чүкө</a></div><div class="gwrap"><div class="score"><span class="a">'+(P===2?"1-оюнчу: ":"Упай: ")+sc[0]+'</span>'+(P===2?'<span class="b">2-оюнчу: '+sc[1]+'</span>':'')+'<span>'+Math.min(k+1,N)+' / '+N+'</span></div>'+BONE+'<div class="faces">'+F.map(function(f,i){return '<div class="'+(face===i?"on":"")+'"><b>'+f.n+'</b>'+f.d+'</div>'}).join("")+'</div><div id="q"></div></div>';
      if(extra)extra()}
    function end(){var w=sc[0]>sc[1]?1:sc[1]>sc[0]?2:0;if(P===1&&sc[0]>(S.best.chuko||0)){S.best.chuko=sc[0];save()}
      app.innerHTML='<div class="gwrap win"><h2>'+(P===2?(w?w+"-оюнчу жеңди!":"Тең чыкты!"):"Жыйынтык: "+sc[0]+" упай")+'</h2><p>Азаматсыздар! Чүкө оюну аяктады.</p><div class="btns" style="justify-content:center"><button class="btn r" onclick="location.reload()">Кайра ойноо</button><a class="btn g" href="#/" style="text-decoration:none">Башкы бет</a></div></div>'}
    function turn(){
      if(k>=N)return end();
      view(-1,function(){$("#q").innerHTML='<div class="btns" style="justify-content:center"><button class="btn r" id="th">🦴 Чүкөнү ыргыт'+(P===2?" ("+(k%2+1)+"-оюнчу)":"")+'</button></div>';
        $("#th").onclick=function(){var fi=Math.floor(Math.random()*4);$("#th").disabled=true;var g=$("#bg");g.style.transformOrigin="60px 60px";g.style.transition="transform 1s";g.style.transform="rotate("+(720+fi*90)+"deg)";setTimeout(function(){view(fi,function(){ask(fi)})},1050)}})}
    function ask(fi){
      var f=F[fi],who=P===2?k%2:0,box=$("#q");
      function next(ok){if(ok)sc[who]+=f.p;k++;turn()}
      if(f.c==="s"){var s=spk.length?spk[Math.floor(Math.random()*spk.length)]:"Үй-бүлөң жөнүндө эки сүйлөм айт.";
        box.innerHTML='<div class="qbox" style="--tc:#7b4fd1"><h3>🎤 '+esc(s)+'</h3><p style="color:#7a6a60;margin:0 0 8px">Кыргызча 2–3 сүйлөм айт. Мугалим же дос баалайт.</p><div class="btns"><button class="btn ok" id="y">Аткардым ✓ (+'+f.p+')</button><button class="btn g" id="n">Кийинки</button></div></div>';$("#y").onclick=function(){next(true)};$("#n").onclick=function(){next(false)};return}
      var cand=pool.filter(function(q){return q.c===f.c&&used.indexOf(q)<0});if(!cand.length)cand=pool.filter(function(q){return used.indexOf(q)<0});if(!cand.length){used=[];cand=pool}
      var raw=cand[Math.floor(Math.random()*cand.length)];used.push(raw);
      box.appendChild(askBox(mkQ(raw),"#d62839",next));
    }
    turn();
  });
}
function gameQuiz(sel){
  setNav("games");var t=themeBy(sel);if(!t){location.hash="#/";return}
  var Q=pick(t.pool||[],10).map(mkQ),i=0,sc=0;
  function nx(){
    if(i>=Q.length){var pts=Math.round(100*sc/Q.length);if(S.quiz[t.n]==null||pts>S.quiz[t.n]){S.quiz[t.n]=pts;save()}
      app.innerHTML='<div class="gwrap win"><h2>'+pts+' / 100</h2><p>'+(pts>=80?"Эң мыкты!":pts>=50?"Жакшы, дагы машыгалы!":"Кайра аракет кылалы!")+'</p><div class="btns" style="justify-content:center"><a class="btn r" href="#/game/quiz/'+t.n+'" onclick="setTimeout(function(){location.reload()},10)" style="text-decoration:none">Кайра</a><a class="btn g" href="#/t/'+t.n+'" style="text-decoration:none">Темага кайтуу</a></div></div>';return}
    app.innerHTML='<div class="crumb"><a href="#/t/'+t.n+'">'+t.n+'-тема</a> › <span>Тест</span></div><div class="gwrap"><div class="score"><span class="a">'+(i+1)+' / '+Q.length+'</span><span class="b">Упай: '+sc+'</span></div><div id="q"></div></div>';
    $("#q").appendChild(askBox(Q[i],t.color,function(g){if(g)sc++;i++;nx()}));
  }
  nx();
}
function pageRiddles(sel){
  setNav("games");
  var ts=sel&&sel!=="all"?[themeBy(sel)]:B.themes,items=[];ts.forEach(function(t){(t.riddles||[]).forEach(function(r){items.push(r)})});
  app.innerHTML='<div class="crumb"><a href="#/">Башкы</a> › <span>Табышмак</span></div><h2 class="sec" style="margin-top:0">Табышмак</h2><p style="color:#7a6a60">Ойлонуп көр, андан кийин жоопту ач. Кыргыз тилиндеги кеңеш түшүнүүгө жардам берет.</p>'+items.map(function(r,i){return '<div class="rid" data-i="'+i+'"><p style="margin:0 0 6px;font-weight:600">'+wrap(r.q)+' <button class="say" data-s="'+i+'">🔊</button></p>'+(r.ky?'<small style="color:#7a6a60">💡 '+esc(r.ky)+'</small>':"")+'<div class="btns"><button class="btn s" data-a="1">Жообу</button></div><div class="ans">'+esc(r.a)+'</div></div>'}).join("");
  app.onclick=function(e){var s=e.target.closest("[data-s]");if(s){speak(items[+s.dataset.s].q);return}var b=e.target.closest("[data-a]");if(b)b.closest(".rid").classList.toggle("on")};
}
function pageProverbs(){
  setNav("games");
  app.innerHTML='<div class="crumb"><a href="#/">Башкы</a> › <span>Макал-лакап</span></div><h2 class="sec" style="margin-top:0">Макал-лакап</h2><div class="seg" id="pt"><button data-v="learn" class="on">Үйрөн</button><button data-v="match">Жупташтыр</button><button data-v="build">Сөз тиз</button></div><div id="pb" style="margin-top:14px"></div>';
  function show(v){$$("#pt button").forEach(function(b){b.classList.toggle("on",b.dataset.v===v)});var pb=$("#pb");pb.innerHTML="";
    if(v==="learn"){pb.innerHTML='<p style="color:#7a6a60">Макалды басканда мааниси чыгат.</p>'+B.proverbs.map(function(p,i){return '<div class="prov" data-i="'+i+'"><b>'+esc(p.ky)+'</b><span>'+esc(p.m)+' <button class="say" data-say="'+i+'">🔊</button></span></div>'}).join("");pb.onclick=function(e){var s=e.target.closest("[data-say]");if(s){e.stopPropagation();speak(B.proverbs[+s.dataset.say].ky);return}var p=e.target.closest(".prov");if(p)p.classList.toggle("on")}}
    if(v==="match"){var sub=pick(B.proverbs,6);var c=el('<div class="task"><div class="th"><div class="ic game">'+IC.game+'</div><h3>Макалды анын маанисине жупташтыр.</h3></div></div>');pb.appendChild(c);R.match({pairs:sub.map(function(p){return [p.ky,p.m]})},"pm",c)}
    if(v==="build"){var sub2=pick(B.proverbs,5);var c2=el('<div class="task"><div class="th"><div class="ic game">'+IC.game+'</div><h3>Сөздөрдү туура тартипке койгула.</h3></div></div>');pb.appendChild(c2);R.order({items:sub2.map(function(p){return [p.ky,p.m]})},"pbld",c2)}}
  $("#pt").onclick=function(e){var b=e.target.closest("button");if(b)show(b.dataset.v)};show("learn");
}

/* ---------- router ---------- */
function route(){
  var h=location.hash.replace(/^#\/?/,"").split("/");stopSpeak();app.onclick=null;
  var k=h[0];
  if(k==="t"&&h[2])pageLesson(h[1],+h[2]);
  else if(k==="t")pageTheme(h[1]);
  else if(k==="dict")pageDict();
  else if(k==="me")pageMe();
  else if(k==="proverbs")pageProverbs();
  else if(k==="riddles")pageRiddles(h[1]);
  else if(k==="games"){setNav("games");app.innerHTML='<h2 class="sec" style="margin-top:0">Оюндар</h2><div class="tiles"><a class="tile" href="#/game/tug/all"><em>🪢</em>Аркан тартыш<small>Команда менен</small></a><a class="tile" href="#/game/chuko/all"><em>🦴</em>Чүкө оюну<small>Сөз, грамматика, маданият</small></a><a class="tile" href="#/proverbs"><em>📜</em>Макал-лакап</a></div><h2 class="sec">Тема тесттери</h2><div class="tiles">'+B.themes.map(function(t){return '<a class="tile" href="#/game/quiz/'+t.n+'"><em>'+t.em+'</em>'+t.n+'. '+esc(t.en)+'<small>'+(S.quiz[t.n]!=null?S.quiz[t.n]+"/100":"тест")+'</small></a>'}).join("")+'</div>'}
  else if(k==="game"){var g=h[1],s=h[2]||"all";if(g==="tug")gameTug(s);else if(g==="chuko")gameChuko(s);else if(g==="quiz")gameQuiz(s);else pageHome()}
  else pageHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
$("#bign").onclick=function(){S.big=S.big?0:1;save();document.documentElement.classList.toggle("big",!!S.big)};
route();
})();
</script>
