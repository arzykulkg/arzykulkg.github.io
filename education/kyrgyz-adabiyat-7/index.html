 Ичинде, Кайран гана Жусубумдун орду жок»."}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t3l12", "title": "Асанбек Стамов. «Үч мээрим» повести", "ky": "Жазуучунун өмүрү (1938–2010). Бөрүбай жана жылан кыз", "gram": "<b>Мээрим</b> — боорукердик, сүйүү, жылуулук. Повестте <b>эне, бала жана ата мээрими</b> сүрөттөлөт. <b>Фразеологизмдер</b>: <i>эр сайышка түшсө мындан алдырбаган, эч ким менен тил табышпагандыгы, бир жолу</i>.", "lex": "так, жатык, ширин, көркөм, муун, көз караш, ишеним, диний, чогойно, тобулгу, аса-муса, зергерчилик, колунан көөрү төгүлгөн уста, сөөк, жаннат, эр сайыш, эңиш, күрөш, куучу, бакшы, зергер", "tasks": [{"t": "vocab", "i": "think", "h": "Сөздүк жана кеп казына. Басканда угулат (🔊). <small style=\"color:#7a6a60;font-weight:400\">(74-бет)</small>", "w": [["так", "тыкан, даана", "чёткий", "✔️"], ["жатык", "жөнөкөй, түшүнүктүү", "доступный, простой", "📘"], ["ширин", "таттуу, жагымдуу", "сладкий, приятный", "🍯"], ["муун", "бир курактагы адамдар", "поколение", "👥"], ["көз караш", "ой-пикир", "мировоззрение", "👁️"], ["ишеним", "ишенүү", "вера, доверие", "🤝"], ["диний", "динге байланыштуу", "религиозный", "🕌"], ["чогойно", "тикендүү бадал", "шиповник, боярышник", "🌿"], ["тобулгу", "катуу жыгачтуу бадал", "таволга (кустарник)", "🌳"], ["аса-муса", "таяк жасалчу жыгач", "дерево для посохов", "🪵"], ["зергерчилик", "алтын-күмүштөн буюм жасоо", "ювелирное дело", "💍"], ["колунан көөрү төгүлгөн уста", "абдан чебер уста", "мастер золотые руки", "🛠️"], ["сөөк (боз үйдүн)", "боз үйдүн жыгач каркасы", "остов юрты", "🏕️"], ["жаннат", "бейиш", "рай", "🌤️"], ["эр сайыш", "ат үстүндө найза менен сайышуу", "конное сражение на копьях", "🐎"], ["эңиш", "ат үстүндө алышуу", "борьба на лошадях", "🤼"], ["куучу", "төрөтчү аял, бакшы", "повитуха, знахарка", "👵"], ["бакшы, эмчи-домчу", "элдик дарыгер", "народный лекарь", "🌾"], ["зергер", "алтын-күмүш устасы", "ювелир", "💎"], ["чоор", "чопо же жыгач үйлөмө аспап", "чоор (духовой инструмент)", "🎶"], ["карек", "көздүн карегы", "зрачок", "👁️"]]}, {"t": "read", "i": "read", "h": "Жазуучу жөнүндө окугула. <small style=\"color:#7a6a60;font-weight:400\">(73-бет)</small>", "title": "Асанбек Стамов (1938–2010)", "text": ["Кыргыз Эл жазуучусу Асанбек Стамов эмгек жолун Токмок шаарында мектеп мугалими болуп иштөөдөн баштаган. Жазуучунун чыгармалары 1960-жылдан баштап жарык көрөт. Кыргыз мамлекеттик университетинин филология факультетинде окуп жүргөн кезинде эле А. Стамовдун алгачкы повесттеринин бири — «Ата», кийин 1967-жылы «Кеч күздө» повести «Ала-Тоо» журналына жарыяланган. Кыргыз Эл баатыры Т. Касымбеков жаш жазуучунун бул чыгармаларына төмөнкүдөй баа берген: «Повесттин стили өтө так, жатык, тилинин ширин диги, көркөмдүгү жагынан бөтөн жаш калемгерлерге салыштырганда өзгөчөлөнүп турган…» Жазуучу аталган чыгармаларында жаш муундардын образына көбүрөөк басым жасап, алардын көз карашынын, түшүнүктөрүнүн, ишенимдеринин өнүгүшүн көрсөткөн.", "XX кылымдын 80-жылдарында А. Стамовдун чыгармачылыгында жаңы бурулуш башталып, жазуучу «Үч мээрим», «Келгин куштар», «Перзент кудурети» деген керемет повесттерди жараткан. Бул чыгармаларында жазуучу философиялык жана диний мурастарды кайрадан иштеп чыгууга көңүл бурган. 1992-жылы «Үч мээрим» повести Л. Лебедева тарабынан орус тилине которулган.", "XXI кылымдын башында Стамовдун «Кышында чардаган бакалар же кызыл гүл баяны», «Эне кудурети» аттуу повесттери жарык көргөн.", "Жазуучунун акыркы чыгармасы — «Хан Тейиш» романы (2009). Автор бул чыгарманы жазууга беш жылча убакыт сарптаганын, жазууга жыйырма жылдан ашык тарыхый булактарды окуп даярданганын белгилейт. Бул тарыхый роман жуңгар баскынчыларынын заманында кыргыз элинин башынан өткөргөн азап-тозокторду жөнүндө баяндайт."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "А. Стамов эмгек жолун кайдан баштаган?", "o": ["Токмокто мектеп мугалими болуп", "Фрунзеде гезитте", "Ошто театрда", "Москвада"], "a": 0}, {"q": "80-жылдардагы керемет повесттери?", "o": ["«Үч мээрим», «Келгин куштар», «Перзент кудурети»", "«Ата», «Кеч күздө»", "«Хан Тейиш»", "«Эне кудурети»"], "a": 0}, {"q": "Акыркы чыгармасы?", "o": ["«Хан Тейиш» романы (2009)", "«Үч мээрим»", "«Ата»", "«Кеч күздө»"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "«Үч мээрим» повестинен үзүндүнү окугула (бабадан атага, атадан балага өткөн жомок). <small style=\"color:#7a6a60;font-weight:400\">(74-бет)</small>", "title": "Үч мээрим (үзүндү)", "text": ["Бөрүбай Арзыгүл аттуу кызды сүйүп калат. Кыздын атасы баатыр адам, журт башкарган ажо болгон. Арзыгүлдүн агасы карындашын эч нерсеси жок жетим Бөрүбайга бергиси келбей, атасы менен сүйлөшүп алып, кызга чоң калың сурайт. Ошол мезгилде Арзыгүлгө Кең-Алайдын койнунда жашаган атактуу баргы элинин мыктысы Жоору куда түшөт. Жоору жашы элүүдөгү болсо да, Самат ажо жаш кызын ага берүүгө аргысыз болот. Айласы түгөнгөн Бөрүбай Жоорунун жүрөгүнө канжар уруп, өзү айылдан качып кетет.", "… Бул жомокту мен алгачкы ирет атамдан уккам. Атам аны бала чагымда өз атамдан уккам дечү. Ага да өз атасы айтып бериптир. Иши кылып бул жомок бабадан атага, атадан балага өтүп, биздин Качы тукумдарынын ичинде, оо, көптөн бери мурас катары оозон түшпөй келаткан эзелки жомок.", "… Жигит элге алынып кетсе да, эмнегедир өзүнчө өгөйсүй той-тамашаларга аралашкандан качып, ар дайым жалгыздап оолак жүрөт. Көтөрүп алган боз үйүн да айылдан четкерээк тигет. Башында анын кесиби жөнүндө. Жасаганы боз үйдүн сөөгү: кереге, уук, түндүк; ошо менен катар зергерчилик да кылат. Неси болсо да, колунан көөрү төгүлгөн устаны эл кадырлайт.", "… Ошо кезде жигитте дагы бир жаңы өнөр бүтөт. Жаш кезинде атасы ага чоор жасап берип, чоордо ойногонду үйрөткөн. Мына ошол өнөрүнүн пайдасы эми тийет. Жалгыз бой жигитке мындан өткөн жолдоштун, эрмектин кереги эмне. Чоор — жаннаттын аспабы. Ал бу дүйнөгө да, тиги дүйнөгө да таандык. Бирок негизинен чоор — тирүү аспап.", "Жылан кыз чоордо ойноп жаткан Бөрүбайды көрүп сүйүп калат. Кыздын энеси адам баласына турмушка чыкса, аны кандай кыйынчылыктар күтөрүн айтат. Ал ата-энесинин тилин албай, адам кейпин кийип Бөрүбайдын алдынан чыгат. Кыз Бөрүбайдын мурдагы сүйгөн кызы Арзыгүлгө абдан окшош болот. Бөрүбай менен жылан кыз Арзыгүл үйлөнүшөт. Жылан кыздын энеси бала төрөгөндөн кийин аны жети күн эч ким көрүүгө болбосун эскертет, себеби жети күндөн кийин гана ал толугу менен адамга айланмак. Алар балалуу болушат. Бир күнү Бакалбай чал Бөрүбайга жолугуп, анын аялы жылан экендигин айтат. Жигит аялына берген убаданы бузуп, баласын эмизип жаткан аялынын үстүнө кирет. Аялы эми адам кейпин кийе албай калат, ал кош айтып, Бөрүбайды баласы менен калтырат."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Бөрүбай ким болгон?", "o": ["Жетим, боз үйдүн сөөгүн жасаган уста", "Бай", "Хан", "Мерген"], "a": 0}, {"q": "Бөрүбайдын сүйгөн кызынын аты?", "o": ["Арзыгүл", "Зулайка", "Алтынай", "Айке"], "a": 0}, {"q": "Чоор — кандай аспап?", "o": ["Жаннаттын аспабы, тирүү аспап", "Кылдуу аспап", "Урма аспап", "Темир аспап"], "a": 0}, {"q": "Жылан кыз кимге окшош болгон?", "o": ["Арзыгүлгө", "Бакалбайга", "Жооруга", "Самат ажого"], "a": 0}, {"q": "Бөрүбай кайсы убадасын бузду?", "o": ["Аялын жети күн көрбөө убадасын", "Чоор ойнобоо убадасын", "Үй курбоо убадасын", "Айылдан кетпөө убадасын"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "Уландысын окугула: «Эне, бала жана ата мээрими». <small style=\"color:#7a6a60;font-weight:400\">(79-бет)</small>", "title": "Эне, бала жана ата мээрими (үзүндү)", "text": ["…. Ошо кезде, балдарым, шолоктоп ыйлап жаткан Бөрүбайдын боорундагы ымыркайдын да ыңаалаган үнү чыгат. Ого бетер шолоктогон Бөрүбай эңкейе берип сурайт аялынан: — Баланын тагдыры не болот? Өзүң жок кантип багам бу кызыл этти? — Эч болбосо кеңешиңди айтып кет.", "Ушу тапта аялдын бүт денеси жыланга айланып, башы гана адамдыкы боюнча турган дейт. Ошо жерден жылан токтой калып, эринин алдына сойлоп келип: — Тос колуңду, — дейт. Бөрүбай алаканын тосот. Ыйынып-ычкынган аял куйкасынан бери жыйрып келип, кабагын катуу кысканда, анын оң көзү бөлт этип эринин алаканына кулап түшөт да, чечекейинен ажыраган чанактан кызыл кан шүүшүндөп жерге тыптып эте тама баштаган дейт. — Ардагым, көздү мен эмне кылам? Түшүндүрүп кет.", "Жылан бала ачка болуп ыйлаганда каректи анын таңдайына салып, багуу керектигин айтат. Күйөөсүнөн балага энеси жөнүндө эч нерсе айтпа деп убадасын алат.", "…. Бир күнү баласы ыйлаганда, Бөрүбай каректи анын таңдайына салып коюп унутуп калат. Нариста (ымыркай) каректи соруп жатып, жутуп ийиптир. Бир жылдан бери карек өзү деле кичирейип отуруп, баланын тамагынан өткүдөй болуп калса керек. Бөрүбайдын айласы кетет.", "…. Бир күнү бала көтөрүп, азып тозгон Бөрүбайдын алдынан баягы жылан эне каршы чыгыптыр. Эне баласын эмизиш үчүн экинчи карегин чыгарып берет. — Ардагым, эми мен капкараңгы түндүн ичинде калдым. Мага мындан ары жашоонун кандайча кереги бар? Андан көрө башымды таш менен жанчып өлтүр да, көөмп кой. Бир айнегим барда эптеп жан бакчу элем. Эми кантем.", "… Жылан башын көтөрүп, ойлоно калат да, кайра өзү акыл салат: — Андай болсо мен көлдүн ичинде жашайм. Көл жылуу. Ал кышында тоңбойт. Эми эптеп оозумду ачсам тишиме бирдеме илинер. Тамыр, балыр болсо да жарай берет. Андан көрө силер үйүңөрдү көлдөн окчун жерге тиккиле. Мен таң атканын, күн батканын көрбөйм да. Күн бүркөлүп, түн түшкөнү да капарыма кирбейт. … Жаз, жай, кыш менен да ишим болбойт. Ошондуктан сен кез-кез бала уктап жатканда, жаныма келип, чоор тартып, жарык дүйнө жөнүндө кабар салып тур. Бирок мен жөнүндө бала такыр билбесин.", "Ошентип, байкуш жылан көлгө сойлоп кирип кеткен дейт.", "Бир жолу атасы жумуштап кеткенде, энесин эстеп куса болгон бала жалгыз бейитке келди. … Ошо кезде добуш чыгат. Бала башын көтөрсө бет алдында көзү кылыйган Бакалбай чал. — Өз энемди айтам, ата! Ал ушу жерге көмүлгөн, — деп бала муңайса, чал карскарс күлдү. — А бечара, бул жерде мындан отуз жыл мурда өлгөн Көчөрдүн кызынын сөөгү жатат. — Анда менин энемдики кайда? — Сенин энең тирүү. Аны өлдү деп ким айтты сага?… — Калп айтпаңыз. Жыландан адам төрөлбөйт. Мен сизге такыр ишенбейм. — Ишенбесең барып көр. Көл жактан атаңдын чоорунун үнү чыкканда жылан энең көлдөн чыгып келип, атаң менен адамча сүйлөшө баштайт. …", "Ошо жерден бала көл тарапты көздөй ыйлаган бойдон чуркап жүрүп отурат. Көл четинде чоор угуп, эри менен сүйлөшүп отурган жылан эне уулунун үнүн укканда эрине бир кыйкырып, көлдүн тереңин көздөй качып жөнөгөн дейт.", "… Эки көзү жок, караманча сокур алты кулач ак жыланга жеткенде бала эч бир коркпой жана үркүп койбостон энесинин башынан кучактай берип: — Энеке, энеке! — деп солуктап ыйлагандан башка сөз айталбаптыр.", "Жылан дагы баласына алты оронуп, анын демине, жытына чыдабай муундары бошогон байкуш эчкирип өксөп ыйлаган тура. «Чындаса, сокур көздөн жаш чыгат» деген макал бар. Бирок жыландын көзүнөн жаш ордуна кан чыгыптыр. Эне-балага жетип атасы да кошо ыйлай баштайт. Ал эми ошондо баланын көзүнөн аккан мөлтүр жаш, шор жаш жыландын сокур көзүнө тамат. Кызыгың түшкүр, жаш тамган сайын жылан эненин көзү ачылып, ага көз бүтүп, ал бир заматта суйкайган сулуу аялга айланган турбайбы. Кучакташа калышып, бирде күлө, бирде өбүшүп, бактыга тунган үч адам көлдөн чыгып келатканда күн күлүп жиберет. Дүйнө, чар тарап ого бетер кооз боло түшөт. Ошо кездеги эне, бала жана ата үчөөнүн бири-бирине төгүлгөн мээримин сүрөттөөгө сөз жетпес, балдарым…"], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Жылан эне баласын багуу үчүн эмнесин берди?", "o": ["Карегин (көзүн)", "Чачын", "Алтынын", "Сүтүн"], "a": 0}, {"q": "Жылан эне кайда жашаганга кетти?", "o": ["Көлдүн ичине", "Тоого", "Токойго", "Үңкүргө"], "a": 0}, {"q": "Балага энеси тирүү экенин ким айтты?", "o": ["Бакалбай чал", "Атасы", "Арзыгүл", "Жоору"], "a": 0}, {"q": "Жылан эненин көзү эмнеден ачылды?", "o": ["Баласынын көз жашынан", "Суудан", "Чоордун үнүнөн", "Дарыдан"], "a": 0}, {"q": "Чыгарманын идеясын кайсы сүйлөм толук берет?", "o": ["Эне менен баланы эч бир күч ажырата албайт; адамдагы бардык жакшы нерселер мээрим менен жаралат", "Жыландан коркуу керек", "Убада берүү жаман", "Көлдө жашоо жакшы"], "a": 0}]}]}, {"t": "order", "i": "think", "h": "Окуялардын иретин эстеп, ар бир сүйлөмдүн сөздөрүн туура тартипке койгула.", "items": [["Бөрүбай жылан кызга үйлөнөт", "1-окуя"], ["Бөрүбай убадасын бузат", "2-окуя"], ["Жылан эне карегин балага берет", "3-окуя"], ["Жылан эне көлгө кирип кетет", "4-окуя"], ["Бала энесин таап кучактайт", "5-окуя"], ["Эне кайра сулуу аялга айланат", "6-окуя"]]}, {"t": "match", "i": "think", "h": "Синонимдерди жупташтыргыла. <small style=\"color:#7a6a60;font-weight:400\">(84-бет)</small>", "pairs": [["окчун", "алыс"], ["куса болуу", "сагынуу"], ["муң", "кайгы"], ["мезгил", "убак"], ["нариста", "ымыркай"], ["чогуу", "бирге"], ["бечара", "байкуш"], ["үн", "добуш"]]}, {"t": "match", "i": "think", "h": "Антонимдерди жупташтыргыла. <small style=\"color:#7a6a60;font-weight:400\">(85-бет)</small>", "pairs": [["өлүү", "тирилүү"], ["жыргал", "азап"], ["ачка болуу", "тоюу"], ["унутуу", "эстөө"], ["ый", "күлкү"], ["жек көрүү", "сүйүү"]]}, {"t": "gap", "i": "write", "h": "Сөз түркүмүн толуктагыла (мээрим). <small style=\"color:#7a6a60;font-weight:400\">(85-бет)</small>", "items": ["Энем абдан [мээримдүү] аял.", "Ал балдарга [мээримин] төгөт.", "Мээрими [жок] адам — таш жүрөк адам."]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(84-бет)</small>", "qs": ["1. Жылан кыз Бөрүбайга кандайча ашык болуп калды?", "2. Эмне үчүн жылан кыз жигитке чындыкты айта алган жок?", "3. Бөрүбайдын убадасына турбай калганына эмне себеп болду?", "4. Наристе баласын багуу үчүн жылан эне кандай жол тапты?", "5. Жылан эне Бөрүбайдан эмне тууралуу суранды?", "6. Бала энеси тууралуу кандайча билди?", "7. Эмне үчүн жылан эне баласынан качып жөнөдү?", "8. Жылан эне кантип сулуу аялга айланып, көзү кайра көрө баштады?", "9. Жыланды мээримдүү энеге айланып, карегин баласына чыгарып бергенине ишенесиңерби?"], "rows": 3, "ex": "1. Чоордо ойноп жатканын көрүп сүйүп калды.<br>2. Анткени ата-энеси тыйган, жети күнгө чейин сыр ачылбашы керек болчу.<br>3. Бакалбай чал аялы жылан деп айтканы.<br>4. Карегин чыгарып, баланын таңдайына салууну.<br>5. Балага энеси жөнүндө эч нерсе айтпоону, чоор тартып кабар салып турууну.<br>6. Бакалбай чалдан.<br>7. Бала аны көрүп коркот деп, сокур, жылан кейпинде уялганынан.<br>8. Баласынын мээримдүү көз жашынан.<br>9. (Өз оюңар.) Бул жомок — мээримдин күчү жөнүндө."}, {"t": "act", "i": "group", "h": "Биздин долбоор. <small style=\"color:#7a6a60;font-weight:400\">(85-бет)</small>", "html": "1. Берилген сөздөр менен жекече иштегиле: <i>Мээрим — мээримдүү — мээримсиз — мээримин төгөт — мээрими жок</i>.<br>2. Топторго бөлүнүп, карылар үйүндө калган ата-энелер тууралуу маалымат топтогула.<br>3. Карылар үйүнө кайрымдуулук акциясы менен барып келгиле.<br>4. Карылар менен баарлашып интервью алгыла. Балдарынын мээримсиз болуп калышына эмнелер себеп болгонун аныктагыла.<br>5. «Ар бир үй-бүлөдө ар дайым үч мээрим жашасын!» деген темада сүрөт сынагын уюштургула."}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t3l13", "title": "Ч. Айтматов. «Эрте келген турналар» повести", "ky": "Согуш мезгилиндеги балдар. Аксай десанты", "gram": "<b>Прототип</b> — чыгармадагы каармандын реалдуу турмуштагы үлгүсү. Повесттин каармандарынын прототиптери — Айтматовдун айылдаш курбулары. <b>Эпиграф</b> — чыгарманын башында берилген цитата: <i>«Адамдар үмүт менен жер оодарат, адамдар үмүт менен үрөн себет…»</i> («Тхерогатха», байыркы Индостан адабиятынан).", "lex": "катчы, курбулар, катаал, коюп, бейпил, токпейил, чобур, дың, чоро, тооруп, кылат, көк тумшук, тири карак, ичи күйүү, күүшөө, ирик түймө, кашек, манаттай кызаруу, чунак, адыр, түбөлүк, үрөйү учуп, кайрат, алагды кылуу, кадала тиктөө, күздүк, кесепет, жаздык, мойнуна тагылган милдет, беш кошко, күнөс, акыр, башбагып, керт башы, нып-та, кыйраңда", "tasks": [{"t": "vocab", "i": "think", "h": "Сөздүк. Басканда угулат (🔊). <small style=\"color:#7a6a60;font-weight:400\">(89-бет)</small>", "w": [["катчы", "секретарь", "секретарь", "📝"], ["курбу", "теңтуш", "сверстник", "👫"], ["катаал", "оор, кыйын", "суровый", "❄️"], ["кунт коюу", "көңүл буруу", "внимательно слушать", "👂"], ["бейпил", "тынч, бейкут", "мирный", "🕊️"], ["токпейил", "оокат-аш жетиштүү", "сытый, обеспеченный", "🍞"], ["чобур", "арык, алсыз (ат)", "тощий (конь)", "🐴"], ["дың", "айдалбаган жер", "целина", "🌾"], ["чоро", "баатырдын жолдошу, жоокери", "дружинник, соратник", "⚔️"], ["тооруп", "аңдып", "подстерегая", "👀"], ["кылат", "жеңет", "победит", "🏆"], ["көк тумшук", "суук тийген, тоңгон", "посиневший от холода", "🥶"], ["тири карак", "шок, тынч эмес", "непоседа", "😜"], ["ичи күйүү", "көрө албоо, кызгануу", "завидовать", "😒"], ["күүшөө", "тыңшоо, кунт коюу", "прислушиваться", "🎧"], ["ирик түймө жүн жоолук", "калың жүн жоолук", "плотный шерстяной платок", "🧣"], ["кашек", "эшиктин жылчыгы", "щель", "🚪"], ["манаттай кызаруу", "катуу кызаруу", "сильно покраснеть", "😳"], ["чунак", "тентек, тили курч", "озорной", "😏"], ["адыр", "дөң, дөбөлүү жер", "холмистая местность", "⛰️"], ["түбөлүк", "түбөлүктүү, дайыма", "вечный", "♾️"], ["үрөйү учуу", "катуу коркуу", "испугаться", "😱"], ["кайрат", "эрк, күч", "мужество", "💪"], ["алагды кылуу", "алаксытуу", "отвлекать", "🙈"], ["кадала тиктөө", "тик карап туруу", "пристально смотреть", "👁️"], ["күздүк", "күздө себилген эгин", "озимые", "🌱"], ["кесепет", "зыян, жаман таасир", "вред, бедствие", "⚠️"], ["жаздык", "жазда себилген эгин", "яровые", "🌿"], ["мойнуна тагылган милдет", "жоопкерчилик", "возложенная обязанность", "🎒"], ["беш кошко", "беш соко", "пять плугов", "🚜"], ["күнөс", "күн тийген жер", "солнечная сторона", "☀️"], ["акыр", "малдын чөп жечү жайы", "ясли, кормушка", "🪵"], ["башбагып", "башын салып карап", "заглянув", "👀"], ["керт башы", "өзү, жеке башы", "лично сам", "🙋"], ["нып-та", "так, тыкан", "чётко", "✔️"], ["кыйраңда", "кыйралап, оор кыймылда", "тяжело двигаясь", "🚶"]]}, {"t": "read", "i": "read", "h": "Повесть жөнүндө окугула. <small style=\"color:#7a6a60;font-weight:400\">(86-бет)</small>", "title": "Ч. Айтматов. «Эрте келген турналар» повести", "text": ["«Эрте келген турналар» повести орус тилинде жазылып, «Ранние журавли» деген ат менен «Новый мир» журналынын 1975-жылдагы №9-санына басылган. Аны кыргыз тилине Ашым Жакыпбеков которгон.", "1976-жылы кыргызча которула элек чыгармага — «Ранние журавли» повестине Кыргыз ССРинин Токтогул атындагы Мамлекеттик сыйлыгы ыйгарылган. Повесть боюнча кинотасма тартылган.", "«Эрте келген турналар» повести Улуу Ата Мекендик согуш учурунда болгон окуяны чагылдырган. Согуш ошол мезгилде жашаган ар бир адамдын тагдырына өз таасирин тийгизген. Болочок жазуучу Улуу Ата Мекендик согуш убагында 1942-жылы убактылуу окуусун таштап, өзүнүн Шекер айылдык советинде катчы, налог агенти, трактор бригадасынын эсепчиси болуп иштеген. Оорукта элдин жамандык-жакшылыгын өз жүрөгүнөн өткөрүп, ошол кездеги көрүп билген кыйынчылыктары кийинки чыгармаларына булак болгон. Согуштун адам табиятына каршы келген трагедиялары жазуучунун «Саманчы жолу», «Атадан калган туяк», «Бетме-бет», «Эрте келген турналар» чыгармаларында адамзаттык бийик деңгээлде чагылдырылган.", "Повесттин каармандарынын прототиптери Чыңгыз Айтматовдун айылдаш курбулары (теңтуштары) эле. Жазуучу согуш учурундагы ушул балдардын жеңиш үчүн, жашоо үчүн болгон ченемсиз эрдигин сүрөттөгөн. Чыгармадагы бардык окуя башкы каарман Султанмураттын башынан өткөргөндөрү, элестери жана кыялдары аркылуу берилген. Согуштун катаал (оор, кыйын) мезгилине карабай окуусун улантып өспүрүмдөр суук класста улам от жагып, мугалими айткан сабакты кунт коюп (көңүл буруп) угуп олтурушат. Кээде ар ким өз кыялы менен согуштан мурдагы бейпил (тынч, бейкут) турмушун, аталары бар токпейил (оокат-аш жетиштүү) учурун эстешет. Султанмурат да атасы калтырган Чабдар аты менен атасын жеңиш менен тосуп аламын деп кыялданат. Бирок турмуштун талабы менен башкарма Тыналиев бөлүп берген чобур (арык, алсыз) аттарын багып, далай даярдык менен алыскы Аксайга десант катары келишет. Табияттын ар кандай татаал кысымына карабастан, балдар Аксайдын дың (айдалбаган) жерлерин өздөштүрүүгө көп күчүн жумшашты. Ошондуктан жазуучу башкарма Тыналиевди айкөл Манас баатырга, ал эми Султанмурат баштаган балдарды баатыр чоролорго салыштырып сүрөттөйт. Бирок белгисиз каракчылар аттарын уурдап, алардын артынан түшкөн Султанмураттын Чабдар атына ок жаңылат. Чабдардын өлүгүн тооруп (аңдып) келген ач карышкырды утурлай, аттын жүгөнүн кармап Султанмурат да жырткычты тосууга даяр турат.", "Ушул финалда элдин тынчтыгын бузуп кол салган ач карышкырдай жутунган фашисттер менен жер айдап үрөн сепкен ак ниет адамдар карама-каршы коюлат. Алар кандай кыйынчылык болсо да жеңип, аталарынын жолун улантышат, жакшылык менен үмүт үстөмдүк кылат (жеңет) деген идеяны берет."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Повесть кайсы тилде жазылган жана ким которгон?", "o": ["Орусча, Ашым Жакыпбеков которгон", "Кыргызча, өзү которгон", "Англисче", "Казакча"], "a": 0}, {"q": "Повесть качан, кайда жарыяланган?", "o": ["1975-ж., «Новый мир» журналына", "1965-ж., «Ала-Тоо» журналына", "1980-ж., «Эркин-Тоо» гезитине", "1942-ж., Шекерде"], "a": 0}, {"q": "Башкы каарман ким?", "o": ["Султанмурат", "Тыналиев", "Анатай", "Эркинбек"], "a": 0}, {"q": "Балдар кайда десант катары барышат?", "o": ["Аксайга", "Шекерге", "Таласка", "Москвага"], "a": 0}, {"q": "Султанмураттын атынын аты?", "o": ["Чабдар", "Октору", "Акбайпак", "Алтынтуяк"], "a": 0}, {"q": "Жазуучу Тыналиевди кимге салыштырат?", "o": ["Манас баатырга", "Кожожашка", "Куйручукка", "Дүйшөнгө"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "Повесттен үзүндүнү окугула. <small style=\"color:#7a6a60;font-weight:400\">(88-бет)</small>", "title": "Эрте келген турналар (үзүндү)", "text": ["Ирик түймө жүн жоолугун ороно салынса да болбой үшүгөн Иңкамал-апай өзүнөн бетер көк тумшук болуп отурган балдарга география сабагында Цейлон аралы жөнүндө узун сабак-жомок айтып жатыры.", "Үшүп олтурган балдардын ичинен бирөө ыкшып жөтөлсө, сөзүн токтото калып, өзү далысын күүшөп коюп, суук класста Иңкамал-апай Цейлон жөнүндөгү, көк деңиз, ысык жерлер жөнүндөгү сабагын өтүп жатыры. Кулагы уккан укмуштарга биресе ишенсе, биресе ишене албай Султанмурат отуру. Цейлондо туулбай калганына ичи күйөт.", "Терезеден үйлөгөн суукка Султанмураттын оң капталы муздагандан муздап баратат. Кашекке тийген шамалдын ышкырыгы кулак түбүнөн ызылдайт. Бирок чыдабаска чара жок. Ыңкамал-апай аны атайы отургузган. «Балдардын арасында тири карагы сен эмессиңби, чыдаарсың» — деген. Суук түшө электе бул орунда Мырзагүл отурчу, аны Султанмураттын ордуна которгон. Аерге мынчалык суук жетпейт. «Мырзагүлдү деле жаныма калтырбай койбойбу, терезе жакка мен эле отурбайт белем», — деп Султанмурат ичинде сызып калган. Бир партада жанаша отура беришмек. Эми танапистен жанына жолосо, манаттай кызарат. Башкалар менен аралашып ойноп жүргөнү, а Султанмурат барса эле кызарып, качып кетет. Артынан кубаламак беле. Анда балдар ого бетер күлбөйбү. Баарынан да береги чунак кыздар саал эле болсо, «Султанмурат + Мырзагүл = эки ашык» деп кагаз жазып, партадан партага таратат. Башынан Мырзагүл тартынбай жүргөндө отура беришмек, минтип сөз да чыкмак эмес…", "Кап десең, Таластын аба ырайы деле тиги ысык жактагыдай болсо кана. Аба ырайы жакшы, жашоо-турмуш да башкача болмок. Адыр-адырда пилдер жүрмөк оттоп. Бирин өгүздөй чүлүктөп минип алсаң… .", "… Сабак дале жүрүп жатыры, Ыңкамал-апай эми Ява, Борнео, Австралияны айтып турган экен. Дагы уксаң, дагы укмуш жерлер, суугу жок, түбөлүк жай. Крокодили, маймылы көп, пальма өскөн, кулак укпаган ажайып нерселер. Кенгурусун айтсаң — укмуштун укмушу го. Күчүгүн боор баштыгына салып алып, чаап жүрө берет дейт. Ойлоп тапканын карасаң, жок, ошол өзү ойлоптурбу, табияттын жаратканы да…"], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Иңкамал-апай кайсы сабакты өтүп жатат?", "o": ["География", "Тарых", "Адабият", "Математика"], "a": 0}, {"q": "Иңкамал-апай балдарга кайсы жер жөнүндө айтып жатат?", "o": ["Цейлон аралы жөнүндө", "Москва жөнүндө", "Ысык-Көл жөнүндө", "Талас жөнүндө"], "a": 0}, {"q": "Султанмурат эмне үчүн терезенин жанында отурат?", "o": ["Тири карак, чыдамдуу деп апай отургузган", "Жазаланган", "Өзү каалаган", "Партасы жок"], "a": 0}, {"q": "Султанмурат жакындаганда Мырзагүл эмне кылат?", "o": ["Кызарып качып кетет", "Күлөт", "Урушат", "Сүйлөшөт"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "Уландысын окугула: Тыналиев мектепте. <small style=\"color:#7a6a60;font-weight:400\">(90-бет)</small>", "title": "Эрте келген турналар (уландысы)", "text": ["… Бирок кийинки күндөрү апайдын ою бир жерде эмес… Ошол үчүн болуу керек, азыр да завуч коштогон башкарма Тыналиев класска кирип келгенде, Иңкамал-апай үрөйү учуп (фраз. чочуп, коркуп), доскага кетенчиктей берди. Ошондо да кайратын жоготпой: — Тургула, балдар. Султанмурат, ордуңа бар, — деди.", "— Жаман кабарыбыз жок, Иңкамал-апай, — деп башкарма көңүл тынчытты. — Мен жумуштап келдим. Балдар менен сүйлөшөр сөзүм бар. Сабагыңыздан алагды кылганымы кечирип коюңуз, уруксат алдым, — деп завучка башын жаңсады.", "— Мектебиңер суук экен, бирок самандан башка берер менде отун жок… Абал оор, согушта да абал оор. Былтыр эки жүз гектар жерге күздүктү кем айдап калдык. Бу да болсо согуштун кесепети… Мына менин келгеним да ушул түйшүк менен. Кээ бириңер азырынча мектепти коё тургула деп айтканым бар… Буга эмне үчүн жан күйөт дебейсиңерби. Алиги күздүктөн айдалбай калган эки жүз гектар кемчилигибизди жаздык менен жабышыбыз керек… Айдоо алыс, Аксайда. Аялдар бара албайт. Башка жарамдуу эл жок. Эмне кылмакпыз? Ойлоп-ойлоп отуруп, акыры, окуучу балдар, силерден жардам сурайлы дедик…", "— Мен жыргап кеткенимен силерди окууңардан ажыратып жаткан жокмун, — деп сүйлөдү Тыналиев. — Башка арга жок. Кичине эмессиңер, туура түшүнгүлө. Согуш бүтөр замат, же андан деле мурун мектебиңерге өзүм кайра апкелип, окууңарды улантасыңар дейм. Ага чейин силердин мойнуңарга тагылган милдет ушул.", "… Беш кошко деген жыйырма ат күнөстө тизилип, күркүлдөтө акырдан баш көтөрбөйт. Беш бала, жыйырма ат — Аксайдын десанты деп, Тыналиев ушуну айткан. Башкарма таң эрте келип бир кыдырып көрөт, ал учурда балдар да аттарынын жанында какыйып турат. Башкарманын алиги сөзүнөн кийин бригадир, арабакеч, атчылары бардыгы «десант, десантчылар, Аксайдын аттары, Аксайдын чөп-жеми, Аксайдын сокосу» дей турган болушту. Ат сарайдын жанынан өтүп бараткан салт адам да, десанттын ал-жайы кандай экен деп, бир башбагып кетет. Аксайдын десанты деген сөз бүт айыл элинин оозунда. Башкарма десанттын командирлигине Бекбайдын уулу Султанмуратты дайындаптыр деп сөз кылып жүрүшүптү.", "…— Эмесе, балдар, азыр согуш учуру. Демек, биз дагы согуш тартиби менен жашайбыз, — деп сүйлөдү башкарма. — Мен силер үчүн керт башым менен жооп берем. Экөөңөрдүн атаңар согушта курман болду, үчөөңөрдүн атаңар согушуп жүрөт. Өлгөндөрдүн да, тирүүлөрдүн да алдында мен силер үчүн жооп берем. Силерге ишенген үчүн жоопкерчиликти мойнума алып отурам. Алыскы Аксайга жөнөйсүңөр. Өзгөчө тапшырмага жөнөгөн парашютчу десант сыяктуу силер да нечен күн, нечен түн ээн жерде жалгыз болосуңар, аякка барганда кантип жашап, кантип иштейсиңер?"], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Тыналиев мектепке эмне үчүн келди?", "o": ["Балдардан Аксайды айдоого жардам сурап", "Жаман кабар айтып", "Сабак өтүп", "Отун алып келип"], "a": 0}, {"q": "Канча гектар күздүк кем айдалган?", "o": ["Эки жүз", "Жүз", "Элүү", "Беш жүз"], "a": 0}, {"q": "Аксай десанты: канча бала, канча ат?", "o": ["Беш бала, жыйырма ат", "Он бала, он ат", "Төрт бала, сегиз ат", "Беш бала, беш ат"], "a": 0}, {"q": "Десанттын командири ким?", "o": ["Султанмурат", "Анатай", "Эркинбек", "Эргеш"], "a": 0}]}]}, {"t": "match", "i": "think", "h": "Чоролорду (балдарды) сүрөттөмөсү менен жупташтыргыла. <small style=\"color:#7a6a60;font-weight:400\">(92-бет)</small>", "pairs": [["Султанмурат", "баш баатыр-чоро, Бекбайдын уулу, Чабдар аты"], ["Анатай", "он алтыга караган, ителгидей мыжыгыр, Октору аты"], ["Эркинбек", "атка жеңил, тайга чак, Акбайпак аты"], ["Эргеш", "жанга шерик, жакшы дос, Алтынтуяк аты"], ["Кубаткул", "үйдөгү чоң балдардын улуусу, Жибекжал аты"]]}, {"t": "gap", "i": "write", "h": "Көп чекиттердин ордуна керектүү сөздөрдү койгула. <small style=\"color:#7a6a60;font-weight:400\">(94-бет)</small>", "items": ["Алыскы [Аксайга] жөнөйсүңөр. Өзгөчө тапшырмага жөнөгөн парашютчу [десант] сыяктуу силер да нечен күн, нечен түн ээн жерде жалгыз болосуңар.", "Бекбайдын уулу Султанмурат [командир] болуп дайындалган Аксай [десантынын] алдында Тыналиев башкарма ушинтип сүйлөдү."]}, {"t": "mcm", "i": "think", "h": "Портреттерди табуу: булар кимдер? <small style=\"color:#7a6a60;font-weight:400\">(94-бет)</small>", "qs": [{"q": "«Аскерден кие келген боз шинели үстүнөн түшпөгөн, көк тумагы башында, асынма сумкасы капталында, өзү жаш болсо да караганы катаал, кабагы түнт» — ким?", "o": ["Тыналиев", "Султанмурат", "Анатай", "Иңкамал-апай"], "a": [0]}, {"q": "«Жаңы он алтыга караган, бул бешөөнүн улуусу. Ителгидей мыжыгыр, теңтушуна алдырбаган баатыр бала» — ким?", "o": ["Анатай", "Султанмурат", "Эркинбек", "Эргеш"], "a": [0]}, {"q": "«Гүлдөн гүлгө учуп конгон көпөлөк мисал тиги кыздын этек жеңи желбиреп, аттамчык аттап келе жатканы бир сонун көрүндү» — ким?", "o": ["Мырзагүл", "Иңкамал-апай", "Ажымурат", "Султанмурат"], "a": [0]}, {"q": "«Алар көк мухитке киринип, кээде жабыла, кээде жалгыздап үн салып, канаттарынын учтарына гана арине каккылап, каалгып сүзүп баратты…» — эмнелер?", "o": ["Турналар", "Самолёттор", "Бүркүттөр", "Булуттар"], "a": [0]}]}, {"t": "sort", "i": "think", "h": "Султанмурат жашаган жердин шарты менен алыскы жылуу өлкөлөрдү салыштыргыла. <small style=\"color:#7a6a60;font-weight:400\">(89-бет)</small>", "cols": ["Султанмурат жашаган жер (Талас)", "Алыскы жылуу өлкөлөр"], "items": [["суук кыш, кар", 0], ["согуш, оор турмуш", 0], ["суук класс, саман отун", 0], ["түбөлүк жай, суугу жок", 1], ["крокодил, маймыл, пальма", 1], ["кенгуру, пилдер", 1]]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(93-бет)</small>", "qs": ["1. Эмне үчүн Иңкамал-апай Тыналиев келгенде коркуп кетти?", "2. Башкарма Тыналиев мектепке кандай өтүнүч менен келди?", "3. Эмне үчүн балдар окуусун таштап, алыскы жерге баруусу керек?", "4. Аксайга баруучу балдарды Тыналиев эмнеге «Аксай десанты» деп атады?", "5. Аксай десантын жана алардын аттарын жазуучу эмне үчүн чоролорго салыштырып сүрөттөйт?", "6. Аксай десантынын ийгилигине ишенесиңерби? Балдар башкарма Тыналиев тапшырган ишти аткара алышабы? Аргументтерди келтиргиле.", "7. Ч. Айтматовдун «Эрте келген турналар» повести кайсы идеяны берет?", "8. Каркыра — турналар эмненин символу болуп саналат?"], "rows": 3, "ex": "1. Согуш убагы, жаман кабар (кара кагаз) келгенби деп корккон.<br>2. Балдардан Аксайдын дың жерин айдоого жардам сурап.<br>3. Анткени аялдар бара албайт, башка жарамдуу эл жок, эки жүз гектар кем айдалган.<br>4. Өзгөчө тапшырма менен алыскы жерге жалгыз жөнөгөн парашютчу десант сыяктуу.<br>5. Анткени алар Манастын чоролору сыяктуу эрдик кылып, элди багуу үчүн күрөшөт.<br>6. Ооба, анткени балдар эр жүрөк, аталарынын жолун улантууга даяр (өз аргументтериңер).<br>7. Кандай кыйынчылык болсо да жакшылык менен үмүт жеңет.<br>8. Жаздын, үмүттүн, жаңы жашоонун символу."}, {"t": "act", "i": "group", "h": "Биздин долбоор. <small style=\"color:#7a6a60;font-weight:400\">(95-бет)</small>", "html": "1. Ч. Айтматовдун чыгармалары боюнча согуш темасындагы көркөм тасмалардын аттарын жана тарткан режиссёрлору тууралуу видеослайд жасагыла.<br>2. «Эрте келген турналар» повести боюнча тартылган көркөм фильмди көрүп, согуш учурундагы балдардын турмушунун кинодо жана чыгармада берилишин салыштыргыла.<br>3. Балалык жана өспүрүм курагы согуш учуруна туш келген жакын адамдарың же тааныштарың тууралуу аңгеме даярдап келгиле.<br>4. «Азыркы учурдагы улуттар аралык конфликттердин, миграциянын балдарга тийгизген таасири» аттуу презентация даярдагыла."}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t3l14", "title": "Төлөгөн Касымбеков. «Адам болгум келет» повести", "ky": "Жазуучунун өмүрү (1931–2011). Асылбек жана атасы", "gram": "<b>Повесттин идеясы</b>: «Адам болуу» — мансап, кызмат эмес, эл менен бирге ак эмгек кылуу. <b>Фразеологизмдер</b>: <i>ат тезегин кургатпайт, жылан сыйпагандай, жону жука, аталадай былжырап, иттен жок же ит байлаган жиптен жок болуп, куурай башын сындырып көргөн жан эмес, тили буудай куурат, кол жоолугу болуу, айтканын кылып, айдаган жагына жүрүү, үч уктаса түшүнө кирбеген</i>.", "lex": "кат тааныган, сөзмөрлүк, чагылдырган, изденүү, жыш, үлгү алуу, элеттик, өкүмзар, кыргыз, чыгаан, колбашчы, чигит, күдүрөйүп, өтөгү көк жашаң, карбаласта, аксоё, сазе айтып, пешенемден, кердим, аки-чүкүсү, алээми, ыкыбалың кетсе, оролундай эмес, келде, кожоңдойт", "tasks": [{"t": "vocab", "i": "think", "h": "Сөздүк. Басканда угулат (🔊). <small style=\"color:#7a6a60;font-weight:400\">(101-бет)</small>", "w": [["кат тааныган", "окуп-жаза билген", "грамотный", "📖"], ["сөзмөрлүк", "сөзгө чебердик", "красноречие", "🗣️"], ["чагылдыруу", "сүрөттөө, баяндоо", "отражать", "🪞"], ["изденүү", "ойлонуу, издөө", "искать, размышлять", "🔍"], ["жыш", "көп, арбын", "обильно", "🌾"], ["үлгү алуу", "үйрөнүү, туурап үйрөнүү", "брать пример", "🎯"], ["элеттик", "айылдык", "сельский", "🏡"], ["өкүмзар", "катаал, авторитардык", "властный, суровый", "👊"], ["чыгаан", "таланттуу", "выдающийся", "🌟"], ["колбашчы", "жетекчи, командир", "полководец", "🎖️"], ["чигит", "пахтанын уругу", "хлопковое семя", "🌱"], ["күдүрөйүп", "дөңсөлөнүп", "бугристо", "⛰️"], ["өтөгү көк жашаң", "тоонун этеги жашыл", "подножие зелёное", "🏞️"], ["карбаластоо", "шашып, аптыгуу", "суетиться", "🏃"], ["аксоё", "жапыз, эски там", "низкая лачуга", "🏚️"], ["сазе айтуу", "сөз таштоо, кагуу", "съязвить", "😏"], ["пешене", "маңдай, тагдыр", "лоб, судьба", "🙇"], ["кердим", "чоюдум, мактандым", "важничал", "😤"], ["аки-чүкү", "майда-чүйдө", "мелочи", "🔸"], ["алээми", "чоң ааламы", "весь мир", "🌍"], ["ыкыбал", "бакыт, ийгилик", "удача", "🍀"], ["келде", "келечек", "будущее", "🔮"], ["кожоңдоо", "көөдөн көтөрүү, менменсинүү", "важничать", "👑"], ["мансап", "кызмат, бийлик", "должность, карьера", "🏛️"], ["бекерчи", "иштебеген, жалкоо", "бездельник", "🛋️"]]}, {"t": "read", "i": "read", "h": "Жазуучу жөнүндө окугула. <small style=\"color:#7a6a60;font-weight:400\">(96-бет)</small>", "title": "Төлөгөн Касымбеков (1931–2011)", "text": ["Төлөгөн Касымбеков 1931-жылы Аксы районундагы Акжол айылында туулган. Ал — Кыргызстандын Баатыры, Кыргыз эл жазуучусу, Кыргыз Республикасынын Токтогул атындагы сыйлыгынын лауреаты. Келечектеги жазуучунун атасы Касымбек арабча кат тааныган (окуп, жаза билген) билимдүү адам болгон. Ал уулуна «Лайли менен Мажнун», «Кыз Сайкал» сыяктуу чыгармаларды арабча окуп берген. Атасынын сөзмөрлүк (сөзгө чебер) өнөрү жаш балага зор таасир берген.", "1957-ж. КМУнун филология факультетин бүтүргөн. Анын алгачкы «Кичинекей жылкычы» аңгемеси 1952-ж. жарыяланган. «Жылкычынын уулу» (1956), «Туулган жер» (1958), «Адам болгум келет» (1961) аттуу аңгеме, повесттер жыйнактары чыккан.", "Жазуучулук ысымын окурмандарга тааныткан, кыргыз элинин социалдык-саясий абалын чагылдырган чыгармасы — «Сынган кылыч» романы болуп саналат (1-китеп 1966-жылы, 2-китеп 1971-жылы чыккан). Роман Кокон хандыгынын учурундагы тарыхый окуяларды чагылдырган. Кыргыз аймагы падышалык Россия тарабынан куралдуу күч менен колонияга айландырылганы көркөм чындык катары далилденген. Роман 1980-жылы англис тилине которулган.", "Ал «Келкел» (1986), «Баскын» (2000) тарыхый үчилтиктин бөлүмдөрүн терең изилдөөлөр, фактылар менен айкалыштырып көркөм баяндап бере алган. «Келкел» тарыхый романы Кыргызстанда XX кылымдын 20–30-жылдарында Кеңеш бийлигин куруу учурундагы окуяларды чагылдырууга арналган.", "Т. Касымбековдун «Алымкан», «Курманжан датка» драмалары театр сахнасында коюлган. Чыгаан (таланттуу) жазуучунун чыгармалары башка тилдерге да которулган.", "Т. Касымбековдун «Адам болгум келет» повести 1965-жылы орус тилинде жарык көргөн. Бул чыгармасында элге пайдалуу инсан болуу үчүн ар тараптан изденүү (ойлонуу), эски түшүнүктөр менен күрөшүү канчалык маанилүү экендигин ачып берген. «Адам болгум келет» повестинде турмуштагы жакшы адамдардан, алардын иштеринен үлгү алуу (үйрөнүү) аркылуу өнүгүү жолуна түшкөн элеттик (айылдык) жаш адамдын образы ишенимдүү берилген."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Т. Касымбеков качан, кайда туулган?", "o": ["1931-ж., Аксы, Акжол айылы", "1912-ж., Кең-Суу", "1938-ж., Токмок", "1925-ж., Кызыл-Жар"], "a": 0}, {"q": "Жазуучуну элге тааныткан романы?", "o": ["«Сынган кылыч»", "«Келкел»", "«Баскын»", "«Адам болгум келет»"], "a": 0}, {"q": "«Сынган кылыч» кайсы доорду чагылдырат?", "o": ["Кокон хандыгынын учурун", "Совет мезгилин", "Үркүндү", "Манастын доорун"], "a": 0}, {"q": "«Адам болгум келет» повести качан орусча жарык көргөн?", "o": ["1965", "1952", "1980", "2000"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "Повесттен үзүндүнү окугула: Асылбектин айылга кайтып келиши. <small style=\"color:#7a6a60;font-weight:400\">(98-бет)</small>", "title": "«Адам болгум келет» повести (үзүндү)", "text": ["Үргүлөйүн, туулган жер… Мелмилдеген көк асманы, чигиттеп койгон пахта сымал тоо баштарында түрмөк-түрмөк чубалган ак булуттары өз үйүңдүн чамгарагындай тааныш, көзгө жылуу. Өркөчтөнгөн кара тоолор, күдүрөйүп бадал жамынган адырмак, өтөгү көк жашаң өзөн, ийрилип аккан кашка суу — бири төрүң, бири улагаң сыяктуу. Абасы бир түркүн мемиреп, көңүлдү сергитет. Эненин ууз сүтү, көкүрөк жыты сезилет.", "Мен чоң окууга экзамен тапшырууга кетерде буудайга жаңы гана орок тийген эле, эми бүтө жаздап, жон-жондо ак саман чаңып, кызылы кырманга үйүлүп калыптыр. Жүгөрү дүмбүл болуп, жаңгак оймо, сары алма, кара жүзүм, кызыл алча шагын ийип берешен эне ырыскысын ченебей төгүп турган кези экен…", "Эски чемоданымды көтөрүп, кылкылдап турган көк жүгөрүнү басып, бурчунда жалгыз түп тыты бар жалпак тамдын эшигине келе бергенимде, бери чыгып келе жаткан атам бетме-бет келе түштү. Мени көрүп, оозунан сөзү түшүп, аңкайып токтоп калды. — Кел, уулум!.. — деп күңк этти, тула боюмду бир тегерете тиктеп. Ичкертен апамдын карбаластаган үнү чыкты: — Асылбы?.. Каралдым!.. Экөөбү ортого алып, өөп-жыттап, сылап-сыйпап эне-аталык мээримге бөлөдү.", "— И! Иш кандай? — деп сурады атам жанына отургузуп. Эмелеки шатман жылмаю жүзүнөн жылан сыйпагандай жоголду да, анын ордуна коопонуу, кабырга майыштырган оор заарканүү басты. Көзү тикирейип өтөр-катарымды тепчиди. Мурдуму шыр тартып, бутумдан башын тиктедим: — Өтпөй калдым… Тиги Мыкты деле өтпөй калды… Атам үн катпай, былк этпей тунжурай түштү. Бир оокумда апам: — Ой … Эмне мынча үрпөйдүң, окубаса жүрөр! — деп сазе айтып жиберди. Бирок атамын уккусу келбеди. Этек кагынып, күңкүлдөп эшикке чыгып кетти: — Адам болот экен десе… Апам улутунуп койду да, пешенемден сылады: — Тегеренейин, азып кетипсиң… Бир жериң оорудубу, ыя..? — деди. — Атаң дулдуңдай берет, адаты. Мейли, окубасаң жүрөрсүң, чымындай жаның аман болсо болду мага, каралдым…", "Бир күнү. Улуу шашке. Атам кер быштыны камчылап, түйлата теминип келип, айдоонун чекесине токтой калды. Шашкан түрү бар: — Ой!.. Ой, Асылбек! — деп үзөңгүсүн чирене тээп, обдула берип кыйкырды. — Ой, бери бас! Чотур унчукпастан тракторду бир кунунда айдап кете берди. Атам кыжырланып, бизди карата аркыратып аттын башын коюп жиберди. Кер бышты тракторду жандабай, ойт берип өтө качты. Канча камчыланса да, кулагын тикчийтип кетенчиктей берди. Айласы куруду белем, атам те марзеге чыкты да, быштыны оңерге байлап, өзү ормоюп бизди карай басты. Чотур күлүп — күлүп тракторду токтотту да: «Барчы», — деди акырын. Прицептен түшө баштаганымда атам айдоонун четине келип, мени теше тиктеп туруп калды. Жеткенде эле: — Эмне кылып жүрөсүң? — деди корс эте. — Таапсың телди?! — Иштеп жүрөм, — дедим күңк-мыңк.", "— Иштеп жүрөсүңбү?.. Таапсың ишти! — Атам кекете сүйлөдү. — Тарт атты! … Атка жигитче леп минди да: — Учкаш! — деп бутун үзөңгүдөн чыгара берди. — Бүгүн сүйлөштүм… Жүр азыр! Мектептин директири менен мукум сүйлөшүп келдим. Уулуңузду бүгүн апкелиңиз деп калды. Күнү кечээ секретары бошоптур. Биртке айлыгы бар окшойт. Болот ошол азырынча. Жүр, дакименттериңи тактай салып, бол эрте, чаап бара кой!", "— Ата… Эмне жумуш кылат экен анда? — Эмне кылмак элең? Орок орбойсуң, кетмен чаппайсың. Айтканын кылып, айдаган жагына жүрүп, деректирдин өзүнүн катчысы болосуң. Ошерде көөдөнүмдөн бирдеме чарт жарылгансып, кандайдыр ысык бирдеме оргун-оргун бүт денеми баскансып, көзүмө парда тартып, кулагымы дүңгүрөттү: — Кол жоолугу болот экемин да! — Оозумдан бу кеп кантип чыгып кеткенин билбейм, шарт бурулуп жүрүп бердим. — Барбайм!.. — Барбайм!.. Барбайм!.. Атам капыстан жаакка жеген баладай але-саладе селдее түштү. Жалгыз уулунун тил албай өзүнөн оолактап баратканын өз көзү менен көрүп турганына ишенбеди окшойт. Бир маалда: — О токто!! — деген чакырыгы чыкты анын. — Ой!! Токто!! Андан ары эмне дегенин уккан жокмун, уккум да келген жок. Түптүз барып прицепке чыктым…"], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Асылбек шаардан эмне үчүн кайтып келди?", "o": ["Чоң окууга өтпөй калды", "Окууну бүтүрдү", "Оорup калды", "Атасы чакырды"], "a": 0}, {"q": "Атасы уулунун өтпөй калганына кандай карады?", "o": ["Ачууланып, тунжурап калды", "Кубанды", "Кайдыгер карады", "Күлдү"], "a": 0}, {"q": "Асылбек кимдин прицебине олтуруп иштеди?", "o": ["Чотур тракторчунун", "Орко бригадирдин", "Бердике председателдин", "Базыл чалдын"], "a": 0}, {"q": "Атасы уулуна кандай жумуш тапты?", "o": ["Мектеп директорунун катчысы", "Тракторчу", "Мугалим", "Бригадир"], "a": 0}, {"q": "Асылбек атасынын сунушун кандай кабыл алды?", "o": ["«Кол жоолугу болот экемин да!» деп баш тартты", "Кубанып макул болду", "Унчукпай кетти", "Ойлонуп туруп макул болду"], "a": 0}]}]}, {"t": "match", "i": "think", "h": "Фразеологизмдерди мааниси менен жупташтыргыла. <small style=\"color:#7a6a60;font-weight:400\">(107-бет)</small>", "pairs": [["ат тезегин кургатпайт", "тынымсыз келип-кетип турат"], ["жылан сыйпагандай", "заматта жок болду"], ["жону жука", "кедей, алсыз"], ["аталадай былжырап", "алсыз, бош"], ["куурай башын сындырып көргөн жан эмес", "эч эмгек кылбаган"], ["тили буудай куурат", "сөзгө чечен"], ["кол жоолугу болуу", "бирөөнүн кызматчысы болуу"], ["үч уктаса түшүнө кирбеген", "эч күтүлбөгөн"]]}, {"t": "sort", "i": "think", "h": "Повесттеги каармандардын «адам болуу» түшүнүгүн бөлгүлө. <small style=\"color:#7a6a60;font-weight:400\">(102-бет)</small>", "cols": ["Асылбектин түшүнүгүндө", "Атасынын түшүнүгүндө"], "items": [["Чотур — тракторист, бардык жумуш колунан келген уста", 0], ["Орко — колхоздун бригадири, жумуштун көзүн билген иштерман", 0], ["Базыл — ардагер, жерге мээнетин төккөн баба дыйкан", 0], ["Бердике — сельсоветтин председатели, элдин эсебинен семирген", 1], ["Бүргө — эсепчи, жетим-жесирлерге деген акчадан кымырган", 1], ["Мыкты — атасынын атына жамынып өзүн башкалардан өйдө көргөн бекерчи", 1]]}, {"t": "mc", "i": "think", "h": "Чыгарманын мазмунуна карата тесттик тапшырмаларды аткаргыла. <small style=\"color:#7a6a60;font-weight:400\">(109-бет)</small>", "qs": [{"q": "1. Окууга өтпөй келген Асылбек убактысын кандайча өткөрө баштады?", "o": ["эгин жыйнап, картошка чогултушту", "кесип үйрөндү", "атка минип, бекерчиликте күн өткөрдү", "үйүн оңдоп, чарбасын карады"], "a": 0}, {"q": "2. Атасы уулуна кандай жумуштарды издеди?", "o": ["сельсоветтин секретары, мектеп директорунун секретары", "чөп, эгин жана картошка жыйноочу", "трактор, комбайн айдоочу", "бригадир, токойчу, финагент"], "a": 0}, {"q": "3. Асылбекке атасынын жасаган аракеттери эмне үчүн жакпады?", "o": ["Атасынын чоңдорго кошомат кылып, басынганы", "Ал эч жерде иштегиси келген жок", "Асылбек ал жумуштарга али даяр эмес", "Асылбекке кеңешпей чечкени"], "a": 0}, {"q": "4. Эмне үчүн Асылбек күздүк айдаган Чотурдун тракторуна минди?", "o": ["Элге кошулуп эмгектенип, пайдалуу адам болгусу келди", "Чотурдун карындашы Дилде сулууга жакын болгусу келди", "Мыктыдай бекерчи болуп, ары-бери баскандан тажады", "Атасы тапкан кызматтарга баргысы келбеди"], "a": 0}, {"q": "5. Асылбек атасы тапкан тери чогултуучу жумушуна эмнеге барды?", "o": ["Атасынын көңүлүн калтыргысы келген жок", "Мындай жумуш Асылбекке абдан жаккан", "Кышында жумуш жок болгондуктан иштеп турайын деди", "Тери чогултуучу комбинатта жаштар көп иштеген"], "a": 0}, {"q": "6. Асылбек эмне үчүн атасынын берген сумкесин сууга ыргытат?", "o": ["Атасынын турмушка болгон көз караштары эски сумке сыяктуу эле ага туура келбей турганын түшүндү", "Сумке ага салмактуу сезилди", "Тегине, кызматына карата кошомат кылган атасынын эски буюму", "Асылбек өзү каалаган кесипке, өз жолуна багыт алды"], "a": 0}]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(108-бет)</small>", "qs": ["1. Асылбек эмне үчүн туулган жерин сагынып, суктанып келди?", "2. Уулун ата-энеси кандай тосуп алышты? Асылбекке өзү жашаган үй кандай көрүндү?", "3. Атасы уулун чоң окууга кантип жөнөткөн? Окууга өтпөй калышына кимдерди күнөөлүү деп эсептейт?", "4. Асылбек эмне үчүн Чотурдун прицебине олтурду?", "5. Орко бригадир Асылбектин кара жумушка чыкканына эмнеге таң калды?", "6. Ата-баланын ортосундагы карама-каршылык эмне себептен чыкты? Асылбек атасы тапкан жумушка эмне үчүн барбай койду? Ал туура кылды деп ойлойсуңарбы?", "7. Адам болууну Асылбек жана атасы ар кандай түшүнөт. Сенин идеалыңа кимиси туура келет? Эмне үчүн?"], "rows": 3, "ex": "1. Анткени шаарда жүрүп, туулган жердин сулуулугун, ата-энесин сагынган.<br>2. Ата-энеси сүйүнүп тосуп алды; үй жапыз, эски, ичи куңурт көрүндү.<br>3. Чоң үмүт менен жөнөткөн; мугалимдерди, таанышы жокторду күнөөлөйт.<br>4. Элге кошулуп, эмгектенип, пайдалуу адам болгусу келди.<br>5. Анткени окуган бала кара жумушка чыгат деп күткөн эмес.<br>6. Атасы мансап, жеңил кызмат каалайт; уул ак эмгекти каалайт. Асылбек туура кылды — өз жолун тандады.<br>7. Асылбектики: адам болуу — эл менен бирге ак эмгек кылуу, чыныгы кесип ээси болуу."}, {"t": "write", "i": "write", "h": "«Адам болуу деген эмне? Аны сен кандай түшүнөсүң?» деген темада өз оюңарды жазгыла. <small style=\"color:#7a6a60;font-weight:400\">(98-бет)</small>", "rows": 6, "min": 40, "ph": "Менин оюмча, адам болуу — …", "sample": "Менин оюмча, адам болуу — мансап же байлык эмес. Адам болуу — ак эмгек кылуу, элге пайда келтирүү, ата-энени, улууларды урматтоо жана өз сөзүнө турууу. Асылбек сыяктуу өз жолун тандап, аны адал жүрүп өтүү керек."}, {"t": "box", "i": "think", "h": "Кызыктуу фактылар", "c": "y", "html": "• Төлөгөн Касымбеков чыгаан жазуучу гана эмес, ар тараптуу инсан катары да кызыгууну жаратат.<br>• Жазуучу аттын мыктысын да жогору баалаган. Аксыдан бир айтылуу жоргону издетип жүрүп, сатып алып, айылга барганда минип калчу эле дешет. Ал жоргосу убагында көп ат оюндарына катышып, байге алып берген учурлары да болгон экен.<br>• Жазуучунун дагы бир өнөрү — комуз черткенди билген. Көпчүлүктө эмес, өзүнчө, үйдө болгондо эрмектеп комуз чертип, ой-кыялы алып учуп, убакыт өткөргөндү жакшы көргөн. Төлөгөн Касымбеков кайсы жерге барбасын шахмат ойноп отуруп сүйлөшкөндү жакшы көрчү экен."}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t3l15", "title": "Камчы Жунусов. «Ак-Буура»", "ky": "Балдар акыны (1915–1988). Ак-Буура дарыясы", "gram": "<b>Салыштыруу</b> ырда: <i>«ок жыландай окторулуп», «сайга батпай», «асти жатпай»</i>. <b>Эпитеттер</b>: <i>ак буудай, асыл буудай, муздак жел</i>. Акын дарыянын кыймылын жыланга, толкунун майрамга салыштырат.", "lex": "балдар акыны, адептүүлүк, тунгуч, которгон, негизинен, киргилденип, жар, асти, күрпүлдөө, агым, өркөчтөнгөн, ээленүү, көнгөн, шарпылда, шаркыра, сыр, окторулуп, ойкуштап, мөңкү, өнүү, барктоо, амал, ачыркан, ташы, чарпыл, артыл", "tasks": [{"t": "vocab", "i": "think", "h": "Сөздүк. Басканда угулат (🔊). <small style=\"color:#7a6a60;font-weight:400\">(112-бет)</small>", "w": [["тунгуч", "биринчи", "первый", "1️⃣"], ["адептүүлүк", "тарбиялуулук", "воспитанность", "🙏"], ["которгон", "башка тилге өткөргөн", "перевёл", "🔁"], ["негизинен", "көбүнчө", "в основном", "📌"], ["киргилденүү", "ылайланып күңүрт болуу", "мутнеть", "🌫️"], ["жар", "тик жээк", "обрыв, берег", "🏞️"], ["асти", "такыр, эч", "вовсе, никак", "🚫"], ["күрпүлдөө", "катуу агып шаркыроо", "бурлить", "🌊"], ["агым", "суунун агышы", "течение", "➡️"], ["өркөчтөнүү", "толкундап көтөрүлүү", "вздыматься", "🐫"], ["ээленүү", "ээ болуп жырталаңдоо", "буйствовать", "💥"], ["көнгөн", "үйрөнгөн", "привычный", "✔️"], ["шарпылдоо", "шарп-шарп үн чыгаруу", "плескаться", "💦"], ["шаркыроо", "катуу агып үн чыгаруу", "шуметь (о реке)", "🔊"], ["сыр", "жашыруун нерсе", "тайна", "🤫"], ["окторулуу", "катуу атылып чыгуу", "вырываться", "🚀"], ["ойкуштоо", "ойноп, оолжуп агуу", "играть, резвиться", "🎉"], ["мөңкү", "кыймылдуу, тынчсыз", "беспокойный", "🌀"], ["өнүү", "өсүү", "расти", "🌱"], ["барктоо", "баалоо", "ценить", "💎"], ["амал", "айла, ыкма", "способ", "🛠️"], ["ачыркануу", "суусап ачка болуу", "жаждать", "🥵"], ["ташуу", "ашып-ташып агуу", "разливаться", "🌊"], ["чарпылуу", "чарпып, чачырап агуу", "бурлить, плескаться", "💧"], ["артылуу", "ашып өтүү", "перехлёстывать", "⤴️"]]}, {"t": "read", "i": "read", "h": "Акын жөнүндө окугула. <small style=\"color:#7a6a60;font-weight:400\">(111-бет)</small>", "title": "Камчы Жунусов (1915–1988)", "text": ["Камчы Жунусов 1915-жылы 10-августта Ноокат районундагы Беш-Бадам айылында туулган. 1930-жылдан тартып балдар үйүндө тарбияланган. 1945-жылдан баштап ырлары, аңгемелери республикалык гезит-журналдарга басылып турган. «Менин жерим» аттуу тунгуч жыйнагы 1950-жылы жарыкка чыгат. 1957-жылы «Жыпар» повести, 1960-жылы балдарга арналган (балдар үчүн) «Мен» аттуу аңгемелер жыйнагы жарык көргөн. Акындын ырлары орус, татар, якут, өзбек, тажик, украин тилдерине которулган.", "К. Жунусов татар акындары М. Жалил менен Г. Тукайдын тандалган чыгармаларын, А. Навоинин, орус акындары А. С. Пушкиндин, Н. А. Некрасовдун ырларын кыргыз тилине которгон.", "Камчы Жунусовдун чыгармалары негизинен (көпчүлүгү) Ата Мекен темасына арналган. 1958-жылы «Ак-Буура» ырлар жыйнагы басылып чыккан.", "Ак-Буура дарыясы — Кара-Суу жана Ноокат районунун аймактары, Ош шаары аркылуу агып өтөт. Узундугу 136 км, аянты 2540 км². Ак-Буура дарыясы Алай кырка тоосунун түндүк капталынан башталып, Ак-Буура капчыгайы аркылуу агат. Жогорку агымы Кичи Алай, ортоңкусу Турук деп аталат. Ак-Буура суусу негизинен сугатка пайдаланылат. Ош шаарын суу менен камсыз кылат. Дарыянын боюнда Төлөйкөн, Турук, Папан жана башка кыштактар бар."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "К. Жунусов качан, кайда туулган?", "o": ["1915-ж., Ноокат, Беш-Бадам айылы", "1925-ж., Алай-Куу", "1931-ж., Аксы", "1940-ж., Төлөйкөн"], "a": 0}, {"q": "Тунгуч жыйнагы?", "o": ["«Менин жерим» (1950)", "«Ак-Буура» (1958)", "«Жыпар» (1957)", "«Мен» (1960)"], "a": 0}, {"q": "Ак-Буура дарыясынын узундугу?", "o": ["136 км", "2540 км", "50 км", "300 км"], "a": 0}, {"q": "Ак-Буура кайсы шаарды суу менен камсыз кылат?", "o": ["Ош", "Бишкек", "Жалал-Абад", "Талас"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "Ырды окугула. <small style=\"color:#7a6a60;font-weight:400\">(112-бет)</small>", "title": "Ак-Буура", "text": ["Жаз болсо киргилденип сайга батпай, Чамынып жар көчүрүп асти жатпай. Күүлдөп күү чыгарып агымыңдан, Күрпүлдөп турганыңды кантем айтпай. Ак-Буура, Сен Ак-Буура, өркөчтөнгөн, Ээленип жаралгандан көптү көргөн, Ээленип ээ-жаа бербей агып көнгөн.", "Шаркырап эчен түрдүү сыр чыгарып, Шарпылдап жээкке согуп ыр чыгарып. Толгонуп ок жыландай окторулуп, Ойкуштап акканың ай, үн чыгарып Мейли түн, Мейли күндүз, Ар убакта, Ак-Буура, айланайын, дымып акпа! Ак-Буура, деме улам, тынчып жатпа!", "Мөңкүсөң эчен канал сууга толуп, Бак бүрдөйт, талаа гүлдөйт, эгин өнүп. Башкарып баба дыйкан сени барктап Ак-Буура, Башынан адис болгон ишке көнүп. Ак буудай, Асыл буудай, амал алып, Ак пахта ачыркана сууга канып, Ак пахта асылын көр ана барып.", "Ак-Буура, сен ташысаң, түшүм ташат, Ар тамчың жанга кубат, суусун басат. Турмушта суусуз жашоо болбосу чын, Аңкыган муздак желиң уйкумду ачат. Ак-Буура! Сен толкусаң Менде талант Чарпыла толкунуңдан күчөп барат, Артыла андан бетер миң салтанат."], "by": "Камчы Жунусов", "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Акын дарыянын кыймылын эмнеге салыштырат?", "o": ["Ок жыланга", "Бүркүткө", "Шамалга", "Жылдызга"], "a": 0}, {"q": "Ак-Буура ташыганда эмне болот?", "o": ["Түшүм ташат, бак бүрдөйт, эгин өнөт", "Айыл кургайт", "Эл качат", "Жол бузулат"], "a": 0}, {"q": "Акын дарыяны качан сүрөттөйт?", "o": ["Жазда", "Кышта", "Күздө", "Түндө"], "a": 0}]}]}, {"t": "gap", "i": "write", "h": "Ыр саптарын толуктагыла.", "items": ["Жаз болсо киргилденип [сайга] батпай, Чамынып жар көчүрүп [асти] жатпай.", "Толгонуп ок [жыландай] окторулуп.", "Ак-Буура, сен ташысаң, [түшүм] ташат.", "Турмушта [суусуз] жашоо болбосу чын."]}, {"t": "match", "i": "think", "h": "Сөздөрдү мааниси менен жупташтыргыла.", "pairs": [["мөңкүү", "кыймылдоо, толкуу"], ["барктоо", "баалоо"], ["ачыркануу", "суусоо"], ["ташуу", "ашып агуу"], ["артылуу", "ашып өтүү"], ["өркөчтөнүү", "толкундоо"]]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(113-бет)</small>", "qs": ["1. Дарыянын жазгы көрүнүшү силерге кандай таасир берди? Ак-Бууранын сүрөттөлүшүн белгиленген сөздөр аркылуу тапкыла.", "2. Акын дарыянын кыймылын эмнелерге салыштырат?", "3. Дарыянын кандай агышын акын жагат?", "4. Эмне үчүн ишке адис болгон баба дыйкан суунун ар бир тамчысын баалайт, барк иятын баяндаган экспонаттар коюлган залдардан турган кызыктуу музей да тоонун ичинде жайгашкан. XVI кылымга чейин Сулайман Тоо Баара-Кух деп аталчу. Сулайман тоонун аталышы Сулайман пайгамбардын ысымы менен байланыштуу. Сулайман Тоодо Бабурдун үйү жайгашкан. Аны Сулайман Тоо мечити деп атап коюшат. Бабур Захиреддин Мухаммед — Улуу Моголдор династиясынын негиз салуучусу, акын жана ойчул. Ал белгилүү Амир Темирдин урпагы болгон жана 1483–1530-жылдары жашаган. 11 жашында атасынын ордуна Ферғананын ханы болуп дайындалган. Кийин Түндүк Индияны басып алып, анда Улуу Моголдор өлкөсүн негиздеген."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "С. Жусуев качан, кайда туулган?", "o": ["1925-ж., Кара-Кулжа, Кызыл-Жар", "1915-ж., Ноокат", "1931-ж., Аксы", "1959-ж., Фрунзе"], "a": 0}, {"q": "Согушта акын ким болуп кызмат өткөн?", "o": ["Байланышчы", "Учкуч", "Дарыгер", "Тракторчу"], "a": 0}, {"q": "Мамлекеттик сыйлыкты кайсы чыгармасы үчүн алган?", "o": ["«Курманжан датка» (ыр менен жазылган роман)", "«Эмгек күүсү»", "«Сулайман Тоо»", "«Ак-Буура»"], "a": 0}, {"q": "Сулайман Тоо XVI кылымга чейин кандай аталган?", "o": ["Баара-Кух", "Ала-Тоо", "Тахти-Сулайман", "Ош-Тоо"], "a": 0}, {"q": "Сулайман Тоодо кимдин үйү жайгашкан?", "o": ["Бабурдун", "Манастын", "Курманжан датканын", "Амир Темирдин"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "Ырды окугула. <small style=\"color:#7a6a60;font-weight:400\">(117-бет)</small>", "title": "Сулайман Тоо", "text": ["Сулайман Тоо — Ош менен тагдырлаш тоо, Таалайлаш тоо, таптакыр айрылбас тоо. Ариетин өзүндөй бийик сактап, Ар-намысты Ошунан алдырбас ТОО", "Сулайман Тоо — Ош менен тамырлаш тоо, Сырдаш, курдаш, ынак тоо, кадырлаш тоо. Эзелтеден кебелбей бекем туруп, Эл көздөгөн максаттан жаңылбас тоо.", "Сулайман Тоо Ошко ыктап, шерик турат, Ар жактан эл сыйынып келип турат. Адамдардын аңсаган тилектерин Ыймандуу тоо, ыйык тоо берип турат.", "Омок болуп Ошуна уланган тоо, Ош кубанса, оштонуп кубанган тоо. Оштун сөөлөт, сыймыгы, мактанычы Ооматтуу тоо, сулуу тоо — Сулайман Тоо!"], "by": "Сооронбай Жусуев", "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Сулайман Тоо кайсы шаар менен тагдырлаш?", "o": ["Ош", "Бишкек", "Жалал-Абад", "Талас"], "a": 0}, {"q": "Эл тоого эмне үчүн келет?", "o": ["Сыйынып, тилек тилөө үчүн", "Соода кылуу үчүн", "Спорт үчүн", "Балык уулоо үчүн"], "a": 0}]}]}, {"t": "match", "i": "think", "h": "Синоним сөздөрдү жупташтыргыла. <small style=\"color:#7a6a60;font-weight:400\">(118-бет)</small>", "pairs": [["ынак", "курдаш"], ["сырдаш", "жакын дос"], ["сөөлөтү", "сыймыгы"], ["мактанычы", "сыймыгы, намысы"], ["таалайлаш", "бактылаш"], ["омок", "таяныч"]]}, {"t": "gap", "i": "write", "h": "Ыр саптарын толуктагыла.", "items": ["Сулайман Тоо — Ош менен [тагдырлаш] тоо.", "Сырдаш, [курдаш], ынак тоо, кадырлаш тоо.", "Оштун сөөлөт, [сыймыгы], мактанычы Ооматтуу тоо, сулуу тоо — Сулайман Тоо!"]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(118-бет)</small>", "qs": ["1. Сулайман Тоосунун Ош шаары менен байланышын кайсы сөздөр көрсөтүп турат? Тоо ариеттүү, ар-намыстуу болушу мүмкүнбү?", "2. Шаар тургундарынын жашоосунда Сулайман Тоо кандайча сырдаш, курдаш болгон деп ойлойсуңар?", "3. Ошко ыктап шерик болгон тоого эмне үчүн ар тараптан эл келип сыйынышат?", "4. Акын тоону адамга курдаш, сырдаш катары көрүп, шаардагыларга таяныч болуп, алар кубанса кошо кубанган жандуудай элестеткени туурабы?", "5. Силер Сулайман Тоого бардыңар беле? Тоо силерге кандай сезимдерди калтырды?", "6. Ак-Буура менен Сулайман Тоонун айырмачылыгын, жалпылыгын таап, Венндин диаграммасын түзгүлө."], "rows": 3, "ex": "1. Тагдырлаш, таалайлаш, тамырлаш, айрылбас; акын тоону адамга окшотуп сүрөттөйт (жандандыруу).<br>2. Тоо шаардын дайыма жанында, элдин кубанычын, кайгысын көргөн.<br>3. Анткени ыйык жер, Сулайман пайгамбардын ысымы менен байланыштуу.<br>4. Ооба, бул — жандандыруу (олицетворение) ыкмасы.<br>5. (Өз жообуңар.)<br>6. Жалпылыгы: экөө тең Оштун сыймыгы, табият кереметтери, ырга салынган. Айырмасы: бири — дарыя, кыймылдуу; экинчиси — тоо, бекем, ыйык."}, {"t": "box", "i": "think", "h": "Кызыктуу фактылар", "c": "y", "html": "• Кыргызстанда ислам дини таралгандан бери бул тоо Сулайман пайгамбардын атын алып жүргөн ыйык жерлердин бири. Азыркы күндөргө чейин Азияда экинчи Мекке аталып, зыяратчылар үзбөй келип турушат.<br>• Байыркы замандан тартып орто кылымдарга чейин сүрөтчүлөрдүн колу менен тартылган тоодогу петроглифтер жана аскага тартылган сүрөттөр Фергана өрөөнүнүн тарыхы, маданияты тууралуу көп маалыматтарды берип турат."}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t3l17", "title": "Кыялбек Урманбетов. «Бишкегим»", "ky": "Кыргыз Республикасынын эл акыны. Борбор шаар жөнүндө ыр", "gram": "<b>Гимн</b> — салтанаттуу ыр. К. Урманбетовдун «Бишкегим» ыры Кыргыз Республикасынын борборунун гимни катары кабыл алынган. <b>Кайырма</b> — ырдын кайталанган бөлүгү. <b>Салыштыруу</b>: <i>«ак жолтойлуу үйдөй», «достук шаарындай», «баатыр эне окшоп»</i>.", "lex": "кабарчы, обондуу ырлар, мюзикл, баалуулуктар, конгондо, айлануу, сүйбөй коюу, жагыласың, элесиң, эске келесиң, орнодуң, ак жолтойлуу, арга барбы, сагынуу, тагдыр, ыйыгың", "tasks": [{"t": "vocab", "i": "think", "h": "Сөздүк. Басканда угулат (🔊). <small style=\"color:#7a6a60;font-weight:400\">(121-бет)</small>", "w": [["кабарчы", "корреспондент", "корреспондент", "📰"], ["обондуу ыр", "обону бар, ырдалган ыр", "песня", "🎵"], ["мюзикл", "музыкалык спектакль", "мюзикл", "🎭"], ["баалуулук", "нарктуу нерсе", "ценность", "💎"], ["конуу", "токтоп жайгашуу", "осесть, поселиться", "🏕️"], ["айлануу", "тегеренүү", "кружиться", "🔄"], ["ак жолтойлуу", "ырыскылуу, бактылуу", "счастливый, благодатный", "🍀"], ["арга барбы", "башка айла барбы", "есть ли выход", "❓"], ["жагылуу", "жагымдуу болуу", "нравиться", "😊"], ["элес", "көрүнүш, образ", "образ", "🖼️"], ["эске келүү", "эс
