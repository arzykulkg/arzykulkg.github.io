рөлсө Каныш же Молдожаш деп атоону, мылтыгын терип алып сактоону, өзүн эстен чыгарбоону.<br>5. Ал «бир эчкинин зарпынан» деп күнөөнү толук моюнга албайт, бирок өкүнөт.<br>6. Мыкты: мерген, эр жүрөк, элин багат, мээримдүү жар. Начар: кайберендерди ашыкча кырган, жалынганга кулак салбаган.<br>7. Жок, адам табият менен таттуу мамиледе жашоосу керек — Молдожаштын жолу ушуну көрсөтөт."}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t1l5", "title": "«Кожожаш» эпосунун идеялык мазмуну жана образдары", "ky": "Талдоо. Тотемизм жана анимизм", "gram": "<b>Тотемизм</b> (гр. — <i>башталыш, негиз</i>) — адамзат өнүгүүсүнүн алгачкы баскычындагы элдин мифологиялык түшүнүгү: адамдын табияты жана жашоо-шарты кайсы бир жаныбар менен байланыштуу деп эсептешкен. <b>Анимизм</b> (лат. — <i>жан, рух, адам</i>) — байыркы адамдардын жан-жаныбарларды, өсүмдүктөрдү, буюм-теримдерди киши сыяктуу ойлоо, сезүү касиетине ээ деп түшүнүшү.", "lex": "анимисттик, тотемисттик, сырдуу күч, чечүүчү маани, кемчилик, мээримдүү, карама-каршылык, трагедия, тил табышуу", "tasks": [{"t": "vocab", "i": "think", "h": "Жаңы сөздөр. Басканда угулат (🔊).", "w": [["тотемизм", "ыйык жаныбарга ишенүү", "тотемизм", "🦌"], ["анимизм", "бардык нерседе жан бар деген ишеним", "анимизм", "🌬️"], ["мифологиялык", "уламышка байланышкан", "мифологический", "🐉"], ["трагедия", "кайгылуу окуя", "трагедия", "🎭"], ["карама-каршылык", "бири-бирине каршы туруу", "противоречие", "⚡"], ["мээримдүү", "боорукер, жылуу", "милосердный", "💗"], ["кемчилик", "жетишпеген жагы", "недостаток", "➖"], ["сырдуу", "табышмактуу", "таинственный", "🔮"], ["текеберлик", "менменсинүү", "высокомерие", "👑"], ["тил табышуу", "макулдашуу, ынтымак", "найти общий язык", "🤝"]]}, {"t": "read", "i": "read", "h": "Текстти окугула. <small style=\"color:#7a6a60;font-weight:400\">(15-бет)</small>", "title": "«Кожожаш» эпосунун идеялык мазмуну жана образдары", "text": ["Эпос кыргыз элинин анимисттик жана тотемисттик түшүнүктөрүн камтып, тапсыз коомдогу адамдын жаратылыштын сырдуу күчтөрүнө болгон мамилесин ачып берет. Табият күчтөрү менен күрөшүп, ага жигердүү каршылык көрсөткөн каарман — Кожожаш мерген болуп эсептелет. Анын жашоосунда мергенчилик кесиби чечүүчү мааниге ээ болгон. Мергенчилик кесип аркылуу анын эң мыкты сапаттары менен бирге кемчиликтери да ачылат.", "Кожожаш кайраттуу жана аёосуз мерген гана эмес, ал боорукер уул жана мээримдүү жар катары да сүрөттөлгөн. Мергендин бул сапаттары анын Сур эчки менен айыгышкан карама-каршылыгынын трагедиялуу учурунда терең ачылат. Ал Кожожаш кайберендин артынан жөө кууп жетем деген антына бекем турат. Бирок жаратылыштын айбаттуу күчтөрүнүн алдында алсыз болуп, аскада калат. Сурэчкинин каргышынан улам, өлүм менен бетме-бет калганына карабастан Кожожаш ата-энесин, сүйгөн жары Зулайканы аяп, аларга керээз калтырат.", "Бул трагедияда Сур эчкинин орду абдан маанилүү. Ал элдик түшүнүк боюнча кайберендердин ээси катары берилет, адамча ойлойт жана сүйлөйт. Сур эчки уруулук доордун тотемдик аң сезимин чагылдырат. Адам баласын анын гумансыз аракеттери үчүн жазалап, мергендин трагедиялуу өлүмү аркылуу жеңишке жетишет. Бул жаратылыштын эскертүүсү жана татыктуу жазалоосу катары кабыл алынат.", "Бирок оозеки чыгармачылыкта адам канчалык трагедияга кабылса да, анын жакшылыкка болгон үмүт-тилеги ишке ашат деген идея ар дайым жашап келген. Ошондуктан эпосто Кожожаштын уулу Молдожаштын табият менен тил табышып, жеңишке жетишүүсү адамдын жакшылыкка болгон умтулуусун далилдейт."], "qs": [{"t": "mcm", "i": "think", "h": "Туура жоопторду тандагыла.", "qs": [{"q": "Эпосто кыргыз элинин кандай түшүнүктөрү чагылдырылган? (бир нече жооп)", "o": ["Анимисттик", "Тотемисттик", "Диний-исламдык", "Илимий"], "a": [0, 1]}, {"q": "Кожожаштын кандай сапаттары бар? (бир нече жооп)", "o": ["Кайраттуу мерген", "Боорукер уул", "Мээримдүү жар", "Коркок"], "a": [0, 1, 2]}, {"q": "Эпостун башкы идеясы?", "o": ["Адам табият менен тил табышып жашоосу керек", "Адам табиятты толук багындырышы керек", мдук ишмери болгон. 1937-жылы жалган жалаа менен репрессияга учурап, үй-бүлөсү көп убакыт бою ал жөнүндө так маалымат алышкан эмес. Кайра куруу жылдарында гана Төрөкул атылып, башка репрессияланган адамдар менен Чоң-Ташка коюлганы маалым болду. Бул жер Ч. Айтматовдун сунушу менен Ата-Бейит аталды. Энеси, Нагима Хамзаевна, өз мезгилинин билимдүү аялдарынан болгон.", "1935–1937-жылдары атасы Москвада кызыл профессура институтунда окуп жатканда Чыңгыз орус мектебинде окуйт. Төрөкул камаларын билип, үй-бүлөсүн Шекерге жөнөтөт. Ал жерде Чыңгыз кыргыз мектебинде окуусун улантат. Шекерде чоң эжеси Айымкандын, эжеси Карагыздын жомокторун, насаат сөздөрүн угуп чоңоёт.", "Чыңгыз согуштан кийин зоотехниктик кесип алат, бирок адабиятка кызыгуусу аны А. М. Горький атындагы адабият институтуна алып келет. Бул жерде окуп жүрүп «Бетме-Бет», «Жамийла» повесттерин жазды. «Жамийла» повести аны дүйнө жүзүнө таанытты. Андан кийин жазуучунун ар бир чыгармасы дүйнөлүк окурмандын көңүлүн буруп келди.", "Жазуучу чыгармачылыгында өзү жашаган мезгилдеги турмушту, совет жылдарындагы жана ааламдашуу доорунун көйгөйлөрүн чагылдырат. Каармандары — коомдук турмуштун алдыңкы катарында турган активдүү позициядагы адамдар.", "«Биринчи мугалим» повестинде совет мезгилинин алгачкы жылдарына кайрылган. Чыгарманын каарманы Дүйшөн комсомолдун мүчөсү, өзү чала сабат болсо да, тоо арасындагы кыргыз балдарын окутуу үчүн көп кыйынчылыктарды жеңип чыккан.", "Чыңгыз Айтматов 2008-жылдын 10-июнунда дүйнөдөн кайткан, жазуучу бүткүл кыргызстандыктар үчүн ыйык болгон Ата-Бейит мемориалдык комплексине коюлган."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Ч. Айтматов качан жана кайда туулган?", "o": ["1928-ж. 12-декабрь, Шекер айылы", "1960-ж., Кызыл-Адыр", "1928-ж., Бишкек", "1940-ж., Төлөйкөн"], "a": 0}, {"q": "Жазуучунун атасы ким болгон?", "o": ["Төрөкул — партиялык жана коомдук ишмер", "Молдо", "Мерген", "Акын"], "a": 0}, {"q": "Ч. Айтматовду дүйнө жүзүнө тааныткан повесть?", 924-жылы болгон. Ооба, мен жакшы билем, так ошол жылы… Анда азыркы биздин айылыбыз турган жерде он-он беш түтүн жатакчылар болор эле. Анда мен он төрттөгү жетим кыз аталаш туугандардын колунда жүргөм. Ошол жылы күздө, малдуу-жандуулар кыштоого көчүп өткөндөн кийин, биздин айылга мен башта көрбөгөн, аскер шинель кийген чоочун жигит келди. Элден, жолдон оолак турган тоо боорундагы кичинекей кыргыз айылы үчүн бул өзүнчө бир чоң окуя болду. А дегенде аны — аскер башчылыкта жүрүп эми айылга чоң болуп келиптир дешти, кийин туруп-жок, кокуй, бул баягы эле темир жолго тентип кеткен Таштанбектин уулу Дүйшөн деген экен, өкмөт аны солдаттан бошотуп, мугалим кылып жиберген имиш, мектеп ачып, бала окутат имиш дешти.", "Мектеп, окуу деген сөздөрдүн өздөрү эле биз үчүн анда анча да тааныш эмес, жаңы сөздөр. Бул айтылгандар чынбы, жалганбы, эмне болот, кандай болот деген арада, айыл ортосундагы дөбөчөгө эл жыйналып келсин деген кабар айтылып калды. «Ой, шумдугуң кур, бул дагы кандай жыйналыш эле!» — деп, сүйлөгөн акем жаман атына минип, бастырып кеткенде, артынан ээрчип, башка балдар менен кошо мен да жүгүрүп бардым. Беш-алтоо аттуусу, калганы жөө турган кичинекей топтун ортосунда көөнө кара шинель кийген, кубакай жигит сүйлөп жаткан экен.", "— Эй, балам, — деди ал аптыга сүйлөп, балдырап. — Бул сенин ата-тегиңди го билебиз: бизге окшогон кара таман. Анан сен кайдан жүрүп молдо болдуң?", "Дүйшөн артына кайрыла салып, жооп берди: — Мен молдо эмесмин, аксакал. Мен комсомолмун. Азыркы убакытта кат тааныгандарды мугалим дешет. Мен аскерде жүрүп кат таанып келдим. Менин молдолук жайым ошондой.", "— Эмесе комсомол мени мугалимдикке даярдап, бала окуткун деп жиберди. Мектепти силердин жардамыңар менен тээ төбөдө ээн турган жаман тамды оңдоп ачалы деген такилик бар. Кандай дейсиңер, акылыңарды айткыла?", "— Аныңды коё тур, окуунун бизге кереги эмне? — деп бер жактагылар да жабыла козголо берди. — Биз жер кетмендеп, жер менен эле оокат кылган дыйканбыз. А биздин балдар окуу окуп, эл сурап, өкмөт болот беле? Кой, айланайын, башыбызды катырба?..", "— Силер балдарды окутууга каршысыңарбы? — деп сурады. — А каршы болгондо сен зордойсуңбу? Азыр элдин өз эрки, боштондукка чыкканбыз! — деди нары жактан бир үн.", "Шинелинин илгичтерин жула бере жаздап, Дүйшөн төш чөнтөгүнүн ичинен төрт бүктөлгөн кагазды сууруп чыкты да, аны колуна көрсөтө кармай кыйкырды: — Силерге жер, суу бөлүп берген кеңеш өкмөтүнүн бала окутсун деп мөөрүн баскан ушул кагазына каршы чыгасыңарбы? Кана, кеңеш өкмөтүнүн мыйзамына ким каршы, ким? — Анын «ким» — деп кыйкырган сөзү бейпил жаткан күзгү абаны атылган октой жиреп, чак деп бөксөдөгү аска ташка тийгенсиди. Эч ким унчукпай баары тең тымтырс болушту. — Силер кедейсиңер, — деди Дүйшөн чарчагандай үнүн басаңдата сүйлөп, — биз өмүр бою эзилип, тепсенди болуп келген элбиз. Өкмөт бизди эми көзү ачылсын, кат таанып, билимге жетилсин деп жатат. Мына, ошондуктан балдарды окутушубуз керек!..", "Жеңеси жетим кызга билимдин кереги жок деп эсептеп, Алтынайды мектепке бергиси келбейт. Бирок күйөөсү үйдө ким кожоюн экенин көрсөтүш үчүн аялына каршы болуп, кызга окууга уруксат берет."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Окуя кайсы жылы болгон?", "o": ["1924", "1937", "1917", "1945"], "a": 0}, {"q": "Алтынай канча жашта болгон?", "o": ["Он төрттө", "Он экиде", "Сегизде", "Он сегизде"], "a": 0}, {"q": "Дүйшөн кимдин уулу?", "o": ["Таштанбектин", "Төрөкулдун", "Сатымкулдун", "Картаңбайдын"], "a": 0}, {"q": "Дүйшөн кат таанууну кайдан үйрөнгөн?", "o": ["Аскерде", "Медреседе", "Шаарда", "Молдодон"], "a": 0}, {"q": "Дүйшөн мектепти кайда ачууну сунуштады?", "o": ["Төбөдөгү ээн тамда", "Айылдын ортосунда", "Байдын үйүндө", "Мечитте"], "a": 0}]}]}, {"t": "tf", "i": "think", "h": "Туура же ката экенин белгилегиле.", "qs": [{"s": "Айылда он-он беш түтүн жатакчы жашаган.", "a": true}, {"s": "Дүйшөн өзүн молдомун деп айтты.", "a": false, "fix": "Ал: «Мен молдо эмесмин, мен комсомолмун» деди."}, {"s": "Айылдыктар башында балдарды окутууга каршы болушту.", "a": true}, {"s": "Дүйшөн кеңеш өкмөтүнүн мөөр басылган кагазын көрсөттү.", "a": true}, {"s": "Алтынайдын жеңеси аны окууга жиберүүнү каалаган.", "a": false, "fix": "Жеңеси каршы болгон, күйөөсү уруксат берген."}]}, {"t": "match", "i": "think", "h": "Синоним сөздөрдү тексттен тапкыла, жупташтыргыла. <small style=\"color:#7a6a60;font-weight:400\">(33-бет)</small>", "pairs": [["сунуш", "такилик"], ["алыс", "оолак"], ["бай", "малдуу-жандуу"], ["эркиндик", "боштондук"], ["бөлөк", "өзүнчө"], ["кедей", "кара таман"]]}, {"t": "gap", "i": "write", "h": "Бош орундарды толтургула.", "items": ["Азыркы убакытта кат тааныгандарды [мугалим] дешет.", "Мен аскерде жүрүп [кат] таанып келдим.", "Силер [кедейсиңер], биз өмүр бою эзилип, тепсенди болуп келген элбиз."]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(32-бет)</small>", "qs": ["1. Чыгармада сүрөттөлгөн доорго мүнөздөмө бергиле.", "2. Дүйшөн айылга кандай максат менен келди?", "3. Калктын сабатын жоюуга совет бийлиги кандай маани берген?", "4. Дүйшөндүн демилгесин адамдар эмне үчүн колдогон жок?", "5. Алтынай ата-энеси менен жашачу беле?", "6. Алтынай мектепте кандайча окуп калды?", "7. Повесттин үзүндүсүнө тема койгула.", "8. «Кеңеш өкмөтү, кеңеш берүү, кеп-кеңеш» деген сөздөр менен сүйлөмдөрдү түзгүлө.", "9. «Сабатсыздыкты жоюу — бул …» (тексттен синонимдерди таап жазгыла).", "10. Тексттен Дүйшөн мугалимди сүрөттөгөн сүйлөмдү тапкыла."], "rows": 3, "ex": "1. 1924-жыл, совет бийлигинин алгачкы жылдары, эл сабатсыз, кедей, мектеп жок.<br>2. Мектеп ачып, балдарды окутуу максаты менен.<br>3. Чоң маани берген: мөөр басылган кагаз берип, мугалим жиберген.<br>4. Анткени окуунун керегин түшүнүшкөн эмес, жер менен оокат кылышкан.<br>5. Жок, ал жетим, аталаш туугандардын колунда жашаган.<br>6. Жеңеси каршы болсо да, күйөөсү уруксат берип, окуп калды.<br>7. «Мектептин ачылышы», «Айылга келген мугалим».<br>8. Кеңеш өкмөтү элге жер бөлүп берди. Мугалим бизге кеңеш берди. Кеп-кеңешибизди бириктирдик.<br>9. Көзү ачылуу, кат таануу, билимге жетилүү.<br>10. «Көөнө кара шинель кийген, кубакай жигит сүйлөп жаткан экен»."}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t3l4", "title": "«Биринчи мугалим» (уландысы)", "ky": "Дүйшөндүн мектеби. Алтынайдын тагдыры", "gram": "<b>Омоним</b> — бирдей угулган, бирок мааниси башка сөздөр: <i>кош</i> (коштошуу / эки), <i>асыл</i> (баалуу / асылып), <i>көк</i> (асман / түс). <b>Макал</b>: <i>«Билимдүүгө дүйнө жарык», «Билим — элге, суу — жерге»</i>.", "lex": "батрак, арип, калам, чырак, деңиз, көктөм, терек, зээн, эсен-соо, заман, тигиле, тагдыр, рабфак, эвакуация", "tasks": [{"t": "vocab", "i": "think", "h": "Сөздүк. Басканда угулат (🔊). <small style=\"color:#7a6a60;font-weight:400\">(35-бет)</small>", "w": [["батрак", "байга жалданып иштеген кедей", "батрак", "🌾"], ["арип", "тамга", "буква", "🔤"], ["калам", "карандаш, калем", "карандаш", "✏️"], ["чырак", "шам, жарык", "светильник", "🕯️"], ["деңиз", "чоң көл, море", "море", "🌊"], ["көктөм", "жаз", "весна", "🌱"], ["терек", "бийик дарак (тополь)", "тополь", "🌳"], ["зээн", "акыл, түшүнүү жөндөмү", "способности, ум", "🧠"], ["эсен-соо", "аман-эсен", "жив-здоров", "💪"], ["заман", "мезгил, доор", "эпоха", "⏳"], ["тигиле", "тигил, ал", "тот", "👉"], ["тагдыр", "жашоо жолу", "судьба", "🛤️"], ["рабфак", "жумушчу факультети", "рабфак", "🏫"], ["муңайым", "кайгылуу, муңдуу", "печальный", "😔"], ["кан майдан", "согуш талаасы", "поле битвы", "⚔️"]]}, {"t": "box", "i": "think", "h": "Макалдарга комментарий бергиле", "c": "", "html": "«Билимдүүгө дүйнө жарык», «Билим — элге, суу — жерге». Силердин мектебиңерде биринчи сабак эмне тууралуу айтылат?"}, {"t": "read", "i": "read", "h": "Уландысын окугула. <small style=\"color:#7a6a60;font-weight:400\">(33-бет)</small>", "title": "Биринчи мугалим (уландысы)", "text": ["Биринчи күнү ал бизди жерде төшөлгөн саманга олтургузуп, колубузга бирден дептер, бирден калам, ар бирибизге атайлап жасалган кичинекей тактайдан берди да: — Муну тизеңерге коюп, кат жазасыңар, — деди. Анан дубал бооруна жармаштырып койгон сүрөттү көрсөтүп, — мына бул киши — Ленин! — деди, — Биз ушул кишинин айткан, көрсөткөн жолу менен окуйбуз…", "Айтканындай эле Дүйшөн билгенин аябай, ар бирибиздин үстүбүздөн үйрүлүп, калам кармоодон тарта үйрөтүп, биз укпаган саясы сөздөргө чейин түшүндүрүп, окутууга аракеттенип жатты. Азыр ойлосом, колунда кармаган алиппеси жок бул чала сабат, эки сөздү эптеп кошуп окуган жаш жигиттин, албетте, анда окутуунун тартиби, жол-жобосу жөнүндө эч кандай кабары да болгон эмес. Окутат деген ушул деп өз билгениндей, өзүнүн оюна туура келгениндей окута берген. Бирок анын ак пейилинен кылган аракети, менимче, таалага кеткен жок. Анткени ошондо биз үчүн, айылынын четине чыгып көрбөгөн тоо койнундагы кыргыз балдары үчүн, бул мектеп деп аталган туш-туш жыртыгынан шамал ышкырып, эшигинин жылчыктарынан тээ алыстагы ак карлуу тоо чокулары көрүнгөн ышталган котур тамда кулак угуп, көз көрбөгөн укмуштуу жаңы дүйнө ачылды.", "Анча-мынча арип тааныгандан кийин, «ат», «таканы» жазалбай жатып, кат жүзүндө биздин биринчи оозанган сөзүбүз Ленин — болгон. Биздин саясы алиппебиз: «бай», «кедей», «батрак», «кеңеш» деген сөздөрдөн түзүлгөн.", "Алтынайдын жеңеси куда түшүп жүргөн жашы бир топ улуу байга кызды сатып жиберет. Мектептен Дүйшөндү көптөн сабап, Алтынайды зордук менен алып кетишет. Дүйшөн жашы жетпеген кызды зордоп алган «түлкү тебетей» байдын үйүнө чейин милиционер менен келип, Алтынайды куткарып кетет. Байдын кылмышы үчүн жазага тартылышына жетишип, Алтынайды шаарга окууга жиберди.", "…Ушундан эки күндөн кийин Дүйшөн мени жолго узатып станцияга алып келди. — Мен сени өмүрү жанымдан алыс чыгарбас элем, Алтынай, — деди. — Бирок менин билимим жетпейт. Кантейин, окуунун чыныгы жолунан сени калтыра албаймын. Мен болсом ушул жерде кармашып балдарды окута берем. Күчүм канча жетсе, ошончо окутам. Балким, кийин сен дагы мугалим болуп балдарды окутуп каласың, биздин жаман мектепти эстеп күлөрсүң… — Мына эми, азыр жөнөйсүң! — деди Дүйшөн, колумду кармап. Бактылуу бол. Канатыңды жазып талпынгын, Алтынай. Эчтемеден тайманба, чабыттап учкун, окуй бер…", "Арадан жылдар өтүп Алтынай рабфакты бүтүрүп, Москвада окуп, кандидаттык диссертация коргойт. Согуш башталып, Фрунзеге эвакуацияга бара жаткан Алтынай, айылга бара кетүүнү чечет.", "Кайран теректер! Арадан канча заман өткөнүн ушундан эле билүүгө болбойбу. Саламатсыңарбы, асыл зат теректер! Силерди тиккен, багып-өстүргөн кишинин айткандарынын баары келди. Мына эми ал эл-журтун душмандан коргош үчүн кан майданга аттанып жөнөп кетиптир… Кыш келе жатат, саргарган жалбырактарыңды шамал отоп, жылаңач калганыңарга кейип турасыңарбы? Ооба, бороон-чапкындуу кыш да болот, бирок жаз да келет… Кейибегиле, теректер, муңданбагыла… Биз силерди жакшылыкка багыштап тиккенбиз. О, колуңдан айланайын, мугалимим!.. Жеңиш менен эсен-соо согуштан кайтып кел…"], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Биринчи күнү Дүйшөн балдарга эмне берди?", "o": ["Дептер, калам, кичинекей тактай", "Китеп, доска", "Телефон", "Алиппе"], "a": 0}, {"q": "Балдардын кат жүзүндө биринчи жазган сөзү?", "o": ["Ленин", "Ат", "Така", "Бай"], "a": 0}, {"q": "Дүйшөн Алтынайды кимден куткарды?", "o": ["«Түлкү тебетей» байдан", "Жеңесинен", "Милиционерден", "Молдодон"], "a": 0}, {"q": "Алтынай кийин ким болду?", "o": ["Илимдин кандидаты (окумуштуу)", "Мугалим", "Дарыгер", "Акын"], "a": 0}, {"q": "Дүйшөн согуш башталганда кайда кетти?", "o": ["Кан майданга", "Москвага", "Ташкентке", "Шекерге"], "a": 0}]}]}, {"t": "mcm", "i": "think", "h": "Омоним сөздөрдүн эки маанисин тапкыла (бир нече жооп). <small style=\"color:#7a6a60;font-weight:400\">(38-бет)</small>", "qs": [{"q": "«Кош» сөзүнүн маанилери:", "o": ["коштошуу (кайыр кош)", "эки, жуп", "суу", "тоо"], "a": [0, 1]}, {"q": "«Асыл» сөзүнүн маанилери:", "o": ["баалуу, кымбат", "асылып туруу", "жаз", "жол"], "a": [0, 1]}, {"q": "«Көк» сөзүнүн маанилери:", "o": ["асман", "түс (көк түс)", "терек", "куш"], "a": [0, 1]}]}, {"t": "match", "i": "think", "h": "Антоним сөздөрдү жупташтыргыла. <small style=\"color:#7a6a60;font-weight:400\">(36-бет)</small>", "pairs": [["бай", "кедей"], ["муңайым", "шайыр"], ["ак пейил", "кара ниет"], ["жаңы", "эски"], ["терс", "оң"], ["согуш", "тынчтык"], ["душман", "дос"], ["жаш", "кары"]]}, {"t": "gap", "i": "write", "h": "Макалдарды керектүү сөздөр менен улагыла. <small style=\"color:#7a6a60;font-weight:400\">(36-бет)</small>", "items": ["«Мугалим — [элдин] [чырагы]».", "«Билим алуу — [ийне] менен [кудук] казгандай».", "«Билеги күчтүү [бирди] жыгат, билими күчтүү [миңди] жыгат»."]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(38-бет)</small>", "qs": ["1. Балдардын келечеги үчүн Дүйшөн кандай кыйынчылыктарга чыдады?", "2. Айылдыктардын Дүйшөнгө мамилеси кандайча өзгөрдү?", "3. «Канатыңды жазып талпынгын, Алтынай» деген сөздү Дүйшөн эмне үчүн айтты?", "4. Дүйшөн Алтынайды алыскы Ташкент же Москвага жибербей алып калса болот беле?", "5. Алтынай эмне үчүн айылда калгысы келген жок? Алтынайдын келечеги кандай болду?", "6. Каармандын тагдыры кош терек менен кандайча байланышкан?", "7. Дүйшөндүн мектеби менен азыркы мектебиңерди салыштыргыла."], "rows": 3, "ex": "1. Котур тамда окутту, айылдыктардын каршылыгына, байдын сабаганына чыдады.<br>2. Башында каршы болушту, кийин балдар окуп, элдин көзү ачылып, мамилеси жылыды.<br>3. Анткени Алтынай билим алып, бийик максатка жетишин каалады.<br>4. Жок, анткени анын билими жетпейт эле, кыздын келечеги үчүн жиберди.<br>5. Жеңеси зордукка берген, ал окуп, Москвада илимдин кандидаты болду.<br>6. Дүйшөн теректерди жакшылыкка багыштап тиккен, алар Алтынайдын келечегинин символу.<br>7. Дүйшөндүн мектеби — жыртык там, саман, тактай; биздики — жылуу имарат, парта, компьютер."}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t3l5", "title": "«Биринчи мугалим» повестинин идеясы жана каармандары", "ky": "Талдоо", "gram": "<b>Идея</b> — чыгарманын башкы ою. Повесттин идеясы: билимдин, мугалимдин эмгегинин улуулугу, келечек муун үчүн камкордук. <b>Башкы каармандар</b>: Дүйшөн жана Алтынай.", "lex": "чын дилинен, зарылдык, саясий сабат, топтоштурган, берилгендик, кайдыгер эместик, келечек муун, кадыр-барк, кара катын, бирдей билим, тең укук, зээндүү, талыкпас эмгек", "tasks": [{"t": "vocab", "i": "think", "h": "Жаңы сөздөр. Басканда угулат (🔊).", "w": [["чын дилинен", "жүрөгүнөн, ак ниетинен", "искренне", "💖"], ["зарылдык", "керектик", "необходимость", "❗"], ["саясий сабат", "саясатты түшүнүү", "политграмота", "🏛️"], ["топтоштуруу", "бир жерге чогултуу", "сосредоточить", "🧩"], ["берилгендик", "чын берилүү", "преданность", "🤝"], ["кайдыгер эместик", "көңүл коюу, кайдыгер болбоо", "неравнодушие", "❤️‍🔥"], ["келечек муун", "кийинки муун", "будущее поколение", "👶"], ["кадыр-барк", "сый-урмат", "авторитет, уважение", "🏅"], ["тең укук", "бирдей укук", "равноправие", "⚖️"], ["зээндүү", "акылдуу, шыктуу", "способный", "🌟"], ["талыкпас эмгек", "тынымсыз эмгек", "неустанный труд", "🔨"], ["идеалдаштыруу", "ашыра мактоо", "идеализировать", "✨"]]}, {"t": "read", "i": "read", "h": "Текстти окугула. <small style=\"color:#7a6a60;font-weight:400\">(39-бет)</small>", "title": "«Биринчи мугалим» повестинин идеясы жана каармандары", "text": ["Повесттин башкы каарманы — Дүйшөн. Совет өкмөтү комсомолдун мүчөсү Дүйшөндү алыскы тоо арасындагы айылга элдин сабатын жоюуга жөнөтөт. Ал өзү чала сабат болсо да, билгенин балдарга үйрөтүүгө чын дилинен аракеттенет. Балдардын ата-энелерине же айылдыктарга да билимдин зарылдыгын жеткирүүгө умтулат, натыйжада балдарга эле билим бербестен, чоңдорду да саясий сабатка үйрөткөн.", "Автор Дүйшөндүн образын идеалдаштырганын, тактап айтканда эң мыкты сапаттарды топтоштурганын жазат. Мугалим биринчи сабагында эле окуучуларга Лениндин сүрөтүн көрсөткөн. Ленин Дүйшөнгө кедейлер үчүн жаркын келечектин символу катары көрүнөт. Совет бийлигине берилгендик, кедей-кембагалдардын жана балдардын тагдырына кайдыгер эместик, келечек муун үчүн камкордук Дүйшөндүн мыкты сапаттары болуп саналат.", "Азыркы учурда Дүйшөн мугалимдик кесиптин ысык-суугуна чыдаган, балдарга камкор, өз окуучуларынын укугун коргогон гумандуу, жетимге боорукер каарман катары маанилүү. Ч. Айтматов мугалимдин коом үчүн, келечек муун үчүн эмгегин жогору баалаган, анын кадыр-баркын өстүрүү зарылдыгын белгилеген.", "Повесттин дагы бир башкы каарманы — Алтынай. Ал 14 жаштагы жетим кыз, аталаш агасынын үйүндө жашайт. Совет бийлиги орнобосо, аны кандай тагдыр күтүп турганын, өмүрү жакшылык көрбөгөн «кара катын» деп аталган аялдын образы аркылуу берилет. Анын бактысына совет түзүлүшү жетимдерге ата-энелүү балдар менен, кыз балдарга эркек балдар менен бирдей билим алууга жана жеке турмушун өз чечүүгө тең укук берди. Алтынай зээндүү, өз укугун талашкан, билимге умтулган кыргыз кызы. Ал өз аракети, талыкпас эмгеги жана Дүйшөндүн жардамы менен илимдин докторунун даражасына жетип, өзү каалаган адамына турмушка чыгат.", "Жыйынтыктап айтканда, Алтынай өз тагдырын өзү чечүүгө укук алган, эркиндикке чыккан кыргыз кызынын образы."], "qs": [{"t": "mcm", "i": "think", "h": "Туура жоопторду тандагыла.", "qs": [{"q": "Дүйшөндүн мыкты сапаттары (бир нече жооп):", "o": ["Балдардын тагдырына кайдыгер эмес", "Келечек муун үчүн камкор", "Жетимге боорукер", "Өзүмчүл"], "a": [0, 1, 2]}, {"q": "Алтынай кандай кыз?", "o": ["Зээндүү, билимге умтулган", "Жалкоо", "Коркок", "Бай кызы"], "a": [0]}, {"q": "Автор Дүйшөндүн образын кандай түзгөн?", "o": ["Идеалдаштырып, эң мыкты сапаттарды топтоштурган", "Терс каарман катары", "Күлкүлүү каарман катары", "Эч нерсе айткан эмес"], "a": [0]}]}]}, {"t": "match", "i": "think", "h": "Синоним сөздөрдү жупташтыргыла. <small style=\"color:#7a6a60;font-weight:400\">(38-бет)</small>", "pairs": [["зор", "чоң"], ["заман", "доор"], ["муң", "кайгы"], ["кубануу", "сүйүнүү"], шөн мугалимдин эрдиги, Алтынайдын тагдыры көрсөтүлөт. Мага эң таасир эткени — Дүйшөндүн балдар үчүн сууга түшүп, аларды көтөрүп өткөргөн жери. Бул мугалимдин чыныгы камкордугу."}, {"t": "box", "i": "think", "h": "Тарыхый комментарий", "c": "y", "html": "<b>Комсомол</b> — Совет өлкөсүндөгү жаштардын саясий уюму. Анын катарында 14–28 жаштагы миллиондогон улан-кыздар турган.<br><b>Владимир Ильич Ульянов (Ленин)</b> — дүйнөдөгү биринчи социалисттик мамлекет СССРди негиздеген. Анын тарыхтагы орду жана ролу жөнүндө пикирлер бири-биринен кескин айырмаланат.<br><b>КИМ</b> (коммунистический интернационал молодежи) — комсомолдун биринчи төш белгиси."}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t3l6", "title": "Жолон Мамытов. «Ата Журт» ыры", "ky": "Акындын өмүрү. Мекенчилдик лирикасы", "gram": "<b>Лирика</b> — акындын сезимин, ой толгоосун билдирген ыр түрү. Ж. Мамытов — «отту сүйгөн» («от жүрөк») лирик акын. «Ата Журт» ырында <b>Саман жолу</b> (Галактика) образы, <b>эпитеттер</b> (<i>үмүттөр, тынчтык, ыраңдуу</i>) колдонулат.", "lex": "бозоргон, тозоң, доор, озондо, акыл-эс, алсыздануу, өйдөлөө, элес, Саман жолу, кайруу, ыраңдуу, мыкчуу, барчын, кутман, жат кол, дайын, дайра", "tasks": [{"t": "vocab", "i": "think", "h": "Сөздүк жана кеп казына. Басканда угулат (🔊). <small style=\"color:#7a6a60;font-weight:400\">(43-бет)</small>", "w": [["бозоргон", "боз тартып күңүрт көрүнгөн", "посеревший", "🌫️"], ["тозоң", "чаң", "пыль", "💨"], ["доор", "заман, мезгил", "эпоха", "⏳"], ["озондо", "алыста, нарыда", "вдали", "🏞️"], ["акыл-эс", "ой жүгүртүү жөндөмү", "разум", "🧠"], ["алсыздануу", "күчү кетүү", "ослабеть", "😮‍💨"], ["өйдөлөө", "жогорулоо", "подняться", "📈"], ["элес", "көрүнүш, сүрөт", "образ, видение", "🖼️"], ["Саман жолу", "Саманчынын жолу — Галактика", "Млечный путь", "🌌"], ["кайруу", "кайырма (ырдын)", "припев", "🎵"], ["ыраңдуу", "кооз, сулуу", "красивый, живописный", "🌸"], ["мыкчуу", "катуу кармоо", "крепко сжать", "✊"], ["барчын", "алгыр куш, бүркүт", "беркут", "🦅"], ["кутман", "таалайлуу, ыйык", "благословенный", "🙏"], ["жат кол", "душман, кас", "вражеская рука", "🗡️"], ["дайын", "белгилүү", "известно", "✅"], ["дайра", "дарыя, өзөн", "река", "🏞️"]]}, {"t": "read", "i": "read", "h": "Акын жөнүндө окугула. <small style=\"color:#7a6a60;font-weight:400\">(41-бет)</small>", "title": "Жолон Мамытов (1940–1988)", "text": ["Акын Жолон Мамытов 1940-жылы 1-апрелде Ош областындагы Кара-Суу районунун Төлөйкөн айылында төрөлгөн. Орто мектепти ийгиликтүү бүтүргөндөн кийин Кыргыз айыл чарба институтун жана Москвадагы М. Горький атындагы адабият институтун аяктаган.", "Ж. Мамытовдун алгачкы ыры 1954-жылы областтык «Ленин жолу» газетасына жарыяланып, кийин чыгармалары республикалык газет-журналдарда жарык көргөн. Акындын «Отту сүйөм», «Мезгилдин элеси», «Буурул таңдын жомогу», «Жүз жашка тол кылым», «Башат жана Мухит» жана башка поэтикалык жыйнактары жарыкка чыккан.", "Ал коомчулукка таланттуу, өз үнү бар лирик акын катары таанылып, отту сүйгөн «от жүрөк» акын деп аталган. Жолон орус акындарынан В. Маяковский менен Н. Заболоцкийди баалап сүйгөн. Ал Ф. Тютчевдин, А. Феттин, В. Маяковскийдин, М. Слуцкийдин айрым чыгармаларын кыргыз тилине которгон.", "1973-жылы Ж. Мамытов жемиштүү чыгармачылыгы үчүн Кыргызстан Ленин комсомолу сыйлыгынын лауреаты болот. «Жүз жашка тол кылым» аттуу ыр китеби үчүн Токтогул атындагы мамлекеттик сыйлыкты алган.", "Акын Жолон Мамытовдун чыгармачылыгында Ата Журт темасындагы көркөм образдуу ырлар, поэмалар арбын. «Айрыса да, ден соолуктан башкадан, айрыбасын Ата-Журттан ылайым», — деп жазган мекенчил акын."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Ж. Мамытов качан, кайда туулган?", "o": ["1940-ж., Ош облусу, Төлөйкөн айылы", "1928-ж., Шекер", "1912-ж., Кең-Суу", "1938-ж., Токмок"], "a": 0}, {"q": "Акын кандай акын деп аталган?", "o": ["«От жүрөк» лирик акын", "Төкмө акын", "Сатирик", "Драматург"], "a": 0}, {"q": "Токтогул атындагы сыйлыкты кайсы китеби үчүн алган?", "o": ["«Жүз жашка тол кылым»", "«Отту сүйөм»", "«Башат жана Мухит»", "«Ата Журт»"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "Ырды окугула. <small style=\"color:#7a6a60;font-weight:400\">(42-бет)</small>", "title": "Ата Журт ыры", "text": ["Түн бир убак… Саман жолу бозоргон, Көктү тилген ошол түпсүз тозоңдон. Не бир укмуш назик ырлар угулат, Ырлар учат, кайруулары озондоп.", "Укмуш доордо акыл-эстер жердеген, Турам жалгыз түн жамынып жерде мен. Көкүрөккө толуп алып үмүттөр, Өкүнүчтөр жанга тынчтык бербеген.", "Түгөнгөндөй ойдун таза, асылы, Элестердин ыраңдуусу, жашылы. Сен тууралуу ыр жаза албай Ата Журт, Алсызданып мыкчый берем башымы.", "Ата Журтум, ааламга учкан сен барчын, Ыйык сезип сендей кутман жер баркын. Достукка бек тоолук жүрөк толкундап, Согуп турса, сен жашайсың, сен барсың.", "Түп аталар жат колунан сак кармап, Жалындашып, сени сүйгөн кастарлап. Ошол тейден тирүү жетип бул күнгө, Өсүүдөсүң ай теректей асмандап.", "Мунун баары дайын сага беш колдой, Муну билүү бизге керек беш колдой. Биздин тагдыр сага куят, Ата-Журт, Дайра суусун көлгө келип кошкондой."], "by": "Жолон Мамытов", "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "«Саман жолу бозоргон, көктү тилген» — күндүн кайсы маалы?", "o": ["Түн", "Таң", "Түш", "Кеч"], "a": 0}, {"q": "Акын Ата Журтту эмнеге салыштырат?", "o": ["Ааламга учкан барчынга (бүркүткө)", "Ташка", "Дарыяга", "Тозоңго"], "a": 0}, {"q": "«Биздин тагдыр сага куят, Ата-Журт» — эмнеге салыштырылат?", "o": ["Дайра суусунун көлгө кошулушуна", "Жамгырга", "Жылдызга", "Шамалга"], "a": 0}]}]}, {"t": "gap", "i": "write", "h": "Ыр саптарын толуктагыла.", "items": ["Түн бир убак… [Саман жолу] бозоргон.", "Ата Журтум, ааламга учкан сен [барчын].", "Биздин тагдыр сага куят, Ата-Журт, [Дайра] суусун көлгө келип кошкондой."]}, {"t": "match", "i": "think", "h": "Аныктоочторду зат атоочтор менен жупташтыргыла (Кандай?). <small style=\"color:#7a6a60;font-weight:400\">(44-бет)</small>", "pairs": [["кутман", "Ата Журт"], ["түпсүз", "тозоң"], ["таза, асыл", "ой"], ["ыраңдуу, жашыл", "элестер"], ["укмуш", "доор"], ["жалгыз", "мен"]]}, {"t": "match", "i": "think", "h": "Синонимдерди жупташтыргыла. <small style=\"color:#7a6a60;font-weight:400\">(44-бет)</small>", "pairs": [["жашоо", "турмуш"], ["асман", "көк"], ["таалайлуу", "кутман"], ["белгилүү", "дайын"], ["өзөн", "дайра"]]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(43-бет)</small>", "qs": ["1. Жолон Мамытовдун «Ата Журт кыйын күнгө кабылганда, айлансын ар бир уулуң чагылганга» деген сөздөрүн кандай түшүнөсүңөр?", "2. Акын өзү жашаган доорду кандай сөз менен сүрөттөйт?", "3. «Сен тууралуу ыр жаза албай Ата Журт, алсызданып мыкчый берем башымы» — эмне үчүн Ата Мекенди сүрөттөө абдан татаал?", "4. Адамдын тагдыры менен Мекендин тагдыры тыгыз байланышта экендиги кайсы саптарда көрсөтүлгөн?", "5. Жолондун чыгармачылыгында Ата Журт темасы кандай мааниге ээ болгон?"], "rows": 3, "ex": "1. Мекенге кыйын күн түшкөндө ар бир жигит аны коргоого даяр болуш керек.<br>2. «Укмуш доордо акыл-эстер жердеген».<br>3. Анткени Мекенге болгон сүйүү чексиз, аны сөз менен толук айтуу мүмкүн эмес.<br>4. «Биздин тагдыр сага куят, Ата-Журт, дайра суусун көлгө келип кошкондой».<br>5. Эң негизги орунда — Ата Журт темасындагы ырлары, поэмалары арбын."}, {"t": "write", "i": "write", "h": "«Менин Мекеним» деген темада эссе жазгыла. <small style=\"color:#7a6a60;font-weight:400\">(44-бет)</small>", "rows": 6, "min": 50, "ph": "Менин Мекеним — …", "sample": "Менин Мекеним — Кыргызстан. Анын бийик тоолору, таза булактары, кең жайлоолору бар. Мен өз кичи мекеним — айылымды абдан жакшы көрөм. Мекенди сүйүү — аны коргоо, анын келечеги үчүн эмгектенүү деп түшүнөм."}, {"t": "box", "i": "think", "h": "Кеп казына", "c": "y", "html": "<b>Саман жолу</b> — Саманчынын жолу — Млечный путь. <b>Саманчынын жолу</b> (Галактика) — Жер, Күн системасы жана башка көзгө көрүнүүчү айрым жылдыздар жайгашкан галактика. Асманды кесип өтүүчү «сүттөй» ак түстөгү жазы тилкени айтышат. Байыртадан түрк элдеринин түшүнүгүндө асмандагы жылдыздар менен жердеги адамдардын түпкү теги бир болгон, жылдыздар — адамдар, алар жылдызга айланып кеткен деген идея жашаган."}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t3l7", "title": "Ж. Мамытов. «Ат — адамдын канаты». «Ат жабдыксыз — ат жайдак»", "ky": "Ат жабдыктары жөнүндө", "gram": "<b>Макал</b>: <i>«Ат — адамдын канаты»</i>, <i>«Аттай арка, тоодой медер»</i>. <b>Ат жабдыктары</b>: ээр, үзөңгү, канжыга, көмөлдүрүк, куюшкан, басмайыл, чаполоң, желдик, тердик, ичмек, жүгөн, нокто, көрпөчө, атжабуу, камчы.", "lex": "алектенүү, жашоо-тиричилик, жеткирбес, куткарбас, оттоо, ат жабдыктары, атты токуу, атка минүү, ээр, жалаң, шашылуу, ирет, тартуу, салуу, бап келген, шилтөө", "tasks": [{"t": "vocab", "i": "think", "h": "Сөздүк. Басканда угулат (🔊). <small style=\"color:#7a6a60;font-weight:400\">(45-бет)</small>", "w": [["алектенүү", "бир иш менен машыгуу", "заниматься", "🔧"], ["жашоо-тиричилик", "турмуш", "быт, жизнь", "🏠"], ["жеткирбес", "жеткизбей кетүүчү", "недосягаемый", "🏇"], ["куткарбас", "качырбай кармоочу", "не дающий уйти", "🎯"], ["оттоо", "чөп жеш (мал)", "пастись", "🌿"], ["ат жабдыктары", "атты токууга керектүү буюмдар", "конская сбруя", "🐎"], ["атты токуу", "ээр салуу", "оседлать коня", "🪑"], ["ээр", "атка салынуучу отургуч", "седло", "🪑"], ["жалаң", "гана, жалгыз", "только, лишь", "1️⃣"], ["шашылуу", "ашыгуу", "спешить", "⏩"], ["ирет", "жолу, кезек", "раз", "🔢"], ["тартуу", "өзүнө тартуу", "тянуть", "↩️"], ["салуу", "коюу, жайгаштыруу", "класть, надевать", "📥"], ["бап келген", "ылайык келген", "подходящий", "✔️"], ["шилтөө", "колун, камчыны сермөө", "взмахнуть", "💫"], ["тулпар", "эң мыкты, күлүк ат", "тулпар (скакун)", "🐴"], ["жайдак", "жабдыксыз, токулбаган", "неосёдланный", "🐎"]]}, {"t": "read", "i": "read", "h": "Текстти окугула. <small style=\"color:#7a6a60;font-weight:400\">(45-бет)</small>", "title": "Ат — адамдын канаты", "text": ["Кыргыз эли байыртадан көчмөн турмушта жашап, негизинен малчылык менен алектенген. Калктын жашоосунда жылкы (ат) эң пайдалуу, эң керектүү мал болгон. Жылкы улук (улуу) деп, өзгөчө баркталган. «Ат — адамдын канаты» деген сөз ошол кездерден калган. Аты жок адам жашоо-тиричилигинде чоң кыйынчылыктарга туш келген. Жылкы көч жолунда унаа болуп, жоо келгенде душманга жеткирбес, касты куткарбас тулпар болгондугу менен бааланган. Ошол эле мезгилде жылкы күн жылууда жайыттан чөп чалып жеп, кышкысын карды тээп оттоп, адамга көп түйшүк жараткан эмес.", "Атты токуп минүүгө керектелүүчү буюмдар — ат жабдыктар деп аталат. Ат жабдыктарына — ээр, үзөңгү, канжыга, көмөлдүрүк, куюшкан, басмайыл, чаполоң, желдик, тердик, ичмек, жүгөн, нокто, көрпөчө, атжабуу, камчы кирет. Аталган буюмдардын ар бири өзүнчө кызмат аткарат. Ат жабдыксыз же токумсуз болсо, жайдак ат деп аташкан.", "Жолон Мамытовдун «Ат жабдыксыз ат жайдак» аттуу ыры ат жабдыктарынын аталышы тууралуу элестүү маалымат берет."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Кыргыз эли негизинен эмне менен алектенген?", "o": ["Малчылык менен", "Балык уулоо менен", "Соода менен", "Дыйканчылык менен"], "a": 0}, {"q": "Жабдыксыз, токулбаган ат кандай деп аталат?", "o": ["Жайдак ат", "Тулпар", "Жорго", "Буудан"], "a": 0}, {"q": "Атты токуп минүүгө керектүү буюмдар кандай аталат?", "o": ["Ат жабдыктары", "Ат жайдак", "Ат токум", "Ат үйү"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "Ырды окугула. <small style=\"color:#7a6a60;font-weight:400\">(46-бет)</small>", "title": "Ат жабдыксыз — ат жайдак (үзүндү)", "text": ["Жылкы менен достошкон байыртадан кыргыз эл. Жоосун тороп токтоткон токуп минип кыргыз ээр.", "Тердик, желдик, жазыны жуптап уздар жасаган. Ээрчи — кесип асылы эл ичинде жашаган.", "Көмөлдүрүк, бешкумпай, көзүлдүрүк, куюшкан, жабдыгына серп салып, минген ээсин туюшкан.", "Азыр жалаң машина, ким көрүптүр мындайды. Басмайылдын Ысмайыл атын таппай турбайбы!", "«Тептим, чыктым терекке», бул не? — десек Ташыга: Үзөңгү! — деш ордуна, Шаты! — деди шашыла.", "Жүгөн катып атыңа, кыл чылбырын тактырып, суулук салып татына, жабуу, көпчүк жаптырып, туягына бап келген темир така кактырып, үзөңгүңү кере тээп, камчы шилтеп бастырып, баратсаң да талашпа, тизгиниң жок нетмексиң? Барамын деп Таласка, Балыкчыга кетмексиң!", "«Ат адамдын канаты» — илгеркинин кеби экен. Ат жабдыктын санаты канча айтса да эп экен. Ат жабдыксыз ат жайдак, Жорго минип жол басам, Жабдыктарын кастарлап, бараткансып «Волгачан».", "Эгер чындап кызыксаң, Ат жабдыкка, чырагым, неден, кантип жасаарын чоң атаңдан сурагын."], "by": "Жолон Мамытов"}, {"t": "match", "i": "think", "h": "Ат жабдыгын анын кызматы менен жупташтыргыла. <small style=\"color:#7a6a60;font-weight:400\">(48-бет)</small>", "pairs": [["ээр", "атка отуруу үчүн"], ["үзөңгү", "бутту коюу, тээп минүү үчүн"], ["жүгөн", "атты башкаруу үчүн"], ["тизгин", "атты оңго-солго буруу үчүн"], ["басмайыл", "ээрди бекитүү үчүн"], ["камчы", "атты бастыруу үчүн"], ["така", "туякты коргоо үчүн"], ["тердик", "ээрдин астына салуу үчүн"]]}, {"t": "gap", "i": "write", "h": "Сүйлөмдөрдү этиштер менен толуктагыла (чабуу, тартуу, тагуу, кагуу, багуу). <small style=\"color:#7a6a60;font-weight:400\">(48-бет)</small>", "items": ["Ээрчи жаңы ээрди [чаап|багып|кагып|тагып*] бүттү.", "Уста аттын туягына така [тартты|какты*|чапты|багып].", "Чоң атам аттын оозуна жүгөн [тагып|чапты|тартты*|какты].", "Кичинекей чабандес атын [тартты|чапты*|какты|багып].", "Саяпкер жылкыларды [какты|тартты|багып*|чапты] бапестеп."]}, {"t": "gap", "i": "write", "h": "Макалдарды толуктагыла. <small style=\"color:#7a6a60;font-weight:400\">(49-бет)</small>", "items": ["Ат мүдүрүлбөй [жер] тааныбайт, эр мүдүрүлбөй [эл] тааныбайт.", "Атты чапсаң [майданда] чап, чыкпай калса бактыңан тап.", "Аттын баары [күлүк] болбойт, куштун баары [алгыр] болбойт.", "Аттын сыры [ээсине] маалым, кыздын сыры төркүнгө маалым."]}, {"t": "sort", "i": "think", "h": "Жылкылардын асылдыгына жараша бөлүштүргүлө. <small style=\"color:#7a6a60;font-weight:400\">(49-бет)</small>", "cols": ["Тулпар", "Буудан", "Дулдул", "Жорго"], "items": [["эпостордо айтылган эң асыл жылкы", 0], ["күлүк, күчтүү, ээсин таштабаган", 1], ["чыдамкай, туяктары чоң, алты айчалык жолго арыбас", 2], ["бир калыптагы майда жүрүштүү ат", 3]]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(48-бет)</small>", "qs": ["1. Кыргыздын жылкыга мамилеси байыртадан кандай болгон?", "2. «Жоосун тороп токтоткон токуп минип кыргыз ээр» — бул саптар менен акын эмнени айткысы келет?", "3. Тердик, желдик эмнеден жасалган?", "4. Ат жабдыктарынын ичинен тизгиндин милдети кандай?", "5. Толубай сынчы тууралуу уламышты эстегиле."], "rows": 3, "ex": "1. Жылкыны улук деп барктап, «ат — адамдын канаты» дешкен.<br>2. Кыргыздар токулган ат менен душманды токтоткон, коргонгон.<br>3. Кийизден, жуптап уздар жасаган.<br>4. Атты оңго-солго буруу, токтотуу үчүн.<br>5. Толубай сынчы аттардын сынын так айтып берген, анын сыны туура келген."}, {"t": "box", "i": "think", "h": "Кызыктуу фактылар", "c": "y", "html": "• Доктор Л. Лимонов жана М. Ж. Моэр: «Кыргыз жылкысынын сырткы келбети сулуу эмес. Ал күчтүүлүгү, чыдамдуулугу менен айырмаланат. Бир канча күн тамаксыз жашай алат. 75–106 чакырымды орто эсеп менен 8,5–16 саатта басып өтөт».<br>• Кыргыздарда төрт түлүк малдын ар биринин колдоочусу бар деген ишеним болгон. <b>Камбар Ата</b> — жылкынын пири.<br>• <b>Тулпар</b> — эпостордогу эң асыл жылкы. <b>Буудан</b> — күлүк, күчтүү, ээсин таштабаган. <b>Дулдул</b> — күчтүү, чыдамкай, алты айчалык жолго арыбас. <b>Жорго</b> — бир калыптагы майда жүрүштүү ат."}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t3l8", "title": "Түгөлбай Сыдыкбеков", "ky": "Жазуучунун өмүрү (1912–1997)", "gram": "<b>Роман</b> — чоң көлөмдөгү кара сөз чыгарма (<i>«Кең-Суу», «Биздин замандын кишилери», «Тоо арасында»</i>). <b>Драма</b> — сахнага арналган чыгарма. <b>Мемуар</b> — эскерүү түрүндөгү чыгарма.", "lex": "негиз салуучу, келте, таанытты, каарман эмгек, толук ачылган, кайрадан оңдоо, үчилтиги, түшүргөн жок", "tasks": [{"t": "vocab", "i": "think", "h": "Сөздүк. Басканда угулат (🔊). <small style=\"color:#7a6a60;font-weight:400\">(51-бет)</small>", "w": [["негиз салуучу", "баштоочу, түптөөчү", "основоположник", "🏗️"], ["келте", "жугуштуу оору (тиф)", "тиф", "🤒"], ["таанытты", "белгилүү кылды", "прославил", "📣"], ["каарман эмгек", "баатырдык эмгек", "героический труд", "💪"], ["толук ачылган", "толук көрүнгөн", "полностью раскрылся", "🌸"], ["кайрадан оңдоо", "кайра иштеп чыгуу", "переработать", "🔄"], ["үчилтик", "үч бөлүктөн турган чыгарма", "трилогия", "3️⃣"], ["түшүргөн жок", "таштаган жок", "не выпускал", "✊"], ["прозаик", "кара сөз жазуучу", "прозаик", "📝"], ["драматург", "драма жазуучу", "драматург", "🎭"], ["мемуар", "эскерүү", "мемуары", "📔"], ["кара сөз", "проза", "проза", "📄"]]}, {"t": "read", "i": "read", "h": "Жазуучу жөнүндө окугула. <small style=\"color:#7a6a60;font-weight:400\">(50-бет)</small>", "title": "Түгөлбай Сыдыкбеков (1912–1997)", "text": ["Түгөлбай Сыдыкбеков — прозаик, акын, драматург, кыргыз совет адабиятынын негиз салуучуларынын бири. Кыргыз эл жазуучусу, Кыргыз Республикасынын Баатыры.", "Ал Ысык-Көл өрөөнүндөгү Кең-Суу деген айылда 1912-жылы карапайым адамдын үй-бүлөсүндө туулган. Түгөлбай экиге чыга элек кезинде атасы келтеден өлүп, топ жетим эне тарбиясында өсөт.", "Пржевальск шаарында 1928-жылга чейин окуп, кийин Фрунзе шаарындагы айыл чарба техникумун окууга өтөт. Андан кийин ар кандай газета-журналдарда иштей баштайт.", "«Күрөш» деген биринчи ырлар жыйнагы 1936-жылы чыккан. Андан кийин «Баатырлар» (1936), «Акын булбул» (1938), «Түн жарчысынан кабар» (1939), «Ач көз ата» (1940) деген жыйнактары чыккан. Согуштун алдында «Кең-Суу» деген романы жана «Ала-Тоодон алтоо» аттуу повести жарыяланган.", "«Биздин замандын кишилери» романы 1948-жылы басылып чыгып, СССРдин Мамлекеттик сыйлыгына татыктуу болгон. Бул чыгармасы Улуу Ата Мекендик согуш мезгилиндеги эл достугун, каарман эмгегин даңазалаган.", "Анын чыгармачылыгы согуштан кийинки жылдарда толук ачылган. 1953-жылы балдарга арналган «Тоо балдары» деген романы чыкты. 1955–1959-жылдардын ортосунда коллективдештирүү темасын чагылдырган «Кең-Суу» деген романын кайрадан оңдоп, «Тоо арасында» деген ат менен басмадан чыгарды. «Темир» аттуу романы 1962-жылы жарыяланып, ал эми аялдар темасына арналган «Зайыптар» үчилтигинин эки китеби жарык көрөт. 1969–70-жылдары чыгармаларынын төрт томдугун чыгарып, «Сыр ачуу», «Ыманбай пейили», андан кийин «Көк асаба» романын жазып жарыялады.", "Т. Сыдыкбеков бир катар драмалык чыгармалардын да автору: «Майданда» (1941), «Манас менен Алманбет» (1942), «Тоодой жүрөк» (1936–1945). Акыркы жылдары «Жол», «Мезгил сабактары» аттуу мемуардык-автобиографиялык романдарын жаратты. А. Пушкин, А. Некрасов, А. Чехов, М. Шолохов өңдүү орус классикасын кыргыз тилине которгон.", "Т. Сыдыкбеков 1997-жылдын 19-июлунда каза болду. Кара сөздүн алпы аталган жазуучу өмүрүнүн акырына чейин калемин колунан түшүргөн эмес."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Т. Сыдыкбеков качан, кайда туулган?", "o": ["1912-ж., Ысык-Көл, Кең-Суу айылы", "1928-ж., Шекер", "1940-ж., Төлөйкөн", "1910-ж., Күн-Батыш"], "a": 0}, {"q": "Биринчи ырлар жыйнагы?", "o": ["«Күрөш»", "«Баатырлар»", "«Кең-Суу»", "«Темир»"], "a": 0}, {"q": "СССРдин Мамлекеттик сыйлыгын алган романы?", "o": ["«Биздин замандын кишилери»", "«Тоо балдары»", "«Көк асаба»", "«Зайыптар»"], "a": 0}, {"q": "Жазуучу кандай ат менен аталган?", "o": ["Кара сөздүн алпы", "От жүрөк акын", "Ак таңдай", "Төкмө"], "a": 0}]}]}, {"t": "sort", "i": "think", "h": "Т. Сыдыкбековдун чыгармаларын жанрлары боюнча бөлгүлө. <small style=\"color:#7a6a60;font-weight:400\">(52-бет)</small>", "cols": ["Романдар", "Повесттер", "Драмалар", "Лирика (ырлар)"], "items": [["«Кең-Суу»", 0], ["«Тоо арасында»", 0], ["«Темир»", 0], ["«Көк асаба»", 0], ["«Ала-Тоодон алтоо»", 1], ["«Акылман куудул»", 1], ["«Майданда»", 2], ["«Манас менен Алманбет»", 2], ["«Күрөш»", 3], ["«Акын булбул»", 3]]}, {"t": "gap", "i": "write", "h": "Бош орундарды толтургула.", "items": ["Т. Сыдыкбеков [1912]-жылы Ысык-Көлдөгү [Кең-Суу] айылында туулган.", "«Биздин замандын кишилери» романы [1948]-жылы чыгып, СССРдин [Мамлекеттик] сыйлыгын алган.", "Жазуучу [1997]-жылы 19-июлда каза болгон."]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(51-бет)</small>", "qs": ["1. Т. Сыдыкбековдун кайсы чыгармаларын окуп чыккансыңар?", "2. Жазуучунун бала чагы жана үй-бүлөсү тууралуу эмнелерди билдиңер?", "3. Т. Сыдыкбеков чыгармачылыгын кайсы жанрдагы чыгармадан башталган?", "4. Улуу Ата Мекендик согуш мезгилиндеги эл достугун даңазалаган чыгармасы кайсы?", "5. Жазуучунун прозалык чыгармалары негизинен кайсы темаларга арналган?", "6. Эмне үчүн Т. Сыдыкбековду «кара сөздүн алпы» деп аташкан?"], "rows": 3, "ex": "1. (Өз жообуңар.)<br>2. Карапайым үй-бүлөдө туулган, экиге чыга электе атасы келтеден өлүп, эненин колунда өскөн.<br>3. Ырлардан («Күрөш» жыйнагы, 1936).<br>4. «Биздин замандын кишилери».<br>5. Эл турмушу, коллективдештирүү, согуш, аялдар темасы, балдар.<br>6. Анткени ал көптөгөн ири романдарды жараткан, кара сөздүн чебери болгон."}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t3l9", "title": "«Акылман куудул» повести", "ky": "Куйручуктун образы. Сатира жана юмор", "gram": "<b>Сатира</b> (гр. — <i>түрдүү, аралаш</i>) — коомдук турмуштагы терс көрүнүштөрдү, адамдардын жагымсыз сапаттарын күлкүгө алып, сындаган чыгармалар. <b>Юмор</b> (анг. — <i>суюктук</i>) — адамдардын мүнөзүндөгү, иш-аракетиндеги айрым көрүнүштөрдү тамашага алуу, күлкү чыгаруу.", "lex": "куудул, айылчылашкан, окшурайтып, чулчуйтат, моюнчаларга учкашып, козукулак, даардашат, төө бастылашат, будалайт, мите, түлөө, саба бышылып, өпчап, соолчу болду, ыпчаны, суутка койгон, жектесин, керегенин көзүнөн, чөлдөпмүн", "tasks": [{"t": "vocab", "i": "think", "h": "Сөздүк. Басканда угулат (🔊). <small style=\"color:#7a6a60;font-weight:400\">(54-бет)</small>", "w": [["куудул", "сөзгө чечен, күлкүгө бай адам", "остряк, шутник", "🤡"], ["айылчылашуу", "айылга коноктоп баруу", "ездить в гости", "🏘️"], ["окшурайтып", "көзүн кысып, бурдап", "прищурив", "😉"], ["чулчуйтуу", "сороюп, бүрүшүп отуруу", "сидеть нахохлившись", "🪑"], ["моюнчага учкашуу", "мойнуна минип алуу", "сесть на шею", "🤸"], ["козукулак", "кичине жабуу, жапкыч", "небольшое покрывало", "🧣"], ["даардашуу", "жөөлөшүп ойноо", "толкаться", "🤼"], ["төө бастылашуу", "жыгылып үстүнө чыгып ойноо", "игра в «верблюда»", "🐫"], ["будалоо", "чаташтыруу, алдоо", "сбивать с толку", "🌀"], ["мите", "кан соргуч курт", "клещ, кровосос", "🪳"], ["түлөө", "курмандык чалуу", "жертвоприношение", "🐑"], ["саба бышылуу", "кымыз бышуу", "взбивать кумыс", "🥛"], ["өпчап", "жарым-жартылай", "наполовину", "½"], ["соолчу болду", "кургап калды", "стал высыхать", "🥀"], ["ыпча", "кереге жабуу, чий", "циновка", "🧺"], ["суутка койгон", "суутуп, сууга байлаган (ат)", "поставленный на выстойку (конь)", "🐎"], ["жектөө", "жек көрүү, айыптоо", "осуждать", "👎"], ["керегенин көзү", "керегенин тешиги", "ячейка решётки юрты", "🪟"], ["чөлдөө", "суусоо", "жаждать", "🥵"], ["алейсалам", "пайгамбарга айтылуучу сөз", "мир ему", "🕌"], ["анекдот", "кыска күлкүлүү аңгеме", "анекдот", "😂"]]}, {"t": "read", "i": "read", "h": "Повесть жөнүндө окугула. <small style=\"color:#7a6a60;font-weight:400\">(52-бет)</small>", "title": "Т. Сыдыкбековдун «Акылман куудул» повести тууралуу", "text": ["Сөзгө чечен, күлкүгө бай, аткаруучулук чеберчилиги күчтүү адамдар куудул аталат. Алар бирөөлөрдү шылдыңдаган, анекдот айткан, күлкүлүү чыгармаларды аткарган.", "XIX кылымдын аягы XX кылымдын башында жашаган Жоошбай (1840–1919), Көкөтөй (1849–1916), Карачунак (1862–1933), Куйручук (1866–1940), Бекназар (1884–1953), Сары учук (1858–1943), Шаршен (1896–1942) сыяктуу куудулдар элдин эсинде сакталып калган. Алардын ысымын, куудулдук окуяларын, курч сөздөрүн муундан-муунга өткөрүп, эл эсинде сактап келген. Ошондой куудулдардын бири Куйручук болуп эсептелет.", "Т. Сыдыкбековдун «Акылман куудул» повестинде Куйручуктун (өз аты Кудайберген) бала чагынан баштап, куудулдугу менен эл ичине таанылган учуруна чейин сүрөттөлгөн. Куйручук сөзмөр-ойчул да, тайманбас-өткүр да адам болгондуктан, ач көз байлардан, бийлерден жана молдолордон тартынбай шылдыңдаган. Ар кандай кырдаалдардан да чукугандай жооп таап, жазадан кутулуп кетип турган. Куйручук кайсы бир учурда бүт турпатын түрлөнтө билген артист да болгон.", "Калк ичинде Куйручук сыяктуу куудулдардан бийликтеги адамдар, байлар жазганып турушкан. Анын негизги куралы өз орду менен курч айтылган сөз болуп саналат. Мындай сапат айрыкча Куйручукка мүнөздүү болгонун жазуучу кызыктуу окуялар, өзгөчө мүнөздөр аркылуу ачып берген."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Куудул деген ким?", "o": ["Сөзгө чечен, күлкүгө бай адам", "Акын", "Мерген", "Молдо"], "a": 0}, {"q": "Куйручуктун өз аты?", "o": ["Кудайберген", "Жоошбай", "Шаршен", "Бекназар"], "a": 0}, {"q": "Куйручук качан жашаган?", "o": ["1866–1940", "1840–1919", "1896–1942", "1912–1997"], "a": 0}, {"q": "Куудулдун негизги куралы?", "o": ["Курч айтылган сөз", "Мылтык", "Комуз", "Камчы"], "a": 0}]}]}, {"t": "read", "i": "read", "h": "Повесттен үзүндүнү окугула (1-бөлүк). <small style=\"color:#7a6a60;font-weight:400\">(53-бет)</small>", "title": "Акылман куудул (үзүндү, 1)", "text": ["Жеңенин колун караган Кудайберген боз тондун ичинде ошо ач калган күндөрү күнгө жылынып, көбүк черткен мөлтүр суудан жутуп алып, эч кайгысыз-муңсуз балдардай оюндун артында.", "Бирок Кудайбергендин оюну башка балдардын оюнунан бөтөнүрөөк. Башка балдар моюнчага учкашып, чоң кишилерди туурап бирин-бири конокко чакырышып айылчылашкан болсо, Кудайберген ошо айылчылашкан балдардын алдынан карп-курп чыгып, кебетесин өзгөртүп не сыңар аяктап, бир көзүн окшурайтып, жаагын чулчуйтат.", "— Ой, сен кайдагы желмогузсуң? — дешсе балдар!", "— Жерден чыккан жекмин! — дейт Кудайберген. — Убадама бекмин. Конок болгон үйүңөрдө мени олтургузбасаңар же моюнчаңарды соромун, же өзүңөр бирди көрөсүңөр.", "Кудайберген ошо өзү каалагандай «төргө» олтурат.", "Жерден чыккан Жек аке, убадага бек аке, Сиздин устукан мына. Алыңыз майы эрип кете электе, же Байдөбөт мүлжүп сала электе, — дешип балдар Кудайбергендин алдына жалбыракка салып каакым, козукулак коюшат.", "Ушу бала кезинде эле эки таноосу барбайыңкы, мурду кобулдуу Кудайбергендин кабагы тик, кашы түктүгүй. Бүт жаратылышы бир кызык. Ал мыкчынып, букчуюп кебетесин өзгөртөм десе деле кыжыры кайнап олтурганды кулдүргүдөй өзгөртөт.", "Албетте, бала-бала. Оюн-оюн. Ошентип быкыйып-букуюп теңтуштарын кулдүргөн Кудайбергенди ошол эле теңтуштары даардашат. Төө бастылашат. Бирок мында да Кудайбергендин бир артыкчылыгы өзү курдуу балдардын эки-үчөөнө бой бербейт. Кайра балдарды өзү будалайт. Ансыз жерден чыккан жек болушка мүмкүн эмес да.", "Ошентип бирде жек болуп, бирде касиеттүү Кысыр алейсаламмын деп, өзүнө балдарды сыйынтып не жалгыз көздүү Дөө болуп балдарды коркутат. Анан, көктөн түшкөн сыйкырчы келди деп дубалап, уктабасты уктатып, же эшек минип эпейип, Мекеден жарыктык ажы келди деп өзүн — ажы этип балдарга тобо айттырат. Айтор, күнү бою ойго түшпөстү ойлоп таап ачкалыгын Кудайберген түнкүсүн тыякта катылуу жаткан түтүгүн алып, кадимкидей «жортуулга» чыгат.", "Анын бул укмуш «жортуулун» кечке өзү менен бирге ойногон теңтуштары да сезе элек. Аны сездирсе, ал жерден чыккан жек боло албайт да…"], "qs": [{"t": "tf", "i": "think", "h": "Туура же ката экенин белгилегиле.", "qs": [{"s": "Кудайберген жетим бала, жеңесинин колунда ач жүргөн.", "a": true}, {"s": "Кудайберген балдарды «жерден чыккан жекмин» деп коркуткан.", "a": true}, {"s": "Балдар Кудайбергенге чыныгы эт берген.", "a": false, "fix": "Жалбыракка каакым, козукулак коюшкан."}, {"s": "Кудайберген бала кезинде эле кебетесин өзгөртө билген.", "a": true}, {"s": "Кудайберген түнкүсүн түтүк менен «жортуулга» чыккан.", "a": true}]}]}, {"t": "read", "i": "read", "h": "Үзүндүнүн 2-бөлүгүн окугула. <small style=\"color:#7a6a60;font-weight:400\">(55-бет)</small>", "title": "Акылман куудул (үзүндү, 2)", "text": ["Айыл жайлоодо. Көчмөн журт жайлоосуз күн көрө албайт эмеспи. Деле жалгыз аттуу, жалаң тондуу кедейи да жер чийип жатакта калышты — өлүк санайт дечи. Төрт-беш түтүнү малдуу калгандары ошентип малдууларына коңшу конуп, бир чоң айыл болушуп ага-тууган жайлоолоп жүрүшкөн кез.", "Деле сааны жогуна саан каралашуу, соёрго малы жогуна союш беришүү ынтымактын эң башкы эрежеси эмесии. Ушул эрежеден чыкпай жайлоолоп көчүп-конгон бир айылда кулак эшитип, көз көрбөгөн сырдуу окуя башталды.", "Ак сатып көрбөгөн, акты кишиден аяп көрбөгөн бейпил үйдө деле табак-табак каймактаткан сүтү ошо табагында соолот. Сапсары каймагы табакка жабышып калат. Күндө бир үйдүн табагындагы сүтү соолчу болду. Бул табышмактуу окуя момун кишилерди чочутту. Бул кудайымдын бизге деген бир сыры. Биздин тукум кудайга эминеден жаздык дешип, карыялар жака карманышты.", "Мите деген сорот дечү эле. Ошо митеси соруп жатпасын дегендер ал митенин өзү кандай болорун билишпей, коркунучтуу нерсени кеп салып тек калышат. Иликтешти. Аңдышты. Эч кандай мите-сите деле билинбейт.", "Неси болсо да бир себеби болор дешип айылдагылар тиги суу боюна кудайга жалынып арбактарга мал атап, түлөө өткөрүүгө келишти. Мал союлду — түлөө да өткөрүлдү. Кудаанын кудуретине тобо деңиз. Ошол күндөн баштап табактагы сүттөр соолбой, сүт бетинде сары каймак калдайып калың.", "Бирок… Ошол түлөө өткөргөн күндүн кечинде Кудайбергендин агасы түндүн бир маалында суутка койгон атын агытып жибериш үчүн сыртка чыгып, өз үйүнүн ыпча тарабынан бир шумдукту көрүп калды. Адегенде чочуп кеткен ага жүрөк токтотуп жакындады эле, тиги түйүнчөктөй болуп бозорган өз иниси Кудайберген экен. Ал узун түтүктү керегенин көзүнөн сойлотуп, табактагы сүттү жутуп жатат.", "— Ой, ушу шумдукту иштеп жүргөн мите сен белең?.. — Мен элем аба… — Ой кудай урган, бул эмнең? Бизди элге-журтка уят кылбадыңбы?.. — Уялбай эле кой, аба. Кечээки түлөөнүн этине Сиз деле чоң тойгондой болдуңуз го. Эт жедирген кишини ким жектесин. Эт жегендердин баарысы маа ыраазы эле болушаар… Хи-хи… — Капаланба, аба. Кечээ мен да сорпо-шилеңге чоң тойгон элем. Катуу чөлдөпмүн. Башка үйгө жете албай өзүбүздүн сүттү ичип койдум. Хи-хи…", "— Күлбөй күмүрөй бол, — деп агасы Кудайбергенди жемеледи. Бирок сыр ачылса инимдин шумдугу үчүн мен айып тартып каламбы деп «мите» сыры жабылуу калды."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Айылда кандай табышмактуу окуя болду?", "o": ["Табактагы сүт соолуп калчу болду", "Малдар жоголду", "Боз үй күйдү", "Суу кургады"], "a": 0}, {"q": "Айылдыктар бул окуяны эмнеден көрүштү?", "o": ["Мите соруп жатат деп", "Уурудан", "Шамалдан", "Балдардан"], "a": 0}, {"q": "Эл эмне кылды?", "o": ["Мал союп, түлөө өткөрдү", "Көчүп кетти", "Милиция чакырды", "Эч нерсе кылган жок"], "a": 0}, {"q": "Сүттү ким ичип жүргөн экен?", "o": ["Кудайберген түтүк менен", "Мите", "Агасы", "Мышык"], "a": 0}, {"q": "Агасы сырды эмне үчүн ачкан жок?", "o": ["Айып тартып калам деп", "Унутуп калды", "Күлкүсү келди", "Коркту"], "a": 0}]}]}, {"t": "order", "i": "think", "h": "Окуялардын иретин эстеп, ар бир сүйлөмдүн сөздөрүн туура тартипке койгула.", "items": [["Табактагы сүт соолчу болду", "1-окуя"], ["Эл мите соруп жатат деп коркту", "2-окуя"], ["Айыл түлөө өткөрдү", "3-окуя"], ["Агасы Кудайбергенди кармап алды", "4-окуя"]]}, {"t": "mcm", "i": "think", "h": "Сатира же юмор?", "qs": [{"q": "Бай-бийлердин кемчиликтерин күлкүгө алып сындаган чыгарма — бул:", "o": ["Сатира", "Юмор", "Лирика", "Эпос"], "a": [0]}, {"q": "Адамдын мүнөзүндөгү көрүнүштөрдү жөн гана тамашалап, күлкү чыгаруу — бул:", "o": ["Юмор", "Сатира", "Драма", "Трагедия"], "a": [0]}, {"q": "Кудайбергендин «мите» окуясы — бул:", "o": ["Юмор", "Сатира", "Трагедия", "Эпос"], "a": [0]}]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(58-бет)</small>", "qs": ["1. Текст боюнча түшүнгөнүңөрдү план боюнча кыскача жазып чыккыла: а) Жайлоонун жай турмушунда жашаган чоң айыл; б) Сүттү соолуткан табышмактуу окуя элди чочутту; в) Кудайга жалынган момундар түлөө беришти; г) Суусаган мите ким болуп чыкты?", "2. Жерден чыккан жекмин; Кысыр алейсаламмын; жалгыз көздүү Дөө; сыйкырчы; жарыктык ажы — деп ойногон Кудайберген жетимдин келечектеги кайсы сапаттарынан кабар берет?", "3. Момун элди чочуткан окуяны алар эмнеге жорушту? Эл-журт эмне үчүн түлөө өткөрдү?", "4. Куудулдун түтүк менен керегеден сүт сорууну — уурулукпу же айлакерликпи?", "5. Эгерде куудулдун жоругу элге билингенде окуя кандайча өнүгөт эле?", "6. Кудайбергендин бул жоругу өзүнөн башка кимдерге пайдалуу болду?", "7. Силердин турмушуңарда кандай күлкүлүү окуялар болгонун эстегиле."], "rows": 3, "ex": "1. а) Айыл жайлоодо, ынтымактуу жашайт; б) сүт соолуп, эл чочуйт; в) мал союп түлөө берет; г) мите — Кудайберген.<br>2. Артисттик, айлакерлик, сөзмөрлүк, тайманбастык.<br>3. Кудайдын сыры, мите деп жорушту; кудайга жалынуу үчүн түлөө өткөрүштү.<br>4. Айлакерлик, тамаша; бирок башкалардын сүтүн ичүү туура эмес.<br>5. Эл ачууланып, агасы айып тартмак.<br>6. Түлөөдө эт жеген бүт айылга пайдалуу болду.<br>7. (Өз окуяңар.)"}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t3l10", "title": "Повесттеги Куйручуктун образы", "ky": "Талдоо", "gram": "<b>Образ</b> — чыгармадагы каармандын көркөм сүрөттөлүшү. Куйручуктун образы: <i>тирикарак, өтө айлакер, тибиртке тилдүү, тайманбас, сөзгө чебер</i>.", "lex": "тирикарак, айлакер, тибиртке тилдүү, тикенектей сөз, кемсинткен, кем бааламак, ак-караны ажыраткан, чечендик, классик", "tasks": [{"t": "vocab", "i": "think", "h": "Жаңы сөздөр. Басканда угулат (🔊).", "w": [["тирикарак", "тың, шамдагай", "бойкий, расторопный", "⚡"], ["айлакер", "амалкөй, акылдуу", "хитроумный", "🦊"], ["тибиртке тилдүү", "курч, өткүр тилдүү", "острый на язык", "🗡️"], ["тикенектей", "чагуучу, курч", "колкий", "🌵"], ["кемсинтүү", "басмырлоо, теңсинбөө", "унижать", "👎"], ["ак-караны ажыратуу", "жакшы-жаманды айыруу", "различать добро и зло", "⚖️"], ["чечендик", "сөзгө чебердик", "красноречие", "🎙️"], ["классик", "үлгүлүү, эң мыкты өкүл", "классик", "🏛️"], ["жекирүү", "жемелөө, кемсинтүү", "попрекать", "😠"], ["кыраан", "чечкиндүү, курч", "отважный", "🦅"], ["кара жаак", "сөзгө чебер, тилдүү", "красноречивый", "🗣️"]]}, {"t": "read", "i": "read", "h": "Текстти окугула. <small style=\"color:#7a6a60;font-weight:400\">(58-бет)</small>", "title": "Т. Сыдыкбековдун «Акылман куудул» повестиндеги Куйручуктун образы", "text": ["Жазуучу талантынын ар тараптуулугу менен айырмаланган Куйручуктун (Кудайберген) өмүр жолун көркөм сөз менен ачып берген. Повесттин сюжети башкы каармандын айланасына топтолуп, куудулдун образы кеңири сүрөттөлгөн. Куйручуктун талантынын калыптанышына татаал тагдыры, жетимдиктин оор сыноолору таасир бергенин көрөбүз. Ошондуктан ал тирикарак, өтө айлакер, тибиртке тилдүү шок бала болуп калыптанган.", "Кара курсактын айынан түн ортосунда айылдагылардын сүтүн түтүк менен ичет. Мал-жандуу байлардын үшүн алып түлөө өткөртөт. Куйручукка окшогон жетим-жесирлер этке тоюп, көңүлдөрү жайланат. Чыгарманын башталышындагы Куйручуктун бул жоругунан анын келечектеги талантынын маңызы ачыла баштайт. Ал турмуштун адилетсиздигине жана материалдык теңсиздикке өз өнөрүн жана күлкүлүү жоруктарын каршы койгон.", "Жардылар менен бөлүшпөгөн зыкым байларга, карапайым адамды кемсинткен текебер бийлерге тикенектей сөзү менен тийген. Бийлигине, мансабына карабай алардын кемчиликтерин эл алдында айтып жазалаган.", "Чыгармада Касымалы, Кудайберген, Чолпонкул, Көкүмбай, Кадыма сыяктуу бай-бийлерди оор абалга такап, шылдыңдаганын көрөбүз. Мындай жүйөлүү сын-пикири, так айтылган чечен сөзү менен «эл жакшыларын» эсине келтирген. Эмгек акысын ала албай жүргөн бечараларга карызын кайтартып берген. Байлыгына эсирген залимдерди, ашкерелеп, карапайым журтту азаптан куткарган.", "Куйручук айтыш өнөрүнө да өз салымын кошкон. Жер кыдырып, эл тааныган. Куйручуктун кара жаак Калмырза, Найманбайды жеңип кеткендиги анын ырчылыгынан да кабар берет. «Кулагы жок чунак, куйругу жок чолок Куйручук» деп жекирген манапка куудул мындай деп жооп кайтарган: «Куйругум чолок болсо — тулпар чыгаармын, Кулагым чунак болсо — шумкар чыгаармын. Куйругу узунду ит дейбиз, Кулагы узунду эшек дейбиз».", "1928-жылы Бишкек шаарында Куйручуктун өз башынан өткөргөн окуялары жазылып алынган. Куйручук чечендик өнөрүн куудулдук менен айкалыштырган кайталангыс классик катары элибиздин тарыхында жашай берет."], "qs": [{"t": "mcm", "i": "think", "h": "Куйручуктун сапаттарын тандагыла (бир нече жооп).", "qs": [{"q": "Куйручук кандай адам?", "o": ["Тирикарак, айлакер", "Тибиртке тилдүү, тайманбас", "Коркок, жалкоо", "Сөзгө чебер, чечен"], "a": [0, 1, 3]}, {"q": "Куйручук кимдерди шылдыңдаган?", "o": ["Зыкым байларды", "Текебер бийлерди", "Жетимдерди", "Кедейлерди"], "a": [0, 1]}]}]}, {"t": "match", "i": "think", "h": "Куйручуктун жообун жупташтыргыла.", "pairs": [["Куйругум чолок болсо", "тулпар чыгаармын"], ["Кулагым чунак болсо", "шумкар чыгаармын"], ["Куйругу узунду", "ит дейбиз"], ["Кулагы узунду", "эшек дейбиз"]]}, {"t": "gap", "i": "write", "h": "Акылман Куйручуктун айткандарын толуктагыла. <small style=\"color:#7a6a60;font-weight:400\">(61-бет)</small>", "items": ["Ат мүдүрүнүп аксайт, азамат [жутунуп] аксайт.", "Ынсап — ырыс [төрөйт].", "Кишини ит этчү — ач көздүк менен [арамдык].", "Ач көз менен арамдын колунан келчү иш — [жамандык]!"]}, {"t": "open", "i": "group", "h": "Суроолор жана тапшырмалар боюнча иштегиле. <small style=\"color:#7a6a60;font-weight:400\">(60-бет)</small>", "qs": ["1. Куудулдун мүнөзү кандай шарттарда калыптанган? Тагдырдын оор сыноолорунан татыктуу чыгууга кайсы сапаттары жардам берген деп ойлойсуң?", "2. Куйручук коомдогу кайсы көрүнүштөргө каршы турган, тикенектей тили кимдерге багытталган?", "3. Адилетсиз байларды жана бийлерди шылдыңдап, алсыздарды коргоо үчүн адамда дагы кайсы сапаттар болушу керек деп эсептейсиң?", "4. Куудулдун замандаштары аны кандайча баалашкан?", "5. Куйручук тирүү болгондо коомдогу кайсы кемчиликтерди сындайт эле? Чындыкты бетке айткан азыркы учурдун азамат куудулдарынан кимдерди билесиң?", "6. Текст боюнча Куйручукту башка балдар менен салыштыргыла (абалы, оюндары, жүрүм-туруму).", "7. Эмне үчүн Куйручукту ар тараптуу талант деп баалайбыз?"], "rows": 3, "ex": "1. Жетимдик, ачкачылык шартында; тирикарактык, айлакерлик, тайманбастык жардам берген.<br>2. Адилетсиздикке, материалдык теңсиздикке; зыкым байларга, текебер бийлерге.<br>3. Эр жүрөктүк, адилеттүүлүк, сөзгө чебердик, акыл.<br>4. Акылман, кыраан, тайманбас, чынчыл, чечен деп баалашкан.<br>5. Коррупцияны, калп айтууну, ач көздүктү; (өз жообуңар).<br>6. Куйручук — жетим, ачка, бирок айлакер, башкаларды будалайт; башка балдар — ата-энелүү, ток, жөнөкөй ойнойт.<br>7. Куудул, ырчы, артист, чечен, айтышка катышкан."}, {"t": "write", "i": "write", "h": "«Куйручук — чечендик, куудулдук өнөрдүн классиги» деген темада эссе жазгыла. <small style=\"color:#7a6a60;font-weight:400\">(60-бет)</small>", "rows": 6, "min": 50, "ph": "Куйручук — …", "sample": "Куйручук — кыргыз элинин улуу куудулу. Ал жетим өссө да, акылы, курч сөзү менен байларды, бийлерди шылдыңдап, карапайым элди коргогон. Анын сөздөрү азыр да макал болуп айтылат."}, {"t": "box", "i": "think", "h": "Кызыктуу фактылар", "c": "y", "html": "1. Түгөлбай Сыдыкбеков 30-жылдардын аягында «Акылман куудул» повестинин каарманы Куйручук менен жолугушкан. Бул жолугушууда кыргыздын алгачкы акын жазуучулары Кубанычбек Маликов, Мукай Элебаев жана Жоомарт Бөкөнбаев да болушкан. Куйручук алардын ар биринин мүнөзүн, келечегин ачык айткан.<br>2. Куйручуктун Жаш Түгөлбайга берген мүнөздөмөсү: «Ачык кабак, жайык төш азаматтын жаркыны! Жамандык келбес кулунан, жакшылык кетпес оюнан — ою тунук турбайбы. Бет алганын бек өтөөр, деми күчтүү турбайбы. Унчукпай туруп төп сүйлөөр, кеби күчтүү турбайбы!»"}, {"t": "light", "i": "think", "h": "Теманы кандай түшүндүңөр?"}]}, {"id": "t3l11", "title": "Жусуп Турусбеков. «Энем» поэмасы", "ky": "Акындын өмүрү (1910–1943). Поэманы окуу", "gram": "<b>Лирикалык каарман</b> — лирикалык чыгармада сезими, ой толгоосу берилген каармандын образы («Энем» поэмасынын лирикалык каарманы — шаарга окууга кеткен жаш адам). <b>Автордук маанай (пафос)</b> — көркөм чыгарманын идеялык-эмоциялык абалынын багыты.", "lex": "жетимдер үйү, тарбиялануу, курулуш, кайраттуулук, мыкаачылык, азап-тозок, боштондук, курман болуу, өзгөрүү, жаңыруу, Үркүн", "tasks": [{"t": "vocab", "i": "think", "h": "Сөздүк. Басканда угулат (🔊). <small style=\"color:#7a6a60;font-weight:400\">(63-бет)</small>", "w": [["жетимдер үйү", "балдар үйү, интернат", "детский дом", "🏠"], ["тарбиялануу", "тарбия алуу", "воспитываться", "🎓"], ["курулуш", "куруу иши, структура", "строение, строительство", "🏗️"], ["кайраттуулук", "эрдик, бекемдик", "мужество", "💪"], ["мыкаачылык", "ырайымсыздык", "жестокость", "😠"], ["азап-тозок", "кыйынчылык, кордук", "мучения", "😣"], ["боштондук", "эркиндик", "свобода", "🕊️"], ["курман болуу", "каза табуу", "погибнуть", "🕯️"], ["өзгөрүү", "башкача болуу", "изменение", "🔄"], ["жаңыруу", "жаңыланып, жаңыча болуу", "обновление", "✨"], ["Үркүн", "1916-жылдагы кыргыздардын көтөрүлүшү жана качуусу", "Уркун (1916)", "🏃"], ["тентек", "шок, тынч эмес", "шалун", "😜"], ["таарынчак", "тез таарынган", "обидчивый", "😤"], ["кордук көрүү", "кемсинтүүгө дуушар болуу", "терпеть унижение", "😔"], ["улгайган", "карыган", "пожилой", "👵"], ["сабат", "кат таануу, билим", "грамотность", "📖"]]}, {"t": "read", "i": "read", "h": "Акын жөнүндө окугула. <small style=\"color:#7a6a60;font-weight:400\">(62-бет)</small>", "title": "Жусуп Турусбеков (1910–1943)", "text": ["Кыргыз адабиятынын баштоочуларынын бири акын, драматург Жусуп Турусбеков 1910-жылы Ысык-Көл өрөөнүнүн Күн-Батыш айылында туулган.", "Үркүндө Жусуп болгону алты гана жашта болгон. Ал эл менен бирге бардык азап-тозокторду башынан өткөрдү. Эл туулуп-өскөн жерине кайтканда, Жусуп үй-бүлөсү менен Караколдо жашап калышат. Көп узабай эле эне-атасы, карындашы өлүп, бир үйдө тогуз жашар Жусуп жалгыз калат. Башынан оор күндөр өтөт, акыры Караколдогу жетимдер үйүнө кабыл алынып, тарбияланат.", "Андан кийин Түптөгү айыл чарба техникумунан билим алат. Окуусун аяктаган соң «Кызыл Кыргызстан» республикалык гезитинде иштеген. 1929-жылы Жусуп Турусбеков Тверь шаарындагы (азыркы Калинин) советтик-партиялык мектепке жөнөтүлөт. Орус тилин үйрөнөт, орус адабияты менен кенен таанышат, айрым орус акындарынын чыгармаларын которуп да көрөт.", "1929-жылы «Ленин жолу» деген биринчи ыры «Эркин-Тоо» гезитине басылат. Алгачкы ырлар жыйнагы 1932-жылы жарык көрөт. Жусуп жаңы формада «Ленин жолу», «Ук, жер жүзү!» аттуу ырларын жазган. Ыр жаңыча ритмикалык курулушу, лирикалык каарманын жаңыча көз карашы, пафосу менен өзгөчөлөнөт. Ошондуктан Жусуп кыргыз поэзиясында жаңычыл, новатор акын катары мүнөздөлөт. Адабиятчы С. Шмеев белгилегендей, Жусуптун ырларында орус акындарынын, айрыкча, В. В. Маяковскийдин таасири байкалат. Ал эми салттуу мүнөздө жазган «Кызыл жоолукчан», «Эсимде» сыяктуу лирикалык ырларына обон чыгарылып, алар азыркы күнгө чейин ырдалып келе жатат.", "Жусуптун «Ажал ордуна» деген музыкалык драмасы 1939-жылы Москва шаарында өткөн кыргыз адабият жана искусство декадасында көрсөтүлүп, жогору бааланган. Драмада 1916-жылдагы кыргыз элинин улуттук-боштондук көтөрүлүшү чагылдырылган. Чыгарма Улуу Октябрь революциясы кыргыз элин ажалдан сактап, ажал ордуна өмүр, бакыт алып келгендигин баяндайт.", "Акын «Өткөн күндөр», «Энем», «Кыргыздар», «Каракчынын трагедиясы» поэмаларында жаңы замандын адамдарынын образдарын түзгөн. Совет элинин Улуу Ата Мекендик согуштагы кайраттуулугун, эрдигин көрсөткөн.", "Жусуп Турусбеков согуш башталганда өз ыктыяры менен майданга кетип, 1943-жылы согуш талаасында курман болгон."], "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Ж. Турусбеков качан, кайда туулган?", "o": ["1910-ж., Ысык-Көл, Күн-Батыш айылы", "1912-ж., Кең-Суу", "1915-ж., Беш-Бадам", "1928-ж., Шекер"], "a": 0}, {"q": "Үркүн болгондо Жусуп канча жашта эле?", "o": ["Алты", "Тогуз", "Он", "Он төрт"], "a": 0}, {"q": "Биринчи ыры кайсы гезитке басылган?", "o": ["«Эркин-Тоо»", "«Ленин жолу»", "«Ала-Тоо»", "«Кызыл Кыргызстан»"], "a": 0}, {"q": "«Ажал ордуна» драмасы эмне жөнүндө?", "o": ["1916-жылдагы көтөрүлүш жөнүндө", "Согуш жөнүндө", "Мектеп жөнүндө", "Сүйүү жөнүндө"], "a": 0}, {"q": "Акын качан, кайда курман болгон?", "o": ["1943-ж., согуш талаасында", "1916-ж., Үркүндө", "1950-ж., Фрунзеде", "1939-ж., Москвада"], "a": 0}]}]}, {"t": "match", "i": "think", "h": "Жылдар менен окуяларды жупташтыргыла. <small style=\"color:#7a6a60;font-weight:400\">(64-бет)</small>", "pairs": [["1910-жыл", "туулган"], ["1916-жыл", "Үркүн, жетим калды"], ["1929-жыл", "биринчи ыры басылды, Тверге жөнөтүлдү"], ["1932-жыл", "алгачкы ырлар жыйнагы чыкты"], ["1939-жыл", "«Ажал ордуна» Москвада көрсөтүлдү"], ["1943-жыл", "согуш талаасында курман болду"]]}, {"t": "read", "i": "read", "h": "«Энем» поэмасынан үзүндүнү окугула. <small style=\"color:#7a6a60;font-weight:400\">(65-бет)</small>", "title": "Энем (үзүндү)", "text": ["Күткөндүрсүң, Келдим, эне, аманбы? Кучактачы, Сүйчү беттен балаңды! Беш жыл бою Тентип кеттим дайынсыз, Сагындың го, Бир көрө албай карамды!", "Сагынганда Тентип кеткен балаңды Жүзгө жоруп, Жүгүрттүң го санааңды? Каттоочудан: «Кат жазсын!» — деп, айттырып. Кийинчерээк Ала бердиң мазамды.", "Тентек эле, Эмне болду дедиңби? Күндө ойлоп, Асан кайгы жедиңби? Кимдер тилдеп, Кимдер шагын сындырып, Муңайтты — деп, Кейиттиңби зээниңди?.. Ай, ушул сен, Кейий берген энемсиң, Бекер ойлоп, Бекер кайгы жегенсиң.", "Мен кетерде, Беттен өөп, кучактап: — «Кагылайын, Кайраттуу жүр» — дегенсиң. …Энекебай, Кайратымдан жазбадым Мен мурунку Мен эмесмин башкамын Тентек жана Таарынчаактык мүнөздөр Жаман экен Ишен, эне, таштадым!", "Ха!.. Ха!.. Ха!.. Чүкө салган тулубум, Ташта, энеке, Кереги жок мунуңдун! Шайыр жаштар Арасында чоңоюп, Чүкө ойнобойт, Жигит болгон кулунуң!", "Окуп, эне, Мектебимди бүтүрдүм, Шаардагы Өмүрүмдө 5 жылдык. Көз ачылып, Көп нерсеге түшүндүм. Шайыр жаштар — Тамашасыз жүрбөгөн, Сабакта да, Оюнда да, иште да, Көрөсүңбү Уулуң, эне, гүлдөгөн!..", "Көрөсүңбү Уулуң «КИМ»ди тагынган. Аячу элең Жаның ачып, энеке, Мен кой айдап, Түшкөн кезде адырдан. Мына бүгүн Ал күндөрдөн арылдым. Комсомолмун Мына «КИМ»ди тагындым. Берчи, энеке, Эмчегиңди эмейин, Берчи, энеке, Ак мамаңды сагындым.", "Мугалиммин, Техникумда окугам. Мугалиммин, Мен жаштарды окутам. Карысаң да Бизге, энеке, керексиң, Сабатыңды Ачып кетем, окусаң! Эпкиндүүмүн Бардыгын да бүтөмүн, Бюрого да мүчөмүн. Культмассовой Сектор болуп, энеке, Жолго коюп, Клуб ишин түзөдүм.", "Келдим, эне, Элди, жерди сагынып. Эмнелер бар Эл ичинде айтып бер Туулган жерим Кетиптир го жаңырып? Бул айылдын Жаңырганы жалганбы? Эмне, энеке, Сенин оюң сандалды, Унуттуңбу Айыл ичин каптаган, Өткөндөгү Үшкүрүк, муң арманды! Э, энеке, Айлаңды биз табарбыз, Бул оюңа, Далай бүлүк саларбыз. Колхоздогу Шайыр жаштар биригип, Сени дагы Шайыр кылып аларбыз!"], "by": "Жусуп Турусбеков", "qs": [{"t": "mc", "i": "think", "h": "Туура жоопту тандагыла.", "qs": [{"q": "Уул канча жыл айылдан алыс жүрдү?", "o": ["Беш жыл", "Үч жыл", "Он жыл", "Бир жыл"], "a": 0}, {"q": "Уул кайда окуп, ким болду?", "o": ["Техникумда окуп, мугалим болду", "Институтта окуп, дарыгер болду", "Аскерде болду", "Молдо болду"], "a": 0}, {"q": "Уул кайсы төш белгини тагынды?", "o": ["«КИМ»", "Медаль", "Орден", "Жылдыз"], "a": 0}, {"q": "Эне баласынын өзгөргөнүн кантип кабыл алды?", "o": ["Түшүнбөй, ою сандалды", "Абдан кубанды", "Ачууланды", "Кайдыгер карады"], "a": 0}]}]}, {"t": "gap", "i": "write", "h": "Ыр саптарын толуктагыла.", "items": ["Күткөндүрсүң, Келдим, [эне], аманбы?", "Мен мурунку Мен эмесмин [башкамын].", "[Мугалиммин], Техникумда окугам.", "Шайыр жаштар Арасында чоңоюп, [Чүкө] ойнобойт, Жигит болгон кулунуң!"]}, {"t": "match", "i": "think", "h": "Сөздөрдү мааниси менен жупташтыргыла.", "pairs": [["санаа", "ой, кайгы"], ["мазаны алуу", "тынчын кетирүү"], ["зээнди кейитүү", "көңүлүн оорутуу"], ["чүкө", "кой-эчкинин жиликтеринин сөөгү, оюн"], ["тулуп", "терини сыйрып жасалган баштык"], ["эпкиндүү", "алдыңкы, жигердүү"], ["сабаттуулук", "кат тааныгандык"]]}, {"t": "read", "i": "read", "h": "Поэманын идеялык мазмунун окугула. <small style=\"color:#7a6a60;font-weight:400\">(71-бет)</small>", "title": "«Энем» поэмасынын идеялык мазмуну", "text": ["Отузунчу жылдарда кыргыз адабиятында жазылган чыгармалардан Жусуп Турусбековдун «Энем» поэмасы айырмаланып турат. Белгилүү сынчы Салижан Жигитов: «Башка поэмалардан өз мезгилинин идеялык духун жана эмоциялык атмосферасын таасын чагылдыргандыгы менен аттын кашкасындай бөлүнүп турат», — деп жогору баалаган. Чыгармада 30-жылдардын жалындуу илеби, кыргыз жаштарынын романтикалуу жалпылаңган образы берилген деп белгилеген.", "Бул поэманын мазмунун чыныгы турмуштук окуя түзөт. Акын жаңы замандын жаңы адамынын образын көрсөтөт. Ал образ окуусун бүтүрүп келген эненин баласы. Бала шаарда билим алып, тентек, таарынчак мүнөзөрүн таштап өзгөрөт. Анын өзгөрүшүнө жаңы заман, шайыр жаштар, жакшы адамдар таасир этет.", "Эне баласын сагынып, ал жөнүндө ар кандай ойлорду ойлойт. Ал замандын өзгөргөнүн түшүнбөй, уулу мурдагыдай эле кордук көрүп жүрөт деп капа болот.", "Улгайган эне менен билимдүү уулдун ортосундагы психологиялык конфликттин негизинде кыргыз турмушундагы өзгөрүүлөр жатат. Акын өзүнүн тагдырынан ошол мезгилдеги бүтүндөй элдин тагдырын көргөн.", "Өнүгүүнүн жаңы жолуна түшкөн эл да, жер да өзгөрүлүп жатса, жалгыз гана эненин түшүнүгү өзгөргөн эмес. Бирок уулу анын да сабаты ачылып, коомдун таасири менен турмуштук ой — түшүнүктөрү да өзгөрөт деп ишенет."]},
