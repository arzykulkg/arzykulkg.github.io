<style>:root{--red:#d62839;--red2:#a81c2c;--gold:#f8b500;--gold2:#ffe08a;--blue:#14507a;--blue2:#1d77ad;--cream:#fff8ec;--ink:#2b1b17;--mut:#7a6a60;--ok:#1f9d55;--no:#d62839;--card:#fff;--line:#eadfce;--r:18px}

.tcard{display:block;text-decoration:none;color:inherit;background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;position:relative;box-shadow:0 6px 18px rgba(80,50,20,.07);transition:transform .15s}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center;text-decoration:none;color:inherit;font-weight:700;display:block}

.crumb{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--mut);margin-bottom:14px;flex-wrap:wrap}.crumb a{color:var(--blue);text-decoration:none;font-weight:700}
.lhead{border-radius:22px;padding:22px 20px;color:#fff;background:var(--c,var(--blue));margin-bottom:16px;position:relative;overflow:hidden}

.task{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(80,50,20,.05)}

.th{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.th .ic{flex:none;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--blue);color:#fff}
.th .ic svg{width:22px;height:22px}
.th .ic.pair{background:#e8744a}.th .ic.write{background:var(--red)}.th .ic.group{background:#7b4fd1}.th .ic.think{background:var(--blue2)}.th .ic.read{background:#2d8a6e}.th .ic.listen{background:#c2185b}.th .ic.game{background:var(--gold);color:#3a2600}
.th h3{font-size:1.02rem;font-family:system-ui,sans-serif;font-weight:700;line-height:1.35}.th h3 b{color:var(--red2);margin-right:4px}
.box{background:#e9f2fb;border:1.5px dashed #86b3d9;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.box table{border-collapse:collapse;width:100%}.box td,.box th{border:1px solid #b8d3ea;padding:6px 8px;text-align:left;vertical-align:top}.box th{background:#cfe3f5}
.box.y{background:#fff6d9;border-color:#e6c25a}.box.r{background:#fdecee;border-color:#e59aa3}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--blue);color:#fff;min-height:44px}
.btn.g{background:#efe5d3;color:var(--ink)}.btn.r{background:var(--red)}.btn.ok{background:var(--ok)}
.btn.s{min-height:36px;padding:6px 12px;font-size:.88rem}
.res{font-weight:800;margin-left:auto}.res.good{color:var(--ok)}.res.mid{color:#b8860b}.res.bad{color:var(--no)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vc{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.vc .e{font-size:2rem}.vc b{font-size:1.05rem}.vc i{font-style:normal;color:var(--red2);font-weight:600;display:none}.vc s{text-decoration:none;color:var(--mut);font-size:.85rem;display:none}

.line{display:flex;gap:10px;margin:8px 0;align-items:flex-start}

.line.B .sp{background:var(--red)}
.line .tx{flex:1;background:#f7f1e6;border-radius:4px 14px 14px 14px;padding:8px 12px}.line.B .tx{background:#fdeceb;border-radius:14px 4px 14px 14px}
.line.hid .tx{filter:blur(6px);cursor:pointer}
.say{border:0;background:none;font-size:1.1rem;padding:2px 6px;opacity:.75}
.txt p{margin:.5em 0}.txt{font-size:1.05rem;line-height:1.65}
.w.k{border-bottom:1.5px dotted var(--blue2);cursor:pointer}.w.k:active{background:var(--gold2)}
.hl{background:#fff1b8;border-radius:4px}

#tip b{color:var(--gold)}#tip button{border:0;background:none;color:#fff;margin-left:6px}
.q{margin:12px 0}.q>p{margin:0 0 6px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.o{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px}

.tfb{display:flex;gap:8px}.tfb .o{flex:1;text-align:center}
.q .fx{font-size:.9rem;color:var(--ok);margin-top:4px;display:none}.q.show .fx{display:block}

.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.mt .o{padding:8px 10px;font-size:.95rem;position:relative}
.mt .o[data-p]::after{content:attr(data-p);position:absolute;right:6px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--blue2);color:#fff;font-size:.72rem;display:flex;align-items:center;justify-content:center;font-weight:800}
.wch{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;min-height:40px}
.wc{border:1.5px solid var(--blue2);background:#fff;border-radius:10px;padding:6px 10px;color:var(--blue)}
.ansline{border-bottom:2px solid var(--line);min-height:44px;padding:4px 0;margin:6px 0;display:flex;flex-wrap:wrap;gap:6px;border-radius:4px}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}

.col.can{border-color:var(--blue2);background:#eef6fc}

.cluster{display:flex;flex-direction:column;align-items:center;gap:12px}
.cc{width:110px;height:110px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font:800 1.1rem Georgia,serif;padding:8px}
.cb{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.cb input{text-align:center;border-radius:100px;border:2px solid var(--blue2);padding:10px;font:inherit;background:#fff;width:100%}

.dt{width:100%;border-collapse:collapse}.dt th{background:#cfe3f5;padding:6px;font-size:.9rem}.dt td{border:1px solid var(--line);padding:2px}.dt textarea{border:0;border-radius:0;min-height:90px}

.lights+.cap{text-align:center;color:var(--mut);font-size:.9rem;margin-top:8px}
.prov{background:linear-gradient(135deg,#fff7de,#fff);border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer}

.rid{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.rid .ans{display:none;margin-top:8px;font-weight:800;color:var(--ok)}.rid.on .ans{display:block}

d", "h": "Текстти окугула.", "title": "Пингвиндер", "text": ["Пингвиндер уча албаган, сууда жакшы сүзгөн, тикесинен тик туруп баскан бирден-бир канаттуу. Пингвиндердин эң чоңу император пингвини деп аталат, анын бою 110–120 см, салмагы 46 килограммга чейин жетет. Ал эми эң кичинекей пингвиндердин бою 30–40 см, салмагы 1–25 кг.", "«Linux» программасынын негиздөөчүсү Линус Торвальдсты зоопарктан пингвин тиштеп алат. Бул анын кийинчерээк иштеп чыккан программасынын символу катары Такс пингвининин сүрөтүн тандап алуусуна себеп болгон."]}, {"t": "open", "i": "read", "h": "Пингвиндер жөнүндө текстти окуп, абзацтарга тема койгула. <small style=\"color:#7a6a60;font-weight:400\">(16-бет)</small>", "qs": ["Текст эки абзацтан турат."], "rows": 3, "ex": "1-абзац: Пингвиндердин өлчөмү (император пингвини эң чоң, ал эми эң кичинекей пингвин аз салмактуу).<br>2-абзац: Linux программасынын символу — пингвин Токс (Такс)."}, {"t": "gap", "i": "write", "h": "Туура жандоочту тандагыла.", "items": ["Пингвин ата тамак [менен*|үчүн|чейин] балапанын камсыз кылат.", "Алар тукуму [үчүн*|менен|чейин] өзгөчө кам көрөт.", "Пингвин ата көпкө [чейин*|үчүн|менен] жумурткасын басып турат.", "Апасынан [мурун*|кийин|менен] атасы багат.", "Атасынан [кийин*|мурун|менен] апасы карайт."]}, {"t": "match", "i": "pair", "h": "Суроону жооп менен жупташтыргыла.", "pairs": [["эмне менен?", "тамагы менен"], ["эмне үчүн?", "тукуму үчүн"], ["кимге караганда?", "башкаларга караганда"], ["канчага чейин?", "төрт айга чейин"], ["кимден? эмнеден?", "апасынан көрө атасы камкор"]]}, {"t": "order", "i": "write", "h": "Сөздөрдү туура тартипке койгула.", "items": ["Пингвин ата жумурткасын басып отурат.", "Пингвин апа азык алып келип балапанын тойгузат.", "Балапандар ата-энесинин бутунун ортосунда чоңоёт."]}, {"t": "light", "h": "Светофор аркылуу сабакта аткарган жумушуңду баала."}, {"t": "game", "gs": ["tug", "chuko", "quiz"], "theme": 1}]}, {"id": "t1l5", "title": "Ата-энелер", "ky": "Модалдык сөздөрдү колдонуу", "gram": п, үйгө келе жатканда катуу шамал башталды. Эмне кыларыбызды билбей, курбум экөөбүз бири-биребизди кучактап алып, аябай катуу ыйлап жатыптырбыз.", "Күтүүсүздөн эле мени бирөө колуман тартты. Көрсө, эжем мени ойготуп жатыптыр, анткени окууга барышым керек болчу. Ошол түшүмдү такыр унута албай койдум. Кап, анын түш болуп калганын карачы!.."]}, {"t": "open", "i": "read", "h": "Текстти окуп, өзүңөр жазган текст менен салыштыргыла («Менин саякатым»). <small style=\"color:#7a6a60;font-weight:400\">(40-бет)</small>", "qs": ["Назик эжебиз менен Австралияга саякатка барат; түш көрөт."], "rows": 3, "ex": "Менин текстимде кеме менен саякаттаганым жазылган. Китепте кыз түшүндө курбусу Назик менен Австралияга кеме менен барат. Экөөндө тең саякат, кеме, ачык асман бар, бирок китептеги окуя түш."}, {"t": "open", "i": "think", "h": "Суроолорго жооп бергиле. <small style=\"color:#7a6a60;font-weight:400\">(41-бет)</small>", "qs": ["Кыз эмне жөнүндө түш көрдү? Түшүндө окуя кайсы жерде болуптур? Кыздар чынында эле ушундай түш көрөбү? Кыз курбусу менен кайсы өлкөлөргө саякаттады? Ал жак кандай экен? Ангеменин каармандарына мүнөздөмө бергиле. Силерге ким жакты / жаккан жок? Эмне үчүн?"], "rows": 3, "ex": "Кыз курбусу Назик менен Австралияга кеме менен саякаттаганын түш көрдү.<br>Окуя кемеде, океандын үстүндө болуптур.<br>Кыздар чынында да мындай түш көрүшү мүмкүн — алар саякаттоону кыялданышат.<br>Кыз курбусу менен Австралияга барды; ал жакта аба таза, асман ачык, күн салкын.<br>Кыз — кыялкеч, мээримдүү. Курбусу Назик — тың жана кайрымдуу."}, {"t": "open", "i": "write", "h": "Кыз кыялкечби же кыялкеч эмеспи? Таблицаны далилдер менен толуктап жазгыла. <small style=\"color:#7a6a60;font-weight:400\">(41-бет)</small>", "qs": ["Ооба, бул кыз кыялкеч / Жок, бул кыз кыялкеч эмес — 1, 2, 3 далил."], "rows": 3, "ex": "Ооба, бул кыз кыялкеч: 1. Ал түшүндө саякаттап жүрөт. 2. Ал Австралияга барууну кыялданат. 3. Түштү унуткусу келбейт.<br>Жок, бул кыз кыялкеч эмес: 1. Ал окууга барышы керек экенин унутпайт. 2. Түш менен чындыкты айырмалайт. 3. Эжеси ойготкондо чындыкка кайтат."}, {"t": "open", "i": "group", "h": "Үч кичи топко бөлүнүп, үлгүнү пайдаланып, талкуу өткөргүлө. <small style=\"color:#7a6a60;font-weight:400\">(41-бет)</small>", "qs": ["Менимче, бул кыз … , анткени … (далил + негиз + тексттен факт келтиргиле)."], "rows": 3, "ex": "Менимче, бул кыз кыялкеч, анткени ал түшүндө Австралияга барып, саякат кылат. Мисалы, текстте: «Кеме бизди тан калтырды»."}, {"t": "write", "i": "write", "h": "Талкуу боюнча өз алдынча кыскача эссе жазгыла. <small style=\"color:#7a6a60;font-weight:400\">(41-бет)</small>", "prompt": "Мен бул кыз … деп ойлойм, анткени … (аргумент + текстен алынган далил). Контраргумент келтиргиле. Тезисти кайра түзүп, жыйынтык чыгаргыла.", "min": 20, "sample": "Мен бул кыз кыялкеч деп ойлойм, анткени ал түшүндө курбусу менен Австралияга барат. Айрымдар кыз кыялкеч эмес дейт, бирок ал окууга барышы керек деп эсинен чыкпайт. Мен ал кыялкеч деп ойлойм, себеби түшүн унута албай калат. Демек, бул кыз кыялкеч жана окууну да унутпайт.", "rows": 6}, {"t": "act", "i": "listen", "h": "Текстти угуп, тапшырмаларды аткаргыла. <small style=\"color:#7a6a60;font-weight:400\">(41-бет)</small>", "html": "<b>Эскертүү:</b> Бул тапшырма аудио менен аткарылат: 1) Назик … кат жазды; 2) Назик үй-бүлөсү менен … көрдү; 3) Назиктин иниси Аман … ; 4) Назик Алинаны … чакырды; 5) Алина катты … . Аудио бул китепте берилген эмес.<br>Жоопторду аудио менен текшергиле."}, {"t": "open", "i": "write", "h": "Кырдаал менен таанышып, диалог түзгүлө. <small style=\"color:#7a6a60;font-weight:400\">(42-бет)</small>", "qs": ["Силер Буранага экскурсияга барууга даярданып жатасыңар дейли. Кантип баргыңар келет? Уюштуруучуларга телефон чалып, кандай унаа менен баруу болору, экскурсиянын качан жана канча убакытка созулганы, жол киреге тууралуу сурап-билгиле."], "rows": 3, "ex": "— Саламатсызбы! Буранага экскурсия жөнүндө сурасам болобу?<br>— Саламатсызбы! Ооба, мен угуп жатам.<br>— Кандай у function gameTug(sel){

    var pool=shuf(poolFor(cfg.t)),pi=0,pos=0,turn=0,N=+cfg.n,solo=cfg.m==="1";

    }

      draw();

    var F=[{n:"Алчы",d:"Сөз (1 упай)",c:"v",p:1},{n:"Бүк",d:"Грамматика (2 упай)",c:"g",p:2},{n:"Чик",d:"Маданият (3 упай)",c:"c",p:3},{n:"Тай",d:"Сүйлө! (2 упай)",c:"s",p:2}];
    function view(face,extra){
      app.innerHTML='<div class="crumb"><a href="#/">Башкы</a> › <a href="#/game/chuko/'+cfg.t+'">Чүкө</a></div><div class="gwrap"><div class="score"><span class="a">'+(P===2?"1-оюнчу: ":"Упай: ")+sc[0]+'</span>'+(P===2?'<span class="b">2-оюнчу: '+sc[1]+'</span>':'')+'<span>'+Math.min(k+1,N)+' / '+N+'</span></div>'+BONE+'<div class="faces">'+F.map(function(f,i){return '<div class="'+(face===i?"on":"")+'"><b>'+f.n+'</b>'+f.d+'</div>'}).join("")+'</div><div id="q"></div></div>';
      if(extra)extra()}
    function end(){var w=sc[0]>sc[1]?1:sc[1]>sc[0]?2:0;if(P===1&&sc[0]>(S.best.chuko||0)){S.best.chuko=sc[0];save()}
      app.innerHTML='<div class="gwrap win"><h2>'+(P===2?(w?w+"-оюнчу жеңди!":"Тең чыкты!"):"Жыйынтык: "+sc[0]+" упай")+'</h2><p>Азаматсыздар! Чүкө оюну аяктады.</p><div class="btns" style="justify-content:center"><button class="btn r" onclick="location.reload()">Кайра ойноо</button><a class="btn g" href="#/" style="text-decoration:none">Башкы бет</a></div></div>'}
    function turn(){
      if(k>=N)return end();
      view(-1,function(){$("#q").innerHTML='<div class="btns" style="justify-content:center"><button class="btn r" id="th">🦴 Чүкөнү ыргыт'+(P===2?" ("+(k%2+1)+"-оюнчу)":"")+'</button></div>';
        $("#th").onclick=function(){var fi=Math.floor(Math.random()*4);$("#th").disabled=true;var g=$("#bg");g.style.transformOrigin="60px 60px";g.style.transition="transform 1s";g.style.transform="rotate("+(720+fi*90)+"deg)";setTimeout(function(){view(fi,function(){ask(fi)})},1050)}})}
    function ask(fi){
      var f=F[fi],who=P===2?k%2:0,box=$("#q");
      function next(ok){if(ok)sc[who]+=f.p;k++;turn()}
      if(f.c==="s"){var s=spk.length?spk[Math.floor(Math.random()*spk.length)]:"Үй-бүлөң жөнүндө эки сүйлөм айт.";
        box.innerHTML='<div class="qbox" style="--tc:#7b4fd1"><h3>🎤 '+esc(s)+'</h3><p style="color:#7a6a60;margin:0 0 8px">Кыргызча 2–3 сүйлөм айт. Мугалим же дос баалайт.</p><div class="btns"><button class="btn ok" id="y">Аткардым ✓ (+'+f.p+')</button><button class="btn g" id="n">Кийинки</button></div></div>';$("#y").onclick=function(){next(true)};$("#n").onclick=function(){next(false)};return}
      var cand=pool.filter(function(q){return q.c===f.c&&used.indexOf(q)<0});if(!cand.length)cand=pool.filter(function(q){return used.indexOf(q)<0});if(!cand.length){used=[];cand=pool}
      var raw=cand[Math.floor(Math.random()*cand.length)];used.push(raw);
      box.appendChild(askBox(mkQ(raw),"#d62839",next));
    }
    turn();
  });
}
function gameQuiz(sel){
  setNav("games");var t=themeBy(sel);if(!t){location.hash="#/";return}
  var Q=pick(t.pool||[],10).map(mkQ),i=0,sc=0;
  function nx(){
    if(i>=Q.length){var pts=Math.round(100*sc/Q.length);if(S.quiz[t.n]==null||pts>S.quiz[t.n]){S.quiz[t.n]=pts;save()}
      app.innerHTML='<div class="gwrap win"><h2>'+pts+' / 100</h2><p>'+(pts>=80?"Эң мыкты!":pts>=50?"Жакшы, дагы машыгалы!":"Кайра аракет кылалы!")+'</p><div class="btns" style="justify-content:center"><a class="btn r" href="#/game/quiz/'+t.n+'" onclick="setTimeout(function(){location.reload()},10)" style="text-decoration:none">Кайра</a><a class="btn g" href="#/t/'+t.n+'" style="text-decoration:none">Темага кайтуу</a></div></div>';return}
    app.innerHTML='<div class="crumb"><a href="#/t/'+t.n+'">'+t.n+'-тема</a> › <span>Тест</span></div><div class="gwrap"><div class="score"><span class="a">'+(i+1)+' / '+Q.length+'</span><span class="b">Упай: '+sc+'</span></div><div id="q"></div></div>';
    $("#q").appendChild(askBox(Q[i],t.color,function(g){if(g)sc++;i++;nx()}));
  }
  nx();
}
function pageRiddles(sel){
  setNav("games");
  var ts=sel&&sel!=="all"?[themeBy(sel)]:B.themes,items=[];ts.forEach(function(t){(t.riddles||[]).forEach(function(r){items.push(r)})});
  app.innerHTML='<div class="crumb"><a href="#/">Башкы</a> › <span>Табышмак</span></div><h2 class="sec" style="margin-top:0">Табышмак</h2><p style="color:#7a6a60">Ойлонуп көр, андан кийин жоопту ач. Кыргыз тилиндеги кеңеш түшүнүүгө жардам берет.</p>'+items.map(function(r,i){return '<div class="rid" data-i="'+i+'"><p style="margin:0 0 6px;font-weight:600">'+wrap(r.q)+' <button class="say" data-s="'+i+'">🔊</button></p>'+(r.ky?'<small style="color:#7a6a60">💡 '+esc(r.ky)+'</small>':"")+'<div class="btns"><button class="btn s" data-a="1">Жообу</button></div><div class="ans">'+esc(r.a)+'</div></div>'}).join("");
  app.onclick=function(e){var s=e.target.closest("[data-s]");if(s){speak(items[+s.dataset.s].q);return}var b=e.target.closest("[data-a]");if(b)b.closest(".rid").classList.toggle("on")};
}
function pageProverbs(){
  setNav("games");
  app.innerHTML='<div class="crumb"><a href="#/">Башкы</a> › <span>Макал-лакап</span></div><h2 class="sec" style="margin-top:0">Макал-лакап</h2><div class="seg" id="pt"><button data-v="learn" class="on">Үйрөн</button><button data-v="match">Жупташтыр</button><button data-v="build">Сөз тиз</button></div><div id="pb" style="margin-top:14px"></div>';
  function show(v){$$("#pt button").forEach(function(b){b.classList.toggle("on",b.dataset.v===v)});var pb=$("#pb");pb.innerHTML="";
    if(v==="learn"){pb.innerHTML='<p style="color:#7a6a60">Макалды басканда мааниси чыгат.</p>'+B.proverbs.map(function(p,i){return '<div class="prov" data-i="'+i+'"><b>'+esc(p.ky)+'</b><span>'+esc(p.m)+' <button class="say" data-say="'+i+'">🔊</button></span></div>'}).join("");pb.onclick=function(e){var s=e.target.closest("[data-say]");if(s){e.stopPropagation();speak(B.proverbs[+s.dataset.say].ky);return}var p=e.target.closest(".prov");if(p)p.classList.toggle("on")}}
    if(v==="match"){var sub=pick(B.proverbs,6);var c=el('<div class="task"><div class="th"><div class="ic game">'+IC.game+'</div><h3>Макалды анын маанисине жупташтыр.</h3></div></div>');pb.appendChild(c);R.match({pairs:sub.map(function(p){return [p.ky,p.m]})},"pm",c)}
    if(v==="build"){var sub2=pick(B.proverbs,5);var c2=el('<div class="task"><div class="th"><div class="ic game">'+IC.game+'</div><h3>Сөздөрдү туура тартипке койгула.</h3></div></div>');pb.appendChild(c2);R.order({items:sub2.map(function(p){return [p.ky,p.m]})},"pbld",c2)}}
  $("#pt").onclick=function(e){var b=e.target.closest("button");if(b)show(b.dataset.v)};show("learn");
}

/* ---------- router ---------- */
function route(){
  var h=location.hash.replace(/^#\/?/,"").split("/");stopSpeak();app.onclick=null;
  var k=h[0];
  if(k==="t"&&h[2])pageLesson(h[1],+h[2]);
  else if(k==="t")pageTheme(h[1]);
  else if(k==="dict")pageDict();
  else if(k==="me")pageMe();
  else if(k==="proverbs")pageProverbs();
  else if(k==="riddles")pageRiddles(h[1]);
  else if(k==="games"){setNav("games");app.innerHTML='<h2 class="sec" style="margin-top:0">Оюндар</h2><div class="tiles"><a class="tile" href="#/game/tug/all"><em>🪢</em>Аркан тартыш<small>Команда менен</small></a><a class="tile" href="#/game/chuko/all"><em>🦴</em>Чүкө оюну<small>Сөз, грамматика, маданият</small></a><a class="tile" href="#/proverbs"><em>📜</em>Макал-лакап</a></div><h2 class="sec">Тема тесттери</h2><div class="tiles">'+B.themes.map(function(t){return '<a class="tile" href="#/game/quiz/'+t.n+'"><em>'+t.em+'</em>'+t.n+'. '+esc(t.en)+'<small>'+(S.quiz[t.n]!=null?S.quiz[t.n]+"/100":"тест")+'</small></a>'}).join("")+'</div>'}
  else if(k==="game"){var g=h[1],s=h[2]||"all";if(g==="tug")gameTug(s);else if(g==="chuko")gameChuko(s);else if(g==="quiz")gameQuiz(s);else pageHome()}
  else pageHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
$("#bign").onclick=function(){S.big=S.big?0:1;save();document.documentElement.classList.toggle("big",!!S.big)};
route();
})();
</script>
</body></html>
