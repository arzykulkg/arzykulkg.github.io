 {t:"read",i:"read",h:"Уламышты окугула. Окуп жатканда ар бир тыныштан кийин суроолорго жооп бергиле.",title:"Таш-Рабат (уламыш)",text:["Байыркы бир заманда күчтүү кан жашаган экен. Анын эки уулу болгон. Кан эки баласын тең жакшы көргөндүктөн, кимисин өтө жакшы көрөрүн айта албай калган.","Бир жолу кан улуу уулун чакырып: «Мен карып калдым. Сен эмнеге жөндөмдүү экениңди көрсөтчү», — дейт. Улуу уулу: «Биздин кандык бай, бирок дагы бай боло алат. Мен соодага жарактуу буюмдарды кербендер менен чет жерлерге жөнөтөм, соодагерлерди чакырып, алар эс алуучу кербен сарай курам», — дейт.","Кан көп өтпөй каза болот. Уулу кербен сарай куруу үчүн мамлекетинин эң мыкты чебер уустарын чогултат. Көп жылдар бою таш кербен сарай курулат. Аны көргөндүн баарынын көзү тоюп калат: дубалдары бекем, бөлмөлөрү кенен болот. Соодагерлер Таш-Рабатка атайын келип, анын меймандостугунан ырахат алышат.","Кан жыл сайын байып, эл жакшы жашай баштайт. Бирок кан каза болуп, анын ордун кичүү иниси ээлейт. Ал аскер чогултуп, тынч жолдо баратган кербендерди талап-тоной баштайт. Кошуна кандыктар ага каршы согушка чыгып, жоокерлерин жеңишет. Таш-Рабаттын ордунда талкаланган калдыктар гана калат."],qs:[{t:"mc",i:"think",h:"Уламыш боюнча туура жоопту тандагыла.",qs:[{q:"Кандын улуу уулу эмне курмак болду?",o:["Кербен сарай","Мектеп","Көпүрө","Мечит"],a:0},{q:"Кербен сарайды ким курган?",o:["Кандын улуу уулу","Кичүү иниси","Душмандар","Соодагерлер"],a:0},{q:"Кичүү иниси эмне кылды?",o:["Кербендерди талап-тоноду","Мектеп курду","Кербен сарайды кеңейтти","Соода кылды"],a:0},{q:"Таш-Рабаттын ордунда эмне калды?",o:["Талкаланган калдыктар","Жаңы шаар","Көл","Бак"],a:0}]},{t:"open",i:"pair",h:"Жуп менен талкуулагыла.",qs:["Кандын улуу уулунун оюна кошуласыңбы? Эмне үчүн?","Кичүү инисинин катасы эмнеде болду?","Эгер сен кандын ордунда болсоң, эмне кылмаксың?"]}]},
 {t:"read",i:"read",h:"Таш-Рабаттын архитектурасы жөнүндө окугула.",title:"Таш-Рабат — тарыхый эстелик",text:["Таш-Рабат — Нарын облусунда, деңиз деңгээлинен 3500 метр бийиктикте жайгашкан байыркы кербен сарай. Ал Кара-Коюн капчыгайына жакын, суунун сол жагында турат. Эстелик XV кылымда курулган деп эсептелет.","Имарат жонулган таштардан курулган. Анын маңдай жагы чыгыш тарапка каратылган. Имаратта 40 же 41 бөлмө бар дешет: аларды санаган сайын ар кандай чыгат. Негизги залга узун коридор аркылуу киришет. Залдын төбөсү кумпа менен жабылган, ал оймо-чиймелер менен кооздолгон.","Таш-Рабаттын сүрөтү Кыргызстандын 20 сомдук акчасында бар."],qs:[{t:"tf",i:"pair",h:"<b>Туура</b> же <b>ката</b>.",qs:[{s:"Таш-Рабат Нарын облусунда жайгашкан.",a:true},{s:"Таш-Рабаттын маңдай жагы батыш тарапка каратылган.",a:false,fix:"Маңдай жагы чыгыш тарапка каратылган."},{s:"Негизги залга узун коридор аркылуу киришет.",a:true},{s:"Таш-Рабаттын сүрөтү 100 сомдук акчада бар.",a:false,fix:"20 сомдук акчада бар."}]}]},

 {t:"read",i:"read",h:"Русландын кыялы жөнүндө окугула.",title:"Русландын кыялдануусу",text:["Руслан 8-класста окуйт. Ал саякаттаганды жакшы көрөт. Чоңойгондо чет өлкөлөргө барууну кыялданат. Руслан чет жактагы элдердин жашоосу менен таанышууну самайт.","Учак менен же унаанын ар башка түрлөрү менен алыска жөнөгүсү келет. Чоң шаарларды аралап, бийик имараттарды, тарыхый эстеликтерди көрсө, кандай укмуш! Ошол өлкөлөрдө жашаган адамдар менен эркин сүйлөшкүсү келет. Руслан келечекте котормочу болсом дейт.","Котормочу болуш үчүн Руслан англис тили сабагын жакшы окушу керек. Эгерде англис тилин жаман окуса, анда котормочу боло албайт. Руслан мектепти бүтүрүп, жогорку окуу жайына тапшырат. Котормочулук кесип эмгекчилдикти, чыдамкайлыкты жана аракетчилдикти талап кылат."],qs:[{t:"tf",i:"pair",h:"<b>Туура</b> же <b>ката</b>.",qs:[{s:"Руслан 8-класста окуйт.",a:true},{s:"Руслан чет өлкөлөргө барууну кыялданат.",a:true},{s:"Котормочулук кесип эч кандай сапат талап кылбайт.",a:false,fix:"Ал эмгекчилдик, чыдамкайлык жана аракетчилдикти талап кылат."},{s:"Руслан келечекте дарыгер болгусу келет.",a:false,fix:"Руслан котормочу болгусу келет."}]},{t:"mc",i:"think",h:"Туура жоопту тандагыла.",qs:[{q:"Руслан эмне жөнүндө кыялданат?",o:["Котормочу болуу жөнүндө","Футболчу болуу жөнүндө","Дарыгер болуу жөнүндө","Токочу болуу жөнүндө"],a:0},{q:"Котормочу болуш үчүн кайсы сабакты жакшы окуш керек?",o:["Чет тилин","Дене тарбиясын","Сүрөт сабагын","Музыканы"],a:0}]}]},

  else if(k==="game"){var g=h[1],s=h[2]||"all";if(g==="tug")gameTug(s);else if(g==="chuko")gameChuko(s);else if(g==="quiz")gameQuiz(s);else pageHome()}
  else pageHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
$("#bign").onclick=function(){S.big=S.big?0:1;save();document.documentElement.classList.toggle("big",!!S.big)};
route();
})();
