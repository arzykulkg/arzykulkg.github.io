function reveal(id,justScroll){

  [].forEach.call(document.querySelectorAll("li.open"),function(l){if(!keep[l.dataset.id])closeLi(l)});
  path.forEach(function(x){var l=liOf(x);if(l){ensureKids(l);l.classList.add("open")}});

function relTo(me,id){

  if(b===0){t=a===1?(f?"эне":"ата"):a===2?(f?"чоң эне":"чоң ата"):a+"-муундагы ата-бабаңыз"}
  else if(a===0){t=b===1?(f?"кызыңыз":"уулуңуз"):b===2?"небереңиз":b===3?"чөбүрөңүз":b+"-муундагы урпагыңыз"}
  else if(a===1&&b===1){t="бир тууганыңыз ("+(f?"эже/сиңди":"ага/ини")+")"}

  return{t:t,lca:l,up:A.slice(i-1).reverse(),down:B.slice(i),s:a+b}
}

/* ---- v7: twins (same person on both sides), best relation, profile ---- */
var TW=null;

    function sib(k){var p=parentMap[k];return p?nodeMap[p].children.map(function(c){return c.name}):[]}
    Object.keys(by).forEach(function(nm){var L=by[nm];if(L.length<2)return;L.forEach(function(a){TW[a]=[a]});
      for(var i=0;i<L.length;i++)for(var j=i+1;j<L.length;j++){var a=L[i],b=L[j];if(!parentMap[a]||!parentMap[b]||parentMap[a]===parentMap[b])continue;
        var S=sib(a),T=sib(b);if(S.length<3||T.length<3)continue;var c=0;S.forEach(function(x){if(T.indexOf(x)>=0)c++});
        if(c>=Math.min(S.length,T.length)*.6){TW[a].push(b);TW[b].push(a)}}})}
  return TW[id]||[id];
}
function relBest(me,id){var best=null;twinsOf(me).forEach(function(m){twinsOf(id).forEach(function(x){var r=relTo(m,x);if(!best||r.s<best.s)best=r})});return best||relTo(me,id)}

/* ===== v6: Санжыра окуясы ===== */
(function(){
  document.body.insertAdjacentHTML("beforeend",'<div id="story"><div id="sbg"></div><div id="sorn"></div><div id="sbars"></div><button class="sbtn" id="spp" aria-label="Тындыруу">❚❚</button><button class="sbtn" id="smu" aria-label="Үн">🔊</button><button class="sbtn" id="sx2" aria-label="Жабуу">✕</button><div class="sc" id="sc"></div><div id="stap1"></div><div id="stap2"></div></div>');
  var ST=$("#story"),SC=$("#sc"),BR=$("#sbars");
  $("#sorn").style.backgroundImage=getComputedStyle(document.documentElement).getPropertyValue("--orn2")||"";
  var path=[],idx=0,t0=0,dur=3300,paused=false,raf=0,muted=false,actx=null,master=null,pad=null;
  try{muted=localStorage.getItem("arzykul_mute")==="1"}catch(e){}
  $("#smu").textContent=muted?"🔇":"🔊";
  /* --- music: soft kalimba-like notes over a warm pad --- */
  var SCALE=[0,2,4,7,9];
  function audio(){
    if(actx||muted)return;
    try{actx=new (window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=.55;master.connect(actx.destination);
      var lp=actx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=700;var pg=actx.createGain();pg.gain.value=0;lp.connect(pg);pg.connect(master);
      [110,164.8,220.5].forEach(function(f,i){var o=actx.createOscillator();o.type="sine";o.frequency.value=f*(1+i*.002);o.connect(lp);o.start()});
      pg.gain.linearRampToValueAtTime(.09,actx.currentTime+2);pad=pg}catch(e){actx=null}
  }
  function note(semi,when,vol){
    if(!actx||muted)return;var f=261.63*Math.pow(2,semi/12),o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+when;
    o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.22,t+.015);g.gain.exponentialRampToValueAtTime(.0008,t+1.6);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+1.7);
  }
  function chime(i,last){
    if(!actx)return;var base=SCALE[i%5]+12*Math.floor(i/5%2);
    if(last){[0,4,7,12,16].forEach(function(s,k){note(s+7,k*.13,.2)});return}
    note(base,0,.24);note(base+SCALE[(i+2)%5]%7+4,.16,.14);note(base+12,.34,.1);
  }
  /* --- slides --- */
  function bars(){BR.innerHTML=path.map(function(){return "<i><b></b></i>"}).join("")}
  function show(i){
    idx=Math.max(0,Math.min(path.length-1,i));var id=path[idx],n=nodeMap[id],last=idx===path.length-1,d=depthMap[id];
    ST.style.setProperty("--sg",col(id));
    [].forEach.call(BR.children,function(b,k){b.className=k<idx?"d":"";b.firstChild.style.width=k<idx?"100%":"0"});
    var kids=(n.children||[]),h='<div class="sg">'+(d+1)+'-муун</div>'+avHTML(n,"sav"+(n.f?" f":""))+'<h2>'+esc(n.name)+'</h2>';
    var par=parentMap[id];
    h+='<div class="ss">'+(par?'Атасы: <b>'+esc(nodeMap[par].name)+'</b>':'<b>Санжыранын башталышы</b>')+(kids.length?'<br>'+kids.length+' баласы · '+cnt(n)+' урпагы':'')+'</div>';
    if(last){
      if(kids.length)h+='<div class="sch">'+kids.map(function(k){return '<span data-id="'+k.id+'">'+(k.f?"♀ ":"")+esc(k.name)+'</span>'}).join("")+'</div>';
      h+='<div class="sfin"><button data-k="tree">🌳 Дарактан көрүү</button><button class="g" data-k="again">↻ Кайра</button></div>';
    }
    var tr=path.slice(Math.max(0,idx-4),idx).map(function(x){return esc(nodeMap[x].name)});
    if(tr.length)h+='<div class="stl">'+tr.join("<i>›</i>")+"<i>›</i><b>"+esc(n.name)+"</b></div>";
    SC.className="sc";SC.innerHTML=h;void SC.offsetWidth;SC.className="sc go";
    var bg=$("#sbg");bg.style.animation="none";void bg.offsetWidth;bg.style.animation="";
    t0=performance.now();vib();chime(idx,last);
    if(last&&window.confetti){for(var k=0;k<5;k++)setTimeout(function(){confetti(innerWidth*(.2+Math.random()*.6),innerHeight*(.25+Math.random()*.3),col(id),34)},500+k*260)}
  }
  function tick(t){
    raf=requestAnimationFrame(tick);
    if(paused||idx>=path.length-1)return;
    var k=Math.min(1,(t-t0)/(idx===0?dur+700:dur));BR.children[idx].firstChild.style.width=(k*100)+"%";
    if(k>=1)show(idx+1);
  }
  function go(d){var n=idx+d;if(n<0){show(0);return}if(n>=path.length){return}show(n)}
  window.startStory=function(id){
    if(!nodeMap[id])id=TREE.id;path=pathOf(id).concat([id]);idx=0;paused=false;
    $("#spp").textContent="❚❚";bars();document.body.classList.remove("sheet","menuo","srch");document.body.classList.add("story");
    audio();if(actx&&actx.state==="suspended")actx.resume();if(pad&&actx)pad.gain.linearRampToValueAtTime(.09,actx.currentTime+1.5);
    try{history.pushState({st:1,fv:window.fvCurId&&fvCurId(),i:(history.state&&history.state.i)||0},"")}catch(e){}show(0);cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
  };
  function close(){var was=document.body.classList.contains("story");document.body.classList.remove("story");cancelAnimationFrame(raf);if(was&&history.state&&history.state.st){try{history.back()}catch(e){}}if(pad&&actx)pad.gain.linearRampToValueAtTime(0,actx.currentTime+.6)}
  $("#sx2").onclick=close;
  $("#spp").onclick=function(){paused=!paused;this.textContent=paused?"▶":"❚❚";if(!paused)t0=performance.now()-(parseFloat(BR.children[idx].firstChild.style.width)||0)/100*dur};
  $("#smu").onclick=function(){muted=!muted;this.textContent=muted?"🔇":"🔊";try{localStorage.setItem("arzykul_mute",muted?"1":"0")}catch(e){}
    if(muted){if(pad&&actx)pad.gain.linearRampToValueAtTime(0,actx.currentTime+.3)}else{audio();if(actx){actx.resume();if(pad)pad.gain.linearRampToValueAtTime(.09,actx.currentTime+1)}}};
  $("#stap1").onclick=function(){go(-1)};$("#stap2").onclick=function(){go(1)};
  /* hold = pause */
  var hold=0;["stap1","stap2"].forEach(function(i){var e=$("#"+i);e.addEventListener("pointerdown",function(){hold=setTimeout(function(){paused=true;$("#spp").textContent="▶";hold=-1},260)});
    ["pointerup","pointerleave","pointercancel"].forEach(function(ev){e.addEventListener(ev,function(){if(hold===-1){paused=false;$("#spp").textContent="❚❚";t0=performance.now()-(parseFloat(BR.children[idx].firstChild.style.width)||0)/100*dur}clearTimeout(hold);hold=0})})});
  var sy=0,sx=0;ST.addEventListener("touchstart",function(e){sy=e.touches[0].clientY;sx=e.touches[0].clientX},{passive:true});
  ST.addEventListener("touchend",function(e){var dy=e.changedTouches[0].clientY-sy,dx=e.changedTouches[0].clientX-sx;if(dy>120&&Math.abs(dx)<80)close();else if(Math.abs(dx)>55&&Math.abs(dy)<60)go(dx<0?1:-1)},{passive:true});
  SC.addEventListener("click",function(e){
    var c=e.target.closest(".sch span");if(c){close();setTimeout(function(){if(window.fvGo){document.body.classList.contains("fv")||document.querySelector("#m7").click();fvGo(c.dataset.id)}},150);return}
    var b=e.target.closest(".sfin button");if(!b)return;
    if(b.dataset.k==="again")startStory(path[path.length-1]);
    else{var id=path[path.length-1];close();setTimeout(function(){if(!document.body.classList.contains("fv"))document.querySelector("#m7").click();fvGo(id)},150)}
  });
  addEventListener("keydown",function(e){if(!document.body.classList.contains("story"))return;if(e.key==="Escape")close();else if(e.key==="ArrowRight"||e.key===" ")go(1);else if(e.key==="ArrowLeft")go(-1)});
  /* entry points */
  var bb=document.createElement("button");bb.id="m9";bb.textContent="🎂 Жакынкы туулган күндөр";$("#menu").insertBefore(bb,$("#m7"));bb.addEventListener("click",openBdays);
  var mb=document.createElement("button");mb.id="m8";mb.textContent="▶ Санжыра окуясы";$("#menu").insertBefore(mb,$("#m7"));
  mb.addEventListener("click",function(){startStory((window.fvCurId&&fvCurId())||focusId||TREE.id)});
  $("#sheet").addEventListener("click",function(e){var b=e.target.closest('[data-a="story"]');if(b){e.stopPropagation();startStory($("#sheet").dataset.cur)}},true);
})();
