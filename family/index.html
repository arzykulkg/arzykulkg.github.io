function mkLi(n,i,parentColor){
  var li=document.createElement("li");li.className="nd"+(n.f?" f":"");li.dataset.id=n.id;
  li.style.setProperty("--g",col(n.id));li.style.setProperty("--cg",parentColor||col(n.id));li.style.setProperty("--i",Math.min(i,14));
  var k=(n.children||[]).length,d=depthMap[n.id];
  var h=avHTML(n)+'<div class="tx"><div class="nm">'+esc(n.name)+'</div><div class="mt">'+(k?k+' бала · ':'')+(d+1)+'-муун'+'</div></div>';
  if(k)h+='<span class="bd">'+cnt(n)+'</span><span class="chev">›</span>';
  h+='<button class="inf" aria-label="Маалымат">i</button>';
  var row=document.createElement("div");row.className="row";row.setAttribute("role","button");row.tabIndex=0;row.innerHTML=h;
  row.addEventListener("pointerdown",function(e){ripple(e,row)});
  row.addEventListener("click",function(e){
    if(e.target.closest(".inf")){e.stopPropagation();vib();openInfo(n.id);return}
    vib();if(k)toggle(n.id);else openInfo(n.id);
  });
  row.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();row.click()}});
  li.appendChild(row);return li;
}
function ensureKids(li){
  if(li.querySelector(":scope>.kids"))return;
  var n=nodeMap[li.dataset.id],w=document.createElement("div");w.className="kids";
  var ul=document.createElement("ul"),pc=col(n.id);
  (n.children||[]).forEach(function(c,i){ul.appendChild(mkLi(c,i,pc))});
  w.appendChild(ul);li.appendChild(w);
}

function closeLi(li){li.classList.remove("open");[].forEach.call(li.querySelectorAll("li.open"),function(x){x.classList.remove("open")})}
function openLi(li,keep){
  var p=li.parentNode.closest?li.parentNode.closest("li.nd"):null;
  /* accordion: close open siblings that are not on the kept path */
  [].forEach.call(li.parentNode.children,function(s){if(s!==li&&s.classList.contains("open")&&!(keep&&keep[s.dataset.id]))closeLi(s)});
  ensureKids(li);li.classList.add("open");
}
var focusId=null;
function setFocus(id,anchor){
  var a=anchor?anchor.getBoundingClientRect().top:null;
  [].forEach.call(document.querySelectorAll("li.anc,li.base,li.focus"),function(l){l.classList.remove("anc","base","focus")});
  focusId=id;var path=pathOf(id);

  var f=liOf(id);if(f)f.classList.add("focus");
  if(anchor&&a!==null)window.scrollBy(0,anchor.getBoundingClientRect().top-a);
}
function toggle(id){
  var li=liOf(id);if(!li)return;

}
/* ---------- smooth auto-scroll that tracks layout while animating ---------- */
var fol=0;
function hdr(){return $("#hdr").offsetHeight+$("#bc").offsetHeight}
function follow(el,off,ms){
  var id=++fol,t0=performance.now();
  (function f(t){
    if(id!==fol)return;
    var r=el.getBoundingClientRect(),d=r.top-(hdr()+off);
    if(Math.abs(d)>1)window.scrollBy(0,Math.sign(d)*Math.min(Math.abs(d),Math.max(2,Math.abs(d)*.13)));
    if(t-t0<ms)requestAnimationFrame(f);
  })(t0);
}

}

/* ---------- reveal (open path, scroll, pulse) ---------- */
function reveal(id,justScroll){
  var path=pathOf(id),keep={};path.concat([id]).forEach(function(x){keep[x]=1});
  /* close everything not on the path */
  [].forEach.call(document.querySelectorAll("li.open"),function(l){if(!keep[l.dataset.id])closeLi(l)});
  path.forEach(function(x){var l=liOf(x);if(l){ensureKids(l);l.classList.add("open")}});
  var li=liOf(id);if(!li)return;
  if((nodeMap[id].children||[]).length){ensureKids(li);li.classList.add("open")}
  if(!(nodeMap[id].children||[]).length)setFocus(parentMap[id]||id,li.firstChild);else setFocus(id,li.firstChild);
  crumbs(id);
  var k=(nodeMap[id].children||[]).length;
  setTimeout(function(){follow(li.firstChild,k&&k<=5?96:70,1100)},30);
  var r=li.firstChild;r.classList.remove("pulse");void r.offsetWidth;r.classList.add("pulse");setTimeout(function(){r.classList.remove("pulse")},2000);
}

function relTo(me,id){

  if(b===0){t=a===1?(f?"эне":"ата"):a===2?(f?"чоң эне":"чоң ата"):a+"-муундагы ата-бабаңыз"}
  else if(a===0){t=b===1?(f?"кызыңыз":"уулуңуз"):b===2?"небереңиз":b===3?"чөбүрөңүз":b+"-муундагы урпагыңыз"}

}

/* ---- branch poster ---- */
function poster(id){
  var root=nodeMap[id],MAXD=3,rows=0,nodes=[];
  function lim(){var c=0;(function w(n,d){c++;if(d<MAXD)(n.children||[]).forEach(function(k){w(k,d+1)})})(root,0);return c}
  while(MAXD>1&&lim()>160)MAXD--;
  function lay(n,d){var o={n:n,d:d,k:[]};if(d<MAXD)(n.children||[]).forEach(function(c){o.k.push(lay(c,d+1))});
    if(!o.k.length){o.y=rows++}else o.y=(o.k[0].y+o.k[o.k.length-1].y)/2;nodes.push(o);return o}
  var T=lay(root,0),CW=300,GAP=70,RH=64,W=(MAXD+1)*(CW+GAP)+60,H=rows*RH+250,cv=document.createElement("canvas");cv.width=W;cv.height=H;var x=cv.getContext("2d");
  var bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#1a0b4d");bg.addColorStop(1,"#3b1a8f");x.fillStyle=bg;x.fillRect(0,0,W,H);
  x.fillStyle="#fff";x.font="800 54px serif";x.textAlign="left";x.fillText("Тукум дарагы · "+root.name,40,80);x.font="600 28px sans-serif";x.fillStyle="rgba(255,255,255,.7)";x.fillText("Арзыкулов тукуму · "+(cnt(root)+1)+" адам"+(MAXD<3?"":""),40,125);
  function px(o){return{x:40+o.d*(CW+GAP),y:190+o.y*RH}}
  nodes.forEach(function(o){var p=px(o);o.k.forEach(function(c){var q=px(c);x.strokeStyle="rgba(255,255,255,.35)";x.lineWidth=3;x.beginPath();x.moveTo(p.x+CW,p.y);x.bezierCurveTo(p.x+CW+GAP/2,p.y,q.x-GAP/2,q.y,q.x,q.y);x.stroke()})});
  nodes.forEach(function(o){var p=px(o),c=o.n.f?"#ff5d9e":GEN[(depthMap[o.n.id])%GEN.length];x.fillStyle=c;x.beginPath();if(x.roundRect)x.roundRect(p.x,p.y-26,CW,52,26);else x.rect(p.x,p.y-26,CW,52);x.fill();
    x.fillStyle="#1a0b4d";x.font="800 26px sans-serif";x.textAlign="left";var t=o.n.name;while(x.measureText(t).width>CW-36&&t.length>4)t=t.slice(0,-2);x.fillText(t+(t!==o.n.name?"…":""),p.x+18,p.y+9);
    var kc=(o.n.children||[]).length;if(kc&&o.d===MAXD){x.fillStyle="#1a0b4d";x.textAlign="right";x.font="700 22px sans-serif";x.fillText("+"+cnt(o.n)+" ›",p.x+CW-16,p.y+8)}});
  sendCanvas(cv,"tukum-"+id+".png","Тукум дарагы — "+root.name)}
