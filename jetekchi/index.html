<!doctype html>
<html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1a16"><meta name="robots" content="noindex,nofollow"><meta name="google" content="notranslate">
<title>Класс жетекчи</title>
<style>
:root{--bg:#0f1a16;--card:#18271f;--line:#2a3d33;--tx:#f3efe0;--tx2:#b9c4b4;--g:#e3b74f;--ok:#3fa66b;--no:#e0605a;--late:#e8a33d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,'Segoe UI',sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:rgba(15,26,22,.96);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
header a{color:var(--g);text-decoration:none;font-size:22px}header h1{margin:0;font-size:1.05rem;flex:1}header h1 small{display:block;font-weight:400;color:var(--tx2);font-size:.75rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1410;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--tx2);padding:9px 2px 8px;font:inherit;font-size:.7rem;cursor:pointer}nav button b{display:block;font-size:1.25rem}nav button.on{color:var(--g)}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
h2{font-size:1rem;margin:14px 0 8px;color:var(--g)}
input,textarea,select{width:100%;background:#0f1a16;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font:inherit;margin:4px 0}
textarea{min-height:90px;resize:vertical}
button.b{background:var(--g);color:#1b1500;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
a.b{display:inline-block;background:var(--g);color:#1b1500;border-radius:10px;padding:10px 14px;font-weight:700}a.b.s{background:#26382e;color:var(--tx)}
button.b.s{background:#26382e;color:var(--tx)}button.b.d{background:#4a2020;color:#ffd5d2}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.grow{flex:1!important;min-width:120px}
.mut{color:var(--tx2);font-size:.85rem}.chip{display:inline-block;background:#26382e;border-radius:99px;padding:3px 10px;font-size:.78rem;color:var(--tx2)}
.st{width:46px;height:42px;border-radius:12px;border:2px solid var(--line);background:#0f1a16;font-size:1.2rem;cursor:pointer;color:var(--tx)}
.st.p{background:var(--ok);border-color:var(--ok)}.st.a{background:var(--no);border-color:var(--no)}.st.l{background:var(--late);border-color:var(--late)}
.num{font-weight:700;color:var(--g)}
details summary{cursor:pointer;padding:4px 0}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:9;font-size:.85rem}#toast.on{opacity:1}
</style></head><body>
<header><a href="../" aria-label="Башкы бет">‹</a><h1 id="ttl">Класс жетекчи<small id="sub"></small></h1><button class="b s" id="cfg">⚙</button></header>
<main id="app"></main>
<nav id="nav"></nav><div id="toast"></div>
<script>
(function(){
var K='cj_data_v1',D;
function load(){try{D=JSON.parse(localStorage.getItem(K)||'null')}catch(e){D=null}
 if(!D||!D.students)D={cls:'8-А',year:'2026–2027',students:[],att:{},meet:[]}}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){toast('Сактоо мүмкүн болгон жок')}}
load();
var $=function(s,r){return (r||document).querySelector(s)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},1800)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function normDate(s){s=(s||'').trim();var m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;return ''}
function fmtD(s){if(!s)return '';var p=s.split('-');return p[2]+'.'+p[1]+'.'+p[0]}
function waLink(phone,text){var d=(phone||'').replace(/\D/g,'');if(!d)return '';if(d.length===10&&d[0]==='0')d='996'+d.slice(1);else if(d.length===9)d='996'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(text)}
function copy(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('Көчүрүлдү')},function(){toast('Көчүрүлгөн жок')});else toast('Көчүрүү мүмкүн эмес')}
function byName(a,b){return a.name.localeCompare(b.name,'ky')}
var tab='st',app=$('#app');
var TABS=[['st','👥','Окуучулар'],['at','✅','Катышуу'],['ms','💬','Билдирүү'],['mt','📝','Жыйын'],['bk','💾','Резерв']];
var nav=$('#nav');TABS.forEach(function(t){var b=el('button');b.innerHTML='<b>'+t[1]+'</b>'+t[2];b.dataset.t=t[0];b.onclick=function(){tab=t[0];draw()};nav.append(b)});
function draw(){[].forEach.call(nav.children,function(b){b.classList.toggle('on',b.dataset.t===tab)});
 $('#ttl').firstChild.nodeValue=D.cls+' класс жетекчиси';$('#sub').textContent=D.year+' · '+D.students.length+' окуучу';app.innerHTML='';
 ({st:vSt,at:vAt,ms:vMs,mt:vMt,bk:vBk})[tab]()}
$('#cfg').onclick=function(){var c=prompt('Класстын аты:',D.cls);if(c==null)return;var y=prompt('Окуу жылы:',D.year);D.cls=c.trim()||D.cls;if(y!=null)D.year=y.trim()||D.year;save();draw()};

/* ---------- Окуучулар ---------- */
function vSt(){
 var bd=upcoming();if(bd.length){var c=el('div','card');c.append(el('b',null,'🎂 Жакынкы туулган күндөр'));bd.forEach(function(x){c.append(el('div','mut',x.s.name+' — '+x.txt))});app.append(c)}
 var add=el('details','card');add.innerHTML='<summary><b>＋ Окуучу кошуу</b></summary>';
 var f={};[['name','Аты-жөнү'],['parent','Ата-энесинин аты'],['phone','Ата-энесинин телефону (0555…)'],['bd','Туулган күнү (КК.АА.ЖЖЖЖ)'],['note','Эскертүү']].forEach(function(p){var i=el('input');i.placeholder=p[1];f[p[0]]=i;add.append(i)});
 var sv=el('button','b','Кошуу');sv.onclick=function(){if(!f.name.value.trim())return toast('Атын жазыңыз');D.students.push({id:uid(),name:f.name.value.trim(),parent:f.parent.value.trim(),phone:f.phone.value.trim(),bd:normDate(f.bd.value),note:f.note.value.trim()});save();draw();toast('Кошулду')};add.append(sv);app.append(add);
 var bulk=el('details','card');bulk.innerHTML='<summary><b>📋 Бир нече окуучуну бир ирет кошуу</b></summary>';
 var ta=el('textarea');ta.placeholder='Ар бир сапка бирден:\nАты-жөнү, ата-эне, телефон, туулган күн\nАйгүл Асанова, Асан, 0555123456, 12.03.2012';bulk.append(ta);
 var bb=el('button','b','Кошуу');bb.onclick=function(){var n=0;ta.value.split('\n').forEach(function(l){var p=l.split(',').map(function(x){return x.trim()});if(!p[0])return;D.students.push({id:uid(),name:p[0],parent:p[1]||'',phone:p[2]||'',bd:normDate(p[3]),note:''});n++});save();draw();toast(n+' окуучу кошулду')};bulk.append(bb);app.append(bulk);
 var im=el('details','card');im.innerHTML='<summary><b>📱 Телефондун контактынан алуу</b></summary>';
 im.append(el('p','mut','Контакттарыңыз ушул браузерде гана ачылат, ким тандаганыңызды сайт эч кимге жөнөтпөйт. Кошкондон кийин ✏️ менен окуучунун атын, ата-энесин оңдоп алыңыз.'));
 var pb=el('button','b','📇 Контакттан тандоо (Android Chrome)');pb.onclick=function(){
  if(!(navigator.contacts&&navigator.contacts.select))return toast('Бул браузерде жок. Төмөнкү .vcf файлын колдонуңуз');
  navigator.contacts.select(['name','tel'],{multiple:true}).then(function(r){var n=0;r.forEach(function(c){var nm=(c.name&&c.name[0]||'').trim(),tl=(c.tel&&c.tel[0]||'').trim();if(!nm&&!tl)return;if(D.students.some(function(s){return s.phone&&s.phone.replace(/\D/g,'')===tl.replace(/\D/g,'')&&tl}))return;D.students.push({id:uid(),name:nm||tl,parent:'',phone:tl,bd:'',note:''});n++});save();draw();toast(n+' контакт кошулду')}).catch(function(){})};
 im.append(pb);
 im.append(el('p','mut','Же контакттарды .vcf файл кылып чыгарып, мында жүктөңүз (Контакттар → Экспорт; WhatsApp тобунан да Контакттар аркылуу сактаса болот):'));
 var vf=el('input');vf.type='file';vf.accept='.vcf,text/vcard,text/x-vcard';vf.onchange=function(){var f=vf.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var n=0;String(rd.result).split(/BEGIN:VCARD/i).forEach(function(blk){var nm=(blk.match(/^FN[^:]*:(.*)$/im)||[])[1],tl=(blk.match(/^TEL[^:]*:(.*)$/im)||[])[1];nm=(nm||'').trim();tl=(tl||'').trim();if(!nm&&!tl)return;D.students.push({id:uid(),name:nm||tl,parent:'',phone:tl,bd:'',note:''});n++});save();draw();toast(n+' контакт кошулду')};rd.readAsText(f)};
 im.append(vf);app.append(im);
 if(!D.students.length)app.append(el('p','mut','Азырынча окуучу жок. Жогору жактан кошуңуз.'));
 D.students.slice().sort(byName).forEach(function(s,i){var c=el('div','card'),r=el('div','row');
  r.append(el('span','num',(i+1)+'.'),Object.assign(el('b','grow'),{textContent:s.name}));
  var ed=el('button','b s','✏️');ed.onclick=function(){editSt(s)};r.append(ed);c.append(r);
  var m=[];if(s.parent)m.push('👪 '+s.parent);if(s.phone)m.push('📞 '+s.phone);if(s.bd)m.push('🎂 '+fmtD(s.bd));if(m.length)c.append(el('div','mut',m.join('  ·  ')));
  if(s.note)c.append(el('div','mut','📌 '+s.note));
  var tot=0,ab=0,lt=0;Object.keys(D.att).forEach(function(d){var v=D.att[d][s.id];if(v){tot++;if(v==='a')ab++;if(v==='l')lt++}});
  if(tot)c.append(el('div','mut','Катышуу: '+ab+' жок, '+lt+' кечикти ('+tot+' күндөн)'));
  app.append(c)})}
function editSt(s){var n=prompt('Аты-жөнү:',s.name);if(n==null)return;var p=prompt('Ата-энесинин аты:',s.parent||'');var ph=prompt('Телефону:',s.phone||'');var b=prompt('Туулган күнү (КК.АА.ЖЖЖЖ):',fmtD(s.bd));var no=prompt('Эскертүү (өчүрүү үчүн «!!!» жазыңыз):',s.note||'');
 if(no==='!!!'){if(confirm(s.name+' тизмеден өчүрүлсүнбү?')){D.students=D.students.filter(function(x){return x.id!==s.id});Object.keys(D.att).forEach(function(d){delete D.att[d][s.id]});save();draw()}return}
 s.name=(n||s.name).trim();s.parent=(p||'').trim();s.phone=(ph||'').trim();s.bd=normDate(b);s.note=(no||'').trim();save();draw()}
function upcoming(){var now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),out=[];
 D.students.forEach(function(s){if(!s.bd)return;var p=s.bd.split('-'),d=new Date(t0.getFullYear(),+p[1]-1,+p[2]);if(d<t0)d.setFullYear(d.getFullYear()+1);var diff=Math.round((d-t0)/864e5);if(diff<=30){var age=d.getFullYear()-(+p[0]);out.push({s:s,diff:diff,txt:(diff===0?'БҮГҮН':diff===1?'эртең':diff+' күндөн кийин')+' ('+age+' жашка толот)'})}});
 return out.sort(function(a,b){return a.diff-b.diff})}

/* ---------- Катышуу ---------- */
var attDate=ymd(new Date());
function vAt(){
 var r=el('div','row'),di=el('input');di.type='date';di.value=attDate;di.className='grow';di.onchange=function(){attDate=di.value||attDate;draw()};r.append(di);app.append(r);
 if(!D.students.length){app.append(el('p','mut','Алгач «Окуучулар» бөлүмүнө окуучуларды кошуңуз.'));return}
 var day=D.att[attDate]=D.att[attDate]||{};var sum=el('div','card');app.append(sum);
 var LB={p:'✓',a:'✗',l:'⏰'};
 var recount=function(){var c={p:0,a:0,l:0};D.students.forEach(function(s){if(day[s.id])c[day[s.id]]++});sum.innerHTML='';sum.append(el('b',null,fmtD(attDate)+': '),el('span',null,'✓ '+c.p+'   ✗ '+c.a+'   ⏰ '+c.l+'   (белгиленген: '+(c.p+c.a+c.l)+'/'+D.students.length+')'))}
 var all=el('button','b s','Бардыгын «келди» деп белгилөө');all.onclick=function(){D.students.forEach(function(s){day[s.id]='p'});save();draw()};app.append(all);
 D.students.slice().sort(byName).forEach(function(s,i){var c=el('div','card'),r=el('div','row');r.append(el('span','num',(i+1)+'.'),Object.assign(el('span','grow'),{textContent:s.name}));
  var b=el('button','st'+(day[s.id]?' '+day[s.id]:''),LB[day[s.id]]||'·');
  b.onclick=function(){var o={undefined:'p',p:'a',a:'l',l:undefined}[day[s.id]];if(o)day[s.id]=o;else delete day[s.id];b.className='st'+(day[s.id]?' '+day[s.id]:'');b.textContent=LB[day[s.id]]||'·';save();recount()};
  r.append(b);c.append(r);app.append(c)});
 app.append(el('p','mut','Баскычты басып өзгөртүңүз: · → ✓ келди → ✗ жок → ⏰ кечикти → ·'));
 var dyn=el('div');app.append(dyn);
 function more(){dyn.innerHTML='';var ab=D.students.filter(function(s){return day[s.id]==='a'});
  if(ab.length){var g=el('button','b','💬 Жок болгондордун ата-энесине билдирүү ('+ab.length+')');g.onclick=function(){msgSel=ab.map(function(s){return s.id});msgTpl=0;tab='ms';draw()};dyn.append(g)}
  var mo=attDate.slice(0,7);dyn.append(el('h2',null,'Ай боюнча: '+mo));var any=false;
  D.students.slice().sort(byName).forEach(function(s){var a=0,l=0;Object.keys(D.att).forEach(function(d){if(d.slice(0,7)===mo){var v=D.att[d][s.id];if(v==='a')a++;if(v==='l')l++}});if(a||l){any=true;dyn.append(el('div','mut',s.name+': '+a+' жок, '+l+' кечикти'))}});
  if(!any)dyn.append(el('div','mut','Бул айда жок болгон же кечиккен окуучу белгиленген эмес.'))}
 var _rc=recount;recount=function(){_rc();more()};recount()}

/* ---------- Билдирүү ---------- */
var msgSel=[],msgTpl=0;
var TPL=[
['Сабакка келген жок','Саламатсызбы, {ата-эне}! {аты} бүгүн ({күн}) сабакка келген жок. Эмне себептен экенин билсем болобу? Ден соолугу жакшыбы? Рахмат.\n{класс} класс жетекчиси'],
['Кечикти','Саламатсызбы, {ата-эне}! {аты} бүгүн ({күн}) сабакка кечикти. Кийинки жолу убагында келишине көңүл бурсаңыз. Рахмат.\n{класс} класс жетекчиси'],
['Мактоо','Саламатсызбы, {ата-эне}! {аты} бүгүн сабакта жакшы окуду жана жигердүү болду. Сизди куттуктайм, ийгиликтерин улантсын!\n{класс} класс жетекчиси'],
['Ата-энелер жыйыны','Урматтуу {ата-эне}! {класс} классынын ата-энелер жыйыны ____ күнү саат ____ өтөт. Сураныч, катышууңузду күтөбүз.\n{класс} класс жетекчиси'],
['Үй тапшырма / окуу','Саламатсызбы, {ата-эне}! {аты} жөнүндө айтып коёюн дегем: ______________. Үйдөн колдоо көрсөтүп койсоңуз, рахмат.\n{класс} класс жетекчиси'],
['Туулган күн куттуктоо','Урматтуу {ата-эне}! {аты}ты туулган күнү менен чын жүрөктөн куттуктайм! Ден соолук, ийгилик жана билим тилейм.\n{класс} класс жетекчиси'],
['Өз билдирүүм','']];
function vMs(){
 app.append(el('p','mut','Билдирүү үлгүсүн тандаңыз, окуучуларды белгилеңиз. «WhatsApp» баскычы ар бир ата-эне үчүн даяр билдирүү менен WhatsApp ачат, жөнөтүү баскычын сиз өзүңүз басасыз.'));
 var sel=el('select');TPL.forEach(function(t,i){var o=el('option',null,t[0]);o.value=i;sel.append(o)});sel.value=msgTpl;app.append(sel);
 var ta=el('textarea');ta.value=TPL[msgTpl][1];app.append(ta);
 sel.onchange=function(){msgTpl=+sel.value;ta.value=TPL[msgTpl][1];list()};ta.oninput=function(){TPL[msgTpl][1]=ta.value;list()};
 var box=el('div');app.append(box);
 function fill(s){return ta.value.replace(/\{аты\}/g,s.name.split(' ')[0]).replace(/\{ата-эне\}/g,s.parent?s.parent+' мырза/эже':'ата-эне').replace(/\{күн\}/g,fmtD(attDate)).replace(/\{класс\}/g,D.cls)}
 function list(){box.innerHTML='';if(!D.students.length){box.append(el('p','mut','Окуучу жок.'));return}
  var tools=el('div','row');var a=el('button','b s','Баарын белгилөө'),n=el('button','b s','Тазалоо');a.onclick=function(){msgSel=D.students.map(function(s){return s.id});list()};n.onclick=function(){msgSel=[];list()};tools.append(a,n);box.append(tools);
  D.students.slice().sort(byName).forEach(function(s){var c=el('div','card'),r=el('div','row'),cb=document.createElement('input');cb.type='checkbox';cb.style.cssText='width:22px;height:22px;margin:0';cb.checked=msgSel.indexOf(s.id)>=0;
   cb.onchange=function(){msgSel=msgSel.filter(function(x){return x!==s.id});if(cb.checked)msgSel.push(s.id)};
   r.append(cb,Object.assign(el('span','grow'),{textContent:s.name+(s.phone?'':'  (телефон жок)')}));
   var w=waLink(s.phone,fill(s)),wb=el('a','b'+(w?'':' s'),'WhatsApp');if(w){wb.href=w;wb.target='_blank';wb.rel='noopener'}else wb.onclick=function(){toast('Телефон номери жок')};wb.style.cssText='text-decoration:none';
   var cp=el('button','b s','📋');cp.onclick=function(){copy(fill(s))};r.append(wb,cp);c.append(r);box.append(c)})}
 list()}

/* ---------- Жыйын ---------- */
function vMt(){
 var f=el('div','card'),d=el('input');d.type='date';d.value=ymd(new Date());var t=el('input');t.placeholder='Темасы (мис. Ата-энелер жыйыны)';var x=el('textarea');x.placeholder='Эмне чечилди, ким эмне милдет алды…';
 var b=el('button','b','Сактоо');b.onclick=function(){if(!t.value.trim()&&!x.value.trim())return;D.meet.unshift({id:uid(),date:d.value,title:t.value.trim()||'Жазуу',text:x.value.trim()});save();draw()};f.append(d,t,x,b);app.append(f);
 if(!D.meet.length)app.append(el('p','mut','Азырынча жазуу жок.'));
 D.meet.forEach(function(m){var c=el('div','card');var r=el('div','row');r.append(Object.assign(el('b','grow'),{textContent:fmtD(m.date)+' — '+m.title}));var cp=el('button','b s','📋'),del=el('button','b d','🗑');
