<!doctype html>
<html lang="ky"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Үч айлар 2026–2027</title>
<meta name="theme-color" content="#2f2a4a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe3;--ink:#2b2740;--mut:#6d6884;--card:#fffdf8;--line:#d9d0bb;--acc:#4b3f8f;--gold:#b8892b;--sh:#fffdf8}
body.dk{--bg:#171428;--ink:#ece8f8;--mut:#a8a2c4;--card:#262244;--line:#3b3566;--acc:#a99bf0;--gold:#e3b95a;--sh:#1f1b38}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#vp{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#vp.drag{cursor:grabbing}
#st{position:absolute;left:0;top:0;width:1000px;transform-origin:0 0;transition:transform .9s cubic-bezier(.65,.05,.25,1);will-change:transform}
#st.nodrag{transition:none}
@media (prefers-reduced-motion:reduce){#st{transition:none}}
.zone{position:absolute;left:0;width:1000px}
.zone .ar{position:absolute;left:0;right:0;top:34px;text-align:center;font:700 96px/1 Amiri,serif;direction:rtl;color:#000;opacity:.07}
body.dk .zone .ar{color:#fff;opacity:.09}
.zone .nm{position:absolute;left:0;right:0;top:132px;text-align:center;font:800 15px system-ui;letter-spacing:.35em;text-transform:uppercase;color:var(--mut);opacity:.7}
body.dk .zone{filter:brightness(.38) saturate(.8)}
#paths{position:absolute;left:0;top:0;pointer-events:none}
.card{position:absolute;width:400px;height:210px;border-radius:22px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 10px 26px rgba(40,30,80,.14);padding:20px 22px;cursor:pointer;overflow:hidden;transition:box-shadow .3s,transform .3s}
.card:hover{box-shadow:0 14px 34px rgba(40,30,80,.26)}
.card.on{outline:3px solid var(--gold)}
.card .fl{position:absolute;right:-14px;top:-14px;width:110px;height:110px;opacity:.95}
.card .dn{font:800 52px/1 Georgia,serif;color:var(--acc)}
.card .mn{font:700 18px system-ui;margin-top:2px}
.card .wd{font-size:13px;color:var(--mut);margin-top:2px}
.card .tt{position:absolute;left:22px;right:22px;bottom:44px;font:700 17px/1.2 system-ui}
.card .sh{position:absolute;left:22px;right:22px;bottom:18px;font-size:13px;color:var(--mut)}
.card .cd{position:absolute;right:18px;bottom:16px;background:var(--gold);color:#fff;border-radius:999px;font:700 12px system-ui;padding:4px 10px}
.card .cd.past{background:var(--mut)}
.card .no{position:absolute;left:22px;top:-2px;font:700 11px system-ui;color:var(--mut)}
#modes{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top));z-index:5;display:flex;gap:6px;padding:0 12px 6px;overflow-x:auto;scrollbar-width:none}
#modes button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:700 13px system-ui;cursor:pointer}
#modes button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#views{position:fixed;inset:0;z-index:1}
#top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(var(--bg) 60%,transparent);pointer-events:none}
#top>*{pointer-events:auto}
#top a,#top button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;height:36px;min-width:36px;padding:0 12px;font:600 14px system-ui;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
#top h1{margin:0;font:800 17px system-ui;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nx{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:4;background:var(--acc);color:#fff;border-radius:999px;padding:9px 16px;font:700 14px system-ui;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100vw - 24px);font-size:13px;border:0;cursor:pointer}
body.open #nx{display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;height:62vh;max-width:760px;margin:0 auto;z-index:6;background:var(--sh);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.28);transform:translateY(105%);transition:transform .6s cubic-bezier(.65,.05,.25,1);display:flex;flex-direction:column}
body.open #sheet{transform:none}
#sh-h{display:flex;align-items:center;gap:8px;padding:14px 14px 6px 18px}
#sh-h .t{flex:1;min-width:0}
#sh-h b{display:block;font:800 17px/1.2 system-ui}
#sh-h span{font-size:12px;color:var(--mut)}
#sh-h button{border:1px solid var(--line);background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:17px;cursor:pointer}
#tabs{display:flex;gap:6px;padding:6px 14px 10px;overflow-x:auto;scrollbar-width:none}
#tabs button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:700 13px system-ui;cursor:pointer}
#tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#body{flex:1;overflow-y:auto;padding:4px 18px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;touch-action:pan-y}
.blk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 12px}
.ar{direction:rtl;text-align:right;font:400 26px/1.9 Amiri,"Traditional Arabic",serif;margin:0 0 8px;color:var(--ink)}
.ky{margin:0;font-size:15.5px;line-height:1.6}
.rf{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--gold);font-weight:700}
.note{margin-top:8px;font-size:13px;color:var(--mut);background:rgba(184,137,43,.12);border-radius:10px;padding:8px 10px;line-height:1.5}
ul.li{list-style:none;margin:0;padding:0}
ul.li li{position:relative;padding:12px 14px 12px 40px;margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:15.5px;line-height:1.6}
ul.li li::before{content:"✦";position:absolute;left:14px;top:11px;color:var(--gold)}
.foot{font-size:12px;color:var(--mut);line-height:1.5;margin:8px 0 0}
</style></head>
<body>
<div id="top"><a href="../" aria-label="Башкы бет">‹</a><h1>🌙 Үч айлар</h1><button id="ov" title="Жалпы көрүнүш">🗺</button><button id="dk" title="Караңгы режим">🌓</button></div>
<div id="modes"></div>
<div id="views"></div>
<div id="vp"><div id="st"></div></div>
<button id="nx"></button>
<div id="sheet" role="dialog" aria-modal="true">
 <div id="sh-h"><div class="t"><b id="sh-t"></b><span id="sh-s"></span></div><button id="pv" aria-label="Мурунку">‹</button><button id="nt" aria-label="Кийинки">›</button><button id="cl" aria-label="Жабуу">✕</button></div>
 <div id="tabs"></div><div id="body"></div>
</div>
<script src="content.js"></script>
<script>
(function(){
var MON={'Январь':0,'Февраль':1,'Март':2,'Апрель':3,'Май':4,'Июнь':5,'Июль':6,'Август':7,'Сентябрь':8,'Октябрь':9,'Ноябрь':10,'Декабрь':11};
var CW=400,CH=210,STEP=270,Y0=140,H=Y0+TOP.length*STEP+60;
var vp=document.getElementById('vp'),st=document.getElementById('st'),sheet=document.getElementById('sheet');
var cur=-1,tab=0,cams=[],MODE='prezi';
var TABS=[['ayat','📖 Аят'],['hadis','📜 Хадис'],['fiqh','⚖️ Фикх'],['oku','🕌 Окуя'],['amal','🤲 Амал']];
function E(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
try{if(localStorage.getItem('ua-dk')==='1')document.body.classList.add('dk')}catch(e){}
document.getElementById('dk').onclick=function(){var d=document.body.classList.toggle('dk');try{localStorage.setItem('ua-dk',d?'1':'0')}catch(e){}};

function daysTo(t){var n=new Date();var a=new Date(n.getFullYear(),n.getMonth(),n.getDate());var b=new Date(t.y,MON[t.m],t.d);return Math.round((b-a)/864e5)}
function cdText(n){return n<0?'өттү':n===0?'бүгүн!':n+' күн калды'}
function flower(c){var p='';for(var i=0;i<6;i++)p+='<ellipse cx="50" cy="26" rx="13" ry="22" transform="rotate('+i*60+' 50 50)" fill="'+c+'" opacity=".85"/>';return '<svg class="fl" viewBox="0 0 100 100">'+p+'<circle cx="50" cy="50" r="11" fill="#fff6d6"/><circle cx="50" cy="50" r="5" fill="#d9a21b"/></svg>'}

// build stage
var zs=[];for(var i=0;i<TOP.length;i++){if(zs[TOP[i].z]===undefined)zs[TOP[i].z]=i}
var html='';
ZONES.forEach(function(z,k){var a=k===0?0:zs[k]*STEP+Y0-100,b=k===ZONES.length-1?H:zs[k+1]*STEP+Y0-100;
 html+='<div class="zone" style="top:'+a+'px;height:'+(b-a)+'px;background:'+z.c+'"><div class="ar">'+z.ar+'</div><div class="nm">'+z.n+'</div></div>'});
var pts=[];
TOP.forEach(function(t,i){var x=i%2===0?50:550,y=Y0+i*STEP;pts.push([x+CW/2,y+CH/2]);cams.push({x:x,y:y});
 var n=daysTo(t);
 html+='<div class="card" data-i="'+i+'" style="left:'+x+'px;top:'+y+'px" tabindex="0" role="button" aria-label="'+E(t.title)+'">'+flower(t.fl)+
 '<div class="dn">'+t.d+'</div><div class="mn">'+t.m+' '+t.y+'</div><div class="wd">'+t.wd+' · '+t.h+'</div>'+
 '<div class="tt">'+E(t.title)+'</div><div class="sh">'+E(t.short)+'</div><span class="cd'+(n<0?' past':'')+'">'+cdText(n)+'</span></div>'});
var d='M'+pts[0][0]+' '+pts[0][1];
for(var i=1;i<pts.length;i++){var a=pts[i-1],b=pts[i],my=(a[1]+b[1])/2;d+=' C'+a[0]+' '+my+' '+b[0]+' '+my+' '+b[0]+' '+b[1]}
html='<svg id="paths" width="1000" height="'+H+'"><path d="'+d+'" fill="none" stroke="#b8892b" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity=".8"/></svg>'+html;
st.innerHTML=html;st.style.height=H+'px';

// camera
var S0=1,TX=0,TY=0,ovTY=96;
function vw(){return window.innerWidth}function vh(){return window.innerHeight}
function apply(s,tx,ty){st.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')'}
function clampOv(){var s=S0,minY=Math.min(96,vh()-H*s-90);ovTY=Math.max(minY,Math.min(96,ovTY))}
function overview(){S0=Math.min(vw()/1000,0.9);clampOv();var tx=(vw()-1000*S0)/2;apply(S0,tx,ovTY);S0tx=tx}
var S0tx=0;
function focus(i){var c=cams[i],s=Math.min(vw()*.9/CW,1.4);
 var tx=vw()/2-(c.x+CW/2)*s,ty=104-c.y*s;apply(s,tx,ty)}
function show(i,keepTab){
 if(i<0||i>=TOP.length)return;
 cur=i;if(!keepTab)tab=0;
 document.body.classList.add('open');
 [].forEach.call(st.querySelectorAll('.card'),function(c,k){c.classList.toggle('on',k===i)});
 if(MODE==='prezi')focus(i);render();if(UA.onShow)UA.onShow(i);
 history.replaceState(null,'','#'+i);
}
var UA=window.UA={TOP:TOP,ZONES:ZONES,E:E,daysTo:daysTo,cdText:cdText,show:function(i){show(i)},close:function(){close()},prezi:{vp:vp,overview:overview,focus:function(){}},setMode:function(m){MODE=m;if(m==='prezi'){vp.style.display='';overview()}else vp.style.display='none';document.getElementById('nx').style.visibility=m==='prezi'?'':'hidden'},get cur(){return cur}};
function close(){cur=-1;document.body.classList.remove('open');[].forEach.call(st.querySelectorAll('.card.on'),function(c){c.classList.remove('on')});if(MODE==='prezi')overview();history.replaceState(null,'',location.pathname);if(UA.onShow)UA.onShow(-1)}
function render(){
 var t=TOP[cur];
 document.getElementById('sh-t').textContent=t.title;
 document.getElementById('sh-s').textContent=t.d+' '+t.m+' '+t.y+' · '+t.wd+' · '+t.h;
 var tb='';TABS.forEach(function(x,k){tb+='<button data-k="'+k+'" class="'+(k===tab?'on':'')+'">'+x[1]+'</button>'});
 var T=document.getElementById('tabs');T.innerHTML=tb;
 var key=TABS[tab][0],h='';
 if(key==='ayat')t.ayat.forEach(function(a){h+='<div class="blk">'+(a.ar?'<p class="ar">'+E(a.ar)+'</p>':'')+'<p class="ky">'+E(a.ky)+'</p><span class="rf">'+E(a.ref)+'</span></div>'});
 else if(key==='hadis')t.hadis.forEach(function(a){h+='<div class="blk"><p class="ky">'+E(a.ky)+'</p>'+(a.src?'<span class="rf">'+E(a.src)+'</span>':'')+(a.note?'<div class="note">'+E(a.note)+'</div>':'')+'</div>'});
 else{h='<ul class="li">';t[key].forEach(function(a){h+='<li>'+E(a)+'</li>'});h+='</ul>'}
 h+='<p class="foot">Рамазан (8-февраль), Кадыр түнү (5→6-март) жана Орозо айт (9-март) Кыргызстан Муфтияты алдын ала жарыялаган даталарга дал келет, акыркы дата жакын арада бекитилет. Ражаб, Мирадж, Шаабан жана Бараат даталарын Муфтият жарыялай элек, алар Диянет календарына ылайык. Текст эстеликтен жазылган — китептен текшериңиз.</p>';
 var B=document.getElementById('body');B.innerHTML=h;B.scrollTop=0;
 var on=T.querySelector('.on');if(on&&on.scrollIntoView)T.scrollLeft=on.offsetLeft-20;
}
document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;tab=+b.dataset.k;render()});
document.getElementById('pv').onclick=function(){show(cur-1,true)};
document.getElementById('nt').onclick=function(){show(cur+1,true)};
document.getElementById('cl').onclick=close;
document.getElementById('ov').onclick=close;
document.addEventListener('keydown',function(e){
 if(e.key==='Escape')close();
 else if(cur>=0&&e.key==='ArrowRight')show(cur+1,true);
 else if(cur>=0&&e.key==='ArrowLeft')show(cur-1,true);
 else if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('card'))show(+e.target.dataset.i)});

// next-date chip
var nxI=-1;for(var i=0;i<TOP.length;i++){if(daysTo(TOP[i])>=0){nxI=i;break}}
var nx=document.getElementById('nx');
if(nxI<0)nx.style.display='none';else{var n=daysTo(TOP[nxI]);nx.textContent='Кийинки: '+TOP[nxI].title+' · '+cdText(n);nx.onclick=function(){show(nxI)}}

// pointer: drag in overview, tap card
var sx=0,sy=0,sTY=0,moved=false,down=false;
vp.addEventListener('pointerdown',function(e){down=true;moved=false;sx=e.clientX;sy=e.clientY;sTY=ovTY});
window.addEventListener('pointermove',function(e){if(!down)return;var dy=e.clientY-sy;if(Math.abs(dy)>6||Math.abs(e.clientX-sx)>6)moved=true;
 if(moved&&cur<0){vp.classList.add('drag');st.classList.add('nodrag');ovTY=sTY+dy;clampOv();apply(S0,S0tx,ovTY)}});
window.addEventListener('pointerup',function(e){if(!down)return;down=false;vp.classList.remove('drag');st.classList.remove('nodrag');
 if(!moved){var c=e.target.closest&&e.target.closest('.card');if(c)show(+c.dataset.i);else if(cur>=0&&e.target===vp||cur>=0&&e.target.closest&&e.target.closest('#st')&&!c)close()}});
vp.addEventListener('wheel',function(e){if(cur>=0)return;e.preventDefault();st.classList.add('nodrag');ovTY-=e.deltaY;clampOv();apply(S0,S0tx,ovTY);clearTimeout(vp._w);vp._w=setTimeout(function(){st.classList.remove('nodrag')},150)},{passive:false});
window.addEventListener('resize',function(){if(cur>=0)focus(cur);else overview()});
st.querySelectorAll('.card').forEach(function(c){c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();show(+c.dataset.i)}})});

st.classList.add('nodrag');
// initial: scroll overview to next date
S0=Math.min(vw()/1000,0.9);
if(nxI>0){ovTY=96-(cams[nxI].y-60)*S0}
overview();
requestAnimationFrame(function(){st.classList.remove('nodrag')});
var hh=parseInt((location.hash||'').slice(1),10);if(!isNaN(hh)&&hh>=0&&hh<TOP.length)show(hh);
})();
</script>
<script src="views.js"></script>
</body></html>
